<title>👗 드레스 투 임프레스 · 스타일 패션쇼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

addEventListener('unhandledrejection',function(e){try{__errs.push('rejection: '+String(e.reason))}catch(_){}});

<style>
/* ============================================================
   👗 드레스 투 임프레스 · 스타일 패션쇼  (dress-up.html)
   - 오늘의 주제(8종) → 레이어드 SVG 아바타 꾸미기 → 런웨이 심사
   - 디는 이 기기(localStorage)에만 저장. 서버·가족 DB 사용 안 함.
   ============================================================ */
:root{
  --ink:#33243C; --ink2:#6B5A78; --muted:#95879F;
  --pink:#FF5B9E; --pink-d:#E23E82; --pink-l:#FFE6F1;
  --lilac:#9B6BFF; --lilac-l:#EFE5FF;
  --gold:#FFC53D; --gold-d:#A97400;
  --line:#F2E2EE; --paper:#fff;
  --shadow:0 14px 34px rgba(120,60,120,.12), 0 2px 6px rgba(120,60,120,.06);
  --shadow-lg:0 22px 56px rgba(110,40,110,.18);
  --t1:#FFE3F1; --t2:#EAD9FF;
  --o1:#FF8FBF; --o2:#FFC0DA; --o3:#E0618F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%; overflow-x:hidden}
body{
  margin:0; color:var(--ink); line-height:1.45; word-break:keep-all;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 4% -10%, #FFE0EF 0%, rgba(255,224,239,0) 60%),
    radial-gradient(820px 520px at 100% -6%, #E3E4FF 0%, rgba(227,228,255,0) 58%),
    linear-gradient(180deg,#FFF7FC 0%,#F7F3FF 58%,#FFF4FA 100%);
  background-attachment:fixed;
  padding:calc(10px + env(safe-area-inset-top)) 10px calc(96px + env(safe-area-inset-bottom));
}
.wrap{max-width:1220px; margin:0 auto}

/* ---------- 헤더 ---------- */
header{display:flex; align-items:center; gap:10px; margin:2px 2px 10px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand .logo{
  width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; font-size:23px;
  border-radius:14px; background:linear-gradient(150deg,#FFE9F3,#EADFFF); border:1px solid #fff;
  box-shadow:0 6px 16px rgba(160,80,170,.18);
}
h1{margin:0; font-size:clamp(16px,4.4vw,23px); font-weight:900; letter-spacing:-.04em; line-height:1.15}
h1 small{display:block; font-size:9.5px; font-weight:900; letter-spacing:.22em; color:var(--pink); margin-top:2px}
.hbtns{margin-left:auto; display:flex; gap:7px}
.iconbtn{
  border:1.5px solid #F0DCEC; background:#fff; color:#5B4568; border-radius:13px;
  min-width:44px; height:44px; padding:0 11px; font-size:17px; font-weight:800; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; box-shadow:0 3px 9px rgba(120,60,120,.08);
}
.iconbtn:active{transform:scale(.96)}

/* ---------- 카드 공통 ---------- */
.card{
  background:rgba(255,255,255,.9); border:1px solid #fff; border-radius:22px;
  box-shadow:var(--shadow); backdrop-filter:blur(6px);
}

/* ---------- 주제 바 ---------- */
.theme-bar{padding:11px 12px; margin-bottom:10px}
.theme-top{display:flex; align-items:center; gap:10px}
.theme-top .tem{
  width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; font-size:23px;
  border-radius:14px; background:linear-gradient(150deg,var(--t1),var(--t2)); border:1px solid #fff;
}
.theme-top .tx{min-width:0; flex:1}
.theme-top .tx b{display:block; font-size:15.5px; font-weight:900; letter-spacing:-.03em; line-height:1.25}
.theme-top .tx span{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-top:1px}
.theme-top .dice{flex:0 0 auto}
.chips{display:flex; gap:6px; overflow-x:auto; margin-top:9px; padding-bottom:3px; scrollbar-width:none; min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:1.5px solid #EFDFF0; background:#fff; color:#6B5A78;
  border-radius:999px; padding:7px 11px; font:inherit; font-size:12.5px; font-weight:800;
  cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;
}
.chip.on{background:linear-gradient(135deg,#FF6BA8,#B073FF); color:#fff; border-color:transparent; box-shadow:0 5px 14px rgba(190,80,180,.3)}

/* ---------- 레이아웃 ---------- */
.main{display:grid; grid-template-columns:minmax(0,0.92fr) minmax(0,1.08fr); gap:10px; align-items:start}
.main > section{min-width:0}
@media (max-width:820px){ .main{grid-template-columns:minmax(0,1fr)} }

/* ---------- 무대 ---------- */
.stage-card{padding:10px}
.stage{
  position:relative; border-radius:18px; overflow:hidden; min-height:clamp(320px,48vh,470px);
  background:
    radial-gradient(60% 46% at 50% 104%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(50% 40% at 50% 6%, rgba(255,255,255,.8) 0%, rgba(255,255,255,0) 68%),
    linear-gradient(168deg, var(--t1) 0%, var(--t2) 100%);
  border:1px solid #fff; display:flex; align-items:flex-end; justify-content:center;
  transition:background .45s ease;
}
.stage::before{
  content:""; position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
  width:74%; height:16%; border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(120,60,140,.16), rgba(120,60,140,0) 72%);
}
.stage .lamp{
  position:absolute; top:-8%; width:38%; height:105%; pointer-events:none;
  background:conic-gradient(from 178deg at 50% 0%, rgba(255,255,255,.62), rgba(255,255,255,0) 26%);
  filter:blur(3px); opacity:.85; animation:sway 7s ease-in-out infinite alternate;
}
.stage .lamp.l{left:0; transform-origin:50% 0}
.stage .lamp.r{right:0; transform:scaleX(-1); transform-origin:50% 0; animation-delay:-3s}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.stage .stars{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.stage .stars i{
  position:absolute; font-style:normal; font-size:14px; opacity:.7;
  animation:twinkle 3.2s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.7)}50%{opacity:.95; transform:scale(1.12)}}
.model-wrap{
  position:relative; z-index:2; height:100%; width:100%; display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:2%;
}
.model-wrap svg{height:clamp(290px,44vh,430px); width:auto; display:block; filter:drop-shadow(0 12px 16px rgba(110,40,120,.14))}
.model-wrap .fig{transition:transform .28s cubic-bezier(.4,1.5,.5,1)}
.model-wrap.pose-1 .fig{transform:rotate(-3deg) translateY(-2px)}
.model-wrap.pose-2 .fig{transform:rotate(3deg) scale(1.02)}
.model-wrap.pose-3 .fig{transform:scale(1.05)}
.model-badge{
  position:absolute; z-index:3; left:10px; top:10px; display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.82); border:1px solid #fff; border-radius:999px; padding:6px 12px;
  font-size:12.5px; font-weight:900; color:#6B3E70; box-shadow:0 4px 12px rgba(120,60,120,.12);
}
.pose-btns{position:absolute; z-index:3; right:8px; top:8px; display:flex; gap:5px}
.pose-btns button{
  width:34px; height:34px; border-radius:11px; border:1px solid #fff; background:rgba(255,255,255,.86);
  font-size:16px; cursor:pointer; box-shadow:0 3px 10px rgba(120,60,120,.12);
}
.pose-btns button.on{background:linear-gradient(135deg,#FF6BA8,#B073FF); color:#fff}

/* 이름 · 대결 */
.who{display:flex; gap:6px; align-items:center; margin:9px 2px 0; flex-wrap:wrap}
.who .lbl{font-size:11.5px; font-weight:900; color:var(--muted); letter-spacing:.02em}
.who .name{
  border:1.5px solid #EFDFF0; background:#fff; border-radius:999px; padding:6px 11px;
  font:inherit; font-size:12.5px; font-weight:900; color:#6B5A78; cursor:pointer;
}
.who .name.on{background:#FFEAF4; border-color:#FFB9D6; color:#C22E70}
.who .vs{
  margin-left:auto; border:1.5px solid #E4D7FF; background:#F6F0FF; border-radius:999px;
  padding:6px 11px; font:inherit; font-size:12px; font-weight:900; color:#7846C8; cursor:pointer;
}
.who .vs.on{background:linear-gradient(135deg,#9B6BFF,#FF6BA8); color:#fff; border-color:transparent}

.cta{display:flex; gap:7px; margin-top:9px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0; border-radius:15px; font:inherit; font-weight:900; font-size:15px;
  padding:13px 15px; min-height:50px; cursor:pointer; text-decoration:none; text-align:center;
  transition:transform .1s ease, box-shadow .12s ease; user-select:none;
}
.btn:active{transform:scale(.98)}
.btn.primary{
  flex:1; color:#fff; background:linear-gradient(135deg,#FF5B9E 0%,#E44EC0 46%,#9B6BFF 100%);
  box-shadow:0 9px 22px rgba(224,70,170,.36), inset 0 1px 0 rgba(255,255,255,.5);
  font-size:16.5px; min-height:56px; letter-spacing:-.02em;
}
.btn.ghost{background:#fff; color:#6B4B72; border:1.5px solid #F0DCEC; box-shadow:0 3px 9px rgba(120,60,120,.07)}
.btn.gold{background:linear-gradient(135deg,#FFD85E,#FFB020); color:#4A3000; box-shadow:0 7px 18px rgba(220,160,0,.35)}
.btn.sm{min-height:42px; padding:9px 13px; font-size:13.5px; border-radius:13px}

/* ---------- 옷장 ---------- */
.wardrobe{padding:11px 11px 13px}
.wd-head{display:flex; align-items:center; gap:8px; margin:0 2px 8px}
.wd-head b{font-size:14.5px; font-weight:900; letter-spacing:-.03em}
.wd-head .mode{
  margin-left:auto; font-size:11px; font-weight:900; color:#8A5BC0; background:#F4ECFF;
  border:1px solid #E4D6FF; border-radius:999px; padding:4px 9px;
}
.cats{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto; border:1.5px solid #EFDFF0; background:#fff; color:#6B5A78; border-radius:13px;
  padding:9px 11px; font:inherit; font-size:12.5px; font-weight:900; cursor:pointer;
  display:inline-flex; align-items:center; gap:4px; min-height:42px;
}
.cat.on{background:linear-gradient(135deg,#FFE8F3,#EFE4FF); border-color:#F3B9D8; color:#B02A72; box-shadow:0 3px 10px rgba(190,80,180,.14)}
.swatches{display:flex; gap:7px; flex-wrap:wrap; padding:0 2px 9px; min-width:0}
.sw{
  width:34px; height:34px; border-radius:11px; border:2.5px solid #fff; cursor:pointer;
  box-shadow:0 2px 7px rgba(90,40,100,.18); position:relative;
}
.sw.on{outline:3px solid #FF6BA8; outline-offset:1px}
.sw.on::after{content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:15px; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,.4)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:7px; max-height:min(46vh,430px); overflow-y:auto; padding:2px 2px 4px; min-width:0}
.item{
  position:relative; border:2px solid #F3E7F1; background:linear-gradient(180deg,#FFFDFE,#FBF6FF);
  border-radius:15px; padding:5px 4px 6px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:2px; font:inherit; color:#5C4766; transition:transform .1s, box-shadow .12s, border-color .12s;
}
.item:active{transform:scale(.97)}
.item.on{border-color:#FF6BA8; box-shadow:0 6px 16px rgba(230,80,160,.22); background:linear-gradient(180deg,#FFF0F8,#F8EEFF)}
.item .th{width:100%; height:74px; display:grid; place-items:center; overflow:hidden}
.item .th svg{height:74px; width:auto}
.item .nm{font-size:10.5px; font-weight:900; line-height:1.2; text-align:center; letter-spacing:-.03em}
.item .ck{
  position:absolute; top:-6px; right:-5px; width:21px; height:21px; border-radius:50%;
  background:linear-gradient(135deg,#FF5B9E,#9B6BFF); color:#fff; font-size:12px; font-weight:900;
  display:none; place-items:center; box-shadow:0 3px 8px rgba(200,50,150,.4);
}
.item.on .ck{display:grid}
.hint{font-size:11.5px; color:var(--muted); font-weight:700; margin:6px 3px 0; line-height:1.4}

/* ---------- 룩북 ---------- */
.sheet{
  position:fixed; inset:0; z-index:60; display:none; place-items:end center;
  background:rgba(45,20,55,.42); backdrop-filter:blur(3px); padding:0;
}
.sheet.show{display:grid}
.sheet .box{
  width:min(760px,100%); max-height:88vh; overflow:auto; background:#FFFBFD;
  border-radius:24px 24px 0 0; padding:16px 14px calc(22px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lg);
}
@media (min-width:760px){ .sheet{place-items:center} .sheet .box{border-radius:24px} }
.sheet h2{margin:0 0 3px; font-size:19px; font-weight:900; letter-spacing:-.03em}
.sheet .sub{margin:0 0 12px; font-size:12.5px; color:var(--muted); font-weight:700}
.looks{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:9px}
.look{
  border:2px solid #F3E7F1; border-radius:16px; background:#fff; padding:6px; text-align:center;
  display:flex; flex-direction:column; gap:3px;
}
.look .ph{height:120px; display:grid; place-items:center; background:linear-gradient(160deg,#FFF2F8,#F4EEFF); border-radius:11px; overflow:hidden}
.look .ph svg{height:118px; width:auto}
.look .nm{font-size:11px; font-weight:900; line-height:1.2}
.look .sc{font-size:10.5px; color:#C58A00; font-weight:900}
.look .lb{display:flex; gap:4px; margin-top:2px}
.look .lb button{flex:1; border:0; border-radius:9px; padding:7px 0; font:inherit; font-size:11px; font-weight:900; cursor:pointer}
.look .lb .go{background:#FFEAF4; color:#C22E70}
.look .lb .del{background:#F4F4F8; color:#8B8494}
.empty{padding:22px 10px; text-align:center; color:var(--muted); font-size:13px; font-weight:700; line-height:1.6}

/* ---------- 런웨이 ---------- */
.overlay{
  position:fixed; inset:0; z-index:80; display:none; background:#1B0F28;
  overflow:hidden; touch-action:manipulation;
}
.overlay.show{display:block}
.rw-inner{position:relative; height:100%; width:100%; display:flex; flex-direction:column; color:#fff}
.rw-top{display:flex; align-items:center; gap:8px; padding:calc(9px + env(safe-area-inset-top)) 12px 6px; position:relative; z-index:6}
.rw-top .tchip{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26); border-radius:999px; padding:6px 12px;
  font-size:12.5px; font-weight:900; backdrop-filter:blur(4px);
}
.rw-top .x{
  margin-left:auto; width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12); color:#fff; font-size:17px; cursor:pointer;
}
.rw-stage{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  background:
    radial-gradient(70% 50% at 50% 110%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(180deg,#2A1236 0%,#3A1A4E 52%,#2A1030 100%);
}
.rw-curtain{
  position:absolute; top:0; bottom:0; width:26%; max-width:240px; z-index:2;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 12px, rgba(0,0,0,.14) 12px 26px),
    linear-gradient(90deg,#8E1547,#C42A66 40%,#7A0F3C);
  box-shadow:inset -16px 0 30px rgba(0,0,0,.5);
}
.rw-curtain.l{left:0; border-radius:0 0 40px 0}
.rw-curtain.r{right:0; transform:scaleX(-1); border-radius:0 0 40px 0}
.rw-arch{
  position:absolute; top:0; left:0; right:0; height:24%; z-index:1;
  background:linear-gradient(180deg,#5B1B44 0%,rgba(91,27,68,0) 100%);
}
.rw-floor{
  position:absolute; left:0; right:0; bottom:0; height:34%; z-index:1;
  background:
    linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.04) 30%, rgba(255,255,255,0) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, rgba(255,255,255,0) 2px 52px);
  transform:perspective(300px) rotateX(56deg); transform-origin:bottom center;
}
.rw-spot{position:absolute; z-index:2; width:44%; height:100%; top:0; pointer-events:none; mix-blend-mode:screen}
.rw-spot.a{left:6%; background:conic-gradient(from 190deg at 50% 0%, rgba(255,236,180,.34), rgba(255,236,180,0) 30%); animation:rwsway 5s ease-in-out infinite alternate}
.rw-spot.b{right:6%; background:conic-gradient(from 166deg at 50% 0%, rgba(190,220,255,.34), rgba(190,220,255,0) 30%); animation:rwsway 5.6s ease-in-out infinite alternate-reverse}
@keyframes rwsway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.rw-model{
  position:absolute; z-index:4; left:50%; bottom:15%; transform:translateX(-50%);
  will-change:transform,opacity;
}
.rw-model svg{height:clamp(210px, 42vh, 400px); width:auto; filter:drop-shadow(0 20px 24px rgba(0,0,0,.45))}
.rw-model.duo svg{height:clamp(170px, 30vh, 300px)}
.rw-model.duo.pose, .rw-model.duo.pose2{animation:none}
@media (max-width:520px){ .rw-model svg{height:clamp(190px, 34vh, 340px)} .rw-model.duo svg{height:clamp(150px, 24vh, 240px)} }
.rw-model .fig{display:block}
.rw-model.walk{animation:walkIn 2.5s cubic-bezier(.36,.02,.3,1.03) forwards}
.rw-model.walk .fig{animation:walkBob .34s ease-in-out infinite alternate}
@keyframes walkIn{
  0%{transform:translate(-190%,10%) scale(.62); opacity:0}
  12%{opacity:1}
  58%{transform:translate(-50%,0) scale(.98)}
  72%{transform:translate(-50%,-2.5%) scale(1.03)}
  86%{transform:translate(-50%,0) scale(1)}
  100%{transform:translate(-50%,0) scale(1); opacity:1}
}
@keyframes walkBob{from{transform:translateY(0) rotate(-1.4deg)}to{transform:translateY(-4px) rotate(1.4deg)}}
.rw-model.pose{animation:poseA 1.5s ease-in-out infinite alternate}
@keyframes poseA{0%{transform:translate(-50%,0) rotate(-2.5deg) scale(1.01)}100%{transform:translate(-50%,-4px) rotate(2.5deg) scale(1.04)}}
.rw-model.pose2{animation:poseB 1.6s ease-in-out infinite alternate}
@keyframes poseB{0%{transform:translate(-50%,0) scale(1.02)}100%{transform:translate(-50%,-2px) rotate(-4deg) scale(1.05)}}
.rw-name{
  position:absolute; z-index:5; left:50%; bottom:4.5%; transform:translateX(-50%);
  background:rgba(255,255,255,.94); color:#4A2A55; border-radius:999px; padding:6px 16px;
  font-size:13px; font-weight:900; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.rw-flash{position:absolute; inset:0; z-index:7; background:#fff; opacity:0; pointer-events:none}
.rw-flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}
#rwConfetti{position:absolute; inset:0; z-index:6; pointer-events:none; width:100%; height:100%}
.rw-burst{position:absolute; z-index:6; font-size:26px; opacity:0; pointer-events:none}
.rw-burst.go{animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{opacity:0; transform:translateY(10px) scale(.4)}30%{opacity:1; transform:translateY(-6px) scale(1.15)}100%{opacity:0; transform:translateY(-46px) scale(1)}}

.rw-panel{
  position:relative; z-index:8; flex:0 0 auto; background:linear-gradient(180deg, rgba(24,10,34,.86), #180A22);
  border-top:1px solid rgba(255,255,255,.12); padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  max-height:52vh; overflow-y:auto;
}
.judges{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.judge{
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:16px;
  padding:8px 6px; text-align:center; position:relative;
}
.judge .av{font-size:26px; line-height:1; margin-bottom:2px}
.judge .av svg{height:34px; width:auto}
.judge .jn{font-size:11px; font-weight:900; color:#FFD9EC; letter-spacing:-.02em}
.judge .st{font-size:13.5px; letter-spacing:-1px; margin-top:2px; color:#4B3A22; min-height:18px}
.judge .st .s{opacity:.22; display:inline-block; transition:.2s; color:#fff}
.judge .st .s.on{opacity:1; color:#FFD23F; text-shadow:0 0 8px rgba(255,196,0,.85); animation:starPop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes starPop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.judge .say{
  font-size:11px; font-weight:800; color:#F3E6FF; line-height:1.35; margin-top:4px; min-height:28px;
  background:rgba(255,255,255,.1); border-radius:9px; padding:4px 5px;
}
.rw-total{
  display:flex; align-items:center; gap:9px; margin-top:9px; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18); border-radius:15px; padding:9px 12px;
}
.rw-total .big{font-size:22px; font-weight:900; color:#FFD23F; letter-spacing:-.03em; white-space:nowrap}
.rw-total .tt{font-size:11.5px; font-weight:800; color:#E6D6F5; line-height:1.35}
.rw-btns{display:flex; gap:7px; margin-top:9px}
.rw-btns .btn{flex:1}
.btn.white{background:#fff; color:#5A2C6B}
.btn.line{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3)}
.btn:disabled{opacity:.55; pointer-events:none}

.vs-result{margin-top:9px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:15px; padding:10px 12px; text-align:center}
.vs-result b{font-size:19px; color:#FFD23F; letter-spacing:-.02em}
.vs-result span{display:block; font-size:12px; color:#E9DBF6; font-weight:800; margin-top:2px}

/* ---------- 시간 제한 모드 ---------- */
.timer-bar{display:flex; align-items:center; gap:8px; padding:7px 9px; margin-bottom:10px}
.tm-modes{display:flex; gap:4px; background:#F7EEFB; border-radius:14px; padding:4px; min-width:0}
.tm{
  border:0; background:transparent; color:#7A6688; border-radius:11px; padding:8px 10px;
  font:inherit; font-size:12.5px; font-weight:900; cursor:pointer; min-height:38px;
  display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
}
.tm.on{background:#fff; color:#C22E70; box-shadow:0 3px 9px rgba(150,60,140,.16)}
.tm:active{transform:scale(.975)}
.tm-clock{
  margin-left:auto; display:flex; align-items:center; gap:7px; border-radius:13px; padding:5px 11px;
  background:linear-gradient(135deg,#FFEFF7,#F1E8FF); border:1.5px solid #F3D8EA;
}
.tm-clock b{
  font-size:20px; font-weight:900; letter-spacing:-.02em; color:#8B2E63; line-height:1;
  font-variant-numeric:tabular-nums;
}
.tm-clock span{font-size:10px; font-weight:900; color:#A187A0; letter-spacing:.02em; line-height:1.15}
.tm-clock.warn{border-color:#FF9E9E; background:linear-gradient(135deg,#FFE2E2,#FFEEF4); animation:tmWarn 1s ease-in-out infinite}
.tm-clock.warn b{color:#D6243F}
@keyframes tmWarn{0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(230,50,90,.32)}50%{transform:scale(1.07); box-shadow:0 0 0 9px rgba(230,50,90,0)}}
@media (max-width:400px){ .tm{padding:7px 8px; font-size:11.5px} .tm-clock b{font-size:18px} .tm-clock{padding:5px 9px} }

/* ---------- 의상 패턴 ---------- */
.patterns{display:flex; gap:6px; overflow-x:auto; padding:0 2px 9px; scrollbar-width:none; min-width:0}
.patterns::-webkit-scrollbar{display:none}
.pat{
  flex:0 0 auto; border:2px solid #F3E7F1; background:#fff; border-radius:12px; padding:4px 4px 3px;
  font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px;
}
.pat:active{transform:scale(.96)}
.pat .pv{width:42px; height:26px; border-radius:7px; overflow:hidden; display:block; border:1px solid #F6E7F1}
.pat .pv svg{display:block; width:100%; height:100%}
.pat .pn{font-size:9.5px; font-weight:900; color:#6B5A78; letter-spacing:-.03em}
.pat.on{border-color:#FF6BA8; background:#FFF4FA; box-shadow:0 5px 14px rgba(230,80,160,.2)}
.pat.on .pn{color:#C22E70}

/* ---------- 메이크업 ---------- */
.grid.mk{display:flex; flex-direction:column; gap:8px; max-height:min(46vh,430px); overflow-y:auto}
.mk-row{background:linear-gradient(180deg,#FFFDFE,#FBF6FF); border:1.5px solid #F3E7F1; border-radius:15px; padding:8px 9px 9px}
.mk-row .mh{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:900; color:#6B4B72; margin-bottom:7px}
.mk-row .mh em{font-style:normal; margin-left:auto; font-size:10px; font-weight:900; color:#A187A0; background:#F6EEFA; border-radius:999px; padding:2px 7px}
.mk-sw{display:flex; gap:6px; flex-wrap:wrap}
.mk-b{
  width:31px; height:31px; border-radius:50%; border:2.5px solid #fff; cursor:pointer; position:relative;
  box-shadow:0 2px 6px rgba(90,40,100,.18); padding:0;
}
.mk-b.on{outline:3px solid #FF6BA8; outline-offset:1px}
.mk-b.on::after{content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,.45)}
.mk-b.none{
  background:repeating-linear-gradient(45deg,#fff 0 4px,#EFE6F4 4px 8px); display:grid; place-items:center;
  color:#9B87A8; font-size:12px; font-weight:900;
}
.mk-b.none.on::after{content:none}

/* ---------- 런웨이 투표 ---------- */
.vt-head{display:flex; align-items:center; gap:8px; margin-bottom:7px; min-width:0}
.vt-head .vn{font-size:12px; font-weight:900; color:#FFD9EC; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vt-head .vstep{margin-left:auto; font-size:10.5px; font-weight:900; color:#E7D6F5; background:rgba(255,255,255,.12); border-radius:999px; padding:3px 9px; white-space:nowrap}
.vote{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:8px 10px 9px}
.vote .vq{font-size:12px; font-weight:900; color:#F6E8FF; text-align:center; margin-bottom:2px; letter-spacing:-.02em}
.vstars{display:flex; justify-content:center; gap:2px}
.vstars button{
  border:0; background:transparent; font-size:clamp(27px,8.6vw,35px); line-height:1.15;
  color:rgba(255,255,255,.26); cursor:pointer; padding:2px 3px; text-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:transform .12s ease, color .12s ease;
}
.vstars button.on{color:#FFD23F; text-shadow:0 0 13px rgba(255,196,0,.95)}
.vstars button:active{transform:scale(.88)}
.vstars button:disabled{pointer-events:none}
.vote.done .vstars button{cursor:default}
.vsay{display:flex; align-items:center; gap:7px; margin-top:6px; background:rgba(255,255,255,.1); border-radius:11px; padding:6px 8px; min-height:34px}
.vsay .jav{width:24px; height:24px; flex:0 0 auto; border-radius:50%; background:rgba(255,255,255,.18); display:grid; place-items:center}
.vsay .jav svg{height:20px; width:auto}
.vsay p{margin:0; font-size:11.5px; font-weight:800; color:#F3E6FF; line-height:1.35}
.vboard{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.vboard .bchip{font-size:11px; font-weight:900; color:#F0E4FF; background:rgba(255,255,255,.12); border-radius:999px; padding:4px 9px; white-space:nowrap}
.vboard .bchip.me{background:linear-gradient(135deg,#FF6BA8,#B073FF); color:#fff}

/* ---------- 시상대 ---------- */
.podium{
  position:absolute; left:0; right:0; bottom:0; z-index:6; display:flex; align-items:flex-end; justify-content:center;
  gap:5px; padding:0 8px 4px; pointer-events:none;
}
.pod{flex:1 1 0; max-width:32%; display:flex; flex-direction:column; align-items:center; opacity:0; transform:translateY(24px); animation:podIn .55s cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes podIn{to{opacity:1; transform:translateY(0)}}
.pod .pa{position:relative; display:flex; align-items:flex-end; justify-content:center; width:100%}
.pod .pa svg{height:clamp(90px,15.5vh,138px); width:auto; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.pod.p1 .pa svg{height:clamp(112px,19vh,168px)}
.pod .crown{position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:19px; animation:twinkle 1.5s ease-in-out infinite}
.pod .pb{width:100%; border-radius:9px 9px 4px 4px; display:grid; place-items:center; font-weight:900; font-size:15px; color:#4A2A55; box-shadow:inset 0 -7px 0 rgba(0,0,0,.1)}
.pod.p1 .pb{height:clamp(56px,9.5vh,84px); background:linear-gradient(180deg,#FFE27A,#F0AE0E); color:#5B3A00; font-size:18px}
.pod.p2 .pb{height:clamp(38px,6.6vh,56px); background:linear-gradient(180deg,#EEF2F8,#C2CBD9)}
.pod.p3 .pb{height:clamp(28px,5.2vh,42px); background:linear-gradient(180deg,#F7CFA9,#D5976A)}
.pod .pn{font-size:10.5px; font-weight:900; color:#fff; margin-top:4px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.pod .ps{font-size:10px; font-weight:900; color:#FFD23F; margin-top:1px; white-space:nowrap}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
  background:rgba(45,20,55,.94); color:#fff; font-size:13.5px; font-weight:800;
  padding:11px 17px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:120;
  box-shadow:0 10px 26px rgba(0,0,0,.3); max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (max-width:820px){
  .stage{min-height:clamp(250px,34vh,330px)}
  .model-wrap svg{height:clamp(220px,31vh,300px)}
  .theme-bar{padding:9px 10px}
  .theme-top .tem{width:38px; height:38px; font-size:20px}
  .btn.primary{min-height:52px; font-size:15.5px}
  .who{margin-top:7px}
  .grid{max-height:none}
}
footer{margin:16px 4px 0; text-align:center; font-size:11.5px; color:#A794B0; font-weight:600; line-height:1.7}
footer a{color:#B073FF; text-decoration:none; font-weight:800}
</style>

<script>
(function(){
'use strict';

/* ============================================================
   0. 작은 도우미
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var pick = function(arr){ return arr[Math.floor(Math.random()*arr.length)]; };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };

function hexToRgb(h){
  h = String(h).replace('#','');
  if(h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
function mix(hex, target, amt){
  var c = hexToRgb(hex), t = hexToRgb(target);
  var f = function(a,b){ return Math.round(a + (b-a)*amt); };
  var h = function(n){ return ('0'+clamp(n,0,255).toString(16)).slice(-2); };
  return '#' + h(f(c.r,t.r)) + h(f(c.g,t.g)) + h(f(c.b,t.b));
}
function lighten(hex, amt){ return mix(hex, '#ffffff', amt); }
function darken(hex, amt){ return mix(hex, '#000000', amt); }

/* ============================================================
   1. 소리 (Web Audio · 음소거 토글)
   ============================================================ */
var AC = null, muted = false;
try { muted = localStorage.getItem('dti_muted') === '1'; } catch(e){}
function actx(){
  if(!AC){
    var ACtor = window.AudioContext || window.webkitAudioContext;
    if(!ACtor) return null;
    try { AC = new ACtor(); } catch(e){ return null; }
  }
  if(AC.state === 'suspended'){ try { AC.resume(); } catch(e){} }
  return AC;
}
function tone(freq, dur, type, gain, delay){
  if(muted) return;
  var a = actx(); if(!a) return;
  try{
    var t0 = a.currentTime + (delay||0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function noise(dur, gain, freq, q, delay){
  if(muted) return;
  var a = actx(); if(!a) return;
  try{
    var t0 = a.currentTime + (delay||0);
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);

function lum(hex){
  var c = hexToRgb(hex);
  return (0.299*c.r + 0.587*c.g + 0.114*c.b) / 255;
}

/* --- 의상 패턴(텍스처) --- */
var PATTERNS = [
  { id:'solid',  name:'단색' },
  { id:'dot',    name:'도트' },
  { id:'check',  name:'체크' },
  { id:'stripe', name:'줄무늬' },
  { id:'star',   name:'별빛' },
  { id:'heart',  name:'하트' }
];
var patSeq = 0;
function patternMotif(kind, motif){
  if(kind === 'dot'){
    return '<circle cx="4" cy="4" r="2.1" fill="'+motif+'"/>'+
           '<circle cx="11" cy="11" r="2.1" fill="'+motif+'"/>';
  }
  if(kind === 'stripe'){
    return '<rect x="0" y="0" width="4.6" height="14" fill="'+motif+'"/>'+
           '<rect x="8" y="0" width="1.8" height="14" fill="'+motif+'" opacity=".6"/>';
  }
  if(kind === 'check'){
    return '<rect x="0" y="0" width="7" height="7" fill="'+motif+'" opacity=".55"/>'+
           '<rect x="7" y="7" width="7" height="7" fill="'+motif+'" opacity=".55"/>'+
           '<rect x="7" y="0" width="7" height="7" fill="'+motif+'" opacity=".22"/>'+
           '<rect x="0" y="7" width="7" height="7" fill="'+motif+'" opacity=".22"/>';
  }
  if(kind === 'star'){
    return '<path d="M7 1.4 l1.7 3.5 3.9 .5 -2.9 2.7 .8 3.8 -3.5 -1.9 -3.5 1.9 .8 -3.8 -2.9 -2.7 3.9 -.5 z" fill="'+motif+'"/>';
  }
  if(kind === 'heart'){
    return '<path d="M7 12.4 C2.6 9.4 1 7.1 1 5.2 C1 3.4 2.4 2.1 4.2 2.1 C5.4 2.1 6.4 2.8 7 3.7 C7.6 2.8 8.6 2.1 9.8 2.1 C11.6 2.1 13 3.4 13 5.2 C13 7.1 11.4 9.4 7 12.4 Z" fill="'+motif+'"/>';
  }
  return '';
}
/* 드레스·상의·하의에 쓸 패턴(옷 색에 어울리는 무늬색 자동 선택) */
function makePattern(kind, base){
  if(!kind || kind === 'solid') return { id:null, defs:'' };
  var motif = lum(base) > 0.6 ? darken(base, .42) : lighten(base, .62);
  var id = 'pat' + (++patSeq);
  return {
    id: id,
    defs: '<defs><pattern id="'+id+'" width="14" height="14" patternUnits="userSpaceOnUse">'+
          '<rect width="14" height="14" fill="'+base+'"/>' + patternMotif(kind, motif) + '</pattern></defs>'
  };
}
function withPattern(garment, pid){
  if(!pid || !garment) return garment;
  return garment.split('fill="var(--o1)"').join('fill="url(#'+pid+')"');
}
/* 옷장 패턴 선택지 미리보기 */
function patternPreview(kind){
  var base = '#FFE1EF', motif = '#FF6BA8';
  if(!kind || kind === 'solid'){
    return '<svg viewBox="0 0 42 26" preserveAspectRatio="none"><rect width="42" height="26" fill="'+base+'"/></svg>';
  }
  var id = 'pv' + (++patSeq);
  return '<svg viewBox="0 0 42 26" preserveAspectRatio="xMidYMid slice">'+
    '<defs><pattern id="'+id+'" width="14" height="14" patternUnits="userSpaceOnUse">'+
    '<rect width="14" height="14" fill="'+base+'"/>' + patternMotif(kind, motif) + '</pattern></defs>'+
    '<rect width="42" height="26" fill="url(#'+id+')"/></svg>';
}

function makeupOf(s){

    blush: s.mkBlush || '#FF9FB0',
    eye:   s.mkEye   || 'none',
    nail:  s.mkNail  || '#FF6BA8'
  };
}
function eyeMakeupSVG(mk){

  var e = mk.eye;
  return '<g class="mk-eye">'+
    '<ellipse cx="97" cy="79" rx="8.4" ry="5" fill="'+e+'" opacity=".55"/>'+
    '<ellipse cx="123" cy="79" rx="8.4" ry="5" fill="'+e+'" opacity=".55"/>'+
    '<path d="M90 80 Q86 76 84 71" stroke="'+e+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
    '<path d="M130 80 Q134 76 136 71" stroke="'+e+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
    '<path d="M92 86.5 l-1.8 2.6 M128 86.5 l1.8 2.6" stroke="#3B2632" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>'+
    '</g>';
}
function nailSVG(mk){
  if(!mk.nail || mk.nail === 'none') return '';
  return '<g class="mk-nail"><circle cx="72" cy="237" r="3.3" fill="'+mk.nail+'"/>'+
    '<circle cx="148" cy="237" r="3.3" fill="'+mk.nail+'"/></g>';
}

function colorsFor(s){
  var skin = findItem(SKINS, s.skin || 'light');
  return {
    skin: skin.c, skin2: skin.c2,
    hair: s.hairColor || '#3B2632',
    hair2: lighten(s.hairColor || '#3B2632', .35),
    o1: s.outfitColor || '#FF8FBF',
    o2: lighten(s.outfitColor || '#FF8FBF', .34),
    o3: darken(s.outfitColor || '#FF8FBF', .26),
    acc: '#FFC53D', acc2: '#E19B00'
  };
}
function cssVars(c){
  return '--skin:'+c.skin+';--skin2:'+c.skin2+';--hair:'+c.hair+';--hair2:'+c.hair2+
    ';--o1:'+c.o1+';--o2:'+c.o2+';--o3:'+c.o3+';--acc:'+c.acc+';--acc2:'+c.acc2;
}
function bodySVG(){
  return '<g class="body">'+
    '<rect x="96" y="188" width="13" height="112" rx="6.5" fill="var(--skin)"/>'+
    '<rect x="111" y="188" width="13" height="112" rx="6.5" fill="var(--skin)"/>'+

    '<ellipse cx="118" cy="303" rx="9" ry="6" fill="var(--skin)"/>'+
    '<rect x="103" y="106" width="14" height="26" rx="6" fill="var(--skin)"/>'+
    '<path d="M92 140 Q110 133 128 140 L126 196 Q110 203 94 196 Z" fill="var(--skin)"/>'+
    '<ellipse cx="110" cy="84" rx="31" ry="34" fill="var(--skin)"/>'+

    '<circle cx="141" cy="89" r="6" fill="var(--skin)"/>'+

function armsSVG(){
  return '<g class="arms">'+
    '<path d="M91 150 C84 176 77 208 73 234" stroke="var(--skin)" stroke-width="12" fill="none" stroke-linecap="round"/>'+
    '<path d="M129 150 C136 176 143 208 147 234" stroke="var(--skin)" stroke-width="12" fill="none" stroke-linecap="round"/>'+
    '<circle cx="72" cy="239" r="6.8" fill="var(--skin)"/>'+
    '<circle cx="148" cy="239" r="6.8" fill="var(--skin)"/>'+
    '</g>';
}
function shoeColorVars(s, c){
  // 신발도 코디 색을 따르되, 신발 전용 색이 있으면 그것을 쓴다
  var sc = s.shoeColor || s.outfitColor || '#FF8FBF';
  return '--o1:'+sc+';--o2:'+lighten(sc,.34)+';--o3:'+darken(sc,.26)+';--acc:'+c.acc+';--acc2:'+c.acc2;
}

function figureSVG(s, opt){
  opt = opt || {};
  var c = colorsFor(s);
  var hair = findItem(HAIRS, s.hair), face = findItem(FACES, s.face);
  var dress = findItem(DRESSES, s.dress), top = findItem(TOPS, s.top), bottom = findItem(BOTTOMS, s.bottom);
  var shoes = findItem(SHOES, s.shoes);
  var accs = (s.acc || []).map(function(id){ return findItem(ACCS, id); });
  var mk = makeupOf(s);
  var pat = makePattern(s.pattern, c.o1);

  // 메이크업: 립스틱·블러셔 색을 얼굴 색에 입힌다
  var faceSvg = face.svg;
  if(mk.lip && mk.lip !== 'none'){
    faceSvg = faceSvg.split('#BC4B62').join(mk.lip).split('#C2556A').join(mk.lip);
  }
  faceSvg = faceSvg.split('#FF9FB0').join((mk.blush && mk.blush !== 'none') ? mk.blush : 'none');

  var out = '';
  out += '<svg viewBox="0 0 220 340" xmlns="http://www.w3.org/2000/svg" class="fig" style="'+cssVars(c)+'" role="img" aria-label="'+esc(opt.label || '패션 모델')+'">';
  out += pat.defs;
  // 무대 그림자
  out += '<ellipse cx="110" cy="312" rx="52" ry="9" fill="rgba(90,40,110,.16)"/>';
  // 날개는 몸 뒤
  accs.forEach(function(a){ if(a.id === 'wings') out += a.svg; });
  // 뒤머리
  out += '<g>'+hair.back+'</g>';
  // 다리·신발·몸
  out += '<g style="'+shoeColorVars(s,c)+'">'+shoes.svg+'</g>';
  out += bodySVG();
  // 하의 또는 드레스 (패턴이 골라져 있으면 무늬천으로)
  if(s.mode === 'dress'){
    out += '<g>'+withPattern(dress.svg, pat.id)+'</g>';
  }else{
    out += '<g>'+withPattern(bottom.svg, pat.id)+'</g>';
    out += '<g>'+withPattern(top.svg, pat.id)+'</g>';
  }
  // 팔·손은 옷 위에 (스커트에 팔이 묻히지 않게)
  out += armsSVG();
  // 얼굴 + 아이섀도·속눈썹
  out += '<g>'+faceSvg+'</g>';
  out += eyeMakeupSVG(mk);
  // 앞머리
  out += '<g>'+hair.front+'</g>';
  // 액세서리 (날개 제외)
  accs.forEach(function(a){ if(a.id !== 'wings') out += a.svg; });
  // 손톱
  out += nailSVG(mk);
  out += '</svg>';
  return out;
}

/* 썸네일용: 지금 코디에 해당 옷 하나만 갈아입힌 모습 */
function thumbSVG(kind, item){
  var s = JSON.parse(JSON.stringify(st));
  if(!item) return figureSVG(s);
  if(kind === 'skin') s.skin = item.id;
  else if(kind === 'face') s.face = item.id;
  else if(kind === 'hair') s.hair = item.id;
  else if(kind === 'dress'){ s.mode = 'dress'; s.dress = item.id; }
  else if(kind === 'top'){ s.mode = 'two'; s.top = item.id; }
  else if(kind === 'bottom'){ s.mode = 'two'; s.bottom = item.id; }
  else if(kind === 'shoes') s.shoes = item.id;
  else if(kind === 'acc'){ s.acc = [item.id]; }
  return figureSVG(s, { label:item.name });
}

function wornItems(s){
  var list = [findItem(HAIRS, s.hair)];
  if(s.mode === 'dress'){ list.push(findItem(DRESSES, s.dress)); }
  else { list.push(findItem(TOPS, s.top)); list.push(findItem(BOTTOMS, s.bottom)); }
  list.push(findItem(SHOES, s.shoes));
  list.push(findItem(FACES, s.face));
  (s.acc || []).forEach(function(id){ list.push(findItem(ACCS, id)); });
  return list;
}
function scoreLook(s, theme){
  var pts = 0, seen = {};
  wornItems(s).forEach(function(it){
    (it.tags || []).forEach(function(tg){
      var w = theme.want[tg];
      if(!w) return;
      var n = seen[tg] || 0;
      pts += w * (n ? 0.45 : 1);
      seen[tg] = n + 1;
    });
    (it.tags || []).forEach(function(tg){
      var a = theme.avoid && theme.avoid[tg];
      if(a) pts -= a * 0.7;
    });
  });
  var c = (s.mode === 'dress' ? s.outfitColor : s.outfitColor) || '#FF8FBF';
  if((theme.colors || []).some(function(x){ return x.toUpperCase() === String(c).toUpperCase(); })) pts += 6;
  pts = clamp(pts, 0, 60);
  return Math.round(pts * 10) / 10;
}
function starsFor(pts, judgeIdx){
  var base = 1.35 + pts / 17.5;            // 0점 ≈ 1.4, 30점 ≈ 3.1, 60점 ≈ 4.8
  var jitter = [0.35, -0.25, 0.1][judgeIdx] + rnd(-0.45, 0.45);
  return clamp(Math.round(base + jitter), 1, 5);
}

var confettiRAF = null, confettiParts = [];
function confettiBurst(count, power){
  var cv = $('rwConfetti');
  if(!cv) return;
  var rect = cv.parentNode.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.floor(rect.width * dpr));
  cv.height = Math.max(1, Math.floor(rect.height * dpr));
  var ctx = cv.getContext('2d');
  var cols = ['#FF5B9E','#FFD23F','#9B6BFF','#65D6FF','#7BE3C3','#FFFFFF'];
  var n = count || 90;
  for(var i=0;i<n;i++){
    confettiParts.push({
      x: cv.width * (0.15 + Math.random()*0.7),
      y: cv.height * (0.3 + Math.random()*0.2),
      vx: rnd(-3.4, 3.4) * (power||1) * dpr,
      vy: rnd(-9, -3) * (power||1) * dpr,
      g: 0.24 * dpr,
      w: rnd(5,11) * dpr, h: rnd(7,15) * dpr,
      a: rnd(0, Math.PI*2), va: rnd(-.18,.18),
      c: pick(cols), life: 1
    });
  }
  if(confettiRAF) return;
  var last = performance.now();
  function frame(t){
    var dt = Math.min(2, (t - last) / 16.7); last = t;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=confettiParts.length-1;i>=0;i--){
      var p = confettiParts[i];
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      p.life -= 0.006 * dt;
      if(p.y > cv.height + 40 || p.life <= 0){ confettiParts.splice(i,1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.globalAlpha = clamp(p.life,0,1);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.a*1.6)));
      ctx.restore();
    }
    if(confettiParts.length){ confettiRAF = requestAnimationFrame(frame); }
    else { confettiRAF = null; ctx.clearRect(0,0,cv.width,cv.height); }
  }
  confettiRAF = requestAnimationFrame(frame);
}

var AI_NAMES = ['루나','미아','코코','보라','하니','모모','나나','지니'];
function weightedPick(list, theme){
  var ws = list.map(function(it){
    var w = 1;
    (it.tags || []).forEach(function(tg){
      if(theme.want && theme.want[tg]) w += theme.want[tg] * 1.8;
      if(theme.avoid && theme.avoid[tg]) w -= theme.avoid[tg] * 0.8;
    });
    return Math.max(0.12, w);
  });
  var tot = ws.reduce(function(a,b){ return a + b; }, 0);
  var r = Math.random() * tot;
  for(var i=0;i<list.length;i++){ r -= ws[i]; if(r <= 0) return list[i]; }
  return list[list.length - 1];
}
function aiLook(theme){
  var s = JSON.parse(JSON.stringify(DEFAULT_STATE));
  s.theme = theme.id;
  s.skin = pick(SKINS).id;
  s.hair = weightedPick(HAIRS, theme).id;
  s.hairColor = pick(HAIR_COLORS);
  s.face = pick(FACES).id;
  s.mode = Math.random() < 0.58 ? 'dress' : 'two';
  s.dress = weightedPick(DRESSES, theme).id;
  s.top = weightedPick(TOPS, theme).id;
  s.bottom = weightedPick(BOTTOMS, theme).id;
  s.shoes = weightedPick(SHOES, theme).id;
  var col = (Math.random() < 0.62 && theme.colors && theme.colors.length) ? pick(theme.colors) : pick(OUTFIT_COLORS);
  s.outfitColor = col; s.shoeColor = col;
  s.pattern = pick(PATTERNS).id;
  var acc = [];
  var n = Math.random() < 0.55 ? 2 : 1;
  for(var i=0;i<n;i++){
    var a = weightedPick(ACCS, theme);
    if(acc.indexOf(a.id) < 0) acc.push(a.id);
  }
  if(Math.random() < 0.5){
    var props = ACCS.filter(function(x){ return x.prop; });
    var pr = pick(props);
    if(pr && acc.indexOf(pr.id) < 0) acc.push(pr.id);
  }
  s.acc = acc;
  s.mkLip = pick(['#E8467C','#FF5B8A','#C2447A','#E24B4B','#FF9FB0']);
  s.mkBlush = pick(['#FF9FB0','#FF8FB8','#FFB08F','#D9B3FF']);
  s.mkEye = Math.random() < 0.7 ? pick(['#C8A6FF','#FFB3D1','#9FD8FF','#FFE08A']) : 'none';
  s.mkNail = pick(['#FF6BA8','#E24B4B','#FFD166','#B8A8FF']);
  return s;
}

    var tmp = names[i]; names[i] = names[j]; names[j] = tmp;
  }
  var out = [];
  if(versus.on && versus.looks && versus.looks.length > 1){
    out.push({ name:'윤진', state: JSON.parse(JSON.stringify(versus.looks[0].state)), me:true });
    out.push({ name:'형원', state: JSON.parse(JSON.stringify(versus.looks[1].state)), me:true });
    out.push({ name:names[0], state: aiLook(theme), ai:true });
    out.push({ name:names[1], state: aiLook(theme), ai:true });
  }else{
    out.push({ name: activeName, state: JSON.parse(JSON.stringify(st)), me:true });
    for(var k=0;k<3;k++) out.push({ name:names[k], state: aiLook(theme), ai:true });
  }
  return out;
}

/* ============================================================
   8-c. 내가 주는 ⭐1~5점 투표
   ============================================================ */
var voteResolve = null;
function askVote(p){
  return new Promise(function(resolve){
    voteResolve = resolve;
    resetStars();
    $('rwVote').classList.remove('done');
    $('rwVQ').textContent = p.ai ? '이 AI 친구의 코디, 몇 점일까요?' : ('⭐ ' + p.name + '의 런웨이, 몇 점을 줄까요?');
    setSay(null, '별을 누르면 점수가 매겨지고 다음 참가자가 나와요!');
  });
}
function giveVote(v){
  var r = voteResolve;
  if(!r) return;
  voteResolve = null;
  var btns = $('rwStars').querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    var n = Number(btns[i].getAttribute('data-v'));
    btns[i].disabled = true;
    if(n <= v) btns[i].classList.add('on'); else btns[i].classList.remove('on');
  }
  $('rwVote').classList.add('done');
  SFX.star(v - 1);
  r(v);
}

/* ============================================================
   8-d. 런웨이 진행 (참가자 차례 → 시상대)
   ============================================================ */
var runToken = 0;
var showVotes = [];

async function runShow(){
  var theme = findItem(THEMES, st.theme);
  resetRunway();
  var token = ++runToken;
  $('rwTheme').textContent = theme.emoji + ' ' + theme.name;
  var people = buildParticipants();
  showVotes = [];
  renderBoard();

  for(var i=0;i<people.length;i++){
    if(token !== runToken) return;
    var p = people[i];
    $('rwStep').textContent = '참가자 ' + (i+1) + ' / ' + people.length;
    $('rwNow').textContent = '🎤 지금 무대 · ' + (p.ai ? 'AI 친구 ' : '') + p.name;
    $('rwVQ').textContent = '잠시 후 런웨이가 시작돼요…';
    setSay(null, p.ai ? '주제에 맞춰 스스로 코디한 AI 친구예요!' : (p.name + '의 코디를 무대에서 만나요!'));
    resetStars();
    var model = addModel(p.state, p.name, 50, p.ai ? '🤖 ' : '');
    SFX.walk();
    model.classList.add('walk');
    await wait(1150);
    if(token !== runToken) return;
    $('rwFlash').classList.add('go'); SFX.flash();
    setTimeout(function(){ $('rwFlash').classList.remove('go'); }, 620);
    await wait(1450);
    if(token !== runToken) return;
    model.classList.remove('walk');
    model.classList.add(i % 2 ? 'pose2' : 'pose');
    if(!p.ai){ emojiBurst(); }

    var score = await askVote(p);
    if(score == null || token !== runToken) return;
    showVotes.push({ name:p.name, score:score, me:!!p.me, ai:!!p.ai, state:p.state });
    renderBoard();
    var line = reactLine(p, theme, score);
    setSay(line.judge, line.text);
    confettiBurst(score >= 4 ? 70 : 26, score >= 4 ? 1.05 : 0.7);
    if(score >= 4) SFX.clap();
    await wait(1150);
    if(token !== runToken) return;
    clearStageModels();
  }
  await showPodium(theme, token);
}

async function showPodium(theme, token){
  clearStageModels();
  var sorted = showVotes.slice().sort(function(a,b){ return b.score - a.score; });
  if(!sorted.length) return;
  var top = sorted.slice(0,3);
  var order = [top[1], top[0], top[2]];
  var pod = document.createElement('div');
  pod.className = 'podium';
  pod.innerHTML = order.map(function(p){
    if(!p) return '<div class="pod" style="visibility:hidden"></div>';
    var rank = (p === top[0]) ? 1 : (p === top[1] ? 2 : 3);
    var delay = rank === 1 ? 0.95 : (rank === 2 ? 0.5 : 0.05);
    return '<div class="pod p'+rank+'" style="animation-delay:'+delay+'s">'+
      '<div class="pa">'+(rank === 1 ? '<span class="crown">👑</span>' : '')+figureSVG(p.state, { label:p.name+' '+rank+'등' })+'</div>'+
      '<div class="pb">'+rank+'</div>'+
      '<div class="pn">'+esc(p.name)+(p.ai ? ' 🤖' : '')+'</div>'+
      '<div class="ps">⭐'+p.score+'</div></div>';
  }).join('');
  $('rwStage').appendChild(pod);

  $('rwStep').textContent = '시상식';
  $('rwNow').textContent = '🏆 우승 발표';
  $('rwVote').hidden = true;
  $('rwResult').hidden = false;
  $('rwResult').innerHTML = '<b>🏆 ' + esc(top[0].name) + ' 우승! ⭐' + top[0].score + '</b>' +
    '<span>' + sorted.map(function(v, i){ return (i+1) + '위 ' + esc(v.name) + ' ⭐' + v.score; }).join('  ·  ') + '</span>';
  $('rwAgain').disabled = false;

  await wait(380); if(token !== runToken) return; SFX.star(0);
  await wait(430); if(token !== runToken) return; SFX.star(1);
  await wait(430); if(token !== runToken) return;
  SFX.fanfare(); SFX.clap();
  confettiBurst(180, 1.25); emojiBurst();
  await wait(520); if(token !== runToken) return;
  confettiBurst(90, 1.0);
  SFX.clap();
}

function openRunway(){
  stopTimer();
  $('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  runShow();
}
function closeRunway(){
  runToken++;
  if(voteResolve){ var r = voteResolve; voteResolve = null; r(null); }
  $('overlay').classList.remove('show');
  document.body.style.overflow = '';
  clearStageModels();
  var cv = $('rwConfetti');
  if(cv){ var ctx = cv.getContext('2d'); if(ctx) ctx.clearRect(0,0,cv.width,cv.height); }
  confettiParts.length = 0;
  resetTimer(180);
}

/* ============================================================
   8-e. 제한 시간 모드 (3분 도전 / 자유 코디)
   ============================================================ */
var TM = { mode:'free', left:180, endAt:0, id:null };
try { TM.mode = localStorage.getItem('dti_timermode') === 'challenge' ? 'challenge' : 'free'; } catch(e){}

function updateClock(){
  if(TM.mode !== 'challenge') return;
  var s = Math.max(0, TM.left);
  var m = Math.floor(s / 60), ss = s % 60;
  $('tmTime').textContent = m + ':' + (ss < 10 ? '0' : '') + ss;
  $('tmClock').classList.toggle('warn', s <= 30);
}
function renderTimerMode(){
  var btns = document.querySelectorAll('.tm[data-tm]');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-tm') === TM.mode);
  $('tmClock').hidden = TM.mode !== 'challenge';
  updateClock();
}
function stopTimer(){ if(TM.id){ clearInterval(TM.id); TM.id = null; } }
function startTimer(){
  stopTimer();
  if(TM.mode !== 'challenge') return;
  TM.endAt = Date.now() + Math.max(0, TM.left) * 1000;
  TM.id = setInterval(function(){
    var left = Math.max(0, Math.round((TM.endAt - Date.now()) / 1000));
    if(left !== TM.left){
      var tick = (left <= 10 && left > 0);
      TM.left = left;
      updateClock();
      if(tick) tone(1046, 0.05, 'square', 0.045);
    }
    if(left <= 0){ stopTimer(); timeUp(); }
  }, 200);
}
function resetTimer(sec){
  TM.left = (typeof sec === 'number') ? sec : 180;
  updateClock();
  if(TM.mode === 'challenge' && !$('overlay').classList.contains('show')) startTimer();
}
function setTimerMode(mode){
  TM.mode = mode;
  try { localStorage.setItem('dti_timermode', mode); } catch(e){}
  stopTimer();
  TM.left = 180;
  renderTimerMode();
  if(mode === 'challenge'){
    startTimer();
    toast('⏱️ 3분 안에 코디 완성! 30초 남으면 알려 줄게요');
  }else{
    toast('🕊️ 시간 제한 없이 천천히 꾸며요');
  }
}
function timeUp(){
  if($('overlay').classList.contains('show')) return;
  SFX.theme(); SFX.flash();
  toast('⏰ 시간 종료! 바로 런웨이로 갑니다 ✨');
  openRunway();
}

/* ============================================================
   9. 룩북
   ============================================================ */
var LOOK_KEY = 'dti_lookbook_v1';
function loadLooks(){
  try{
    var raw = localStorage.getItem(LOOK_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveLooks(arr){
  try{ localStorage.setItem(LOOK_KEY, JSON.stringify(arr.slice(0, 36))); }catch(e){}
}
function saveToLookbook(){
  var theme = findItem(THEMES, st.theme);
  var arr = loadLooks();
  var pts = scoreLook(st, theme);
  arr.unshift({
    id: 'l' + Date.now(),
    name: activeName,
    theme: theme.id,
    themeName: theme.name,
    emoji: theme.emoji,
    score: Math.round(pts),
    stars: Math.max(1, Math.min(5, Math.round(pts/12))),
    at: new Date().toISOString().slice(0,10),
    state: JSON.parse(JSON.stringify(st))
  });
  saveLooks(arr);
  toast('💾 ' + activeName + '의 코디를 룩북에 저장했어요!');
  SFX.pick();
  renderLooks();
}
function renderLooks(){
  var arr = loadLooks();
  var box = $('looks');
  if(!arr.length){
    box.innerHTML = '<div class="empty" style="grid-column:1/-1">아직 저장한 코디가 없어요.<br>마음에 드는 코디를 만들고 💾 버튼을 눌러 보세요!</div>';
    return;
  }
  box.innerHTML = arr.map(function(l){
    var look = l.state || {};
    return '<div class="look" data-look="'+l.id+'">'+
      '<div class="ph">'+figureSVG(look, { label:l.name+' 저장 룩' })+'</div>'+
      '<div class="nm">'+esc(l.emoji || '👗')+' '+esc(l.themeName || '')+'</div>'+
      '<div class="sc">'+esc(l.name || '')+' · ⭐'+(l.stars || Math.max(1, Math.min(5, Math.round((l.score||0)/12))))+'</div>'+
      '<div class="lb"><button class="go" type="button" data-wear="'+l.id+'">입히기</button>'+
      '<button class="del" type="button" data-del="'+l.id+'">삭제</button></div>'+
    '</div>';
  }).join('');
}
function wearLook(id){
  var l = loadLooks().filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  st = JSON.parse(JSON.stringify(DEFAULT_STATE));
  Object.keys(l.state || {}).forEach(function(k){ if(st[k] !== undefined) st[k] = l.state[k]; });
  if(l.state && l.state.theme) st.theme = l.state.theme;
  saveState(); renderAll();
  $('lookSheet').classList.remove('show');
  toast('👗 ' + (l.name || '') + '의 코디를 불러왔어요!');
  SFX.pick();
}
function deleteLook(id){
  saveLooks(loadLooks().filter(function(x){ return x.id !== id; }));
  renderLooks(); SFX.off(); toast('룩북에서 지웠어요.');
}

/* ============================================================
   10. 토스트 · UI 배선
   ============================================================ */
var toastTimer = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function renderMute(){
  var b = $('muteBtn');
  b.textContent = muted ? '🔇' : '🔊';
  b.setAttribute('aria-pressed', muted ? 'true' : 'false');
  b.title = muted ? '소리 켜기' : '소리 끄기';
}
function renderStarsDecor(){
  var box = $('stageStars');
  var em = ['✨','⭐','💫','✨','🌟','✨','💖','✨'];
  var html = '';
  for(var i=0;i<10;i++){
    html += '<i style="left:'+(4 + Math.random()*90)+'%; top:'+(6 + Math.random()*76)+'%; animation-delay:'+(Math.random()*3)+'s; font-size:'+(10+Math.random()*10)+'px">'+pick(em)+'</i>';
  }
  box.innerHTML = html;
}

function renderAll(){
  renderThemes();
  renderCats();
  renderWardrobe();
  renderAvatar();
  renderMute();
  syncWhoUI();
}

/* 이벤트 */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-theme],[data-cat],[data-id],[data-color],[data-pose],[data-name],[data-wear],[data-del],[data-pat],[data-mk],[data-tm],[data-v]') : null;
  if(!t) return;

  if(t.hasAttribute('data-theme')){
    st.theme = t.getAttribute('data-theme');
    saveState(); renderThemes(); SFX.theme();
    var th = findItem(THEMES, st.theme);
    toast(th.emoji + ' 오늘의 주제: ' + th.name);
    return;
  }
  if(t.hasAttribute('data-cat')){
    cat = t.getAttribute('data-cat');
    renderCats(); renderWardrobe(); SFX.tap();
    return;
  }
  if(t.hasAttribute('data-id')){
    var id = t.getAttribute('data-id');
    if(cat === 'skin'){ st.skin = id; }
    else if(cat === 'face'){ st.face = id; }
    else if(cat === 'hair'){ st.hair = id; }
    else if(cat === 'dress'){ st.mode = 'dress'; st.dress = id; }
    else if(cat === 'top'){ st.mode = 'two'; st.top = id; }
    else if(cat === 'bottom'){ st.mode = 'two'; st.bottom = id; }
    else if(cat === 'shoes'){ st.shoes = id; if(!st.shoeColor) st.shoeColor = st.outfitColor; }
    else if(cat === 'acc'){
      var acc = (st.acc || []).slice();
      var at = acc.indexOf(id);
      if(at >= 0) acc.splice(at, 1); else acc.push(id);
      st.acc = acc;
    }
    saveState();
    renderWardrobe(); renderAvatar();
    if(cat === 'acc' && (st.acc||[]).indexOf(id) < 0) SFX.off(); else SFX.pick();
    return;
  }
  if(t.hasAttribute('data-color')){
    var col = t.getAttribute('data-color');
    if(cat === 'hair') st.hairColor = col;
    else if(cat === 'shoes'){ st.shoeColor = col; }
    else st.outfitColor = col;
    saveState(); renderWardrobe(); renderAvatar(); SFX.pick();
    return;
  }
  if(t.hasAttribute('data-pat')){
    st.pattern = t.getAttribute('data-pat');
    saveState(); renderWardrobe(); renderAvatar(); SFX.pick();
    return;
  }
  if(t.hasAttribute('data-mk')){
    st[t.getAttribute('data-mk')] = t.getAttribute('data-mkc');
    saveState(); renderWardrobe(); renderAvatar(); SFX.pick();
    return;
  }
  if(t.hasAttribute('data-tm')){
    setTimerMode(t.getAttribute('data-tm'));
    return;
  }
  if(t.hasAttribute('data-v')){
    giveVote(Number(t.getAttribute('data-v')));
    return;
  }
  if(t.hasAttribute('data-pose')){
    setPose(Number(t.getAttribute('data-pose'))); SFX.tap(); saveState();
    return;
  }
  if(t.hasAttribute('data-name')){
    var nm = t.getAttribute('data-name');
    if(versus.on){
      var idx = -1;
      for(var q=0;q<versus.looks.length;q++){ if(versus.looks[q].name === nm) idx = q; }
      if(idx >= 0){ vsSelect(idx); SFX.tap(); return; }
      // 대결에 없는 이름을 고르면 대결을 끝낸다
      turnOffVersus();
    }
    activeName = nm;
    st.name = nm;
    syncWhoUI(); renderAvatar(); saveState(); SFX.tap();
    return;
  }
  if(t.hasAttribute('data-wear')){ wearLook(t.getAttribute('data-wear')); return; }
  if(t.hasAttribute('data-del')){ deleteLook(t.getAttribute('data-del')); return; }
});

$('diceBtn').addEventListener('click', function(){
  var others = THEMES.filter(function(t){ return t.id !== st.theme; });
  st.theme = pick(others).id;
  saveState(); renderThemes(); SFX.theme();
  var th = findItem(THEMES, st.theme);
  toast('🎲 오늘의 주제는 ' + th.emoji + ' ' + th.name + '!');
});

$('muteBtn').addEventListener('click', function(){
  muted = !muted;
  try{ localStorage.setItem('dti_muted', muted ? '1' : '0'); }catch(e){}
  renderMute();
  if(!muted) SFX.pick(); else SFX.off();
  toast(muted ? '🔇 소리를 껐어요' : '🔊 소리를 켰어요');
});

$('runBtn').addEventListener('click', function(){
  if(versus.on){
    vsSync();
    if(versus.active === 0){
      vsSelect(1);
      toast('형원이 차례! 형원이를 꾸며 주세요 👗');
      SFX.theme();
      return;
    }
    openRunway();
    return;
  }
  openRunway();
});

$('saveBtn').addEventListener('click', function(){ saveToLookbook(); });
$('lookBtn').addEventListener('click', function(){ renderLooks(); $('lookSheet').classList.add('show'); });
$('lookClose').addEventListener('click', function(){ $('lookSheet').classList.remove('show'); });
$('lookSheet').addEventListener('click', function(e){ if(e.target === $('lookSheet')) $('lookSheet').classList.remove('show'); });
$('rwClose').addEventListener('click', closeRunway);
$('rwAgain').addEventListener('click', function(){ closeRunway(); toast('옷장에서 다시 꾸며 보세요!'); });
$('rwSave').addEventListener('click', function(){ saveToLookbook(); });

/* 자매 대결 */
function turnOffVersus(){
  versus.on = false;
  versus.looks = [];
  versus.active = 0;
  $('vsBtn').classList.remove('on');
  $('runBtn').textContent = '👠 런웨이 출발!';
}
$('vsBtn').addEventListener('click', function(){
  versus.on = !versus.on;
  if(versus.on){
    versus.active = 0;
    versus.looks = [
      { name:'윤진', state: JSON.parse(JSON.stringify(st)) },
      { name:'형원', state: JSON.parse(JSON.stringify(st)) }
    ];
    activeName = '윤진';
    toast('👭 자매 대결! 윤진이 먼저 꾸미고, 「형원이 차례」 버튼으로 이어서 꾸며요.');
  }else{
    turnOffVersus();
    toast('대결을 끝내고 혼자 꾸미기로 돌아왔어요.');
  }
  syncWhoUI(); renderAvatar(); SFX.tap();
});

/* 시작 */
loadState();
if(st.theme) activeName = activeName || '윤진';
renderStarsDecor();
renderAll();
renderTimerMode();
if(TM.mode === 'challenge') startTimer();
window.__dti = { get state(){ return st; }, THEMES: THEMES, PATTERNS: PATTERNS, openRunway: openRunway, setTimerMode: setTimerMode };
window.__ready = true;

})();
</script>
