<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>embed check</title>
<style>body{font:13px/1.4 monospace;background:#0f1226;color:#cfe}div{width:1px;height:1px;overflow:hidden}</style>
</head><body>
<h3 id="st">loading…</h3>
<pre id="log"></pre>
<div id="stage"></div>
<script>
const IDS = [
 "VNQpP6C1fJg","6Pn7OTSRp8Q","ZRrWLBFNQZI","tcizKvKiYGs",
 "CabrJ5DsykE","f2je7tpBNZ0","lJL83K5XBiI",
 "A9cMbJXLNTE","CA6806hj1nQ"
];
const out = {};
let apiReady = false, started = false;
function log(){ document.getElementById("log").textContent = JSON.stringify(out, null, 1); }
function start(){
  if(!apiReady || started) return; started = true;
  let i = 0;
  const stage = document.getElementById("stage");
  function next(){
    if(i >= IDS.length){
      document.getElementById("st").textContent = "DONE";
      window.__RESULT__ = JSON.stringify(out);
      log(); return;
    }
    const id = IDS[i++];
    const holder = document.createElement("div");
    holder.id = "h_" + i;
    stage.appendChild(holder);
    document.getElementById("st").textContent = "checking " + i + "/" + IDS.length + " " + id;
    let done = false;
    const finish = (rec) => {
      if(done) return; done = true;
      out[id] = rec; log();
      try{ p && p.destroy(); }catch(e){}
      setTimeout(next, 120);
    };
    const p = new YT.Player(holder.id, {
      host: "https://www.youtube-nocookie.com",
      videoId: id,
      width: 320, height: 180,
      playerVars: {rel:0, modestbranding:1, playsinline:1, enablejsapi:1, origin: location.origin},
      events: {
        onReady: (e) => {
          const d = Math.round(e.target.getDuration() || 0);
          let t = "";
          try { t = e.target.getVideoData().title || ""; } catch(err){}
          finish({dur: d, title: t});
        },
        onError: (e) => finish({err: e.data})
      }
    });
    setTimeout(() => { if(!done) finish({err: "timeout"}); }, 15000);
  }
  next();
}
window.onYouTubeIframeAPIReady = () => { apiReady = true; start(); };
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);
setTimeout(() => {
  if(!started){ document.getElementById("st").textContent = "API_NOT_LOADED"; }
}, 20000);
</script>
</body></html>
