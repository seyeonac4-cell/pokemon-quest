<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB 방향 검증</title><style>html,body{margin:0;height:100%;background:#20262e;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const NAMES=['puppy','dog','cat','kitten','capybara','llama','rabbit','dolphin','sea-turtle','clownfish','great-white-shark','jellyfish'];
const COLS=6;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x20262e);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,2.2));
const d1=new THREE.DirectionalLight(0xfff3e0,2.0);d1.position.set(3,9,7);scene.add(d1);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,300);
camera.position.set(0,9.5,7.6);camera.lookAt(0,0.3,0.4);
const coal=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x2b333d,roughness:1}));
coal.rotation.x=-Math.PI/2;scene.add(coal);
const grid=new THREE.GridHelper(80,80,0x4a5666,0x36404c);scene.add(grid);
const loader=new GLTFLoader();
window.__info=[];
NAMES.forEach((n,i)=>{
  const x=(i%COLS-(COLS-1)/2)*2.4, z=Math.floor(i/COLS)*3.0;
  loader.load('./assets/models/'+n+'.glb?v=3',g=>{
    const root=g.scene;const box=new THREE.Box3().setFromObject(root);
    const size=box.getSize(new THREE.Vector3());const c=box.getCenter(new THREE.Vector3());
    root.position.set(-c.x,-box.min.y,-c.z);
    const w=new THREE.Group();w.add(root);
    const k=1.7/Math.max(size.x,size.y,size.z);
    w.scale.setScalar(k);w.position.set(x,0,z);scene.add(w);
    // +Z arrow (red) and +X arrow (blue)
    const mk=(col,dir)=>{const a=new THREE.Group();
      const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.9,8),new THREE.MeshBasicMaterial({color:col}));
      shaft.position.y=0.45;a.add(shaft);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.28,10),new THREE.MeshBasicMaterial({color:col}));
      tip.position.y=1.0;a.add(tip);
      if(dir==='x'){a.rotation.z=-Math.PI/2;a.position.set(x+1.1,0,z);}else{a.position.set(x,0,z+1.1);}
      scene.add(a);};
    mk(0xff3b30,'z');mk(0x3b7bff,'x');
    window.__info.push({n,size:size.toArray().map(v=>+v.toFixed(3)),k:+k.toFixed(3)});
    window.__status=window.__info.length+'/'+NAMES.length;
  },undefined,e=>console.error(n,e));
});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
