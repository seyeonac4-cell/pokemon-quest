:root{
  --ink:#5b3750;
  --ink2:#8c6a82;
  --muted:#b092a5;
  --pink:#ff8fc2;
  --pink-d:#ef6aa8;
  --pink-l:#ffe4f1;
  --lav:#c8b4ff;
  --lav-d:#9a7cf0;
  --gold:#ffc94d;
  --gold-d:#e8a92a;
  --mint:#7fdcc4;
  --mint-d:#2fa98d;
  --paper:#fffafd;
  --line:#ffe1ef;
  --radius:26px;
  --shadow:0 12px 28px rgba(226,140,183,.18);
  --shadow-s:0 6px 16px rgba(226,140,183,.14);
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:

  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:30px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
:focus-visible{outline:3px dashed var(--lav-d);outline-offset:3px;border-radius:14px}

/* ---------- 배경 반짝이 ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky i{position:absolute;font-style:normal;opacity:.55;animation:float 12s ease-in-out infinite}
.sky i:nth-child(1){left:6%;top:16%;font-size:15px;animation-delay:0s}
.sky i:nth-child(2){left:88%;top:10%;font-size:19px;animation-delay:1.4s}
.sky i:nth-child(3){left:76%;top:44%;font-size:13px;animation-delay:2.6s}
.sky i:nth-child(4){left:12%;top:58%;font-size:17px;animation-delay:.8s}
.sky i:nth-child(5){left:50%;top:6%;font-size:12px;animation-delay:3.4s}
.sky i:nth-child(6){left:34%;top:78%;font-size:14px;animation-delay:2s}
.sky i:nth-child(7){left:94%;top:70%;font-size:16px;animation-delay:4.2s}
.sky i:nth-child(8){left:2%;top:88%;font-size:13px;animation-delay:1s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg);opacity:.35}50%{transform:translateY(-16px) rotate(8deg);opacity:.8}}

.wrap{position:relative;z-index:2;max-width:540px;margin:0 auto;padding:12px 14px 8px}

/* ---------- 상단 성 ---------- */
.hero{
  position:relative;
  border-radius:32px;
  padding:14px 16px 18px;
  background:linear-gradient(160deg,#fff2f9 0%,#ffe6f3 46%,#eee4ff 100%);
  border:3px solid #fff;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.top{position:relative;display:flex;align-items:center;gap:8px;z-index:2}
.brand{font-size:14.5px;color:#b4578f;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.brand b{font-size:16px;color:#a04478}
.sp{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:14px;background:#fff;border:2.5px solid #ffd0e5;
  box-shadow:0 3px 0 #ffd0e5;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd0e5}

/* ---------- 인사 ---------- */
.hello{position:relative;display:flex;align-items:center;gap:14px;margin-top:16px;z-index:2}
.fairy{
  position:relative;flex:0 0 auto;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#fff 0%,#ffe6f4 55%,#eedcff 100%);
  border:3px solid #fff;box-shadow:0 8px 20px rgba(226,140,183,.28),inset 0 0 18px rgba(255,255,255,.9);
  overflow:hidden;padding:0;transition:transform .16s;
}
.fairy::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.8),rgba(255,215,235,.2),rgba(214,196,255,.7),rgba(255,255,255,.8));
  z-index:-1;animation:spin 9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fairy:active{transform:scale(.95)}
.fairy img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hello-txt{min-width:0}
.hello-name{font-size:21px;line-height:1.25;color:#a04478;letter-spacing:-.3px}
.hello-sub{margin-top:5px;font-size:13px;color:var(--ink2);line-height:1.5}
.hello-sub b{color:#c05b95}

/* ---------- 공통 카드 ---------- */
.card{
  margin-top:16px;background:var(--paper);border:3px solid #fff;border-radius:var(--radius);
  box-shadow:var(--shadow-s);padding:14px 14px 16px;

.card-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 11px}
.card-head b{font-size:18px;color:#a04478;letter-spacing:-.2px}
.card-head .sub{margin-left:auto;font-size:12px;color:#c79ab3;white-space:nowrap}

/* ---------- 공부 놀이 ---------- */
.playlist{display:flex;flex-direction:column;gap:11px}
.play{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px;border-radius:22px;background:#fff;
  border:3px solid #ffe1ef;box-shadow:0 6px 0 #ffe1ef;
  text-decoration:none;color:inherit;transition:transform .1s;
}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #ffe1ef}
.play .pi{
  flex:0 0 auto;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;
  justify-content:center;font-size:29px;line-height:1;background:#fff7fb;
}
.play .pt{flex:1;min-width:0}
.play .pt b{display:block;font-size:19px;color:var(--ink);letter-spacing:-.2px}
.play .pt small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink2);line-height:1.35}
.play .go{flex:0 0 auto;font-size:22px;color:#e0a5c6}
.play.gugu{border-color:#ffe0a8;box-shadow:0 6px 0 #ffe0a8}
.play.gugu:active{box-shadow:0 3px 0 #ffe0a8}
.play.gugu .pi{background:#fff6e3}
.play.pho{border-color:#b8eedd;box-shadow:0 6px 0 #b8eedd}
.play.pho:active{box-shadow:0 3px 0 #b8eedd}
.play.pho .pi{background:#e9fbf5}
.play.sight{border-color:#dccdff;box-shadow:0 6px 0 #dccdff}
.play.sight:active{box-shadow:0 3px 0 #dccdff}
.play.sight .pi{background:#f2ecff}

.foot{text-align:center;font-size:11px;color:#c9aec3;margin:22px 0 4px}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
  background:rgba(91,55,80,.94);color:#fff;font-size:14px;padding:12px 18px;border-radius:999px;
  box-shadow:0 10px 24px rgba(91,55,80,.3);opacity:0;pointer-events:none;z-index:80;
  transition:opacity .22s,transform .22s;max-width:86vw;text-align:center;line-height:1.4;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 사용 시간 ---------- */
.use-chip{
  font-size:12px;color:#b4578f;background:#fff;border:2px solid #ffd9ec;border-radius:999px;
  padding:5px 9px;white-space:nowrap;flex:0 0 auto;

.use-chip.warn{background:#fff3d9;border-color:#ffd58a;color:#a06a00}
.use-chip.hot{background:#ffe0e0;border-color:#ffb0b0;color:#b03030}

/* ---------- 오버레이 ---------- */
.ov{
  position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(91,55,80,.42);backdrop-filter:blur(3px);
}
.ov.show{display:flex;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ov-card{
  width:100%;max-width:400px;max-height:86vh;overflow:auto;background:#fff;border-radius:28px;
  padding:22px 20px 18px;box-shadow:0 24px 60px rgba(91,55,80,.35);text-align:center;
  animation:rise .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ov-card.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ov-emoji{font-size:38px;line-height:1}
.ov-card h2{margin:8px 0 6px;font-size:20px;color:#a04478;letter-spacing:-.3px}
.ov-body{font-size:14.5px;color:var(--ink2);line-height:1.65;text-align:center}
.ov-body p{margin:7px 0}
.ov-btns{display:flex;gap:9px;margin-top:17px}
.ov-btns .btn{

  border:2.5px solid #ffe1ef;background:#fff;color:#a04478;box-shadow:0 4px 0 #ffe1ef;
}
.ov-btns .btn.primary{background:linear-gradient(100deg,#ff8fc2,#a98cf5);color:#fff;border-color:transparent;box-shadow:0 5px 0 #d987b6}
.ov-btns .btn.ghost{background:#fff7fb}
.ov-btns .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ef}
.pin-row{margin-top:12px}
.pin-input{
  width:170px;padding:12px;font-size:22px;letter-spacing:9px;text-align:center;font-family:inherit;
  border:2.5px solid #ffd0e5;border-radius:16px;background:#fff7fb;color:#a04478;
}
.pin-err{min-height:18px;margin-top:7px;font-size:12.5px;color:#d1447a}

/* 보호자 메뉴 */
.menu{display:flex;flex-direction:column;gap:9px;margin-top:4px;text-align:left}
.menu-btn{
  width:100%;padding:13px 14px;border-radius:18px;background:#fff7fb;
  border:2.5px solid #ffe1ef;box-shadow:0 3px 0 #ffe1ef;font-size:15px;color:var(--ink);

.menu-btn small{display:block;margin-top:3px;font-size:12px;color:var(--muted);font-weight:400}
.menu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffe1ef}
.menu-note{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.55}

/* ---------- 시간 종료 ---------- */
.timeup{
  position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;

.timeup.show{display:flex}

  .play .go{display:none}
}

  }
  function sfxTap() { tone(1180, 0, 0.07, 'sine', 0.05); }
  function sfxNo() { tone(330, 0, 0.14, 'sine', 0.05); tone(262, 0.13, 0.2, 'sine', 0.05); }

  /* 한국어 TTS 응원 */
  var voices = [];
  function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
  if ('speechSynthesis' in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 1; u.pitch = 1.3;
      var pick = null;
      for (var i = 0; i < voices.length; i++) { if (/^ko/i.test(voices[i].lang || '')) { pick = voices[i]; break; } }
      if (pick) u.voice = pick;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 반짝이 폭죽 */
  var fx = $('fx'), fxc = fx.getContext('2d');
  var parts = [], raf = null, lastT = 0;
  var GLYPHS = ['💗', '⭐', '✨', '🎀', '💛', '🌸'];
  function sizeFx() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = Math.floor(window.innerWidth * dpr);
    fx.height = Math.floor(window.innerHeight * dpr);
    fx.style.width = window.innerWidth + 'px';
    fx.style.height = window.innerHeight + 'px';
    fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y, count) {
    count = count || 24;
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2, sp = 110 + Math.random() * 260;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
        life: 1, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 8,
        size: 14 + Math.random() * 12, g: GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
      });
    }
    if (!raf) { lastT = 0; raf = window.requestAnimationFrame(fxLoop); }
  }
  function burstEl(el, count) {
    if (!el) { burst(window.innerWidth / 2, window.innerHeight * 0.34, count); return; }
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count);
  }
  function fxLoop(t) {
    var dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    fxc.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      p.life -= dt * 0.72;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fxc.save();
      fxc.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxc.translate(p.x, p.y); fxc.rotate(p.rot);
      fxc.font = p.size + 'px serif'; fxc.textAlign = 'center'; fxc.textBaseline = 'middle';
      fxc.fillText(p.g, 0, 0);
      fxc.restore();
    }
    if (parts.length) raf = window.requestAnimationFrame(fxLoop);
    else { raf = null; fxc.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  window.addEventListener('resize', sizeFx);

  /* 토스트 */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* ============================================================
     오늘의 요정
     ============================================================ */
  var fairyGreeted = false;
  function renderFairy() {
    var d = new Date();
    var start = new Date(d.getFullYear(), 0, 1);
    var idx = Math.floor((d - start) / 86400000) % FAIRIES.length;
    var f = FAIRIES[idx];
    var img = $('fairyImg');
    img.src = f.img;
    img.alt = f.name + ' 요정';
    $('fairy').setAttribute('data-idx', String(idx));
    if (!fairyGreeted) $('fairyLine').textContent = f.name + '이 기다리고 있어요 · 눌러 봐!';
    return f;
  }
  function currentFairy() {
    var i = Number($('fairy').getAttribute('data-idx'));
    return FAIRIES[isFinite(i) && i >= 0 ? i : 0] || FAIRIES[0];
  }
  function greetFairy(el) {
    actx();
    var f = currentFairy();
    fairyGreeted = true;
    $('fairyLine').textContent = f.name + ': “' + f.cheer + '”';
    burstEl(el, 30);
    sfxTap();
    speak(f.cheer);
  }

  /* ============================================================
     창(오버레이)
     ============================================================ */
  var ovOk = null;
  function openOv(cfg) {
    ovOk = cfg.onOk || null;
    $('ovEmoji').textContent = cfg.emoji || '🎀';
    $('ovTitle').textContent = cfg.title || '';
    $('ovBody').innerHTML = cfg.body || '';
    var btns = $('ovBtns');
    btns.innerHTML = '';
    (cfg.buttons || [{ label: '좋아!', cls: 'primary', fn: closeOv }]).forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn ' + (b.cls || '');
      el.textContent = b.label;
      el.addEventListener('click', function () {
        if (b.keep) { if (b.fn) b.fn(); return; }
        closeOv();
        if (b.fn) setTimeout(b.fn, 90);
      });
      btns.appendChild(el);
    });
    var ov = $('ov');
    ov.classList.add('show');
    ov.setAttribute('aria-hidden', 'false');
    if (cfg.focus) setTimeout(function () { var i = $(cfg.focus); if (i && i.focus) i.focus(); }, 90);
    if (cfg.after) setTimeout(cfg.after, 60);
  }
  function closeOv() {
    $('ov').classList.remove('show');
    $('ov').setAttribute('aria-hidden', 'true');
  }
  function shakeCard() {
    var c = $('ovCard');
    c.classList.remove('shake');
    void c.offsetWidth;
    c.classList.add('shake');
  }
  function askPin(title, msg, onOk) {
    openOv({
      emoji: '🔒',
      title: title || '보호자 확인',
      body: '<p>' + (msg || 'PIN 4자리를 입력해 주세요') + '</p>'
        + '<div class="pin-row"><input class="pin-input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" aria-label="보호자 PIN 4자리"></div>'
        + '<div class="pin-err" id="pinErr"></div>',
      onOk: onOk, focus: 'pinInput',
      buttons: [
        { label: '닫기', cls: 'ghost', fn: closeOv },
        { label: '확인', cls: 'primary', fn: submitPin }
      ]
    });
  }
  function submitPin() {
    var i = $('pinInput');
    if (!i) return;
    var v = String(i.value || '').replace(/\D/g, '');
    if (v === guardPin) {
      var cb = ovOk; closeOv();
      if (cb) setTimeout(cb, 80);
    } else {
      var e = $('pinErr');
      if (e) e.textContent = '앗, PIN이 달라요';
      i.value = '';
      shakeCard(); sfxNo();
    }
  }
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'pinInput' && (e.key === 'Enter' || e.keyCode === 13)) {
      e.preventDefault(); submitPin();
    }
    if ((e.key === 'Escape' || e.keyCode === 27) && $('ov').classList.contains('show')) closeOv();
  });

  /* ============================================================
     보호자 PIN 불러오기
     ============================================================ */
  function initSync() {
    if (typeof firebase === 'undefined' || !firebase.initializeApp) return;
    try {
      var app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(FB_CFG);
      var db = app.database();
      db.ref(FB_ROOT + '/settings/pin').on('value', function (s) {
        var p = String(s.val() || '');
        if (/^\d{4}$/.test(p)) guardPin = p;
      }, function () {});
    } catch (e) {}
  }

  /* ============================================================
     보호자 메뉴 (15분 타이머 새로 시작만)
     ============================================================ */
  function openParent() {
    actx();
    askPin('보호자 확인', 'PIN 4자리를 입력해 주세요', showParentMenu);
  }
  function showParentMenu() {
    openOv({
      emoji: '🛡️',
      title: '보호자 메뉴',
      body: '<div class="menu">'
        + '<button class="menu-btn" type="button" data-act="p-usage">⏰ 화면 시간 처음부터<small>15분 사용 시간을 새로 시작해요</small></button>'
        + '</div>'
        + '<div class="menu-note">보호자 PIN은 가족 대시보드와 같아요(기본 0000).</div>',
      buttons: [{ label: '닫기', cls: 'ghost', fn: closeOv }]
    });
  }
  function parentAction(act) {
    if (act === 'p-usage') {
      usage.acc = 0; useWarned = false; useUp = false;
      hideTimeUp();
      if (!document.hidden) useResume();
      useSave(); usePaint();
      toast('⏰ 화면 시간을 새로 시작했어요');
      closeOv();
    }
  }

  /* ============================================================
     화면 사용 시간 (15분)
     ============================================================ */
  var USE_KEY = 'teenieping_usage_v1';
  var USE_LIMIT = 900, USE_BREAK = 180, USE_WARN = 840;
  var usage = { acc: 0, last: 0 };
  var useStart = 0, useWarned = false, useUp = false, useTick = null;

  function useLoad() {
    var raw = null;
    try { raw = window.localStorage.getItem(USE_KEY); } catch (e) { raw = null; }
    var acc = 0, last = 0;
    if (raw) {
      try { var o = JSON.parse(raw); acc = Number(o && o.acc); last = Number(o && o.last); } catch (e) { acc = 0; last = 0; }
    }
    if (!isFinite(acc) || acc < 0) acc = 0;
    if (!isFinite(last) || last < 0) last = 0;
    var now = Date.now();
    if (!last || now - last >= USE_BREAK * 1000) acc = 0;
    usage.acc = Math.min(acc, USE_LIMIT + 120);
    usage.last = last;
  }
  function useSave() { try { window.localStorage.setItem(USE_KEY, JSON.stringify({ acc: Math.round(usage.acc), last: usage.last })); } catch (e) {} }
  function useElapsed() { var e = usage.acc; if (useStart) e += (Date.now() - useStart) / 1000; return e; }
  function useFold() { if (!useStart) return; var now = Date.now(); usage.acc += (now - useStart) / 1000; useStart = now; usage.last = now; useSave(); }
  function usePaint() {
    var pill = $('usePill');
    if (!pill) return;
    var left = Math.max(0, Math.ceil(USE_LIMIT - useElapsed()));
    pill.textContent = '⏰ ' + Math.floor(left / 60) + ':' + pad2(left % 60);
    pill.classList.toggle('warn', !useUp && left <= 60);
    pill.classList.toggle('hot', !useUp && left <= 30);
  }
  function useResume() {
    if (useUp || useStart) return;
    var now = Date.now();
    if (usage.last && now - usage.last >= USE_BREAK * 1000) { usage.acc = 0; useWarned = false; }
    useStart = now; usage.last = now;
    usePaint();
  }
  function usePause() {
    if (!useStart) return;
    usage.acc += (Date.now() - useStart) / 1000;
    useStart = 0; usage.last = Date.now();
    useSave(); usePaint();
  }
  function showTimeUp() {
    if (useUp) return;
    useUp = true;
    usePause(); usePaint();
    var el = $('timeup');
    el.classList.add('show');
    el.setAttribute('aria-hidden', 'false');
    tone(784, 0, 0.18, 'sine', 0.08);
    tone(587, 0.16, 0.24, 'sine', 0.08);
  }
  function hideTimeUp() {
    useUp = false;
    var el = $('timeup');
    if (el) { el.classList.remove('show'); el.setAttribute('aria-hidden', 'true'); }
  }
  function useExtend() {
    usage.acc = Math.max(0, useElapsed() - USE_LIMIT);
    useWarned = false;
    hideTimeUp(); useResume(); useSave(); usePaint();
    toast('15분 더 놀 수 있어요 💗');
  }
  function useOnVisible() {
    var now = Date.now();
    var away = usage.last ? now - usage.last : 0;
    if (useUp && away >= USE_BREAK * 1000) { usage.acc = 0; useWarned = false; hideTimeUp(); }
    useResume();
  }
  function useStartTimer() {
    if (useTick) return;
    useTick = setInterval(function () {
      if (!useStart) { usePaint(); return; }
      var e = useElapsed();
      if (!useWarned && e >= USE_WARN && e < USE_LIMIT) {
        useWarned = true;
        toast('⏰ 곧 15분이에요! 이번 것만 마무리해 볼까요?');
      }
      if (e >= USE_LIMIT) { showTimeUp(); return; }
      if (Math.floor(e) % 5 === 0) useFold();
      usePaint();
    }, 1000);
  }
  function useBoot() {
    useLoad(); usePaint(); useStartTimer();
    document.addEventListener('visibilitychange', function () { if (document.hidden) usePause(); else useOnVisible(); });
    window.addEventListener('pagehide', usePause);
    window.addEventListener('beforeunload', usePause);
    window.addEventListener('pageshow', function (e) { if (e && e.persisted) useOnVisible(); });
    if (useElapsed() >= USE_LIMIT) setTimeout(showTimeUp, 250);
    else if (!document.hidden) useResume();
  }

  /* ============================================================
     이벤트
     ============================================================ */
  document.addEventListener('click', function (e) {
    actx();
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && (t.getAttribute('data-act') || t.id === 'btnParent' || t.id === 'tuPin' || t.id === 'fairy'))) {
      t = t.parentNode;
    }
    if (!t || t === document) return;

    if (t.id === 'btnParent') { openParent(); return; }
    if (t.id === 'tuPin') { askPin('보호자 확인', 'PIN 4자리를 입력해 주세요', useExtend); return; }
    if (t.id === 'fairy') { greetFairy(t); return; }

    var act = t.getAttribute ? t.getAttribute('data-act') : null;
    if (!act) return;
    if (act.indexOf('p-') === 0) { parentAction(act); return; }
  });

  /* ============================================================
     시작
     ============================================================ */
  sizeFx();
  renderFairy();
  useBoot();
  initSync();

  /* 다음에 만날 요정 미리 받아 두기 */
  setTimeout(function () {
    FAIRIES.forEach(function (f) { if (f.id !== currentFairy().id) { var im = new Image(); im.src = f.img; } });
  }, 1200);
})();
</script>
<!-- 「📲 앱으로 설치」 한 번 누르기 버튼 (공통 스크립트) -->
<script src="./pwa-install.js?v=1" defer></script>
<!-- 홈 화면 '앱 설치'(크롬 배지 없는 WebAPK) 조건: 매니페스트 + 등록된 서비스 워커 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }
</script>
