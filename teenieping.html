<title>🎀 형원이 티니핑</title>
<style>
/* ============================================================
   🎀 형원이 티니핑 — 한 화면 · 단일 파일
   파스텔 핑크 · 라벤더 / 요정 성 테마
   ============================================================ */
:root{
  --ink:#5b3750;
  --ink2:#8c6a82;
  --muted:#b092a5;
  --pink:#ff8fc2;
  --pink-d:#ef6aa8;
  --pink-l:#ffe4f1;
  --lav:#c8b4ff;
  --lav-d:#9a7cf0;
  --gold:#ffc94d;
  --gold-d:#e8a92a;
  --mint:#7fdcc4;
  --mint-d:#2fa98d;
  --paper:#fffafd;
  --line:#ffe1ef;
  --radius:26px;
  --shadow:0 12px 28px rgba(226,140,183,.18);
  --shadow-s:0 6px 16px rgba(226,140,183,.14);
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(120% 55% at 8% 0%, #ffe6f4 0%, rgba(255,230,244,0) 62%),
    radial-gradient(110% 50% at 100% 8%, #e9dcff 0%, rgba(233,220,255,0) 58%),
    radial-gradient(120% 55% at 50% 102%, #d8f3ff 0%, rgba(216,243,255,0) 62%),
    #fff7fc;
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:30px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
:focus-visible{outline:3px dashed var(--lav-d);outline-offset:3px;border-radius:14px}

/* ---------- 배경 반짝이 ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky i{position:absolute;font-style:normal;opacity:.55;animation:float 12s ease-in-out infinite}
.sky i:nth-child(1){left:6%;top:16%;font-size:15px;animation-delay:0s}
.sky i:nth-child(2){left:88%;top:10%;font-size:19px;animation-delay:1.4s}
.sky i:nth-child(3){left:76%;top:44%;font-size:13px;animation-delay:2.6s}
.sky i:nth-child(4){left:12%;top:58%;font-size:17px;animation-delay:.8s}
.sky i:nth-child(5){left:50%;top:6%;font-size:12px;animation-delay:3.4s}
.sky i:nth-child(6){left:34%;top:78%;font-size:14px;animation-delay:2s}
.sky i:nth-child(7){left:94%;top:70%;font-size:16px;animation-delay:4.2s}
.sky i:nth-child(8){left:2%;top:88%;font-size:13px;animation-delay:1s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg);opacity:.35}50%{transform:translateY(-16px) rotate(8deg);opacity:.8}}

.wrap{position:relative;z-index:2;max-width:540px;margin:0 auto;padding:12px 14px 8px}

/* ---------- 상단 성 ---------- */
.hero{
  position:relative;
  border-radius:32px;
  padding:14px 16px 18px;
  background:linear-gradient(160deg,#fff2f9 0%,#ffe6f3 46%,#eee4ff 100%);
  border:3px solid #fff;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.top{position:relative;display:flex;align-items:center;gap:8px;z-index:2}
.brand{font-size:14.5px;color:#b4578f;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.brand b{font-size:16px;color:#a04478}
.sp{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:14px;background:#fff;border:2.5px solid #ffd0e5;
  box-shadow:0 3px 0 #ffd0e5;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd0e5}

/* ---------- 인사 ---------- */
.hello{position:relative;display:flex;align-items:center;gap:12px;margin-top:12px;z-index:2}
.fairy{
  position:relative;flex:0 0 auto;width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#fff 0%,#ffe6f4 55%,#eedcff 100%);
  border:3px solid #fff;box-shadow:0 8px 20px rgba(226,140,183,.28),inset 0 0 18px rgba(255,255,255,.9);
  overflow:hidden;padding:0;transition:transform .16s;
}
.fairy::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.8),rgba(255,215,235,.2),rgba(214,196,255,.7),rgba(255,255,255,.8));
  z-index:-1;animation:spin 9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fairy:active{transform:scale(.95)}
.fairy img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hello-txt{min-width:0}
.hello-name{font-size:20px;line-height:1.25;color:#a04478;letter-spacing:-.3px}
.hello-sub{margin-top:3px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.hearts{
  position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;gap:10px;
  background:#fff;border:3px solid #ffd9ec;border-radius:22px;padding:11px 14px;
  box-shadow:0 5px 0 #ffe4f1;
}
.hearts .hh{font-size:26px;line-height:1}
.hearts .hn{font-size:26px;color:#ef6aa8;line-height:1;min-width:22px;text-align:center}
.hearts .hl{font-size:13.5px;color:var(--ink2);line-height:1.3}
.hearts .hl b{display:block;font-size:14.5px;color:#a04478}
.hearts.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

/* ---------- 공통 카드 ---------- */
.card{
  margin-top:14px;background:var(--paper);border:3px solid #fff;border-radius:var(--radius);
  box-shadow:var(--shadow-s);padding:14px 14px 16px;
}
.card-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.card-head b{font-size:17px;color:#a04478;letter-spacing:-.2px}
.card-head .cnt{
  margin-left:auto;font-size:12.5px;color:#c05b95;background:#ffe9f4;border-radius:999px;
  padding:4px 11px;white-space:nowrap;
}

/* ---------- 오늘 할 일 ---------- */
.qlist{display:flex;flex-direction:column;gap:9px}
.qitem{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:13px 12px;border-radius:20px;background:#fff;
  border:2.5px solid #ffe1ef;box-shadow:0 4px 0 #ffe1ef;
  transition:transform .1s,background .15s,border-color .15s;
}
.qitem:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ef}
.qcheck{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff5fa;
  border:2.5px solid #ffc2dd;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;line-height:1;
}
.qicon{flex:0 0 auto;font-size:25px;line-height:1}
.qt{flex:1;min-width:0;font-size:17.5px;line-height:1.25;color:var(--ink);letter-spacing:-.2px}
.qh{flex:0 0 auto;font-size:13px;color:#e57fae;background:#fff0f7;border-radius:999px;padding:3px 8px}
.qitem.is-done{background:linear-gradient(180deg,#fff0f8,#ffe2f1);border-color:#ffb3d7;box-shadow:0 4px 0 #ffc9e2}
.qitem.is-done .qcheck{background:linear-gradient(180deg,#ff8fc2,#ef6aa8);border-color:#ef6aa8}
.qitem.is-done .qt{color:#b06a92}
.qitem.is-done .qh{background:#fff;color:#c2799f}
.hint{margin:11px 4px 0;font-size:12px;color:var(--muted);line-height:1.55;text-align:center}

/* ---------- 공부 놀이 ---------- */
.playlist{display:flex;flex-direction:column;gap:10px}
.play{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 16px;border-radius:22px;background:#fff;
  border:3px solid #ffe1ef;box-shadow:0 6px 0 #ffe1ef;
  text-decoration:none;color:inherit;transition:transform .1s;
}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #ffe1ef}
.play .pi{
  flex:0 0 auto;width:52px;height:52px;border-radius:17px;display:flex;align-items:center;
  justify-content:center;font-size:27px;line-height:1;background:#fff7fb;
}
.play .pt{flex:1;min-width:0}
.play .pt b{display:block;font-size:18.5px;color:var(--ink);letter-spacing:-.2px}
.play .pt small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink2)}
.play .go{flex:0 0 auto;font-size:20px;color:#e0a5c6}
.play.gugu{border-color:#ffe0a8;box-shadow:0 6px 0 #ffe0a8}
.play.gugu .pi{background:#fff6e3}
.play.pho{border-color:#b8eeddff;box-shadow:0 6px 0 #b8eedd}
.play.pho .pi{background:#e9fbf5}
.play.sight{border-color:#dccdff;box-shadow:0 6px 0 #dccdff}
.play.sight .pi{background:#f2ecff}

.foot{text-align:center;font-size:11px;color:#c9aec3;margin:22px 0 4px}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
  background:rgba(91,55,80,.94);color:#fff;font-size:14px;padding:12px 18px;border-radius:999px;
  box-shadow:0 10px 24px rgba(91,55,80,.3);opacity:0;pointer-events:none;z-index:80;
  transition:opacity .22s,transform .22s;max-width:86vw;text-align:center;line-height:1.4;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 사용 시간 ---------- */
.use-chip{
  font-size:12px;color:#b4578f;background:#fff;border:2px solid #ffd9ec;border-radius:999px;
  padding:5px 9px;white-space:nowrap;flex:0 0 auto;
}
.use-chip.warn{background:#fff3d9;border-color:#ffd58a;color:#a06a00}
.use-chip.hot{background:#ffe0e0;border-color:#ffb0b0;color:#b03030}

/* ---------- 오버레이 ---------- */
.ov{
  position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(91,55,80,.42);backdrop-filter:blur(3px);
}
.ov.show{display:flex;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ov-card{
  width:100%;max-width:400px;max-height:86vh;overflow:auto;background:#fff;border-radius:28px;
  padding:22px 20px 18px;box-shadow:0 24px 60px rgba(91,55,80,.35);text-align:center;
  animation:rise .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ov-card.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ov-emoji{font-size:38px;line-height:1}
.ov-card h2{margin:8px 0 6px;font-size:20px;color:#a04478;letter-spacing:-.3px}
.ov-body{font-size:14.5px;color:var(--ink2);line-height:1.65;text-align:center}
.ov-body p{margin:7px 0}
.ov-body .big{font-size:16px;color:var(--ink)}
.ov-btns{display:flex;gap:9px;margin-top:17px}
.ov-btns .btn{
  flex:1;padding:13px 10px;border-radius:17px;font-size:15.5px;
  border:2.5px solid #ffe1ef;background:#fff;color:#a04478;box-shadow:0 4px 0 #ffe1ef;
}
.ov-btns .btn.primary{background:linear-gradient(100deg,#ff8fc2,#a98cf5);color:#fff;border-color:transparent;box-shadow:0 5px 0 #d987b6}
.ov-btns .btn.ghost{background:#fff7fb}
.ov-btns .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ef}
.pin-row{margin-top:12px}
.pin-input{
  width:170px;padding:12px;font-size:22px;letter-spacing:9px;text-align:center;font-family:inherit;
  border:2.5px solid #ffd0e5;border-radius:16px;background:#fff7fb;color:#a04478;
}
.pin-err{min-height:18px;margin-top:7px;font-size:12.5px;color:#d1447a}

/* 보호자 메뉴 */
.menu{display:flex;flex-direction:column;gap:9px;margin-top:4px;text-align:left}
.menu-btn{
  width:100%;padding:13px 14px;border-radius:18px;background:#fff7fb;
  border:2.5px solid #ffe1ef;box-shadow:0 3px 0 #ffe1ef;font-size:15px;color:var(--ink);
}
.menu-btn small{display:block;margin-top:3px;font-size:12px;color:var(--muted);font-weight:400}
.menu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffe1ef}
.menu-note{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.55}
/* 할 일 고치기 */
.edit-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;text-align:left}
.edit-row{display:flex;gap:7px;align-items:center}
.edit-row .ed-ic{width:30px;text-align:center;font-size:20px}
.edit-row input{
  flex:1;min-width:0;padding:10px 12px;border:2.5px solid #ffd0e5;border-radius:14px;
  background:#fff7fb;font-family:inherit;font-size:15px;color:var(--ink);
}
.edit-row select{
  flex:0 0 auto;padding:10px 8px;border:2.5px solid #ffd0e5;border-radius:14px;
  background:#fff7fb;font-family:inherit;font-size:14px;color:#a04478;
}

/* ---------- 시간 종료 ---------- */
.timeup{
  position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  padding:22px;background:rgba(255,247,252,.96);backdrop-filter:blur(6px);
}
.timeup.show{display:flex}
.timeup-card{
  width:100%;max-width:360px;background:#fff;border:3px solid #ffd9ec;border-radius:30px;
  padding:26px 20px 22px;text-align:center;box-shadow:0 20px 50px rgba(226,140,183,.28);
}
.tu-clock{font-size:46px;line-height:1}
.timeup-card h2{margin:10px 0 8px;font-size:21px;color:#a04478}
.timeup-card p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.tu-btn{margin-top:18px;width:100%;padding:14px;border-radius:18px;background:linear-gradient(100deg,#ff8fc2,#a98cf5);color:#fff;font-size:15px;box-shadow:0 7px 0 #dd78b4}
.tu-note{margin-top:10px !important;font-size:11px !important;color:var(--muted) !important}

#fx{position:fixed;inset:0;pointer-events:none;z-index:130}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* 넓은 화면 */
@media(min-width:640px){
  .wrap{max-width:600px;padding-top:22px}
  .playlist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .play{flex-direction:column;align-items:center;text-align:center;gap:9px;padding:18px 10px}
  .play .pt b{font-size:16.5px}
  .play .pt small{font-size:11.5px}
  .play .go{display:none}
}
</style>
</head>

</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- 확인 / PIN / 메뉴 창 -->
<div class="ov" id="ov" aria-hidden="true">
  <div class="ov-card" id="ovCard" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <div class="ov-emoji" id="ovEmoji">🎀</div>
    <h2 id="ovTitle">확인</h2>
    <div class="ov-body" id="ovBody"></div>
    <div class="ov-btns" id="ovBtns"></div>
  </div>
</div>

<!-- 5분 사용 시간 종료 -->
<div class="timeup" id="timeup" aria-hidden="true">
  <div class="timeup-card" role="alertdialog" aria-modal="true" aria-labelledby="tuTitle">
    <span class="tu-clock" aria-hidden="true">⏰</span>
    <h2 id="tuTitle">5분이 지났어요!</h2>
    <p>티니핑은 잠깐 쉬어야 해요.<br>눈을 쉬고 엄마·아빠를 불러 주세요 💗</p>
    <button class="tu-btn" id="tuPin" type="button">🔒 보호자 PIN으로 연장하기</button>
    <p class="tu-note">3분 넘게 쉬면 다시 놀 수 있어요</p>
  </div>
</div>

    var done = {};
    Object.keys(state.done).forEach(function (k) { if (state.done[k]) done[k] = true; });

    if (wasDone) {
      delete done[id];
      state.hearts = Math.max(0, state.hearts - q.hearts);
      sfxUndo();
      toast('다음에 또 해요 💗');
    } else {
      done[id] = true;
      state.hearts += q.hearts;
      sfxQuest();
      burstEl(el, 18);
      renderHearts(true);
      var praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      toast(praise + ' 💗 하트 +' + q.hearts);
      var allDone = state.quests.length > 0;
      for (var i = 0; i < state.quests.length; i++) {
        if (!done[state.quests[i].id]) { allDone = false; break; }
      }
      if (allDone) {
        state.done = done;
        celebrate();
        return;
      }

    state.day = today();

    renderAll();
    push();
    toast('할 일 목록을 저장했어요 ✏️');
  }

  function parentAction(act) {
    if (act === 'p-usage') {
      usage.acc = 0; useWarned = false; useUp = false;
      hideTimeUp();
      if (!document.hidden) useResume();
      useSave(); usePaint();
      toast('⏰ 화면 시간을 새로 시작했어요');
      closeOv();
      return;
    }
    if (act === 'p-edit') { openEditor(); return; }
    if (act === 'p-clear') {
      state.done = {}; state.hearts = 0; state.day = today();
      renderAll();
      push();
      toast('오늘 체크를 지웠어요');
      closeOv();
      return;
    }
  }

  /* ============================================================
     화면 사용 시간 (5분)
     ============================================================ */
  var USE_KEY = 'teenieping_usage_v1';
  var USE_LIMIT = 300, USE_BREAK = 180, USE_WARN = 270;
  var usage = { acc: 0, last: 0 };
  var useStart = 0, useWarned = false, useUp = false, useTick = null;

  function useLoad() {
    var raw = null;
    try { raw = window.localStorage.getItem(USE_KEY); } catch (e) { raw = null; }
    var acc = 0, last = 0;
    if (raw) {
      try { var o = JSON.parse(raw); acc = Number(o && o.acc); last = Number(o && o.last); } catch (e) { acc = 0; last = 0; }
    }
    if (!isFinite(acc) || acc < 0) acc = 0;
    if (!isFinite(last) || last < 0) last = 0;
    var now = Date.now();
    if (!last || now - last >= USE_BREAK * 1000) acc = 0;
    usage.acc = Math.min(acc, USE_LIMIT + 120);
    usage.last = last;
  }
  function useSave() { try { window.localStorage.setItem(USE_KEY, JSON.stringify({ acc: Math.round(usage.acc), last: usage.last })); } catch (e) {} }
  function useElapsed() { var e = usage.acc; if (useStart) e += (Date.now() - useStart) / 1000; return e; }
  function useFold() { if (!useStart) return; var now = Date.now(); usage.acc += (now - useStart) / 1000; useStart = now; usage.last = now; useSave(); }
  function usePaint() {
    var pill = $('usePill');
    if (!pill) return;
    var left = Math.max(0, Math.ceil(USE_LIMIT - useElapsed()));
    pill.textContent = '⏰ ' + Math.floor(left / 60) + ':' + pad2(left % 60);
    pill.classList.toggle('warn', !useUp && left <= 60);
    pill.classList.toggle('hot', !useUp && left <= 30);
  }
  function useResume() {
    if (useUp || useStart) return;
    var now = Date.now();
    if (usage.last && now - usage.last >= USE_BREAK * 1000) { usage.acc = 0; useWarned = false; }
    useStart = now; usage.last = now;
    usePaint();
  }
  function usePause() {
    if (!useStart) return;
    usage.acc += (Date.now() - useStart) / 1000;
    useStart = 0; usage.last = Date.now();
    useSave(); usePaint();
  }
  function showTimeUp() {
    if (useUp) return;
    useUp = true;
    usePause(); usePaint();
    var el = $('timeup');
    el.classList.add('show');
    el.setAttribute('aria-hidden', 'false');
    tone(784, 0, 0.18, 'sine', 0.08);
    tone(587, 0.16, 0.24, 'sine', 0.08);
  }
  function hideTimeUp() {
    useUp = false;
    var el = $('timeup');
    if (el) { el.classList.remove('show'); el.setAttribute('aria-hidden', 'true'); }
  }
  function useExtend() {
    usage.acc = Math.max(0, useElapsed() - USE_LIMIT);
    useWarned = false;
    hideTimeUp(); useResume(); useSave(); usePaint();
    toast('5분 더 놀 수 있어요 💗');
  }
  function useOnVisible() {
    var now = Date.now();
    var away = usage.last ? now - usage.last : 0;
    if (useUp && away >= USE_BREAK * 1000) { usage.acc = 0; useWarned = false; hideTimeUp(); }
    useResume();
  }
  function useStartTimer() {
    if (useTick) return;
    useTick = setInterval(function () {
      if (!useStart) { usePaint(); return; }
      var e = useElapsed();
      if (!useWarned && e >= USE_WARN && e < USE_LIMIT) {
        useWarned = true;
        toast('⏰ 곧 5분이에요! 이번 것만 마무리해 볼까요?');
      }
      if (e >= USE_LIMIT) { showTimeUp(); return; }
      if (Math.floor(e) % 5 === 0) useFold();
      usePaint();
    }, 1000);
  }
  function useBoot() {
    useLoad(); usePaint(); useStartTimer();
    document.addEventListener('visibilitychange', function () { if (document.hidden) usePause(); else useOnVisible(); });
    window.addEventListener('pagehide', usePause);
    window.addEventListener('beforeunload', usePause);
    window.addEventListener('pageshow', function (e) { if (e && e.persisted) useOnVisible(); });
    if (useElapsed() >= USE_LIMIT) setTimeout(showTimeUp, 250);
    else if (!document.hidden) useResume();
  }

  /* ============================================================
     이벤트
     ============================================================ */
  document.addEventListener('click', function (e) {
    actx();
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && (t.getAttribute('data-act') || t.id === 'btnParent' || t.id === 'tuPin' || t.id === 'fairy'))) {
      t = t.parentNode;
    }
    if (!t || t === document) return;

    if (t.id === 'btnParent') { openParent(); return; }
    if (t.id === 'fairy') { greetFairy(t); return; }
    if (t.id === 'tuPin') { askPin('보호자 확인', 'PIN 4자리를 입력해 주세요', useExtend); return; }

    var act = t.getAttribute ? t.getAttribute('data-act') : null;
    if (!act) return;
    if (act === 'quest') { toggleQuest(t.getAttribute('data-id') || '', t); return; }
    if (act.indexOf('p-') === 0) { parentAction(act); return; }
  });

  /* 날짜가 바뀌면 새로 */
  setInterval(function () {
    if (state.day && state.day !== today()) {
      state.day = today(); state.done = {}; state.hearts = 0;
      renderAll();
      toast('새로운 하루가 시작됐어요! 🌸');
    }
  }, 30000);

  /* ============================================================
     시작
     ============================================================ */
  sizeFx();
  cacheLoad();
  state.day = state.day || today();
  renderFairy();
  render();
  useBoot();
  initSync();

  /* 다음에 만날 요정 미리 받아 두기 */
  setTimeout(function () {
    FAIRIES.forEach(function (f) { if (f.id !== currentFairy().id) { var im = new Image(); im.src = f.img; } });
  }, 1200);
})();
</script>
