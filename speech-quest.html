<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08101f">
<title>탐험가 말하기 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script>
window.__errs = [];
addEventListener('error', function(e){ try{ __errs.push(String(e.message || (e.error && e.error.message) || e.type)); }catch(_){} });
addEventListener('unhandledrejection', function(e){ try{ __errs.push('rejection: ' + String(e.reason)); }catch(_){} });
</script>
<style>
:root{
  --ink:#eef4ff; --ink2:#9fb3d4; --muted:#7288aa;
  --card:#111f3a; --line:#26395e;
  --em:#2ee0a6; --gold:#ffca4a; --sky:#5ec8ff; --pink:#ff8fb8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',Roboto,sans-serif;
  color:var(--ink); font-size:17px; line-height:1.5; letter-spacing:-.2px;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
  background:radial-gradient(circle at 85% -8%, rgba(46,224,166,.20) 0 24%, transparent 25%),
             radial-gradient(circle at 0% 4%, rgba(94,200,255,.16) 0 18%, transparent 19%),
             #08101f;
  background-attachment:fixed; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}

/* 머리 */
header{display:flex;align-items:center;gap:9px;padding:4px 2px 14px}
header .logo{font-size:26px;line-height:1}
header h1{flex:1;margin:0;font-size:18px;font-weight:900;letter-spacing:-.6px}
header h1 small{display:block;font-size:10.5px;font-weight:700;color:var(--em);letter-spacing:1.6px}
.star{background:#152745;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:900;color:var(--gold);white-space:nowrap}
.iconbtn{background:#152745;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:15px}

/* 카드 */
.card{background:linear-gradient(180deg,#12203a,#0d1830);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 26px rgba(0,0,0,.35)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.top b{color:var(--em);font-size:14px}
.bar{height:6px;border-radius:99px;background:#0a1526;overflow:hidden;margin-bottom:15px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .3s}
.title{font-size:17px;font-weight:900;line-height:1.45;margin:0 0 12px}

/* 문장 만들기 */
.slots{min-height:88px;border:2px dashed #2d4670;border-radius:16px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.slots:empty::before{content:'블록을 차례로 눌러 봐 👆';color:#5d7ba6;font-size:13.5px;padding:4px}
.slots.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chip{background:#1b3457;border:1px solid #3a5b8f;border-radius:12px;padding:9px 12px;font-size:16.5px;font-weight:800;animation:pop .16s}
.chip small{display:block;font-size:9.5px;color:var(--sky);font-weight:900}
@keyframes pop{from{transform:scale(.8);opacity:.3}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.blk{background:#172a4a;border:1px solid #33507f;border-radius:14px;padding:11px 13px;font-size:17px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.blk small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.5px;color:var(--sky)}
.blk.who small{color:var(--em)} .blk.what small{color:var(--gold)} .blk.how small{color:var(--pink)}
.blk:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:15px;border-radius:15px;font-size:16.5px;font-weight:900;background:#1a2d50;border:1px solid #33507f;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:.1s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.main{background:linear-gradient(180deg,#2ee0a6,#13a97b);color:#04241b;border-color:#48f0b8;box-shadow:0 4px 0 #0b7d59}
.btn.gold{background:linear-gradient(180deg,#ffd166,#e9ac00);color:#2a1c00;border-color:#ffe08a;box-shadow:0 4px 0 #b97f00}
.btn.sm{padding:12px;font-size:15px}
.row{display:flex;gap:8px;margin-top:9px}
.row .btn{flex:1}
.link{display:block;width:100%;text-align:center;margin-top:11px;font-size:13px;color:var(--muted);padding:6px}

/* 피드백 */
.fb{display:none;margin-top:11px;padding:11px 13px;border-radius:13px;font-size:14.5px;font-weight:800;line-height:1.45}
.fb.show{display:block}
.fb.yes{background:rgba(46,224,166,.14);border:1px solid rgba(46,224,166,.5);color:#a5ffdd}
.fb.no{background:rgba(255,202,74,.12);border:1px solid rgba(255,202,74,.45);color:#ffdd8f}

/* 완성 문장 */
.done{margin-top:12px;padding:14px;border-radius:15px;border:1px solid rgba(46,224,166,.5);background:rgba(46,224,166,.10)}
.done .line{font-size:19px;font-weight:900;line-height:1.55}
.done .go{margin-top:10px;font-size:13px;color:#a5ffdd;font-weight:800}

/* 퀴즈 */
.opt{display:block;width:100%;text-align:left;margin-top:9px;padding:15px;border-radius:15px;background:#172a4a;border:1px solid #33507f;font-size:16.5px;font-weight:700;line-height:1.45}
.opt:active{transform:translateY(1px)}
.opt.ok{background:rgba(46,224,166,.18);border-color:var(--em);color:#bdffe8}
.opt.no{background:rgba(255,122,107,.12);border-color:rgba(255,122,107,.5);color:#ffb9b1;opacity:.75}
.opt.dim{opacity:.38}
.ex{margin-top:10px;font-size:13.5px;line-height:1.55;color:#cfe0f8;background:#0b1729;border:1px dashed #33507f;border-radius:12px;padding:11px 12px;display:none}
.ex.show{display:block}

/* 읽기 */
.passage{background:#0d1930;border:1px solid #33507f;border-radius:15px;padding:14px;font-size:17px;line-height:1.8}
.passage .tag{display:inline-block;font-size:11.5px;font-weight:900;color:var(--sky);margin-bottom:7px}

/* 말하기 */
.say{border-radius:16px;padding:18px 14px;text-align:center;border:1px solid rgba(169,139,255,.45);background:rgba(169,139,255,.12)}
.say .line{font-size:20px;font-weight:900;line-height:1.6}
.say .focus{margin-top:8px;font-size:12.5px;color:#cdbdff;font-weight:700}
audio{width:100%;margin-top:9px}
.recnote{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.45}

/* 유튜브 */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:10px 13px;border-radius:999px;font-size:13.5px;font-weight:800;background:#132342;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.fchip.on{background:rgba(46,224,166,.16);border-color:var(--em);color:#bdffe8}
.vcard{display:flex;gap:11px;width:100%;text-align:left;background:#11203a;border:1px solid var(--line);border-radius:16px;padding:9px;margin-bottom:10px}
.vcard:active{transform:translateY(1px)}
.vcard{cursor:pointer}
.vthumb{position:relative;flex:0 0 128px;width:128px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#0a1526}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,10,20,.34);color:#fff;font-size:16px}
.vthumb .du{position:absolute;right:4px;bottom:4px;background:rgba(4,10,20,.85);border-radius:5px;padding:1px 5px;font-size:10px;font-weight:800;color:#dbe8ff}
.vtxt{flex:1;min-width:0}
.vtxt .cat{font-size:10.5px;font-weight:900;color:var(--em)}
.vtxt .vt{display:block;margin:2px 0 3px;font-size:14.5px;font-weight:900;line-height:1.35}
.vtxt .ch{font-size:11.5px;color:var(--muted)}
.vtxt .why{font-size:12px;color:#b9cbe6;line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtxt .ask{font-size:12px;font-weight:800;color:var(--gold);margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 모달 */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(3,7,14,.9)}
.modal.show{display:flex}
.mbox{width:100%;max-width:720px}
.mtop{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.mtop h4{flex:1;margin:0;font-size:13.5px;font-weight:800;line-height:1.35;color:#dbe8ff}
.mclose{background:#1a2d50;border:1px solid #33507f;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:900}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mask{position:fixed;inset:0;z-index:55;display:none}
.mask.show{display:block}

/* 토스트/별 */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:80;background:#1c3055;border:1px solid var(--em);color:#ddfff1;padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:90;font-size:26px;pointer-events:none;animation:fly .85s ease-out forwards}
@keyframes fly{70%{opacity:1;transform:translateY(-64px) scale(1.25)}100%{opacity:0;transform:translateY(-100px)}}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0a1526;border-top:1px solid var(--line);padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:#7e93b4;font-size:10.5px;font-weight:800;line-height:1.15}
nav button i{font-size:19px;font-style:normal}
nav button.on{color:#fff;background:rgba(46,224,166,.12)}
nav button.on i{filter:drop-shadow(0 0 7px rgba(46,224,166,.8))}

/* 인앱 브라우저 안내 */
.inapp{display:flex;align-items:center;gap:8px;background:rgba(255,202,74,.12);border:1px solid rgba(255,202,74,.45);border-radius:14px;padding:9px 11px;margin:0 2px 11px;font-size:12.5px;line-height:1.4;color:#ffe6a6;font-weight:700}
.inapp span{flex:1}
.inapp a{flex:0 0 auto;background:#ffd166;color:#2a1c00;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900;text-decoration:none;white-space:nowrap}
.inapp button{flex:0 0 auto;color:#ffe6a6;font-size:14px;font-weight:900;padding:2px 4px}

.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🚀</span>
    <h1>탐험가 말하기 연구소<small>SPEECH EXPLORER</small></h1>
    <span class="star">⭐ <span id="starN">0</span></span>
    <button class="iconbtn" id="copyBtn" title="링크 복사">🔗</button>
  </header>

  <div class="inapp hide" id="inapp">
    <span>📱 이 창에선 듣기·녹음이 잘 안 될 수 있어요.</span>
    <a href="#" id="openChrome">🌐 Chrome으로 열기</a>
    <button id="inappX" title="닫기">✕</button>
  </div>

  <!-- 1. 문장 만들기 -->
  <section id="s-sentence" class="card">
    <div class="top"><span>문장 만들기</span><span><b id="sIdx">1</b> / <span id="sTotal">12</span></span></div>
    <div class="bar"><i id="sBar"></i></div>
    <div id="build">
      <p class="title">블록을 차례로 눌러 문장을 만들어 봐!</p>
      <div class="slots" id="slots"></div>
      <div class="pool" id="pool"></div>
      <button class="btn main" id="sCheck">확인했어!</button>
      <div class="row"><button class="btn sm" id="sUndo">↩︎ 하나 지우기</button></div>
    </div>
    <div class="fb" id="sFb"></div>
    <div class="done hide" id="sDone">
      <div class="line" id="sFinal"></div>
      <div class="go">🗣️ 큰 소리로 세 번 따라 말해 봐!</div>
      <div class="row"><button class="btn sm" id="sPlay">🔊 듣기</button><button class="btn sm" id="sSlow">🐢 느리게</button></div>
      <button class="btn gold" id="sNext" style="margin-top:9px">다음 ▶</button>
    </div>
  </section>

  <!-- 2. 말맛 퀴즈 -->
  <section id="s-quiz" class="card hide">
    <div class="top"><span>생활 말 퀴즈</span><span><b id="qIdx">1</b> / <span id="qTotal">15</span></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div id="qBody"></div>
    <div class="fb" id="qFb"></div>
    <button class="btn gold hide" id="qNext" style="margin-top:11px">다음 ▶</button>
  </section>

  <!-- 3. 짧은 읽기 -->
  <section id="s-read" class="card hide">
    <div class="top"><span>짧은 읽기</span><span><b id="rIdx">1</b> / <span id="rTotal">12</span></span></div>
    <div class="bar"><i id="rBar"></i></div>
    <div id="rBody"></div>
    <button class="btn sm" id="rPlay" style="margin-top:10px">🔊 글 읽어 주기</button>
    <div class="fb" id="rFb"></div>
    <button class="btn gold hide" id="rNext" style="margin-top:11px">다음 ▶</button>
  </section>

  <!-- 4. 따라 말하기 -->
  <section id="s-speak" class="card hide">
    <div class="top"><span>따라 말하기</span><span><b id="kIdx">1</b> / <span id="kTotal">12</span></span></div>
    <div class="bar"><i id="kBar"></i></div>
    <div class="say">
      <div class="line" id="kLine"></div>
      <div class="focus" id="kFocus"></div>
    </div>
    <div class="row"><button class="btn sm" id="kNormal">🔊 듣기</button><button class="btn sm" id="kSlow">🐢 느리게</button></div>
    <div class="row"><button class="btn sm" id="kRec">🎙️ 녹음</button><button class="btn sm" id="kPlayRec" disabled>▶︎ 내 목소리</button></div>
    <audio id="recAudio" controls class="hide"></audio>
    <div class="recnote hide" id="recNote"></div>
    <button class="btn main" id="kDone" style="margin-top:11px">✅ 해냈어요!</button>
    <button class="btn sm" id="kNext" style="margin-top:8px">다음 ▶</button>
    <div class="fb" id="kFb"></div>
  </section>

  <!-- 5. 엄선 유튜브 -->
  <section id="s-tube" class="card hide">
    <div class="top"><span>엄선 유튜브</span><span>10편</span></div>
    <div class="filters" id="filters">
      <button class="fchip on" data-cat="all">전체</button>
      <button class="fchip" data-cat="science">🔬 과학</button>
      <button class="fchip" data-cat="words">📚 어휘·말하기</button>
      <button class="fchip" data-cat="history">🏛️ 역사</button>
    </div>
    <div id="vgrid"></div>
  </section>
</div>

<nav><div class="in" id="nav">
  <button class="on" data-tab="sentence"><i>🧩</i>문장</button>
  <button data-tab="quiz"><i>💬</i>퀴즈</button>
  <button data-tab="read"><i>📖</i>읽기</button>
  <button data-tab="speak"><i>🎙️</i>말하기</button>
  <button data-tab="tube"><i>📺</i>영상</button>
</div></nav>

<div class="mask" id="mask"></div>
<div class="modal" id="modal">
  <div class="mbox">
    <div class="mtop"><h4 id="mTitle"></h4><button class="mclose" id="mClose">닫기 ✕</button></div>
    <div class="frame" id="frame"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 데이터 ===== */
const SENTENCES = [
  {who:'지호가', what:'공을', how:'힘껏 찼어요'},
  {who:'엄마가', what:'국을', how:'맛있게 끓였어요'},
  {who:'고양이가', what:'물을', how:'조금씩 마셨어요'},
  {who:'동생이', what:'그림을', how:'예쁘게 그렸어요'},
  {who:'아빠가', where:'거실에서', what:'노래를', how:'크게 불렀어요'},
  {who:'나는', where:'도서관에서', what:'책을', how:'재미있게 읽어요'},
  {who:'오리가', where:'연못에서', what:'물고기를', how:'빠르게 잡았어요'},
  {who:'누나가', where:'교실에서', what:'칠판을', how:'깨끗하게 지웠어요'},
  {who:'우주인이', where:'달에서', what:'돌을', how:'조심조심 주웠어요'},
  {who:'서준이가', where:'바닷가에서', what:'모래성을', how:'크게 만들었어요'},
  {who:'로봇이', where:'우주선 안에서', what:'나사를', how:'빠르게 돌렸어요'},
  {who:'할머니가', where:'마당에서', what:'꽃을', how:'예쁘게 심으셨어요'}
];

const QUIZ = [
  {q:'급식실에서 내 자리에 친구가 앉아 있어요. 뭐라고 말할까요?',
   o:['아무 말 없이 가방을 확 당긴다','“내 자리인데, 같이 앉을래?”','“당장 비켜!”'], a:1,
   e:'내가 원하는 것을 말하면서 친구 기분도 상하지 않게 하는 말이 좋아요.'},
  {q:'기대하던 소풍이 비 때문에 취소됐어요. 이때 드는 마음은?',
   o:['신나요','서운해요','졸려요'], a:1,
   e:'서운하다 = 기대했는데 안 되어서 마음이 허전하고 아쉬운 마음이에요.'},
  {q:'어려운 문제를 혼자서 끝까지 풀었어요. 이때 드는 마음은?',
   o:['지겨워요','무서워요','뿌듯해요'], a:2,
   e:'뿌듯하다 = 내가 해냈다는 생각에 가슴이 뿌듯한 마음이에요.'},
  {q:'친구가 내 물건을 말도 없이 가져갔어요. 뭐라고 말할까요?',
   o:['“가지고 갈 거면 먼저 말해 줘.”','“그냥 가져. 괜찮아.”','“내 거야, 당장 놔!”'], a:0,
   e:'내 마음을 말하되 “먼저 말해 줘”처럼 부탁하면 싸우지 않고 이야기할 수 있어요.'},
  {q:'친구가 오래 공들여 그린 그림을 보여 줬어요. 뭐라고 말할까요?',

/* ===== 저장 ===== */
const KEY = 'speechQuest_v1';
let state = {stars:0, done:{sentence:[],quiz:[],read:[],speak:[]}};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){
    const d = JSON.parse(raw);
    if(d && typeof d === 'object'){
      state.stars = Number(d.stars) || 0;
      if(d.done) for(const k in state.done) if(Array.isArray(d.done[k])) state.done[k] = d.done[k].filter(x => typeof x === 'number');
    }
  }
}catch(_){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(_){} }
function hasDone(k, i){ return state.done[k].indexOf(i) >= 0; }
function hud(){
  document.getElementById('starN').textContent = state.stars;
}
function award(k, i, el){
  if(hasDone(k, i)) return false;
  state.done[k].push(i); state.stars++; save(); hud();
  if(el && el.getBoundingClientRect){
    const r = el.getBoundingClientRect(), f = document.createElement('div');
    f.className = 'fly'; f.textContent = '⭐';
    f.style.left = (r.left + r.width / 2 - 13) + 'px';
    f.style.top = (r.top - 6) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }
  return true;
}
let tTimer = null;
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

let koVoice = null, audioEl = null, audioList = [], audioPos = 0, audioWantRate = 1, audioPlayed = false;
let ttsToken = 0, ttsMode = 'auto';
try{ const m = sessionStorage.getItem('sq_tts'); if(m === 'native' || m === 'audio') ttsMode = m; }catch(_){}

function markMode(m){
  ttsMode = m;
  try{ sessionStorage.setItem('sq_tts', m); }catch(_){}
  try{ document.documentElement.setAttribute('data-tts', m); }catch(_){}
}
function pickVoice(){
  try{
    const vs = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : [];
    koVoice = vs.find(v => /ko[-_]?KR/i.test(v.lang)) || vs.find(v => /^ko/i.test(v.lang)) || null;
  }catch(_){ koVoice = null; }
}
if(window.speechSynthesis){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }
  catch(_){ try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(__){} }
}

function getAudio(){
  if(audioEl) return audioEl;
  const a = new Audio();
  a.preload = 'auto';
  a.onended = () => { audioPos++; playChunk(); };
  a.onloadedmetadata = () => { try{ a.defaultPlaybackRate = audioWantRate; a.playbackRate = audioWantRate; }catch(_){} };
  audioEl = a;
  return a;
}
function splitTts(text){
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  const out = [];
  if(!s) return out;
  let buf = '';
  for(const ch of s){
    buf += ch;
    if(('.!?。？！'.indexOf(ch) >= 0 && buf.length >= 20) || buf.length >= 110){ out.push(buf.trim()); buf = ''; }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}
function playChunk(){
  if(audioPos >= audioList.length){ audioList = []; audioPos = 0; return; }
  const a = getAudio();
  a.onerror = () => {
    if(!audioPlayed){ audioList = []; audioPos = 0; toast('🔊 소리를 못 불러왔어요. 잠시 뒤 다시 눌러 주세요'); return; }
    audioPos++; playChunk();
  };
  a.src = TTS_URL + encodeURIComponent(audioList[audioPos]);
  try{ a.defaultPlaybackRate = audioWantRate; a.playbackRate = audioWantRate; }catch(_){}
  let p = null;
  try{ p = a.play(); }catch(_){}
  if(p && p.then) p.then(() => { audioPlayed = true; }).catch(() => {});
}
function audioSpeak(text, rate){
  audioList = splitTts(text);
  audioPos = 0;
  audioPlayed = false;
  audioWantRate = Math.max(0.5, Math.min(1.2, Number(rate) || 1));
  playChunk();
}
function nativeSay(text, rate, token, onOk, onFail){
  let u = null;
  try{ u = new SpeechSynthesisUtterance(text); }catch(_){ onFail(); return; }
  u.lang = 'ko-KR'; u.rate = Number(rate) || 1; u.pitch = 1; u.volume = 1;
  if(koVoice) u.voice = koVoice;
  let started = false, settled = false, wd = 0;
  const clearWd = () => { if(wd){ clearTimeout(wd); wd = 0; } };
  const fail = () => {
    if(settled) return;
    settled = true; clearWd();
    try{ speechSynthesis.cancel(); }catch(_){}
    onFail();
  };
  u.onstart = () => { started = true; clearWd(); if(token === ttsToken) onOk(); };
  u.onend = () => { settled = true; clearWd(); };
  u.onerror = fail;
  wd = setTimeout(() => { if(!started) fail(); }, 1000);
  try{ speechSynthesis.speak(u); }catch(_){ fail(); }
}
function speak(text, rate){
  const t = String(text || '').trim();
  if(!t) return;
  let busy = false;
  try{ busy = !!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)); }catch(_){}
  stopSpeak();
  const token = ttsToken, r = Number(rate) || 1;
  const toAudio = () => { if(token !== ttsToken) return; markMode('audio'); audioSpeak(t, r); };
  if(ttsMode === 'audio' || IN_APP || !window.speechSynthesis){ toAudio(); return; }
  const run = () => { if(token !== ttsToken) return; nativeSay(t, r, token, () => markMode('native'), toAudio); };
  if(busy) setTimeout(run, 90); else run();
}
function stopSpeak(){
  ttsToken++;
  audioList = []; audioPos = 0;
  if(audioEl){ try{ audioEl.onerror = null; audioEl.pause(); audioEl.removeAttribute('src'); }catch(_){} }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
}

/* ===== 탭 ===== */
const TABS = ['sentence','quiz','read','speak','tube'];
function goTab(n){
  if(TABS.indexOf(n) < 0) n = 'sentence';
  TABS.forEach(t => document.getElementById('s-' + t).classList.toggle('hide', t !== n));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
  stopSpeak();
  window.scrollTo({top:0});
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(b) goTab(b.dataset.tab);
});

/* ===== 1. 문장 만들기 ===== */
const LABEL = {who:'누가', where:'어디서', what:'무엇을', how:'어떻게'};
let sIdx = 0, picked = [], poolKeys = [], tries = 0, slow = false;

function shuffle(a){
  const r = a.slice();
  for(let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function cur(){ return SENTENCES[sIdx]; }
function keys(){ return ['who','where','what','how'].filter(k => cur()[k]); }
function full(){ return keys().map(k => cur()[k]).join(' '); }

function renderSentence(){
  document.getElementById('sIdx').textContent = sIdx + 1;
  document.getElementById('sTotal').textContent = SENTENCES.length;
  document.getElementById('sBar').style.width = Math.round((sIdx / SENTENCES.length) * 100) + '%';
  picked = []; tries = 0; poolKeys = shuffle(keys());
  document.getElementById('build').classList.remove('hide');
  document.getElementById('sFb').className = 'fb';
  document.getElementById('sDone').classList.add('hide');
  document.getElementById('sCheck').classList.remove('hide');
  paint();
}
function paint(){
  const sl = document.getElementById('slots');
  sl.innerHTML = '';
  picked.forEach((k, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = '<small>' + LABEL[k] + '</small>' + cur()[k];
    b.onclick = () => { picked.splice(i, 1); poolKeys.push(k); paint(); };
    sl.appendChild(b);
  });
  const pl = document.getElementById('pool');
  pl.innerHTML = '';
  poolKeys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'blk ' + k;
    b.innerHTML = '<small>' + LABEL[k] + '</small>' + cur()[k];
    b.onclick = () => { poolKeys = poolKeys.filter(x => x !== k); picked.push(k); paint(); };
    pl.appendChild(b);
  });
}
document.getElementById('sUndo').onclick = () => {
  if(!picked.length) return;
  poolKeys.push(picked.pop()); paint();
};
document.getElementById('sCheck').onclick = () => {
  const need = keys(), fb = document.getElementById('sFb');
  if(picked.length < need.length){
    fb.className = 'fb show no';
    fb.textContent = '블록이 ' + (need.length - picked.length) + '개 남았어. 더 골라 봐!';
    return;
  }
  if(picked.join() !== need.join()){
    tries++;
    const sl = document.getElementById('slots');
    sl.classList.remove('shake'); void sl.offsetWidth; sl.classList.add('shake');
    fb.className = 'fb show no';
    fb.textContent = tries === 1
      ? '거의 다 왔어! 순서는 「' + need.map(k => LABEL[k]).join(' → ') + '」야. 다시 해 볼까?'
      : '힌트! 첫 번째는 「' + LABEL[need[0]] + '」 = ' + cur()[need[0]];
    return;
  }
  const got = award('sentence', sIdx, document.getElementById('sCheck'));
  fb.className = 'fb show yes';
  fb.textContent = got ? '정답! ⭐ 별 하나 획득!' : '또 해냈어! 이 문장은 이미 별을 받았어.';
  document.getElementById('sFinal').textContent = full();
  document.getElementById('sDone').classList.remove('hide');
  document.getElementById('sCheck').classList.add('hide');
  document.getElementById('build').classList.add('hide');
  document.getElementById('sDone').scrollIntoView({block:'nearest'});
  speak(full(), slow ? 0.75 : 1);
};
document.getElementById('sPlay').onclick = () => speak(full(), slow ? 0.75 : 1);
document.getElementById('sSlow').onclick = e => {
  slow = !slow;
  e.currentTarget.textContent = slow ? '🐢 느리게 (켜짐)' : '🐢 느리게';
  speak(full(), slow ? 0.75 : 1);
};
document.getElementById('sNext').onclick = () => {
  stopSpeak();
  sIdx = (sIdx + 1) % SENTENCES.length;
  renderSentence();
  document.getElementById('sCheck').scrollIntoView({block:'center'});
};

/* ===== 2. 퀴즈 ===== */
let qIdx = 0, qDone = false, qWrong = 0;
function renderQuiz(){
  qDone = false; qWrong = 0;
  const q = QUIZ[qIdx];
  document.getElementById('qIdx').textContent = qIdx + 1;
  document.getElementById('qTotal').textContent = QUIZ.length;
  document.getElementById('qBar').style.width = Math.round((qIdx / QUIZ.length) * 100) + '%';
  const body = document.getElementById('qBody');
  body.innerHTML = '';
  const t = document.createElement('p'); t.className = 'title'; t.textContent = q.q;
  body.appendChild(t);
  q.o.forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = txt; b.dataset.i = i;
    b.onclick = () => answer(i, b);
    body.appendChild(b);
  });
  document.getElementById('qFb').className = 'fb';
  document.getElementById('qNext').classList.add('hide');
}
function answer(i, btn){
  if(qDone) return;
  const q = QUIZ[qIdx], fb = document.getElementById('qFb');
  if(i === q.a){
    qDone = true;
    btn.classList.add('ok');
    document.querySelectorAll('#qBody .opt').forEach(o => { if(o !== btn) o.classList.add('dim'); });
    const got = award('quiz', qIdx, btn);
    fb.className = 'fb show yes';
    fb.textContent = (got ? '정답! ⭐ ' : '정답! ') + q.e;
    document.getElementById('qNext').classList.remove('hide');
  }else{
    btn.classList.add('no'); btn.disabled = true; qWrong++;
    fb.className = 'fb show no';
    if(qWrong < q.o.length - 1){
      fb.textContent = '거의 다 왔어! 다시 골라 볼까?';
    }else{
      qDone = true;
      document.querySelectorAll('#qBody .opt').forEach(o => {
        if(Number(o.dataset.i) === q.a) o.classList.add('ok'); else o.classList.add('dim');
      });
      fb.className = 'fb show no';
      fb.textContent = '이번엔 아쉽다! 정답은 “' + q.o[q.a] + '” — ' + q.e;
      document.getElementById('qNext').classList.remove('hide');
    }
  }
}
document.getElementById('qNext').onclick = () => {
  qIdx = (qIdx + 1) % QUIZ.length;
  renderQuiz();
  document.getElementById('qBody').scrollIntoView({block:'center'});
};

/* ===== 3. 읽기 ===== */
let rIdx = 0, rDone = false, rWrong = 0;
function renderRead(){
  rDone = false; rWrong = 0;
  const d = READ[rIdx];
  document.getElementById('rIdx').textContent = rIdx + 1;
  document.getElementById('rTotal').textContent = READ.length;
  document.getElementById('rBar').style.width = Math.round((rIdx / READ.length) * 100) + '%';
  const body = document.getElementById('rBody');
  body.innerHTML = '';
  const p = document.createElement('div'); p.className = 'passage';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = d.tag;

  p.appendChild(document.createElement('div'));
  p.lastChild.textContent = d.text;
  body.appendChild(p);

  d.o.forEach((txt, i) => {
    const b = document.createElement('button');

    b.onclick = () => answerRead(i, b);
    body.appendChild(b);
  });
  document.getElementById('rFb').className = 'fb';
  document.getElementById('rNext').classList.add('hide');
}
function answerRead(i, btn){
  if(rDone) return;
  const d = READ[rIdx], fb = document.getElementById('rFb');
  if(i === d.a){
    rDone = true;
    btn.classList.add('ok');
    document.querySelectorAll('#rBody .opt').forEach(o => { if(o !== btn) o.classList.add('dim'); });
    const got = award('read', rIdx, btn);
    fb.className = 'fb show yes';
    fb.textContent = (got ? '정답! ⭐ ' : '정답! ') + d.e;
    document.getElementById('rNext').classList.remove('hide');
  }else{
    btn.classList.add('no'); btn.disabled = true; rWrong++;
    fb.className = 'fb show no';
    if(rWrong < d.o.length - 1){
      fb.textContent = '글을 한 번 더 읽어 볼까? 답은 글 속에 있어!';
    }else{
      rDone = true;
      document.querySelectorAll('#rBody .opt').forEach(o => {
        if(Number(o.dataset.i) === d.a) o.classList.add('ok'); else o.classList.add('dim');
      });
      fb.className = 'fb show no';
      fb.textContent = '정답은 “' + d.o[d.a] + '” — ' + d.e;
      document.getElementById('rNext').classList.remove('hide');
    }
  }
}
document.getElementById('rPlay').onclick = () => {
  speak(READ[rIdx].text, 0.95);
  toast('📖 글을 읽어 줄게요');
};
document.getElementById('rNext').onclick = () => {
  stopSpeak();
  rIdx = (rIdx + 1) % READ.length;
  renderRead();
  document.getElementById('rBody').scrollIntoView({block:'center'});
};

/* ===== 4. 말하기 ===== */
let kIdx = 0, rec = null, chunks = [], stream = null, recURL = null;
function renderSpeak(){
  const d = SPEAK[kIdx];
  document.getElementById('kIdx').textContent = kIdx + 1;
  document.getElementById('kTotal').textContent = SPEAK.length;
  document.getElementById('kBar').style.width = Math.round((kIdx / SPEAK.length) * 100) + '%';
  document.getElementById('kLine').textContent = d.line;
  document.getElementById('kFocus').textContent = '🎯 ' + d.focus;
  document.getElementById('kFb').className = 'fb';
  document.getElementById('kDone').textContent = hasDone('speak', kIdx) ? '✅ 또 해냈어요!' : '✅ 해냈어요!';
  resetRec();
}
function resetRec(){
  const a = document.getElementById('recAudio');
  try{ a.pause(); }catch(_){}
  a.classList.add('hide'); a.removeAttribute('src');
  document.getElementById('recNote').classList.add('hide');
  document.getElementById('kPlayRec').disabled = true;
  if(recURL){ try{ URL.revokeObjectURL(recURL); }catch(_){} recURL = null; }
  setRecBtn(false);
}
function setRecBtn(on){
  document.getElementById('kRec').textContent = on ? '⏹ 멈추기' : '🎙️ 녹음';
}
document.getElementById('kNormal').onclick = () => { speak(SPEAK[kIdx].line, 1); toast('🔊 듣고 따라 말해 봐'); };
document.getElementById('kSlow').onclick = () => { speak(SPEAK[kIdx].line, 0.7); toast('🐢 천천히 듣고 따라 말해 봐'); };
document.getElementById('kRec').onclick = async () => {
  if(rec && rec.state === 'recording'){ try{ rec.stop(); }catch(_){} return; }
  const note = document.getElementById('recNote');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
    note.classList.remove('hide');
    note.textContent = '이 브라우저에서는 녹음이 안 돼요. 소리 내어 세 번 읽고 ✅ 버튼을 누르면 돼요!';
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    let mime = '';
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    else if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
    rec = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      try{
        const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
        if(recURL){ try{ URL.revokeObjectURL(recURL); }catch(_){} }
        recURL = URL.createObjectURL(blob);
        const a = document.getElementById('recAudio');
        a.src = recURL; a.classList.remove('hide');
        document.getElementById('kPlayRec').disabled = false;
        note.classList.remove('hide'); note.textContent = '🎧 내 목소리를 들어 봐!';
      }catch(_){}
      if(stream){ stream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} }); stream = null; }
      setRecBtn(false);
    };
    rec.start(); setRecBtn(true);
    note.classList.remove('hide'); note.textContent = '● 녹음 중… 다 읽었으면 「멈추기」를 눌러!';
  }catch(err){
    rec = null; setRecBtn(false);
    note.classList.remove('hide');
    note.textContent = '마이크를 쓸 수 없어요. 녹음 없이 소리 내어 세 번 읽고 ✅를 눌러도 좋아요!';
  }
};
document.getElementById('kPlayRec').onclick = () => {
  const a = document.getElementById('recAudio');
  if(!recURL) return;
  a.currentTime = 0;
  const p = a.play();
  if(p && p.catch) p.catch(() => toast('재생 버튼을 눌러 봐'));
};
document.getElementById('kDone').onclick = e => {
  const got = award('speak', kIdx, e.currentTarget);
  const fb = document.getElementById('kFb');
  fb.className = 'fb show yes';
  fb.textContent = got ? '해냈어! ⭐ 별 하나 획득!' : '또 해냈어! 이 문장은 이미 별을 받았어.';
  document.getElementById('kDone').textContent = '✅ 또 해냈어요!';
  if(got) toast('⭐ 별 하나 획득!');
};
document.getElementById('kNext').onclick = () => {
  stopSpeak(); kIdx = (kIdx + 1) % SPEAK.length; renderSpeak();
  document.getElementById('kLine').scrollIntoView({block:'center'});
};

/* ===== 5. 유튜브 ===== */
let vCat = 'all';
function renderVideos(){
  const g = document.getElementById('vgrid');
  g.innerHTML = '';
  VIDEOS.filter(v => vCat === 'all' || v.cat === vCat).forEach(v => {
    const b = document.createElement('div');
    b.className = 'vcard';
    b.setAttribute('role', 'button');
    b.setAttribute('tabindex', '0');
    b.innerHTML =
      '<span class="vthumb">' +
        '<img loading="lazy" src="https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg" alt="">' +
        '<span class="pl">▶</span><span class="du">' + v.dur + '</span>' +
      '</span>' +
      '<span class="vtxt">' +
        '<span class="cat">' + CATS[v.cat] + '</span>' +
        '<span class="vt">' + v.title + '</span>' +
        '<span class="ch">' + v.ch + '</span>' +
        '<span class="why">' + v.why + '</span>' +
        '<span class="ask">🗣️ ' + v.ask + '</span>' +
      '</span>';
    const img = b.querySelector('img');
    img.addEventListener('error', () => { img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg'; }, {once:true});
    b.onclick = () => openVideo(v);
    g.appendChild(b);
  });
}
document.getElementById('filters').addEventListener('click', e => {
  const c = e.target.closest('.fchip'); if(!c) return;
  vCat = c.dataset.cat;
  document.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x === c));
  renderVideos();
});
function openVideo(v){
  stopSpeak();
  document.getElementById('mTitle').textContent = v.ch + ' · ' + v.title;
  const f = document.getElementById('frame');
  f.innerHTML = '';
  const ifr = document.createElement('iframe');
  ifr.src = 'https://www.youtube.com/embed/' + v.id + '?rel=0&modestbranding=1&playsinline=1&autoplay=1';
  ifr.title = v.title;
  ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  ifr.allowFullscreen = true;
  try{ ifr.setAttribute('referrerpolicy', 'origin'); }catch(_){}
  f.appendChild(ifr);
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeVideo(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('frame').innerHTML = '';
  document.body.style.overflow = '';
}
document.getElementById('mClose').onclick = closeVideo;
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeVideo(); });

/* ===== 공유 ===== */
document.getElementById('copyBtn').onclick = async () => {
  const url = location.href;
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(url); ok = true; }
  }catch(_){ ok = false; }
  if(!ok){
    try{
      const t = document.createElement('textarea');
      t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      ok = document.execCommand('copy'); t.remove();
    }catch(_){ ok = false; }
  }
  toast(ok ? '🔗 링크를 복사했어요!' : '주소창 주소를 길게 눌러 복사해 주세요');
};

/* ===== 인앱 브라우저 안내 ===== */
(function(){
  const ua = navigator.userAgent || '';
  const noVoice = !window.speechSynthesis;
  const noMic = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if(!(IN_APP || (/Android/i.test(ua) && (noVoice || noMic)))) return;
  const el = document.getElementById('inapp');
  el.classList.remove('hide');
  document.getElementById('inappX').onclick = () => el.classList.add('hide');
  document.getElementById('openChrome').onclick = e => {
    e.preventDefault();
    const here = (location.host + location.pathname + location.search).replace(/^\/\//, '');
    location.href = 'intent://' + here + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent(location.href) + ';end';
  };
})();

hud();
renderSentence(); renderQuiz(); renderRead(); renderSpeak(); renderVideos();
goTab('sentence');

  stopSpeak();
  if(rec && rec.state === 'recording'){ try{ rec.stop(); }catch(_){} }
  if(stream) stream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} });
});
