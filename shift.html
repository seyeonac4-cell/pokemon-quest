<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="세연님 근무 달력">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/shift/shift-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./assets/shift/shift-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/shift/shift-icon-180.png">
<link rel="manifest" href="./manifest-shift.json">
<title>🌙 세연님의 11월 근무 달력</title>
<style>
/* ============================================================
   🌙 세연님의 병동 근무 달력
   데이터는 shift-data.json 하나만 갈아끼우면 다음 달로 갱신됨
   ============================================================ */
:root{
  --night:#3b3a94;
  --night2:#242257;
  --night-ink:#eef0ff;
  --off:#e4f6ee;
  --off2:#f7dbe7;
  --off-ink:#3f6b5c;
  --ink:#1b1d2b;
  --muted:#7b8095;
  --line:#e7e8f0;
  --card:#ffffff;
  --sun:#d1495b;
  --sat:#3d6fb4;
  --shadow:0 18px 48px rgba(30,32,64,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink);background:#eceef6;
  background-image:radial-gradient(1200px 600px at 50% -10%,#dfe3f7 0%,#eceef6 55%,#e9ebf3 100%);
  min-height:100vh;display:flex;justify-content:center;padding:24px 14px 40px;
}
.wrap{width:100%;max-width:468px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.7)}
/* ---------- 헤더 ---------- */
.head{background:linear-gradient(150deg,#31307a 0%,#242257 52%,#171a3f 100%);color:#fff;padding:22px 22px 18px;position:relative;overflow:hidden}
.head::after{content:"";position:absolute;right:-46px;top:-58px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(150,160,255,.45),rgba(150,160,255,0) 70%)}
.h-top{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.06em;color:#b9bdf0;font-weight:500}
.h-top .dot{width:6px;height:6px;border-radius:50%;background:#8f96ff;box-shadow:0 0 10px #8f96ff}
h1{margin:9px 0 3px;font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.h-sub{font-size:13px;color:#c4c8f2;font-weight:500}
.h-sub b{color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;text-align:center;backdrop-filter:blur(6px)}
.stat .n{font-size:20px;font-weight:900;line-height:1.1}
.stat .k{font-size:10.5px;color:#b9bdf0;margin-top:3px;letter-spacing:.03em}
/* ---------- 범례 ---------- */
.legend{display:flex;gap:14px;align-items:center;padding:13px 20px 4px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legend span[hidden]{display:none!important}
.sw{width:13px;height:13px;border-radius:5px;display:inline-block}
.sw.n{background:linear-gradient(150deg,#4a49b4,#242257)}
.sw.o{background:linear-gradient(150deg,#e4f6ee,#cfeade)}
.sw.t{background:#fff;border:1.5px solid #3b3a94}
.sw.b{background:linear-gradient(150deg,#ffedc9,#f6dfae)}
/* ---------- 달 선택 탭 ---------- */
.mtabs{display:flex;gap:7px;padding:12px 18px 0;flex-wrap:wrap}
.mtabs[hidden]{display:none!important}
.mtab{border:1.5px solid #e2e4f0;background:#fbfbfe;color:#5c6180;font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:-.01em;padding:7px 14px;border-radius:100px;cursor:pointer;transition:all .13s ease}
.mtab.cur{background:linear-gradient(150deg,#4a49b4,#242257);border-color:#2b2970;color:#fff;box-shadow:0 6px 14px rgba(43,41,112,.22)}
.mtab .now{display:inline-block;width:5px;height:5px;border-radius:50%;background:#f5b64a;margin-left:5px;vertical-align:middle;margin-bottom:1px}
/* ---------- 달력 ---------- */
.cal{padding:10px 14px 4px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px 0 7px}
.dow div{text-align:center;font-size:11.5px;font-weight:700;color:#9aa0b4;letter-spacing:.04em}
.dow div:first-child{color:var(--sun)}
.dow div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding-bottom:14px}
.cell{
  position:relative;min-height:82px;border-radius:12px;background:#fbfbfe;border:1px solid var(--line);
  padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
}
.cell:active{transform:scale(.97)}
.cell.empty{background:transparent;border:none;cursor:default}
.cell .dnum{font-size:12.5px;font-weight:700;color:#8b90a6;line-height:1}
.cell.n{background:linear-gradient(158deg,#4a49b4 0%,#302e78 55%,#242257 100%);border-color:#2b2970;box-shadow:0 6px 14px rgba(43,41,112,.22)}
.cell.n .dnum{color:#cdd1ff}
.cell.o{background:linear-gradient(158deg,#f2fbf7 0%,#e0f3ea 100%);border-color:#d3ebdf}
.cell.o.first{background:linear-gradient(158deg,#fdf1f5 0%,#f7dbe7 100%);border-color:#f1d2de}
.cell.today{outline:2.5px solid #f5b64a;outline-offset:-2.5px}
.cell .badge{
  margin-top:5px;font-size:11px;font-weight:900;letter-spacing:.04em;border-radius:7px;
  padding:2.5px 0;width:100%;text-align:center;line-height:1.1;
}
.cell.n .badge{color:#fff;background:rgba(255,255,255,.16)}
.cell.o .badge{color:var(--off-ink);background:rgba(255,255,255,.72)}
.cell.o.first .badge{color:#a9506b;background:rgba(255,255,255,.80)}
.cell.b{background:linear-gradient(158deg,#fff8e8 0%,#ffedc9 100%);border-color:#f6dfae}
.cell.b .badge{color:#8a5a12;background:rgba(255,255,255,.86)}
.cell .mates{margin-top:auto;font-size:10.5px;line-height:1.3;color:#cfd3ff;text-align:center;font-weight:500;padding-bottom:1px;word-break:keep-all}
.cell .mates i{display:block;font-style:normal;white-space:nowrap}
/* ---------- 동료 순위 ---------- */
.sec{padding:2px 20px 18px}
.sec h2{margin:6px 0 10px;font-size:13.5px;font-weight:900;color:#2b2d42;display:flex;align-items:center;gap:7px}
.sec h2 .bar{width:3px;height:14px;border-radius:2px;background:linear-gradient(#4a49b4,#242257)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f3f4fb;border:1px solid #e4e6f3;border-radius:100px;padding:6px 11px 6px 9px;font-size:12px;font-weight:700;color:#3a3d55}
.chip b{color:#3b3a94;font-weight:900}
.chip .c{background:#e6e8fa;color:#3b3a94;border-radius:100px;padding:1px 6px;font-size:10.5px;font-weight:900}
.foot{padding:0 20px 20px;font-size:10.5px;color:#a2a7bb;line-height:1.6}
.foot b{color:#7b8095;font-weight:700}
/* ---------- 상세 시트 ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,22,44,.42);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:468px;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 26px;transform:translateY(16px);transition:transform .22s ease}
.sheet.on .box{transform:translateY(0)}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:900}
.sheet .sm{font-size:12px;color:var(--muted);margin-bottom:14px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.sheet .row:first-of-type{border-top:none}
.sheet .row b{font-weight:800}
.pill{font-size:11px;font-weight:900;padding:3px 9px;border-radius:100px}
.pill.n{background:#eaeaff;color:#3b3a94}
.pill.o{background:#e4f6ee;color:#3f6b5c}
.sheet .close{margin-top:16px;width:100%;border:none;background:#242257;color:#fff;font-family:inherit;font-size:14px;font-weight:800;padding:13px;border-radius:14px}
.sheet .close.ghost{background:#f1f2f8;color:#5c6180;margin-top:8px}
/* ---------- 새 근무표 업로드 ---------- */
.badge-inbox{display:none;align-items:center;gap:6px;margin-top:13px;background:rgba(245,182,74,.16);border:1px solid rgba(245,182,74,.55);color:#ffe0a3;border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:800;width:max-content;max-width:100%}
.badge-inbox.on{display:inline-flex}
.up{padding:2px 20px 6px}
.upbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;padding:15px 14px;font-family:inherit;font-size:14.5px;font-weight:900;color:#fff;background:linear-gradient(150deg,#4a49b4 0%,#302e78 55%,#242257 100%);box-shadow:0 10px 22px rgba(43,41,112,.26);cursor:pointer;transition:transform .12s ease,opacity .15s}
.upbtn:active{transform:scale(.985)}
.upbtn[disabled]{opacity:.65;cursor:default}
.upnote{margin-top:9px;font-size:11.5px;line-height:1.55;color:#9aa0b4;word-break:keep-all}
.upmsg{margin-top:11px;font-size:12.5px;line-height:1.55;border-radius:12px;padding:11px 13px;display:none;font-weight:500;word-break:keep-all}
.upmsg.on{display:block}
.upmsg.ok{background:#e9f7ef;color:#2c6b4f;border:1px solid #cfeade}
.upmsg.wait{background:#fff5e0;color:#8a5a12;border:1px solid #ffe2ad}
.upmsg.err{background:#fdecec;color:#a33a3a;border:1px solid #f6cfcf}
.upmsg button{margin-top:8px;border:none;background:#242257;color:#fff;font-family:inherit;font-size:12px;font-weight:800;padding:8px 13px;border-radius:10px}
.pin{width:100%;margin:4px 0 0;border:1.5px solid #dfe2ef;border-radius:14px;padding:14px;font-family:inherit;font-size:22px;font-weight:900;letter-spacing:.42em;text-align:center;color:#242257;background:#fbfbfe;outline:none}
.pin:focus{border-color:#4a49b4;background:#fff}
.pinerr{min-height:16px;margin:8px 0 2px;font-size:12px;font-weight:700;color:#d1495b;text-align:center}
/* ---------- 인쇄 / PDF 저장 버튼 ---------- */
.printbtn{
  position:absolute;top:15px;right:15px;z-index:3;
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.13);
  color:#fff;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:-.01em;
  padding:7px 12px;border-radius:100px;cursor:pointer;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);transition:transform .12s ease,background .15s ease;
}
.printbtn:active{transform:scale(.96);background:rgba(255,255,255,.22)}
.printbtn span{font-size:12.5px;line-height:1}
.printf{display:none}
.pyear{display:none}
@media (max-width:400px){
  .cell{min-height:74px}
  .cell .mates{font-size:9.6px}
  h1{font-size:22px}
  .printbtn{font-size:10.5px;padding:6px 10px;top:12px;right:12px}
}
/* ============================================================
   🖨️ A4 세로 1장 인쇄 / PDF 저장
   ============================================================ */
@media print{
  @page{size:A4 portrait;margin:8mm 10mm}
  html,body{
    margin:0!important;padding:0!important;height:auto!important;
    background:#fff!important;background-image:none!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  body{display:block}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .wrap{max-width:none;width:auto}
  .card{
    display:flex;flex-direction:column;
    width:100%;height:277mm;
    border:none;border-radius:0;box-shadow:none;overflow:hidden;background:#fff;
    page-break-inside:avoid;break-inside:avoid;
  }
  /* 화면 전용 UI는 인쇄에서 숨김 */
  .printbtn,.up,.upbtn,.upnote,.upmsg,.badge-inbox,.sheet,#upFile,.foot,.mtabs,
  .head-actions,.toast,.banner,.backlink,a.dashboard-link{display:none!important}
  /* 헤더 */
  .head{padding:5mm 6mm 4.6mm;flex:0 0 auto;border-radius:0}
  .head::after{width:38mm;height:38mm;right:-10mm;top:-13mm}
  .h-top{font-size:8pt;letter-spacing:.08em}
  .h-top .dot{width:1.5mm;height:1.5mm}
  .pyear{display:inline}
  h1{margin:1.4mm 0 .6mm;font-size:19pt;line-height:1.15}
  .h-sub{font-size:9pt}
  .stats{gap:2mm;margin-top:3.4mm}
  .stat{padding:2mm 2mm 1.8mm;border-radius:2.4mm;backdrop-filter:none;-webkit-backdrop-filter:none}
  .stat .n{font-size:15pt}
  .stat .k{font-size:7.5pt;margin-top:.7mm}
  /* 범례 */
  .legend{padding:2.4mm 6mm 0;font-size:8pt;gap:4.5mm;flex:0 0 auto}
  .sw{width:3mm;height:3mm;border-radius:.9mm}
  /* 달력 */
  .cal{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:1.6mm 4mm 0}
  .dow{flex:0 0 auto;padding:1.6mm 0 1.4mm;gap:1.2mm}
  .dow div{font-size:8pt}
  .grid{flex:1 1 auto;min-height:0;grid-auto-rows:1fr;gap:1.2mm;padding-bottom:0}
  .cell{
    min-height:0;border-radius:1.8mm;padding:1.2mm .7mm .9mm;
    transition:none;cursor:default;overflow:hidden;
  }
  .cell:active{transform:none}
  .cell.n,.cell.o,.cell.o.first{box-shadow:none}
  .cell.today{outline:.55mm solid #f5b64a;outline-offset:-.55mm}
  .cell .dnum{font-size:9.5pt}
  .cell .badge{font-size:7.5pt;margin-top:.9mm;padding:.5mm 0;border-radius:1.2mm;letter-spacing:.03em}
  .cell .mates{font-size:8pt;line-height:1.32;padding-bottom:.3mm}
  .cell .mates i{white-space:nowrap}
  /* 동료 목록 */
  .sec{padding:2.6mm 6mm 0;flex:0 0 auto}
  .sec h2{font-size:8.5pt;margin:0 0 1.6mm;gap:1.6mm}
  .sec h2 .bar{width:1mm;height:3mm}
  .chips{gap:1.2mm}
  .chip{font-size:7.5pt;padding:.9mm 2mm;border-radius:100px;background:#f3f4fb}
  .chip b{font-weight:900}
  .chip .c{font-size:6.5pt;padding:.1mm 1.2mm}
  /* 인쇄 전용 하단 한 줄 */
  .printf{
    display:flex!important;align-items:center;justify-content:space-between;gap:4mm;
    margin-top:auto;padding:2.2mm 6mm 0;border-top:.25mm solid #e7e8f0;
    font-size:7pt;color:#8b90a6;line-height:1.4;
  }
  .printf b{color:#5c6180;font-weight:800}
  .printf .r{text-align:right;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="head">
      <button class="printbtn" id="printBtn" type="button" title="A4 1장으로 인쇄하거나 PDF로 저장"><span>🖨️</span> 인쇄 / PDF</button>
      <div class="h-top"><span class="dot"></span>병동 근무표 · NIGHT<span class="pyear" id="printYear"></span></div>
      <h1 id="title">11월 근무 달력</h1>
      <div class="h-sub"><b id="nurseName">임세연</b> 님의 나이트 근무와 함께 서는 동료</div>
      <div class="stats">
        <div class="stat"><div class="n" id="sNight">–</div><div class="k">나이트</div></div>
        <div class="stat"><div class="n" id="sOff">–</div><div class="k">휴무</div></div>
        <div class="stat"><div class="n" id="sMates">–</div><div class="k">함께 선 동료</div></div>
      </div>
      <div class="badge-inbox" id="inboxBadge">⏳ 새 근무표 분석 대기 중</div>
    </div>

    <div class="mtabs" id="mtabs" hidden></div>

    <div class="legend">
      <span><i class="sw n"></i>나이트(N)</span>
      <span><i class="sw o"></i>휴무</span>
      <span id="lgDae" hidden><i class="sw b"></i>대휴</span>
      <span><i class="sw t"></i>오늘</span>
    </div>

    <div class="cal">
      <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="sec">
      <h2><span class="bar"></span>함께 나이트 선 동료</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="sec up">
      <h2><span class="bar"></span>다음 달 근무표</h2>
      <button class="upbtn" id="upBtn" type="button">📤 새 근무표 사진 올리기</button>
      <div class="upnote">사진을 올리면 호박이가 자동으로 읽어서 이 달력을 다음 달로 바꿔 드려요. (보호자 PIN 필요)</div>
      <div class="upmsg" id="upMsg"></div>
      <input type="file" id="upFile" accept="image/*" hidden>
    </div>

    <div class="foot" id="foot"></div>

    <div class="printf" id="printFoot"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <h3 id="shTitle">11월 3일 (화)</h3>
    <div class="sm" id="shSub">나이트 근무</div>
    <div id="shRows"></div>
    <button class="close" onclick="closeSheet()">닫기</button>
  </div>
</div>

<div class="sheet" id="pinSheet">
  <div class="box">
    <h3>보호자 확인</h3>
    <div class="sm">새 근무표 사진을 올리려면 PIN 4자리를 입력해 주세요.</div>
    <input class="pin" id="pinInput" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <div class="pinerr" id="pinErr"></div>
    <button class="close" onclick="submitPin()">확인</button>
    <button class="close ghost" onclick="closePin()">닫기</button>
  </div>
</div>

<script>
const WD=['일','월','화','수','목','금','토'];
let DATA=null, VIEW=null;
const TODAY=new Date();
const TODAY_KEY=(TODAY.getFullYear()+'-'+String(TODAY.getMonth()+1).padStart(2,'0')+'-'+String(TODAY.getDate()).padStart(2,'0'));

function fmt(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';}

fetch('./shift-data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  DATA=d;
  // 한 파일에 여러 달이 들어 있으면(months) 그 달들을 탭으로 보여 준다.
  const ms=(Array.isArray(d.months)&&d.months.length)?d.months.filter(m=>m&&m.days&&m.days.length):[];
  const list=ms.length?ms:[d];
  const tm=TODAY_KEY.slice(0,7);
  // 오늘이 속한 달을 먼저 보여 주고, 없으면 가장 최근 달을 보여 준다.
  VIEW=list.find(m=>m.month===tm)||list.find(m=>m.month===d.defaultMonth)||list[list.length-1];
  renderMonthTabs(list);
  render();
}).catch(e=>{
  document.getElementById('foot').textContent='근무 데이터를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.';
});

function renderMonthTabs(list){
  const box=document.getElementById('mtabs');
  if(!list||list.length<2){box.hidden=true;box.innerHTML='';return;}
  box.hidden=false;
  box.innerHTML=list.map(m=>{
    const isNow=m.month===TODAY_KEY.slice(0,7);
    return '<button type="button" class="mtab'+(m.month===VIEW.month?' cur':'')+'" data-m="'+m.month+'">'
      +m.monthNum+'월'+(isNow?'<i class="now"></i>':'')+'</button>';
  }).join('');
  box.querySelectorAll('.mtab').forEach(b=>b.addEventListener('click',()=>{
    const list2=(Array.isArray(DATA.months)&&DATA.months.length)?DATA.months:[DATA];
    const hit=list2.find(m=>m.month===b.dataset.m);
    if(hit){VIEW=hit;renderMonthTabs(list2);render();}
  }));
}

function render(){
  const d=VIEW||DATA;
  document.getElementById('title').textContent=d.monthNum+'월 근무 달력';
  document.getElementById('nurseName').textContent=d.nurse.name;
  const nights=d.days.filter(x=>x.shift==='N').length;
  const restDays=d.days.filter(x=>x.shift!=='N');
  const noted=restDays.filter(x=>x.note);
  const offs=restDays.length-noted.length;
  document.getElementById('sNight').textContent=nights;
  document.getElementById('sOff').textContent=offs;
  const lgDae=document.getElementById('lgDae');
  if(lgDae) lgDae.hidden=!(noted.length>0);
  document.getElementById('sMates').textContent=d.colleagues.length;

  // 달력 그리드
  const first=new Date(d.year,d.monthNum-1,1).getDay();
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cell empty';grid.appendChild(e);}
  d.days.forEach(day=>{
    const c=document.createElement('div');
    const isNight=day.shift==='N';
    const isNote=!isNight&&!!day.note;
    c.className='cell '+(isNight?'n':(isNote?'b':'o'))+((!isNight&&!isNote&&(day.weekday==='일'||day.weekday==='토'))?' first':'')+(day.date===TODAY_KEY?' today':'');
    let mates='';
    if(isNight&&day.colleagues.length){
      mates='<div class="mates">'+day.colleagues.map(n=>'<i>'+n+'</i>').join('')+'</div>';
    }
    c.innerHTML='<div class="dnum">'+day.d+'</div><div class="badge">'+(isNight?'N':(day.note||'휴무'))+'</div>'+mates;
    c.onclick=()=>openSheet(day);
    grid.appendChild(c);
  });

  // 동료 칩
  const chips=document.getElementById('chips');
  chips.innerHTML=d.colleagues.map(c=>'<span class="chip">'+c.name+' <span class="c">'+c.count+'</span></span>').join('');

  // 문서 제목(인쇄/PDF 파일 이름에 쓰임)
  document.title='🌙 세연님의 '+d.monthNum+'월 근무 달력';
  const py=document.getElementById('printYear');
  if(py) py.textContent=' · '+d.label;

  // 하단 설명
  const v=d.verification||{};
  const pf=document.getElementById('printFoot');
  if(pf){
    pf.innerHTML='<span><b>'+d.label+' '+d.unit+' 근무표</b> · 하루 나이트 '+(v.nightTotalPerDay||3)+'명(세연님 포함)</span>'+
      '<span class="r">'+d.nurse.name+' 님 · N '+nights+'회 · 휴무 '+offs+'일'+(noted.length?' · '+noted.map(x=>x.note+' '+x.d+'일').join(' · '):'')+'</span>';
  }
  document.getElementById('foot').innerHTML=
    '<b>'+d.label+'</b> · 하루 나이트 인원 '+ (v.nightTotalPerDay||3) +'명(세연님 포함)'+
    (noted.length?' · 대휴 '+noted.map(x=>x.d+'일').join(', '):'')+'<br>'+
    '근무표 사진을 칸 단위로 확대해 읽고, 요약표(N수 '+nights+'·휴무 '+offs+')와 날짜별 NIGHT 인원으로 두 번 대조해 확인했어요.<br>'+
    '다음 달 근무표는 데이터(shift-data.json)만 바꾸면 이 달력이 그대로 갱신됩니다.';
}

function openSheet(day){
  const d0=VIEW||DATA;
  const isNight=day.shift==='N';
  document.getElementById('shTitle').textContent=(d0.monthNum)+'월 '+day.d+'일 ('+day.weekday+')';
  document.getElementById('shSub').textContent=isNight?'나이트 근무 · 함께 서는 동료 2명':(day.note||'휴무');
  let rows='<div class="row"><span>근무</span><span class="pill '+(isNight?'n':'o')+'">'+(isNight?'N · 나이트':(day.note||'휴무'))+'</span></div>';
  if(isNight){
    day.colleagues.forEach(c=>{
      const p=(d0.roster||[]).find(r=>r.name===c);
      rows+='<div class="row"><span><b>'+c+'</b></span><span style="color:#7b8095;font-size:12px">이번 달 N '+(p?p.nCount:0)+'회</span></div>';
    });
  }else{
    const nx=(d0.days||[]).find(x=>x.d>day.d&&x.shift==='N');
    if(nx) rows+='<div class="row"><span>다음 나이트</span><span style="font-weight:800">'+d0.monthNum+'월 '+nx.d+'일 ('+nx.weekday+')</span></div>';
  }
  document.getElementById('shRows').innerHTML=rows;
  document.getElementById('sheet').classList.add('on');
}
/* 🖨️ 인쇄 / PDF 저장 */
document.getElementById('printBtn').addEventListener('click',()=>{
  closeSheet(); closePin();
  setTimeout(()=>window.print(),60);
});

function closeSheet(){document.getElementById('sheet').classList.remove('on');}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

/* ============================================================
   📤 새 근무표 사진 올리기 → Firebase shift_inbox (자동 분석 대기)
   ============================================================ */
const DB='https://pokemon-quest-lim-default-rtdb.asia-southeast1.firebasedatabase.app/family-lim-7660';
const INBOX=DB+'/shift_inbox';
const MAX_W=1800;              // 가로 최대 1800px
const TARGET_BYTES=350*1024;   // ~350KB 이하
let pinOK=false, uploading=false, firstMsgShown=false;

const upMsgEl=document.getElementById('upMsg');
function upMsg(html,kind){
  upMsgEl.className='upmsg on '+(kind||'');
  upMsgEl.innerHTML=html;
  firstMsgShown=true;
}

/* 업로드 대기 상태 확인 */
function setBadge(on){
  document.getElementById('inboxBadge').classList.toggle('on',!!on);
}
async function refreshInbox(){
  try{
    const r=await fetch(INBOX+'/status.json',{cache:'no-store'});
    if(!r.ok) return;
    const st=await r.json();
    const pending=st==='pending';
    setBadge(pending||uploading);
    if(pending){
      if(!firstMsgShown) upMsg('⏳ 새 근무표 분석 대기 중','wait');
    }else if(st==='done' && firstMsgShown && !uploading){
      if(upMsgEl.classList.contains('wait')||upMsgEl.classList.contains('ok')){
        upMsg('✅ 새 근무표 분석이 끝났어요! 새로고침하면 새 달 달력이 나와요.<br><button type="button" onclick="location.reload()">🔄 새로고침</button>','ok');
      }
    }
  }catch(e){/* 오프라인 등은 무시 */}
}

/* PIN 확인 */
async function pinMatches(value){
  let pin='0000';
  try{
    const r=await fetch(DB+'/settings/pin.json',{cache:'no-store'});
    if(r.ok){const p=await r.json(); if(typeof p==='string'&&p.trim()) pin=p.trim();}
  }catch(e){/* 설정을 못 읽으면 기본 PIN */}
  return String(value).trim()===pin;
}
function openPin(){
  document.getElementById('pinErr').textContent='';
  const i=document.getElementById('pinInput'); i.value='';
  document.getElementById('pinSheet').classList.add('on');
  setTimeout(()=>i.focus(),180);
}
function closePin(){document.getElementById('pinSheet').classList.remove('on');document.getElementById('pinErr').textContent='';}
async function submitPin(){
  const input=document.getElementById('pinInput');
  const v=input.value.trim();
  if(v.length!==4){document.getElementById('pinErr').textContent='PIN 4자리를 입력해 주세요.';return;}
  if(await pinMatches(v)){
    pinOK=true; closePin();
    setTimeout(()=>document.getElementById('upFile').click(),120);
  }else{
    document.getElementById('pinErr').textContent='PIN이 맞지 않아요.';
    input.value=''; input.focus();
  }
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin();});
document.getElementById('pinSheet').addEventListener('click',e=>{if(e.target.id==='pinSheet')closePin();});

/* 버튼 → PIN → 파일 선택 */
document.getElementById('upBtn').addEventListener('click',()=>{
  if(uploading) return;
  if(pinOK) document.getElementById('upFile').click();
  else openPin();
});

/* 사진 리사이즈 (최대 1800px · JPEG 0.88 · ~350KB 이하) */
function loadImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);res(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('사진을 열 수 없어요'));};
    img.src=url;
  });
}
function shrink(img){
  const cv=document.createElement('canvas');
  const scale=Math.min(1,MAX_W/img.naturalWidth);
  let w=Math.max(1,Math.round(img.naturalWidth*scale));
  let h=Math.max(1,Math.round(img.naturalHeight*scale));
  let q=0.88;
  const draw=()=>{
    cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,0,0,w,h);
  };
  draw();
  return new Promise(resolve=>{
    const step=()=>{
      cv.toBlob(blob=>{
        if(!blob||blob.size<=TARGET_BYTES||w<=700){resolve({blob:blob||new Blob(),w:w,h:h});return;}
        if(q>0.62){q=Math.max(0.62,q-0.06);}
        else{w=Math.round(w*0.86); h=Math.round(h*0.86); q=0.84; draw();}
        step();
      },'image/jpeg',q);
    };
    step();
  });
}
function blobToDataURL(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(new Error('사진을 읽을 수 없어요'));
    fr.readAsDataURL(blob);
  });
}

/* 업로드 */
async function uploadShift(file){
  if(uploading) return;
  uploading=true;
  const btn=document.getElementById('upBtn');
  const label=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='⏳ 사진 준비 중…';
  setBadge(true);
  try{
    const img=await loadImage(file);
    const out=await shrink(img);
    const kb=Math.max(1,Math.round(out.blob.size/1024));
    btn.innerHTML='📤 올리는 중… ('+kb+'KB)';
    upMsg('📤 올리는 중… ('+kb+'KB · '+out.w+'×'+out.h+')','wait');
    const dataUrl=await blobToDataURL(out.blob);
    const body={
      status:'pending',
      uploaded_at:new Date().toISOString(),
      filename:file.name||'shift.jpg',
      bytes:out.blob.size,
      width:out.w, height:out.h,
      image_data:dataUrl
    };
    const r=await fetch(INBOX+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('저장 실패 (HTTP '+r.status+')');
    setBadge(true);
    upMsg('✅ 업로드 완료! 호박이가 곧 자동 분석해서 달력을 새 달로 바꿔 드릴게요<br><span style="opacity:.75;font-size:11.5px">'+kb+'KB · '+out.w+'×'+out.h+'</span>','ok');
  }catch(err){
    setBadge(false);
    upMsg('❗ 업로드를 마치지 못했어요. 사진을 다시 골라 주세요.<br><span style="opacity:.7;font-size:11.5px">'+String((err&&err.message)||err)+'</span>','err');
  }finally{
    uploading=false;
    btn.disabled=false; btn.innerHTML=label;
  }
}
document.getElementById('upFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(f) uploadShift(f);
});

refreshInbox();
setInterval(refreshInbox,60000);
</script>
