<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="형원이 사이트워드">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/teenieping/teenieping-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/teenieping/teenieping-icon-180.png">
<title>⭐ 형원이 사이트워드</title>
<style>
:root{
  --ink:#4a3455;
  --ink2:#8a6d93;
  --muted:#ad97b5;
  --pink:#ff8fc2;
  --pink-d:#ef6aa8;
  --pink-l:#ffe4f1;
  --lav:#c8b4ff;
  --lav-d:#8f6cf0;
  --gold:#ffc94d;
  --mint:#63d6b4;
  --mint-d:#1f9c7c;
  --red:#ff7a7a;
  --paper:#fffafd;
  --line:#ffe1ef;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(120% 55% at 6% 0%, #ffe6f4 0%, rgba(255,230,244,0) 60%),
    radial-gradient(110% 50% at 100% 6%, #e6dcff 0%, rgba(230,220,255,0) 55%),
    radial-gradient(120% 55% at 50% 102%, #dff5ff 0%, rgba(223,245,255,0) 62%),
    #fff8fc;
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:3px dashed var(--lav-d);outline-offset:3px;border-radius:14px}

.app{position:relative;max-width:560px;margin:0 auto;padding:12px 14px 26px}

/* 상단 */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{
  display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:15px;
  background:#fff;border:2.5px solid #ffd0e5;box-shadow:0 3px 0 #ffd0e5;
  font-size:13.5px;color:#b4578f;
}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd0e5}
.sp{flex:1}
.snd{
  width:44px;height:44px;border-radius:15px;background:#fff;border:2.5px solid #ffd0e5;
  box-shadow:0 3px 0 #ffd0e5;font-size:19px;display:flex;align-items:center;justify-content:center;
}
.snd:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd0e5}
.snd.off{background:#f6f0f8;color:var(--muted)}

/* 히어로 */
.hero{
  position:relative;border-radius:28px;padding:16px 18px 18px;overflow:hidden;
  background:linear-gradient(160deg,#fff2f9 0%,#ffe6f3 48%,#efe5ff 100%);
  border:3px solid #fff;box-shadow:0 12px 28px rgba(226,140,183,.18);
}
.hero h1{margin:0;font-size:21px;color:#a04478;letter-spacing:-.3px}
.hero p{margin:5px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
.hero .deco{position:absolute;right:12px;top:10px;font-size:34px;opacity:.7}

/* 모드 고르기 */
.modes{display:flex;gap:8px;margin-top:12px}
.mode{
  flex:1;padding:12px 10px;border-radius:18px;background:#fff;border:2.5px solid #ffe1ef;
  box-shadow:0 4px 0 #ffe1ef;font-size:14.5px;color:#a04478;display:flex;align-items:center;
  justify-content:center;gap:6px;
}
.mode.on{background:linear-gradient(100deg,#ff8fc2,#a98cf5);color:#fff;border-color:transparent;box-shadow:0 4px 0 #d987b6}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ef}

/* 보기 전환 */
.view{display:none;margin-top:14px}
.view.on{display:block;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 단어 카드 */
.listhead{display:flex;align-items:center;margin:0 4px 9px}
.listhead b{font-size:14px;color:#a04478}
.listhead span{margin-left:auto;font-size:12px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:9px}
.wcard{
  display:block;width:100%;text-align:left;background:#fff;border:2.5px solid #ffe1ef;
  border-radius:20px;box-shadow:0 4px 0 #ffe1ef;padding:13px 14px;transition:transform .1s,border-color .15s;
}
.wcard:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ef}
.wcard.on{border-color:#ffb3d7;box-shadow:0 4px 0 #ffc9e2;background:linear-gradient(180deg,#fff9fc,#ffeef6)}
.wrow{display:flex;align-items:center;gap:10px}
.wemo{flex:0 0 auto;width:40px;height:40px;border-radius:14px;background:#fff5fa;display:flex;align-items:center;justify-content:center;font-size:22px}
.wtxt{flex:1;min-width:0}
.wword{font-size:25px;line-height:1.15;color:#7b3f68;letter-spacing:.3px}
.wko{font-size:12.5px;color:var(--ink2);margin-top:1px}
.wspk{flex:0 0 auto;font-size:18px;color:#e0a5c6}
.wex{
  display:none;margin-top:10px;padding-top:10px;border-top:2px dashed #ffe1ef;
  font-size:14.5px;color:#6b4a63;line-height:1.5;
}
.wcard.on .wex{display:block}
.wex em{display:block;margin-top:3px;font-style:normal;font-size:12.5px;color:var(--muted)}

/* 퀴즈 */
.quizbox{
  background:#fff;border:3px solid #fff;border-radius:26px;padding:16px;
  box-shadow:0 8px 22px rgba(226,140,183,.16);
}
.qtop{display:flex;align-items:center;gap:8px}
.qtop .qn{font-size:13px;color:#b4578f;background:#ffe9f4;border-radius:999px;padding:5px 11px}
.qtop .stars{margin-left:auto;font-size:14px;color:#c05b95}
.bigear{
  display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px 0 4px;
}
.bigear .ic{font-size:52px;line-height:1}
.bigear .tx{font-size:14px;color:var(--ink2)}
.replay{
  margin-top:10px;padding:12px 20px;border-radius:18px;background:#fff5fa;border:2.5px solid #ffd0e5;
  box-shadow:0 4px 0 #ffd0e5;font-size:15px;color:#a04478;
}
.replay:active{transform:translateY(2px);box-shadow:0 2px 0 #ffd0e5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.opt{
  padding:17px 8px;border-radius:20px;background:#fff;border:2.5px solid #e8dcf5;
  box-shadow:0 4px 0 #ece2f8;font-size:23px;color:#5d3f6b;letter-spacing:.3px;
  transition:transform .1s,background .18s,border-color .18s;
}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #ece2f8}
.opt.ok{background:#e9fbf3;border-color:#7fdcc4;box-shadow:0 4px 0 #b8eedd;color:#1f7a61}
.opt.bad{background:#ffecec;border-color:#ffb0b0;box-shadow:0 4px 0 #ffd0d0;color:#b04040;animation:shake .3s}
.opt.hint{background:#fff8e5;border-color:#ffd58a;box-shadow:0 4px 0 #ffe6b0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt:disabled{opacity:1;cursor:default}

.startbox{text-align:center;padding:8px 4px 4px}
.startbox .ic{font-size:56px;line-height:1}
.startbox h2{margin:10px 0 6px;font-size:19px;color:#a04478}
.startbox p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.6}
.startbtn{
  margin-top:16px;width:100%;padding:15px;border-radius:20px;
  background:linear-gradient(100deg,#ff8fc2,#a98cf5);color:#fff;font-size:17px;
  box-shadow:0 6px 0 #d987b6;
}
.startbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #d987b6}
.result{text-align:center;padding:6px 4px}
.result .ic{font-size:56px;line-height:1}
.result h2{margin:10px 0 4px;font-size:20px;color:#a04478}
.result .score{font-size:34px;color:#ef6aa8;letter-spacing:-.5px}
.result p{margin:6px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
  background:rgba(74,52,85,.94);color:#fff;font-size:14px;padding:12px 18px;border-radius:999px;
  box-shadow:0 10px 24px rgba(74,52,85,.3);opacity:0;pointer-events:none;z-index:80;
  transition:opacity .22s,transform .22s;max-width:86vw;text-align:center;line-height:1.4;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.foot{text-align:center;font-size:11px;color:#c9aec3;margin:22px 0 4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <a class="back" href="./teenieping.html">← 티니핑 홈</a>
    <span class="sp"></span>
    <button class="snd" id="snd" type="button" aria-label="소리 끄기" aria-pressed="true">🔊</button>
  </div>

  <div class="hero">
    <span class="deco" aria-hidden="true">⭐</span>
    <h1>⭐ 형원이 사이트워드</h1>
    <p>영어에서 자주 나오는 단어를 듣고, 찾아 봐요!</p>
  </div>

  <nav class="modes" aria-label="놀이 고르기">
    <button class="mode on" type="button" data-mode="cards" aria-pressed="true"><span aria-hidden="true">📚</span>단어 카드</button>
    <button class="mode" type="button" data-mode="quiz" aria-pressed="false"><span aria-hidden="true">🎧</span>소리 퀴즈</button>
  </nav>

  <!-- ============ 단어 카드 ============ -->
  <section class="view on" id="v-cards" aria-label="단어 카드">
    <div class="listhead">
      <b>카드를 누르면 읽어 줘요</b>
      <span id="cardCount">48개</span>
    </div>
    <div class="wlist" id="wlist"></div>
    <p class="foot">누르면 다시 들을 수 있어요 🔊</p>
  </section>

  <!-- ============ 소리 퀴즈 ============ -->
  <section class="view" id="v-quiz" aria-label="소리 퀴즈">
    <div class="quizbox" id="quizBox"></div>
    <p class="foot">10문제씩 풀어 봐요 ⭐</p>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     사이트워드 48개 (7세 기초 · 뜻 + 짧은 예문)
     ============================================================ */
  var WORDS = [
    { w: 'I',      ko: '나',            emo: '🙋', ex: 'I can jump.',             exko: '나는 뛸 수 있어요.' },
    { w: 'a',      ko: '하나의',        emo: '1️⃣', ex: 'I have a red ball.',      exko: '나는 빨간 공이 있어요.' },
    { w: 'the',    ko: '그',            emo: '👑', ex: 'The cat is little.',      exko: '그 고양이는 작아요.' },
    { w: 'and',    ko: '그리고',        emo: '➕', ex: 'Mia and I play.',         exko: '미아와 나는 놀아요.' },
    { w: 'to',     ko: '~로, ~에게',    emo: '➡️', ex: 'Go to the bed.',          exko: '침대로 가요.' },
    { w: 'is',     ko: '~이에요',       emo: '✅', ex: 'She is my mom.',          exko: '그분은 우리 엄마예요.' },
    { w: 'it',     ko: '그것',          emo: '📦', ex: 'It is big.',              exko: '그것은 커요.' },
    { w: 'in',     ko: '~안에',         emo: '📥', ex: 'The toy is in the box.',  exko: '장난감이 상자 안에 있어요.' },
    { w: 'on',     ko: '~위에',         emo: '⬆️', ex: 'The book is on the desk.', exko: '책이 책상 위에 있어요.' },
    { w: 'you',    ko: '너',            emo: '👉', ex: 'You are my friend.',      exko: '너는 내 친구야.' },
    { w: 'he',     ko: '그',            emo: '👦', ex: 'He is my dad.',           exko: '그는 우리 아빠예요.' },
    { w: 'she',    ko: '그녀',          emo: '👧', ex: 'She is happy.',           exko: '그녀는 행복해요.' },
    { w: 'we',     ko: '우리',          emo: '👨‍👩‍👧', ex: 'We like apples.',         exko: '우리는 사과를 좋아해요.' },
    { w: 'my',     ko: '나의',          emo: '🙌', ex: 'This is my bag.',         exko: '이것은 내 가방이에요.' },
    { w: 'me',     ko: '나를, 나에게',  emo: '🙋', ex: 'Look at me!',             exko: '나를 봐요!' },
    { w: 'see',    ko: '보다',          emo: '👀', ex: 'I see a bird.',           exko: '나는 새를 봐요.' },
    { w: 'like',   ko: '좋아하다',      emo: '❤️', ex: 'I like milk.',            exko: '나는 우유를 좋아해요.' },
    { w: 'can',    ko: '~할 수 있어',   emo: '💪', ex: 'I can run fast.',         exko: '나는 빨리 달릴 수 있어요.' },
    { w: 'go',     ko: '가다',          emo: '🚶', ex: 'Let us go to the park.',  exko: '공원에 가요.' },
    { w: 'come',   ko: '오다',          emo: '👋', ex: 'Come here, please.',      exko: '이리 와요.' },
    { w: 'look',   ko: '보다, 살펴보다', emo: '🔍', ex: 'Look at the star.',       exko: '별을 봐요.' },
    { w: 'play',   ko: '놀다',          emo: '⚽', ex: 'I play with my dog.',     exko: '나는 강아지와 놀아요.' },
    { w: 'big',    ko: '큰',            emo: '🐘', ex: 'A big elephant.',         exko: '큰 코끼리.' },
    { w: 'little', ko: '작은',          emo: '🐭', ex: 'A little mouse.',         exko: '작은 쥐.' },
    { w: 'red',    ko: '빨간',          emo: '🔴', ex: 'My ball is red.',         exko: '내 공은 빨개요.' },
    { w: 'blue',   ko: '파란',          emo: '🔵', ex: 'The sky is blue.',        exko: '하늘은 파래요.' },
    { w: 'one',    ko: '하나',          emo: '1️⃣', ex: 'I have one cookie.',      exko: '나는 쿠키가 하나 있어요.' },
    { w: 'two',    ko: '둘',            emo: '2️⃣', ex: 'Two cats are here.',      exko: '고양이 두 마리가 있어요.' },
    { w: 'yes',    ko: '응',            emo: '👍', ex: 'Yes, I can!',             exko: '응, 할 수 있어!' },
    { w: 'no',     ko: '아니',          emo: '👎', ex: 'No, thank you.',          exko: '아니요, 괜찮아요.' },
    { w: 'here',   ko: '여기',          emo: '📍', ex: 'Come here!',              exko: '이리 와요!' },
    { w: 'where',  ko: '어디',          emo: '❓', ex: 'Where is my hat?',        exko: '내 모자는 어디에 있지?' },
    { w: 'what',   ko: '무엇',          emo: '❔', ex: 'What is this?',           exko: '이것은 무엇이지?' },
    { w: 'who',    ko: '누구',          emo: '🙋‍♂️', ex: 'Who is she?',             exko: '그녀는 누구지?' },
    { w: 'have',   ko: '가지다',        emo: '🤲', ex: 'I have a pen.',           exko: '나는 펜이 있어요.' },
    { w: 'has',    ko: '가지다',        emo: '🎁', ex: 'She has a hat.',          exko: '그녀는 모자가 있어요.' },
    { w: 'do',     ko: '하다',          emo: '✍️', ex: 'I do my homework.',       exko: '나는 숙제를 해요.' },
    { w: 'make',   ko: '만들다',        emo: '🎂', ex: 'Let us make a cake.',     exko: '케이크를 만들어요.' },
    { w: 'jump',   ko: '뛰다',          emo: '🤸', ex: 'Jump up high!',           exko: '높이 뛰어요!' },
    { w: 'run',    ko: '달리다',        emo: '🏃', ex: 'I run in the park.',      exko: '나는 공원에서 달려요.' },
    { w: 'up',     ko: '위로',          emo: '☝️', ex: 'Look up!',                exko: '위를 봐요!' },
    { w: 'down',   ko: '아래로',        emo: '👇', ex: 'Sit down, please.',       exko: '앉아요.' },
    { w: 'this',   ko: '이것',          emo: '👆', ex: 'This is my toy.',         exko: '이것은 내 장난감이에요.' },
    { w: 'that',   ko: '저것',          emo: '👉', ex: 'That is a star.',         exko: '저것은 별이에요.' },
    { w: 'with',   ko: '~와 함께',      emo: '🤝', ex: 'Play with me.',           exko: '나와 놀아요.' },
    { w: 'for',    ko: '~를 위해',      emo: '🎀', ex: 'This is for you.',        exko: '이건 너를 위한 거예요.' },
    { w: 'are',    ko: '~이에요',       emo: '👨‍👩‍👦', ex: 'We are happy.',           exko: '우리는 행복해요.' },
    { w: 'was',    ko: '~이었어요',     emo: '⏰', ex: 'I was at home.',          exko: '나는 집에 있었어요.' }
  ];

  var QUIZ_LEN = 10;
  var CHEERS = ['잘했어!', '최고야!', '멋져!', '정말 잘했어!', '훌륭해!'];

  /* ============================================================
     유틸
     ============================================================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ============================================================
     소리 — 영어 단어 읽기 (en-US)
     ============================================================ */
  var muted = false;
  var enVoice = null;
  var koVoice = null;
  function loadVoices() {
    var vs = [];
    try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
    enVoice = null; koVoice = null;
    for (var i = 0; i < vs.length; i++) {
      var lg = (vs[i].lang || '').toLowerCase();
      if (!enVoice && /^en[-_]us/i.test(lg)) enVoice = vs[i];
      if (!koVoice && /^ko/i.test(lg)) koVoice = vs[i];
    }
    if (!enVoice) {
      for (var j = 0; j < vs.length; j++) {
        if (!enVoice && /^en/i.test(vs[j].lang || '')) enVoice = vs[j];
      }
    }
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
  }
  function say(text, lang, rate) {
    if (muted) return;
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      u.rate = rate || 0.82;
      u.pitch = 1.05;
      var v = (lang && lang.indexOf('ko') === 0) ? koVoice : enVoice;
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sayWord(w) { say(w, 'en-US', 0.8); }
  function sayKo(text) { say(text, 'ko-KR', 1); }

  var ac = null;
  function actx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(freq, delay, dur, type, vol) {
    var c = actx();
    if (!c) return;
    try {
      var t0 = c.currentTime + (delay || 0);
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.2));
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + (dur || 0.2) + 0.02);
    } catch (e) {}
  }
  function sfxTap() { tone(1180, 0, 0.07, 'sine', 0.045); }
  function sfxOk() { tone(880, 0, 0.1, 'triangle', 0.07); tone(1318, 0.08, 0.16, 'triangle', 0.06); }
  function sfxNo() { tone(320, 0, 0.14, 'sine', 0.045); }
  function sfxWin() { [523, 659, 784, 1046, 1318].forEach(function (f, i) { tone(f, i * 0.09, 0.26, 'triangle', 0.06); }); }

  /* 반짝이 */
  var fx = $('fx'), fxc = fx.getContext('2d');
  var parts = [], raf = null, lastT = 0;
  var GLYPHS = ['⭐', '✨', '💗', '🌟', '🎀', '💛'];
  function sizeFx() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = Math.floor(window.innerWidth * dpr);
    fx.height = Math.floor(window.innerHeight * dpr);
    fx.style.width = window.innerWidth + 'px';
    fx.style.height = window.innerHeight + 'px';
    fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y, count) {
    count = count || 22;
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2, sp = 110 + Math.random() * 240;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 130,
        life: 1, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 8,
        size: 14 + Math.random() * 12, g: GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
      });
    }
    if (!raf) { lastT = 0; raf = window.requestAnimationFrame(fxLoop); }
  }
  function burstEl(el, count) {
    if (!el) { burst(window.innerWidth / 2, window.innerHeight * 0.34, count); return; }
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count);
  }
  function fxLoop(t) {
    var dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    fxc.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      p.life -= dt * 0.72;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fxc.save();
      fxc.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxc.translate(p.x, p.y); fxc.rotate(p.rot);
      fxc.font = p.size + 'px serif'; fxc.textAlign = 'center'; fxc.textBaseline = 'middle';
      fxc.fillText(p.g, 0, 0);
      fxc.restore();
    }
    if (parts.length) raf = window.requestAnimationFrame(fxLoop);
    else { raf = null; fxc.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  window.addEventListener('resize', sizeFx);

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ============================================================
     단어 카드
     ============================================================ */
  function renderCards() {
    var h = '';
    WORDS.forEach(function (o, i) {
      h += '<button class="wcard" type="button" data-i="' + i + '" aria-expanded="false">'
        + '<span class="wrow">'
        + '<span class="wemo" aria-hidden="true">' + o.emo + '</span>'
        + '<span class="wtxt"><span class="wword">' + esc(o.w) + '</span>'
        + '<span class="wko">' + esc(o.ko) + '</span></span>'
        + '<span class="wspk" aria-hidden="true">🔊</span>'
        + '</span>'
        + '<span class="wex">' + esc(o.ex) + '<em>' + esc(o.exko) + '</em></span>'
        + '</button>';
    });
    $('wlist').innerHTML = h;
    $('cardCount').textContent = WORDS.length + '개';
  }

  function onWordCard(card) {
    var i = Number(card.getAttribute('data-i'));
    var o = WORDS[i];
    if (!o) return;
    var isOpen = card.classList.contains('on');
    Array.prototype.forEach.call(document.querySelectorAll('.wcard.on'), function (c) {
      if (c !== card) { c.classList.remove('on'); c.setAttribute('aria-expanded', 'false'); }
    });
    card.classList.toggle('on', !isOpen);
    card.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    sfxTap();
    actx();
    sayWord(o.w);
    if (!isOpen) burstEl(card, 8);
  }

  /* ============================================================
     소리 퀴즈
     ============================================================ */
  var quiz = { pool: [], i: 0, score: 0, answered: false, running: false, mode: 'idle' };
  var advanceTimer = null;

  function clearAdvance() { if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; } }

  function quizStartScreen() {
    clearAdvance();
    quiz.running = false; quiz.mode = 'idle'; quiz.i = 0; quiz.score = 0;
    $('quizBox').innerHTML = '<div class="startbox">'
      + '<div class="ic" aria-hidden="true">🎧</div>'
      + '<h2>소리 듣고 단어 찾기</h2>'
      + '<p>단어를 하나 들려줄게요.<br>4개 중에서 맞는 단어를 골라요!</p>'
      + '<button class="startbtn" type="button" data-act="q-start">시작!</button>'
      + '</div>';
  }

  function startQuiz() {
    actx();
    quiz.pool = shuffle(WORDS).slice(0, QUIZ_LEN);
    quiz.i = 0; quiz.score = 0; quiz.running = true; quiz.answered = false;
    quiz.mode = 'play';
    askQuestion();
  }

  function askQuestion() {
    clearAdvance();
    if (!quiz.running) return;
    if (quiz.i >= quiz.pool.length) { finishQuiz(); return; }
    quiz.answered = false;
    var target = quiz.pool[quiz.i];
    var choices = [target];
    var others = shuffle(WORDS.filter(function (o) { return o.w !== target.w; }));
    for (var k = 0; k < 3 && k < others.length; k++) choices.push(others[k]);
    choices = shuffle(choices);

    var h = '<div class="qtop">'
      + '<span class="qn">' + (quiz.i + 1) + ' / ' + quiz.pool.length + '</span>'
      + '<span class="stars" aria-label="맞힌 개수">⭐ ' + quiz.score + '</span>'
      + '</div>'
      + '<div class="bigear">'
      + '<div class="ic" aria-hidden="true">🔊</div>'
      + '<div class="tx">잘 듣고, 같은 단어를 찾아봐요</div>'
      + '<button class="replay" type="button" data-act="q-replay">🔁 다시 듣기</button>'
      + '</div>'
      + '<div class="opts" id="opts">';
    choices.forEach(function (o) {
      h += '<button class="opt" type="button" data-act="q-pick" data-w="' + esc(o.w) + '">' + esc(o.w) + '</button>';
    });
    h += '</div>';
    $('quizBox').innerHTML = h;
    actx();
    setTimeout(function () { if (quiz.running && quiz.i < quiz.pool.length) sayWord(target.w); }, 220);
  }

  function pickOption(btn) {
    if (!quiz.running || quiz.answered) return;
    var chosen = btn.getAttribute('data-w');
    var target = quiz.pool[quiz.i];
    if (!target) return;
    quiz.answered = true;
    actx();

    if (chosen === target.w) {
      quiz.score += 1;
      btn.classList.add('ok');
      sfxOk();
      burstEl(btn, 20);
      sayKo(pick(CHEERS));
      advanceTimer = setTimeout(function () {
        quiz.i += 1;
        askQuestion();
      }, 1000);
    } else {
      btn.classList.add('bad');
      btn.disabled = true;
      sfxNo();
      Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) {
        b.disabled = true;
        if (b.getAttribute('data-w') === target.w) b.classList.add('hint');
      });
      toast('이건 ' + target.w + '! 다시 들어 봐요 💗');
      advanceTimer = setTimeout(function () {
        sayWord(target.w);
        advanceTimer = setTimeout(function () {
          quiz.i += 1;
          askQuestion();
        }, 1500);
      }, 420);
    }
  }

  function finishQuiz() {
    quiz.running = false;
    quiz.mode = 'done';
    var n = quiz.score, tot = quiz.pool.length;
    var stars = n >= 9 ? '⭐⭐⭐' : (n >= 7 ? '⭐⭐' : (n >= 4 ? '⭐' : '🌱'));
    var msg = n >= 9 ? '정말 대단해요! 거의 다 맞혔어요!' : (n >= 7 ? '아주 잘했어요!' : (n >= 4 ? '좋아요! 한 번 더 해 봐요' : '괜찮아요. 카드로 다시 들어 봐요'));
    $('quizBox').innerHTML = '<div class="result">'
      + '<div class="ic" aria-hidden="true">🎉</div>'
      + '<h2>10문제 끝!</h2>'
      + '<div class="score">' + n + ' / ' + tot + '</div>'
      + '<div style="font-size:26px;line-height:1.2">' + stars + '</div>'
      + '<p>' + esc(msg) + '</p>'
      + '<button class="startbtn" type="button" data-act="q-start">🔁 한 번 더</button>'
      + '</div>';
    sfxWin();
    burst(window.innerWidth / 2, window.innerHeight * 0.3, 50);
    setTimeout(function () { sayKo('잘했어! ' + n + '개 맞혔어.'); }, 300);
  }

  /* ============================================================
     보기 전환
     ============================================================ */
  function setMode(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
      var on = b.getAttribute('data-mode') === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('v-cards').classList.toggle('on', name === 'cards');
    $('v-quiz').classList.toggle('on', name === 'quiz');
    if (name === 'quiz') {
      if (!quiz.running && quiz.mode !== 'done') quizStartScreen();
    } else {
      /* 카드로 돌아가면 퀴즈 음성 멈춤 */
      clearAdvance();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      quiz.running = false;
      if (quiz.mode === 'play') quiz.mode = 'idle';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     이벤트
     ============================================================ */
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && (t.getAttribute('data-mode') || t.getAttribute('data-act') || t.getAttribute('data-i') || t.id === 'snd'))) {
      t = t.parentNode;
    }
    if (!t || t === document) return;

    if (t.id === 'snd') {
      muted = !muted;
      t.textContent = muted ? '🔇' : '🔊';
      t.classList.toggle('off', muted);
      t.setAttribute('aria-pressed', muted ? 'false' : 'true');
      t.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
      if (muted) { try { window.speechSynthesis.cancel(); } catch (err) {} }
      return;
    }
    if (t.getAttribute('data-mode')) { setMode(t.getAttribute('data-mode')); sfxTap(); return; }
    if (t.classList && t.classList.contains('wcard')) { onWordCard(t); return; }

    var act = t.getAttribute('data-act');
    if (!act) return;
    if (act === 'q-start') { startQuiz(); return; }
    if (act === 'q-replay') {
      actx();
      var q = quiz.pool[quiz.i];
      if (q) sayWord(q.w);
      return;
    }
    if (act === 'q-pick') { pickOption(t); return; }
  });

  /* ============================================================
     시작
     ============================================================ */
  sizeFx();
  renderCards();
  setMode('cards');

  /* 목소리 목록은 늦게 도착할 때가 있어 한 번 더 */
  setTimeout(loadVoices, 600);
})();
</script>
