<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfefff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>포켓몬 퀘스트 대시보드</title>
<style>
/* ============================================================
   포켓몬 퀘스트 대시보드 — 단일 파일 / 외부 의존성 0
   ============================================================ */
:root{
  --ink:#1e2a44;
  --ink-2:#43537a;
  --muted:#7b8aa9;
  --line:#e7eefa;
  --paper:#ffffff;
  --yellow:#ffd23f;
  --red:#ff5f6d;
  --red-d:#e0394a;
  --blue:#3fa9ff;
  --green:#2fc98a;
  --green-d:#12a86e;
  --purple:#9a6bff;
  --gold:#ffb300;
  --radius:22px;
  --shadow-soft:0 8px 22px rgba(30,42,68,.10);
  --shadow-pop:0 5px 0 rgba(30,42,68,.13), 0 12px 24px rgba(30,42,68,.10);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:#e9f8ff;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  word-break:keep-all;
  overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:-12%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 8% 6%, #ffeeb0 0 15%, transparent 16%),
    radial-gradient(circle at 94% 4%, #ffd9ec 0 13%, transparent 14%),
    radial-gradient(circle at 88% 62%, #cdeaff 0 20%, transparent 21%),
    radial-gradient(circle at 4% 74%, #d6ffe9 0 17%, transparent 18%),
    linear-gradient(180deg,#bfefff 0%,#e9f9ff 42%,#fff8e6 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.9) 0 1.5px, transparent 2px);
  background-size:26px 26px;
}
#bgball{
  position:fixed;top:-70px;right:-70px;width:230px;height:230px;z-index:-1;
  opacity:.35;transform-origin:50% 50%;animation:spin 60s linear infinite;pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 공통 ---------- */
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{
  width:100%;max-width:560px;margin:0 auto;
  padding:14px 14px calc(26px + var(--safe-b));
}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 12px}
.section-head h2{font-size:17.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.section-head .hint{font-size:12px;color:var(--muted);font-weight:700}
.card{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 상단바 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.78));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:2px solid rgba(30,42,68,.07);
}
.topbar-in{
  max-width:560px;margin:0 auto;padding:9px 14px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:32px;height:32px;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(30,42,68,.2))}
.brand-title{font-size:16.5px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.brand-sub{font-size:10.5px;font-weight:800;color:var(--red);letter-spacing:.18em;text-transform:uppercase}
.topbar .spacer{flex:1}
.icon-btn{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:18px;line-height:1;
  background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 rgba(30,42,68,.07);
  transition:transform .12s, box-shadow .12s, background .12s;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(30,42,68,.07)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.off{opacity:.45}
.parent-btn{border-color:#ffe1a8;background:linear-gradient(180deg,#fffaf0,#fff3d6);width:auto;min-width:38px;padding:0 10px}
.parent-btn .lbl{font-size:11px;font-weight:900;margin-left:1px;white-space:nowrap}

/* ---------- 상단 내비게이션 ---------- */
.nav{border-top:1.5px solid rgba(30,42,68,.06)}
.nav-in{
  max-width:560px;margin:0 auto;padding:5px 8px 6px;
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
}
.nav-b{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-width:0;min-height:44px;padding:3px 2px;border-radius:13px;
  background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 rgba(30,42,68,.06);
  color:var(--ink-2);transition:transform .12s, background .15s, border-color .15s, color .15s;
}
.nav-b .ni{font-size:16px;line-height:1.15;filter:grayscale(.35);opacity:.82;transition:.15s}
.nav-b .nl{font-size:10px;font-weight:900;letter-spacing:-.03em;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-b:active{transform:translateY(2px);box-shadow:0 0 0 rgba(30,42,68,0)}
.nav-b.on{background:linear-gradient(180deg,#fff7dc,#ffedb0);border-color:#f0c64b;color:#7a5200;box-shadow:0 2px 0 rgba(240,198,75,.45)}
.nav-b.on .ni{filter:none;opacity:1;transform:translateY(-1px) scale(1.1)}
.nav-b .nb{
  position:absolute;top:1px;right:1px;min-width:14px;height:14px;border-radius:99px;line-height:1;
  background:var(--red);color:#fff;font-size:8.5px;font-weight:900;display:grid;place-items:center;padding:0 3px;
  border:1.5px solid #fff;
}

/* ---------- 아이 프로필 카드 ---------- */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kid{
  position:relative;text-align:left;height:100%;padding:11px 11px 10px;border-radius:20px;
  background:#fff;border:2.5px solid var(--line);
  box-shadow:0 4px 0 rgba(30,42,68,.08), var(--shadow-soft);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  overflow:hidden;
}
.kid::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
  background:radial-gradient(circle at 85% -10%, var(--tint,#ffd23f) 0 40%, transparent 41%);
}
.kid.is-active{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 7px 0 rgba(30,42,68,.16), 0 14px 26px rgba(30,42,68,.14)}
.kid.is-active .kid-flag{opacity:1;transform:translateY(0)}
.kid-flag{
  position:absolute;top:0;left:50%;transform:translate(-50%,-120%);
  font-size:9.5px;font-weight:900;letter-spacing:.06em;color:#fff;
  background:var(--ink);padding:2px 9px;border-radius:0 0 9px 9px;transition:.2s;
}
.kid-top{display:flex;align-items:center;gap:8px}
.kid-avatar{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:24px;line-height:1;
  background:radial-gradient(circle at 35% 28%, #fff, var(--tint,#ffe9a8) 75%);
  border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(30,42,68,.10);
}
.kid-id{min-width:0;flex:1}
.kid-name{font-size:15px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-lv{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:900;color:#8a5a00;background:linear-gradient(180deg,#ffe98a,#ffd23f);border-radius:7px;padding:1px 6px;margin-top:3px}
.xp{margin-top:9px;height:10px;border-radius:99px;background:#eef3fc;overflow:hidden;border:1px solid #e2eafa;position:relative}
.xp-fill{
  height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);
  background-image:linear-gradient(90deg, rgba(255,255,255,.45) 0 6px, transparent 6px 12px), linear-gradient(90deg, var(--c1,#57c7ff), var(--c2,#9a6bff));
  background-size:12px 100%, 100% 100%;
  animation:stripes 0.8s linear infinite;
}
@keyframes stripes{to{background-position:12px 0, 0 0}}
.xp-txt{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:3px}
.kid-stats{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.stat{
  display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:900;
  background:#f4f8ff;border:1px solid #e6eefc;color:var(--ink-2);
  border-radius:8px;padding:2.5px 6px;line-height:1.1;white-space:nowrap;
}
.stat b{font-weight:900;color:var(--ink)}
.stat.coin{background:linear-gradient(180deg,#fff7dd,#ffefc0);border-color:#ffe09a;color:#8a5a00}
.stat.streak{background:linear-gradient(180deg,#fff0e8,#ffe1d2);border-color:#ffc9b4;color:#a8441f}
.stat.dex{background:linear-gradient(180deg,#eef4ff,#e2ecff);border-color:#cfe0ff;color:#2a4d8f}

/* ---------- 오늘 카드 ---------- */
.today{
  margin-top:12px;padding:15px 16px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#ffffff 0%,#f6fbff 60%,#fffdf4 100%);
  border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-pop);
}
.today-txt{flex:1;min-width:0}
.today-date{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.02em}
.today-title{font-size:18px;font-weight:900;letter-spacing:-.03em;margin-top:3px}
.today-sub{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.4}
.ring{position:relative;width:70px;height:70px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);width:70px;height:70px;display:block}
.ring .track{fill:none;stroke:#e8f0fc;stroke-width:9}
.ring .bar{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;font-size:14px;font-weight:900}
.ring-lbl small{font-size:9px;color:var(--muted);font-weight:800}

/* ---------- 퀘스트 ---------- */
.slot{margin-top:14px}
.slot-head{display:flex;align-items:center;gap:8px;margin:0 4px 10px}
.slot-ico{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 rgba(30,42,68,.06)}
.slot-name{font-size:15.5px;font-weight:900;letter-spacing:-.02em}
.slot-count{font-size:12px;font-weight:900;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:1px 8px}
.slot-note{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 7px;padding-left:2px}
.slot-line{flex:1;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,#dfe9f8 0 6px,transparent 6px 11px)}
.quests{display:grid;gap:10px}
@media (min-width:760px){.quests{grid-template-columns:1fr 1fr}}
.quest{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;border-radius:20px;background:#fff;border:2px solid var(--line);
  box-shadow:0 3px 0 rgba(30,42,68,.07);
  transition:transform .13s ease, box-shadow .13s ease, border-color .13s, background .18s;
  overflow:hidden;
}
.quest:active{transform:scale(.977)}
.quest .q-ico{
  width:43px;height:43px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(180deg,#f7fbff,#eef5ff);border:2px solid #eaf1fd;
}
.quest .q-body{flex:1;min-width:0}
.quest .q-title{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.32}
.quest .q-rewards{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.quest .r{
  font-size:11.5px;font-weight:900;border-radius:8px;padding:2px 7px;line-height:1.2;
  background:#fff8e0;color:#8a5a00;border:1px solid #ffe4a3;
}
.quest .r.c{background:#fff1e8;color:#a8441f;border-color:#ffd7c2}
.quest .check{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  border:2.5px dashed #cddcf3;color:transparent;font-size:17px;font-weight:900;
  transition:.2s;
}
.quest.is-done{
  background:linear-gradient(135deg,#f1fff8,#e8fff3);border-color:#b9eed6;
  box-shadow:0 3px 0 rgba(18,168,110,.12);
}
.quest.is-done .q-title{color:#4a6b60}
.quest.is-done .q-ico{background:linear-gradient(180deg,#effff8,#e2fbef);border-color:#c4f0dc}
.quest.is-done .check{background:var(--green);border:2.5px solid var(--green);color:#fff;box-shadow:0 0 0 4px rgba(47,201,138,.14)}
.quest.is-done .q-rewards{opacity:.5}
.quest.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.035) rotate(-.6deg)}100%{transform:scale(1)}}
.quest .done-flag{
  position:absolute;top:8px;right:8px;font-size:9px;font-weight:900;color:#0e8a5c;
  opacity:0;transform:translateY(-4px);transition:.25s;pointer-events:none;
}
.quest.is-done .done-flag{opacity:1;transform:none}
.empty{
  padding:20px 14px;text-align:center;font-size:13.5px;font-weight:700;color:var(--muted);
  background:#fbfdff;border:2px dashed #dbe6f7;border-radius:18px;
}
.bonus-note{
  margin-top:12px;display:block;padding:10px 12px;border-radius:16px;
  background:linear-gradient(90deg,#fff9e6,#fff3d0);border:2px dashed #ffd98a;
  font-size:12.5px;font-weight:800;color:#8a5a00;line-height:1.6;
}
.bonus-note b{color:#6f4300}

/* ---------- 상점 / 뽑기 ---------- */
.gacha{
  position:relative;padding:16px;border-radius:24px;overflow:hidden;
  background:linear-gradient(150deg,#2b3557 0%,#3b2f6b 45%,#642c53 100%);
  border:2.5px solid #171f36;box-shadow:var(--shadow-pop);color:#fff;
}
.gacha::before{
  content:"";position:absolute;inset:-40% -10% auto auto;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,63,.35),transparent 62%);animation:glow 4s ease-in-out infinite;
}
@keyframes glow{50%{opacity:.45;transform:scale(1.08)}}
.gacha h3{font-size:16.5px;font-weight:900;letter-spacing:-.02em;position:relative}
.gacha p{font-size:12.5px;color:#cfd8f3;margin-top:4px;position:relative;line-height:1.45}
.gacha-main{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative}
.ball-btn{
  width:96px;height:96px;flex:0 0 auto;border-radius:50%;position:relative;
  display:grid;place-items:center;transition:transform .15s;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));
}
.ball-btn svg{width:96px;height:96px;animation:bob 2.6s ease-in-out infinite}
.ball-btn:active{transform:scale(.94)}
.ball-btn:active svg{animation:wobble .5s ease}
.ball-btn:disabled{opacity:.55;filter:grayscale(.5) drop-shadow(0 6px 10px rgba(0,0,0,.3));cursor:not-allowed}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.gacha-side{flex:1;min-width:0}
.gacha-price{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:900;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:99px}
.gacha-owned{font-size:11.5px;color:#cfd8f3;margin-top:8px;font-weight:700}
.pull-row{display:flex;gap:6px;margin-top:10px}
.pull-slot{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.10);
  border:1.5px dashed rgba(255,255,255,.30);display:grid;place-items:center;font-size:15px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:900;letter-spacing:-.01em;
  padding:12px 16px;border-radius:15px;min-height:46px;border:2.5px solid var(--ink);
  background:#fff;box-shadow:0 4px 0 rgba(30,42,68,.18);
  transition:transform .12s, box-shadow .12s;white-space:nowrap;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,42,68,.18)}
.btn:disabled{opacity:.45;box-shadow:none;transform:none;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#ffe27a,#ffc61e);border-color:#8a5a00;color:#543400;box-shadow:0 4px 0 #c99300}
.btn-red{background:linear-gradient(180deg,#ff8a94,#ff5f6d);border-color:#a01f2c;color:#fff;box-shadow:0 4px 0 #b82936}
.btn-green{background:linear-gradient(180deg,#6ee7b7,#2fc98a);border-color:#0e7f56;color:#053d2a;box-shadow:0 4px 0 #0d8a5e}
.btn-ghost{background:#f6f9ff;box-shadow:0 3px 0 rgba(30,42,68,.08);border-color:#dbe6f7}
.btn-sm{font-size:12.5px;padding:8px 12px;border-radius:12px;min-height:38px;box-shadow:0 3px 0 rgba(30,42,68,.14)}
.btn-block{width:100%}
.rewards{display:grid;gap:10px}
.reward{
  display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:13px 14px;border-radius:20px;
  background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 rgba(30,42,68,.07);
}
.reward .rw-ico{
  width:47px;height:47px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(180deg,#fff8e8,#ffefc9);border:2px solid #ffe1a3;
}
.reward .rw-body{flex:1;min-width:0}
.reward .rw-title{font-size:15px;font-weight:900;letter-spacing:-.02em}
.reward .rw-note{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.35}
.reward .rw-cost{font-size:12px;font-weight:900;color:#8a5a00;background:#fff5d6;border:1px solid #ffe19a;border-radius:8px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px;margin-top:5px}
.reward.wk{border-color:#cfe0ff;background:linear-gradient(135deg,#ffffff,#f4f9ff)}
.reward.wk .rw-ico{background:linear-gradient(180deg,#eef5ff,#e2ecff);border-color:#cfe0ff}
.rw-tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:900;color:#1f4fb8;background:#e8f0ff;border:1.5px solid #bcd4ff;border-radius:7px;padding:1px 6px;vertical-align:2px;white-space:nowrap}
.tk-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:900;color:#1f4fb8;background:#e8f0ff;border:1.5px solid #bcd4ff;border-radius:6px;padding:0 5px}
.chk-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--ink-2);margin:2px 0 10px;cursor:pointer}
.chk-row input{width:20px;height:20px;accent-color:#3fa9ff;flex:0 0 auto}
.tickets{display:grid;gap:10px}
.ticket{
  position:relative;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(135deg,#fffdf5,#fff6e0);
  border:2px dashed #f0cf8a;box-shadow:0 3px 0 rgba(255,179,0,.10);
}
.ticket::before,.ticket::after{
  content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#e9f8ff;
  border:2px solid #f0cf8a;top:50%;transform:translateY(-50%);
}
.ticket::before{left:-8px;border-left-color:transparent}
.ticket::after{right:-8px;border-right-color:transparent}
.ticket.used{opacity:.5;filter:grayscale(.4)}
.ticket .tk-ico{font-size:25px;flex:0 0 auto}
.ticket .tk-body{flex:1;min-width:0}
.ticket .tk-title{font-size:14px;font-weight:900}
.ticket .tk-code{font-size:11px;font-weight:800;color:#a8802f;letter-spacing:.06em;margin-top:2px}
.ticket .tk-state{font-size:11px;font-weight:900;color:#0e8a5c}

/* ---------- 도감 ---------- */
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:420px){.dex-grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:760px){.dex-grid{grid-template-columns:repeat(6,1fr)}}
.dex-item{
  position:relative;aspect-ratio:1/1;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:6px 4px 5px;overflow:hidden;
  background:linear-gradient(180deg,#ffffff,#f4f9ff);border:2px solid var(--line);
  box-shadow:0 3px 0 rgba(30,42,68,.06);
}
.dex-item .art{width:100%;height:auto;max-height:74%;display:block}
.dex-item .nm{font-size:10.5px;font-weight:900;letter-spacing:-.02em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dex-item .rar{position:absolute;top:4px;left:4px;font-size:8.5px;font-weight:900;padding:1px 5px;border-radius:5px;letter-spacing:.02em}
.rar.common{background:#eef3fb;color:#6b7c9c}
.rar.rare{background:#e8f0ff;color:#2a5bd7}
.rar.legend{background:linear-gradient(90deg,#ffe082,#ffb300);color:#5a3a00}
.dex-item.locked{background:linear-gradient(180deg,#f7faff,#eef4fd)}
.dex-item.locked .art{filter:brightness(0) saturate(0);opacity:.13}
.dex-item.locked .nm{color:#b6c2d8}
.dex-item.is-new{animation:pop .6s ease}
.dex-item.legendary{background:linear-gradient(160deg,#fff9e0,#fff2c9);border-color:#ffdf8a;box-shadow:0 4px 0 rgba(255,179,0,.18), 0 0 20px rgba(255,210,63,.25) inset}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:900;
  padding:6px 10px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--muted);
  box-shadow:0 2px 0 rgba(30,42,68,.06);
}
.badge.on{background:linear-gradient(180deg,#fffbe8,#fff2c0);border-color:#ffd979;color:#7a5200;box-shadow:0 2px 0 rgba(255,179,0,.2)}
.badge .b-ico{font-size:13px;filter:grayscale(1);opacity:.5}
.badge.on .b-ico{filter:none;opacity:1}

/* ---------- 모달 ---------- */
.backdrop{
  position:fixed;inset:0;z-index:80;background:rgba(20,28,46,.5);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
  padding:0;animation:fade .18s ease;
}
@media (min-width:560px){.backdrop{align-items:center;padding:20px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:440px;background:#fff;border:2.5px solid var(--ink);
  border-radius:26px 26px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  box-shadow:0 -10px 40px rgba(20,28,46,.3);
  animation:sheetUp .28s cubic-bezier(.2,.9,.25,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
@media (min-width:560px){.modal{border-radius:26px;padding-bottom:16px;max-height:86vh}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.modal-head h3{font-size:17.5px;font-weight:900;letter-spacing:-.03em;flex:1}
.modal-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f4f8ff;border:2px solid var(--line);font-size:15px;font-weight:900;color:var(--muted)}
.modal-body{font-size:14px;line-height:1.5;color:var(--ink-2)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1}

/* PIN */
.pin-dots{display:flex;gap:12px;justify-content:center;margin:6px 0 14px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#e9effa;border:2px solid #d3def1;transition:.15s}
.pin-dot.on{background:var(--ink);border-color:var(--ink);transform:scale(1.12)}
.pin-msg{text-align:center;font-size:12px;font-weight:800;color:var(--red);height:16px;margin-bottom:6px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto}
.pin-key{
  height:56px;border-radius:16px;background:#fff;border:2px solid var(--line);
  box-shadow:0 3px 0 rgba(30,42,68,.08);font-size:21px;font-weight:900;transition:.1s;
}
.pin-key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(30,42,68,.08);background:#f4f8ff}
.pin-key.wide{font-size:14px;color:var(--muted)}
.pin-hint{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}
.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* 보호자 시트 */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:900;color:var(--ink-2)}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);
  padding:11px 13px;border-radius:13px;border:2px solid var(--line);background:#fbfdff;width:100%;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(63,169,255,.14)}
.field select{background-image:linear-gradient(45deg,transparent 50%,#7b8aa9 50%),linear-gradient(135deg,#7b8aa9 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1.6fr .8fr .8fr auto;gap:6px;align-items:center}
.p-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:14px;background:#fbfdff;margin-bottom:7px}
.p-row .p-main{min-width:0}
.p-row .p-name{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .p-meta{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.p-row .p-acts{display:flex;gap:5px}
.mini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:15px;border:2px solid var(--line);background:#fff;box-shadow:0 2px 0 rgba(30,42,68,.06)}
.mini:active{transform:translateY(1px)}
.mini.del{border-color:#ffd3d7;background:#fff5f6;color:#c02a3a}
.sub-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.sub-head h4{font-size:13px;font-weight:900;margin:0;letter-spacing:-.02em}
.note{
  font-size:12px;font-weight:700;color:#7a5a1f;background:#fff9e6;border:2px dashed #ffd98a;
  border-radius:13px;padding:9px 11px;line-height:1.45;margin-top:10px;
}
.row-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.import-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translate(-50%,20px);
  z-index:90;pointer-events:none;opacity:0;transition:.25s cubic-bezier(.2,.9,.25,1);
  background:rgba(30,42,68,.95);color:#fff;font-size:13px;font-weight:800;
  padding:11px 17px;border-radius:99px;box-shadow:0 8px 20px rgba(0,0,0,.25);
  max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.modal-open #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px)}
body.modal-open #toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}

/* 뽑기 결과 */
.reveal{text-align:center}
.reveal-stage{
  position:relative;width:190px;height:190px;margin:2px auto 6px;display:grid;place-items:center;
}
.reveal-stage .rays{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(255,210,63,.55) 0 8deg, transparent 8deg 24deg);
  animation:spin 9s linear infinite;opacity:.8;
}
.reveal-stage .disc{
  position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%, #fff 0 18%, #fff6d6 45%, #ffe28a 100%);
  border:3px solid #ffc61e;box-shadow:0 0 0 8px rgba(255,210,63,.18), inset 0 -8px 20px rgba(255,179,0,.2);
}
.reveal-stage svg{position:relative;width:150px;height:150px;animation:revealIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes revealIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.reveal h3{font-size:20px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.reveal .rar-tag{display:inline-block;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:99px;margin-top:6px}
.reveal .desc{font-size:12px;font-weight:700;color:var(--muted);margin-top:8px;line-height:1.5}
.reveal .new-tag{
  display:inline-block;margin-top:8px;font-size:11px;font-weight:900;color:#0e7a52;
  background:#e6fff4;border:1.5px solid #a9edcd;border-radius:99px;padding:3px 10px;
}

/* 레벨업 */
.levelup{text-align:center;padding:6px 0}
.levelup .lv-big{
  font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(180deg,#ffd23f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(30,42,68,.15));
}
.levelup .lv-sub{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:8px}

/* ---------- 오늘 달성률 / 90% ---------- */
.big-pct{
  font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(180deg,#3fa9ff,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.big-pct.hit{background:linear-gradient(180deg,#ffcf3f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.goal{margin-top:20px}
.goal-bar{position:relative;height:12px;border-radius:99px;background:#eef3fc;border:1px solid #e2eafa}
.goal-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#57c7ff,#9a6bff);transition:width .5s}
.goal-bar .goal-mark{position:absolute;left:90%;top:-4px;width:2px;height:20px;background:#ff5f6d;border-radius:2px}
.goal-bar .goal-mark::after{content:"90%";position:absolute;top:-15px;left:50%;transform:translateX(-46%);font-size:9.5px;font-weight:900;color:#ff5f6d}
.goal-note{margin-top:18px;font-size:12px;font-weight:900;color:#7b8aa9}
.goal-note.hit{color:#0e8a5c}
.rw-cond{
  flex:1 0 100%;margin-top:4px;padding-top:8px;border-top:1.5px dashed #d3e2f8;
  font-size:12px;font-weight:900;color:#5d6f92;line-height:1.45;
}
.rw-cond.on{color:#0e8a5c;border-top-color:#b9eed6}

/* ---------- 오늘의 배움 카드 ---------- */
.learn{
  position:relative;overflow:hidden;margin-top:10px;padding:12px 13px;border-radius:20px;
  border:2px solid var(--line);box-shadow:var(--shadow-soft);background:#fff;
}
.learn::after{
  content:"";position:absolute;right:-26px;top:-32px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,var(--lt,#ffe9a8),transparent 70%);opacity:.55;pointer-events:none;
}
.learn-head{display:flex;align-items:center;gap:7px;margin-bottom:7px;position:relative;z-index:1}
.learn-ic{font-size:16px}
.learn-t{font-size:13px;font-weight:900;color:var(--ink-2);letter-spacing:-.01em}
.learn-sub{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);background:#f4f7fd;border:1px solid #e7eefa;border-radius:99px;padding:1.5px 8px;white-space:nowrap}
.proverb{background:linear-gradient(135deg,#fffdf7,#fff3e4);border-color:#ffe2bd}
.pv-en{
  font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:700;line-height:1.45;
  color:#3a2d17;position:relative;z-index:1;letter-spacing:.002em;
}
.pv-ko{font-size:12.5px;font-weight:700;color:#8a6b3a;margin-top:7px;line-height:1.55;position:relative;z-index:1}
.hanja{background:linear-gradient(135deg,#f8fcff,#eaf3ff);border-color:#cfe4ff}
.hj-main{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hj-char{
  font-size:46px;font-weight:900;line-height:1;color:#1e2a44;flex:0 0 auto;
  font-family:"Noto Serif KR","Nanum Myeongjo",serif;text-shadow:0 2px 0 rgba(63,169,255,.18);
}
.hj-info{flex:1;min-width:0}
.hj-read{font-size:17px;font-weight:900;letter-spacing:-.02em}
.hj-mean{font-size:11.5px;font-weight:800;color:var(--muted);margin-top:2px}
.hj-ex{font-size:12px;font-weight:800;color:#2a5bd7;margin-top:6px;line-height:1.45}
.ring-lbl small{font-size:10px;color:var(--muted);font-weight:800}
.ring-lbl b{font-size:16px;font-weight:900}

/* ---------- 파트너 / 진화 ---------- */
.partner{
  position:relative;margin-top:12px;padding:12px 13px;display:flex;gap:12px;align-items:center;
  border-radius:22px;border:2.5px solid var(--ink);box-shadow:var(--shadow-pop);overflow:hidden;
  background:linear-gradient(135deg,#ffffff 0%,#fffaf0 52%,#ffeede 100%);
}
.partner::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.35),transparent 65%)}
.partner-art{
  width:88px;height:88px;flex:0 0 auto;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 30%,#fff,#fff0d8 72%);border:2px solid rgba(30,42,68,.12);
  box-shadow:inset 0 -7px 14px rgba(255,179,0,.20);z-index:1;
}
.partner-art.st3{box-shadow:inset 0 -7px 14px rgba(255,179,0,.3), 0 0 0 4px rgba(255,210,63,.25)}
.partner-art svg{width:74px;height:74px;animation:bob 3.6s ease-in-out infinite}
.p-badge{
  position:absolute;right:-3px;bottom:-3px;width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;font-size:12.5px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#a9c9f5,#6f93cf);border:2px solid var(--ink);
  box-shadow:0 2px 0 rgba(30,42,68,.18);z-index:2;
}
.p-badge.s2{background:linear-gradient(180deg,#ffdc6b,#f0a500);color:#5a3a00}
.p-badge.s3{background:linear-gradient(180deg,#ff9ec4,#e8455f);color:#fff;box-shadow:0 0 0 3px rgba(255,214,63,.45),0 2px 0 rgba(30,42,68,.18)}
.partner-info{flex:1;min-width:0;z-index:1}
.partner-name{font-size:16.5px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.partner-tag{font-size:10px;font-weight:900;color:#fff;background:var(--ink);padding:1.5px 7px;border-radius:99px}
.partner-desc{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.4}
.evo-bar{margin-top:8px;height:8px;border-radius:99px;background:#f1f4fb;overflow:hidden;border:1px solid #e6ecf8}
.evo-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd23f,#ff8a3d);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.evo-note{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--muted);margin-top:3px}
.evo-stages{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.evo-stage{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:900;padding:1.5px 6px;border-radius:99px;background:#f4f7fd;border:1.5px solid #e7eefa;color:#9aa8c2}
.evo-stage.on{background:#fff5d6;border-color:#ffd98a;color:#8a5a00}
.evo-stage.now{background:linear-gradient(180deg,#ffd23f,#ffb300);border-color:#c99300;color:#4a3000}

/* ---------- 마을 ---------- */
.village{
  position:relative;max-width:520px;margin:0 auto;border-radius:24px;overflow:hidden;border:2.5px solid var(--ink);
  box-shadow:var(--shadow-pop);
  background:linear-gradient(180deg,#cdeeff 0%,#e9f8ff 13%,#dcf5c6 14%,#c2ecaa 100%);
}
.village .v-sun{position:absolute;top:4px;right:12px;font-size:19px;z-index:1;animation:spin 24s linear infinite;transform-origin:50% 50%}
.village .v-cloud{position:absolute;top:5px;left:8px;font-size:17px;opacity:.9;z-index:1;animation:drift 30s linear infinite}
.village .v-cloud.b{top:2px;left:46%;font-size:14px;animation-duration:40s;animation-delay:-8s}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(180px)}}
.v-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;aspect-ratio:1/1;padding:8px}
.cell{position:relative;display:grid;place-items:center;border-radius:14px;transition:.15s}
.cell.empty{border:1.5px dashed rgba(30,42,68,.14);background:rgba(255,255,255,.20)}
.cell.empty::after{content:"빈 터";font-size:8px;font-weight:800;color:rgba(30,42,68,.28)}
.cell .bld{font-size:31px;line-height:1;filter:drop-shadow(0 4px 3px rgba(30,42,68,.22));animation:buildIn .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes buildIn{from{transform:scale(.2) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.cell .bld-name{position:absolute;bottom:0;font-size:7.5px;font-weight:900;color:#2c4a2a;background:rgba(255,255,255,.78);padding:0 4px;border-radius:5px;white-space:nowrap}
.v-critter{position:absolute;width:38px;height:38px;z-index:3;pointer-events:none;animation:hop 3.2s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(30,42,68,.18))}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.build-list{display:grid;gap:8px}
@media (min-width:700px){.build-list{grid-template-columns:1fr 1fr}}
.build{
  display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:16px;background:#fff;
  border:2px solid var(--line);box-shadow:0 3px 0 rgba(30,42,68,.06);
}
.build.built{background:linear-gradient(135deg,#f4fff9,#e9fff3);border-color:#bfeeda}
.build .bd-ico{width:43px;height:43px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(180deg,#f6fbff,#eaf3ff);border:2px solid #e9f1fd}
.build .bd-body{flex:1;min-width:0}
.build .bd-name{font-size:13.5px;font-weight:900;letter-spacing:-.02em}
.build .bd-desc{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px;line-height:1.3}
.build .bd-cost{font-size:11.5px;font-weight:900;color:#8a5a00;background:#fff5d6;border:1px solid #ffe19a;border-radius:7px;padding:1px 6px;display:inline-block;margin-top:3px}

/* ---------- 응원 메시지 ---------- */
.cheers{display:grid;gap:9px}
.cheer{
  position:relative;display:flex;gap:10px;padding:13px 14px;border-radius:18px;background:#fff;
  border:2px solid var(--line);box-shadow:0 3px 0 rgba(30,42,68,.06);animation:riseIn .4s ease;
}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cheer .c-av{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:19px;background:linear-gradient(180deg,#fff1e2,#ffe3cd);border:2px solid #fff;box-shadow:0 2px 6px rgba(30,42,68,.12)}
.cheer .c-body{flex:1;min-width:0}
.cheer .c-who{font-size:13px;font-weight:900}
.cheer .c-when{font-size:10.5px;color:var(--muted);font-weight:700;margin-left:4px}
.cheer .c-txt{font-size:14px;font-weight:700;line-height:1.5;margin-top:3px;color:var(--ink-2);word-break:keep-all}
.heart-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:#c02a3a;background:#fff5f6;border:1.5px solid #ffd3d7;border-radius:99px;padding:4px 9px;margin-top:7px;transition:.15s}
.heart-btn:active{transform:scale(.94)}
.heart-btn.on{background:#ffe7ea;border-color:#ffb3bc;box-shadow:0 0 0 3px rgba(255,95,109,.10)}
.cheer-form{padding:12px;border-radius:18px;background:linear-gradient(135deg,#fffdf6,#fff4e2);border:2px solid #ffe3b0}
.cheer-form .field{margin-bottom:8px}
.cheer-form textarea{min-height:64px;resize:vertical;line-height:1.45}
.cheer-form textarea,.cheer-form select{background:#fff}

/* 스팬이 인라인으로 무너지지 않도록 */
.xp,.xp-fill{display:block}
.kid-id,.kid-name{display:block}
.q-body,.q-title{display:block}
.reward .rw-title,.reward .rw-note{display:block}
.ticket .tk-title,.ticket .tk-code{display:block}
.build .bd-name,.build .bd-desc{display:block}
.cheer .c-who,.cheer .c-when{display:inline}
.p-row .p-name,.p-row .p-meta{display:block}

/* 하루 구분 / 세그먼트 */
.day-tag{font-size:10.5px;font-weight:900;border-radius:99px;padding:2px 8px;background:#eafff5;color:#0e8a5c;border:1.5px solid #b9eed6;white-space:nowrap}
.day-tag.off{background:#f4f6fb;color:#9aa8c2;border-color:#e3e9f5}
.quest.other{background:#fdfefe}
.kid-grade{font-size:11px;font-weight:800;color:var(--muted);margin-left:3px}
.seg{display:flex;gap:6px;background:#f2f6fd;padding:4px;border-radius:15px;margin-bottom:10px;border:1.5px solid #e7eefa}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:13px;font-weight:900;color:#7b8aa9;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,42,68,.12)}

.evo-from{width:74px;height:74px;flex:0 0 auto;opacity:.85;filter:grayscale(.35)}
.evo-arrow{font-size:22px;font-weight:900;color:#c99300;animation:pulseArrow 1.1s ease-in-out infinite}
@keyframes pulseArrow{50%{transform:translateX(3px) scale(1.12)}}
label.btn{cursor:pointer}

/* ---------- 홈 히어로 (오늘 날짜) ---------- */
.hero{
  position:relative;margin-top:12px;padding:17px 16px 15px;border-radius:26px;overflow:hidden;
  background:linear-gradient(140deg,#2b3557 0%,#3a4a86 46%,#6a4bb5 100%);
  border:2.5px solid #1a2340;box-shadow:var(--shadow-pop);color:#fff;
}
.hero::before{
  content:"";position:absolute;right:-46px;top:-62px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,63,.45),transparent 66%);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;
  background-image:radial-gradient(circle at 50% 50%, rgba(255,255,255,.75) 0 1.2px, transparent 2px);
  background-size:22px 22px;
}
.hero-in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero-chip{font-size:11px;font-weight:900;background:var(--yellow);color:#5a3a00;border-radius:99px;padding:2px 9px;letter-spacing:.02em}
.hero-wd{font-size:11.5px;font-weight:900;color:#cfd8f3;letter-spacing:.01em}
.hero-date{font-size:32px;font-weight:900;letter-spacing:-.05em;line-height:1.08;margin-top:8px}
.hero-date small{font-size:15px;font-weight:900;color:#ffd86b;margin-left:5px;letter-spacing:-.02em}
.hero-sub{font-size:12.5px;font-weight:800;color:#cfd8f3;margin-top:7px;line-height:1.45}
.hero-bars{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.hb{display:flex;align-items:center;gap:8px}
.hb-name{font-size:11.5px;font-weight:900;width:58px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-bar{flex:1;min-width:0;height:8px;border-radius:99px;background:rgba(255,255,255,.20);overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd23f,#ff8a3d);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hb-pct{font-size:11px;font-weight:900;color:#ffd86b;width:34px;text-align:right;flex:0 0 auto}

/* ---------- 홈 아이 현황 카드 ---------- */
.pcards{display:grid;gap:10px}
@media (min-width:560px){.pcards{grid-template-columns:1fr 1fr}}
.pcard{
  position:relative;display:block;width:100%;text-align:left;padding:12px 13px 11px;border-radius:22px;
  background:linear-gradient(150deg,#ffffff,#f7fbff);border:2.5px solid var(--pc-line,#e7eefa);
  box-shadow:0 4px 0 rgba(30,42,68,.08), var(--shadow-soft);overflow:hidden;
  transition:transform .14s, box-shadow .14s;
}
.pcard:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(30,42,68,.08), var(--shadow-soft)}
.pcard::after{
  content:"";position:absolute;right:-36px;top:-48px;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,var(--pc-tint,#ffe9a8),transparent 70%);opacity:.8;pointer-events:none;
}
.pc-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.pc-art{
  position:relative;width:64px;height:64px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,#fff,#fff0d8 74%);border:2px solid rgba(30,42,68,.12);
  box-shadow:inset 0 -6px 12px rgba(255,179,0,.18);
}
.pc-art svg{width:54px;height:54px}
.pc-art .p-badge{width:23px;height:23px;font-size:11px;right:-2px;bottom:-2px}
.pc-id{flex:1;min-width:0}
.pc-name{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden}
.pc-name .g{font-size:11px;font-weight:800;color:var(--muted);flex:0 0 auto}
.pc-mon{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-lv{display:inline-flex;font-size:11px;font-weight:900;color:#8a5a00;background:linear-gradient(180deg,#ffe98a,#ffd23f);border-radius:7px;padding:1px 6px;margin-top:5px}
.pc-pct{flex:0 0 auto;text-align:center;min-width:52px;z-index:1}
.pc-pct b{display:block;font-size:21px;font-weight:900;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#3fa9ff,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pc-pct.hit b{background:linear-gradient(180deg,#ffcf3f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.pc-pct small{display:block;font-size:9.5px;font-weight:800;color:var(--muted);margin-top:2px}
.pc-prog{display:block;margin-top:12px}
.pc-prog .goal-bar{display:block}
.pc-prog .goal-mark::after,.kh-goal .goal-mark::after{content:none}
.pc-tline{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:var(--muted);margin-top:5px}
.pc-goal{font-size:10px;font-weight:900;color:#ff5f6d;white-space:nowrap}
.pc-tline b{color:var(--ink-2)}
.pcard .xp{margin-top:11px}
.pcard .kid-stats{margin-top:9px}
.pc-foot{display:block;margin-top:10px;font-size:11.5px;font-weight:900;color:#2a5bd7;text-align:right}
.pc-foot span{display:inline-block;transition:transform .15s}
.pcard:active .pc-foot span{transform:translateX(3px)}

/* ---------- 아이 페이지 헤더 ---------- */
.kid-head{
  position:relative;margin-top:12px;padding:14px 15px 13px;border-radius:24px;overflow:hidden;
  background:linear-gradient(135deg,#ffffff 0%,#f6fbff 58%,#fffdf4 100%);
  border:2.5px solid var(--ink);box-shadow:var(--shadow-pop);
}
.kid-head::after{
  content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,var(--tint,#ffe9a8),transparent 68%);opacity:.6;pointer-events:none;
}
.kh-top{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.kh-av{
  width:52px;height:52px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:27px;line-height:1;
  background:radial-gradient(circle at 35% 28%,#fff,var(--tint,#ffe9a8) 78%);border:2px solid var(--ink);
  box-shadow:inset 0 -4px 8px rgba(30,42,68,.10);
}
.kh-id{flex:1;min-width:0}
.kh-name{display:flex;align-items:baseline;gap:5px;font-size:19px;font-weight:900;letter-spacing:-.03em}
.kh-name .g{font-size:11.5px;font-weight:800;color:var(--muted)}
.kh-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.kh-meta span{
  font-size:11px;font-weight:900;color:var(--ink-2);background:#f4f8ff;border:1px solid #e6eefc;
  border-radius:7px;padding:1px 6px;line-height:1.5;
}
.kh-pct{flex:0 0 auto;text-align:center}
.kh-pct b{display:block;font-size:23px;font-weight:900;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#3fa9ff,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.kh-pct.hit b{background:linear-gradient(180deg,#ffcf3f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.kh-pct small{display:block;font-size:9.5px;font-weight:800;color:var(--muted);margin-top:2px}
.kh-goal{position:relative;z-index:1;margin-top:13px}
.kh-note{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:900;color:#7b8aa9;margin-top:11px}
.kh-note.hit{color:#0e8a5c}
.kh-sub{position:relative;z-index:1;font-size:12px;font-weight:800;color:var(--muted);margin-top:9px}

/* ---------- 가족 톡방 ---------- */
.chat{
  padding:12px 12px 2px;border-radius:22px;
  background:linear-gradient(180deg,#f7fbff,#eef6ff);border:2px solid #e3edfb;
  box-shadow:inset 0 2px 8px rgba(30,42,68,.04);
}
.chat-empty{text-align:center;font-size:13px;font-weight:700;color:var(--muted);line-height:1.6;padding:16px 8px 20px}
.msg{display:flex;gap:8px;align-items:flex-start;margin-bottom:11px;animation:riseIn .3s ease}
.m-av{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;
  background:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(30,42,68,.12);
}
.msg.mom .m-av{background:linear-gradient(180deg,#ffe6ef,#ffc9dd)}
.msg.dad .m-av{background:linear-gradient(180deg,#e6f1ff,#c9e1ff)}
.msg.k1 .m-av{background:linear-gradient(180deg,#fff1d8,#ffe0b0)}
.msg.k2 .m-av{background:linear-gradient(180deg,#e2fbef,#c1f0da)}
.m-body{min-width:0;max-width:calc(100% - 44px)}
.m-who{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:var(--ink-2);margin:0 0 3px 2px}
.m-who .t{font-size:10px;font-weight:700;color:#9aa8c2}
.bubble{
  display:block;padding:9px 12px;border-radius:5px 16px 16px 16px;font-size:13.5px;font-weight:700;line-height:1.5;
  color:var(--ink);background:#fff;border:2px solid var(--m-line,#e7eefa);
  box-shadow:0 2px 0 rgba(30,42,68,.05);word-break:keep-all;
}
.msg.mom .bubble{background:linear-gradient(140deg,#fff7fa,#ffe9f0);border-color:#ffd3e2}
.msg.dad .bubble{background:linear-gradient(140deg,#f6faff,#e6f1ff);border-color:#cfe2ff}
.msg.k1 .bubble{background:linear-gradient(140deg,#fffcf5,#ffeed6);border-color:#ffdcae}
.msg.k2 .bubble{background:linear-gradient(140deg,#f4fffb,#e2fbef);border-color:#bdeed8}
.bubble .b-line{display:block}
.bubble .heart-btn{display:inline-flex;margin-top:7px}
.chat-form{
  margin-top:10px;padding:11px 11px 9px;border-radius:20px;background:#fff;
  border:2px solid var(--line);box-shadow:var(--shadow-soft);
}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:#7b8aa9;
  background:#f4f8ff;border:2px solid #e7eefa;border-radius:99px;padding:4px 9px;transition:.15s;
}
.chip.on{color:#5a3a00;background:linear-gradient(180deg,#fff6d8,#ffeeb4);border-color:#f0c64b;transform:translateY(-1px)}
.chat-row{display:flex;gap:7px;align-items:flex-end}
.chat-row textarea{
  flex:1;min-width:0;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);
  padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:#fbfdff;
  resize:none;min-height:46px;max-height:110px;line-height:1.45;
}
.chat-row textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(63,169,255,.14)}
.chat-send{
  width:48px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(180deg,#ffe27a,#ffc61e);border:2.5px solid #8a5a00;box-shadow:0 3px 0 #c99300;color:#543400;
}
.chat-send:active{transform:translateY(2px);box-shadow:0 1px 0 #c99300}
.chat-hint{font-size:11px;font-weight:700;color:var(--muted);margin-top:8px;text-align:center}

/* 아이 선택 (상점·마을·도감) */
.kidseg button{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.cs-coin{font-size:10.5px;font-weight:900;color:#8a5a00;background:#fff5d6;border:1px solid #ffe19a;border-radius:6px;padding:0 4px;white-space:nowrap}

/* ---------- 오늘의 학습 (암산·영단어) ---------- */
.study{display:grid;gap:9px}
@media (min-width:620px){.study{grid-template-columns:1fr 1fr}}
.study-card{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:18px;background:#fff;
  border:2px solid var(--line);box-shadow:0 3px 0 rgba(30,42,68,.06);
}
.study-card.s-math{background:linear-gradient(135deg,#ffffff,#fff9ea);border-color:#ffe4a8}
.study-card.s-words{background:linear-gradient(135deg,#ffffff,#f2f8ff);border-color:#cfe4ff}
.sc-ico{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#fff;border:2px solid #eef4fd}
.sc-body{flex:1;min-width:0}
.sc-title{display:block;font-size:14px;font-weight:900;letter-spacing:-.02em}
.sc-desc{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.35}
.sc-rec{display:block;font-size:11px;font-weight:900;color:#2a5bd7;margin-top:4px}
.study-card .btn{flex:0 0 auto}

/* ---------- 퀴즈 ---------- */
.quiz{margin-top:4px}
.q-top{display:flex;align-items:center;gap:8px}
.q-x{
  width:40px;height:40px;flex:0 0 auto;border-radius:13px;background:#fff;border:2px solid var(--line);
  font-size:16px;font-weight:900;color:var(--muted);display:grid;place-items:center;box-shadow:0 2px 0 rgba(30,42,68,.06);
}
.q-kicker{flex:1;min-width:0;font-size:13.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-time{font-size:12px;font-weight:900;color:#7b8aa9;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:4px 9px;white-space:nowrap}
.q-dots{display:flex;gap:5px;margin-top:13px}
.q-dots i{flex:1;height:7px;border-radius:99px;background:#e4ecf9;transition:background .2s}
.q-dots i.ok{background:var(--green)}
.q-dots i.bad{background:var(--red)}
.q-dots i.now{background:var(--blue);animation:pulseDot 1.3s ease-in-out infinite}
@keyframes pulseDot{50%{opacity:.4}}
.q-card{
  position:relative;margin-top:14px;padding:22px 16px 18px;border-radius:26px;text-align:center;overflow:hidden;
  background:linear-gradient(160deg,#ffffff,#f4faff 62%,#fffdf5);border:2.5px solid var(--ink);box-shadow:var(--shadow-pop);
}
.q-card::after{
  content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,63,.35),transparent 68%);pointer-events:none;
}
.q-num{position:relative;z-index:1;font-size:11.5px;font-weight:900;color:var(--red);letter-spacing:.02em}
.q-text{
  position:relative;z-index:1;margin-top:10px;font-size:40px;font-weight:900;letter-spacing:-.045em;
  line-height:1.12;word-break:keep-all;
}
.q-text.word{font-family:Georgia,"Times New Roman",serif;font-size:33px;letter-spacing:-.01em;word-break:break-word}
.q-ask{position:relative;z-index:1;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--muted)}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.q-opt{
  min-height:60px;padding:10px 8px;border-radius:18px;background:#fff;border:2.5px solid var(--line);
  box-shadow:0 4px 0 rgba(30,42,68,.08);font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.2;
  transition:transform .1s, background .15s, border-color .15s;word-break:keep-all;
}
.q-opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(30,42,68,.08)}
.q-opt.word{font-size:14.5px;min-height:64px;line-height:1.35;letter-spacing:-.02em}
.q-opt.ok{background:linear-gradient(180deg,#7ef0bd,#2fc98a);border-color:#0e7f56;color:#04331f;box-shadow:0 4px 0 #0d8a5e}
.q-opt.bad{background:linear-gradient(180deg,#ffa8b0,#ff5f6d);border-color:#a01f2c;color:#fff;box-shadow:0 4px 0 #b82936}
.q-opt.dim{opacity:.45}
.q-feedback{min-height:24px;margin-top:12px;text-align:center;font-size:13.5px;font-weight:900}
.q-feedback.ok{color:#0e8a5c}
.q-feedback.bad{color:#c02a3a}
.qres{text-align:center;padding:8px 2px 2px}
.qres-emoji{font-size:56px;line-height:1.1}
.qres-score{
  font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin-top:4px;
  background:linear-gradient(180deg,#ffcf3f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.qres-meta{font-size:13px;font-weight:800;color:var(--muted);margin-top:6px}
.qres-gain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.qres-gain span{font-size:12.5px;font-weight:900;color:#8a5a00;background:#fff5d6;border:1.5px solid #ffe19a;border-radius:99px;padding:5px 10px}
.qres-gain span.b{color:#0e7a52;background:#e6fff4;border-color:#a9edcd}
.qres-wrong{
  margin-top:16px;text-align:left;background:#fff;border:2px dashed #ffd9de;border-radius:18px;padding:11px 12px;
}
.qres-wrong h4{margin:0 0 4px;font-size:12px;font-weight:900;color:#c02a3a}
.qres-wrong li{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5;padding:4px 0;border-top:1px dashed #ffe3e6}
.qres-wrong li:first-child{border-top:0}
.qres-wrong b{color:var(--ink)}
.qres-btns{display:flex;gap:8px;margin-top:16px}
.qres-btns .btn{flex:1}

/* 접근성 / 모션 */
:focus-visible{outline:3px solid #3fa9ff;outline-offset:2px;border-radius:14px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  .xp-fill{animation:none}
}
</style>
</head>

  function tone(freq, start, dur, type, vol) {
    var ac = audio();
    if (!ac) return;
    try {
      var t0 = ac.currentTime + (start || 0);
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol == null ? 0.14 : vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.16));
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + (dur || 0.16) + 0.03);
    } catch (e) { /* 무음 */ }
  }

  var fxCanvas, fxCtx, fxParticles = [], fxRunning = false;
  function initFx() {
    fxCanvas = document.getElementById('fx');
    if (!fxCanvas) return;
    fxCtx = fxCanvas.getContext('2d');
    resizeFx();
    window.addEventListener('resize', resizeFx);
  }
  function resizeFx() {
    if (!fxCanvas) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    fxCanvas.width = Math.floor(window.innerWidth * dpr);
    fxCanvas.height = Math.floor(window.innerHeight * dpr);
    fxCanvas.style.width = window.innerWidth + 'px';
    fxCanvas.style.height = window.innerHeight + 'px';
    if (fxCtx) fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y, opts) {
    if (!fxCtx) return;
    opts = opts || {};
    var colors = opts.colors || ['#ffd23f', '#ff5f6d', '#3fa9ff', '#2fc98a', '#9a6bff', '#ffffff'];
    var n = opts.count || 26;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 2.4 + Math.random() * 5.6;
      fxParticles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp * (0.6 + Math.random()),
        vy: Math.sin(a) * sp - 2.2,
        g: 0.14 + Math.random() * 0.08,
        life: 1, decay: 0.014 + Math.random() * 0.012,
        r: 2 + Math.random() * 3.4,
        c: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        shape: Math.random() < 0.35 ? 'rect' : 'circle'
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
  }
  function fxTick() {
    if (!fxCtx) { fxRunning = false; return; }
    var W = window.innerWidth, H = window.innerHeight;
    fxCtx.clearRect(0, 0, W, H);
    for (var i = fxParticles.length - 1; i >= 0; i--) {
      var p = fxParticles[i];
      p.vy += p.g; p.vx *= 0.995; p.x += p.vx; p.y += p.vy;
      p.life -= p.decay; p.rot += p.vr;
      if (p.life <= 0 || p.y > H + 30) { fxParticles.splice(i, 1); continue; }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxCtx.fillStyle = p.c;
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
      if (p.shape === 'rect') fxCtx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      else { fxCtx.beginPath(); fxCtx.arc(0, 0, p.r, 0, 6.2832); fxCtx.fill(); }
      fxCtx.restore();
    }
    if (fxParticles.length) requestAnimationFrame(fxTick);
    else { fxCtx.clearRect(0, 0, W, H); fxRunning = false; }
  }
  function burstAt(el, opts) {
    if (!el || !el.getBoundingClientRect) return burst(window.innerWidth / 2, window.innerHeight * 0.45, opts);
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, opts);
  }

  /* ============ 오늘의 학습 — 암산 / 영단어 ============ */
  var quiz = null;
  var quizTick = null;

  function shuffleArr(a) {
    var out = a.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }
  function rndInt(n) { return Math.floor(Math.random() * n); }

  function mathItem(k, t) {
    var a, b, ans, text;
    if (k === 'c1') {
      if (t === 0) { a = 13 + rndInt(66); b = 12 + rndInt(48); ans = a + b; text = a + ' + ' + b; }
      else if (t === 1) { a = 45 + rndInt(53); b = 12 + rndInt(30); ans = a - b; text = a + ' − ' + b; }
      else if (t === 2) { a = 12 + rndInt(24); b = 2 + rndInt(8); ans = a * b; text = a + ' × ' + b; }
      else { b = 3 + rndInt(7); ans = 4 + rndInt(9); a = b * ans; text = a + ' ÷ ' + b; }
    } else {
      if (t === 0) { a = 1 + rndInt(8); b = 1 + rndInt(10 - a); ans = a + b; text = a + ' + ' + b; }
      else if (t === 1) { a = 3 + rndInt(7); b = 1 + rndInt(a - 1); ans = a - b; text = a + ' − ' + b; }
      else { a = 1 + rndInt(9); ans = 10 - a; text = a + ' + □ = 10'; }
    }
    return { text: text, ans: ans };
  }

  function numChoices(ans, k) {
    var pool = k === 'c1'
      ? [-20, -11, -10, -5, -3, -2, -1, 1, 2, 3, 5, 10, 11, 20]
      : [-3, -2, -1, 1, 2, 3, 4];
    var out = [], guard = 0;
    while (out.length < 3 && guard++ < 80) {
      var d = pool[rndInt(pool.length)];
      var v = ans + d;
      if (v < 0 || v === ans || out.indexOf(v) !== -1) continue;
      out.push(v);
    }
    while (out.length < 3) out.push(ans + out.length + 1);
    return out;
  }

  function buildQuiz(k, type) {
    var items = [], i;
    if (type === 'math') {
      var seen = {};
      var plan = shuffleArr(k === 'c1'
        ? [0, 0, 0, 1, 1, 1, 2, 2, 3, 3]
        : [0, 0, 0, 0, 1, 1, 1, 2, 2, 2]);
      plan.forEach(function (t) {
        var raw = mathItem(k, t), guard = 0;
        while (seen[raw.text] && guard++ < 40) raw = mathItem(k, t);
        seen[raw.text] = 1;
        var opts = numChoices(raw.ans, k).map(String);
        opts.push(String(raw.ans));
        items.push({ q: raw.text, a: String(raw.ans), opts: shuffleArr(opts) });
      });
    } else {
      var pool = (k === 'c1' ? WORDS_MID : WORDS_BASIC);
      var koSeen = {};
      var clean = [];
      pool.forEach(function (w) {
        if (koSeen[w.ko]) return;
        koSeen[w.ko] = 1;
        clean.push(w);
      });
      var picks = shuffleArr(clean).slice(0, 10);
      picks.forEach(function (w) {
        var others = [];
        var rest = shuffleArr(clean.filter(function (x) { return x.ko !== w.ko; }));
        for (var j = 0; j < rest.length && others.length < 3; j++) others.push(rest[j].ko);
        var opts = others.slice();
        opts.push(w.ko);
        items.push({ q: w.en, a: w.ko, opts: shuffleArr(opts) });
      });
    }
    return items;
  }

  function academyRec(k) {
    var ch = state.children[k];
    if (!ch.academy || ch.academy.day !== todayStr()) {

  function startQuizTimer() {
    stopQuizTimer();
    quizTick = setInterval(function () {
      var el = document.getElementById('qTimer');
      if (!el || !quiz || quiz.done) return;
      var sec = Math.floor((Date.now() - quiz.startAt) / 1000);
      el.textContent = '⏱ ' + Math.floor(sec / 60) + ':' + pad2(sec % 60);
    }, 250);
  }

  }

  function startQuiz(k, type) {
    state.active = k;
    quiz = {
      k: k, type: type, items: buildQuiz(k, type), idx: 0, correct: 0,
      marks: [], wrong: [], startAt: Date.now(), chosen: null, answered: false,
      done: false, gain: null, sec: 0
    };
    view = 'quiz';
    save();
    SFX.tap();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
    startQuizTimer();
  }

  function answerQuiz(opt) {
    if (!quiz || quiz.done || quiz.answered) return;
    var it = quiz.items[quiz.idx];
    var ok = opt === it.a;
    quiz.chosen = opt;
    quiz.answered = true;
    quiz.marks.push(ok ? 1 : 0);
    if (ok) {
      quiz.correct += 1;
      SFX.quest();
      burst(window.innerWidth / 2, window.innerHeight * 0.38, { count: 16, colors: ['#ffd23f', '#2fc98a', '#ffffff'] });
    } else {
      quiz.wrong.push({ q: it.q, a: it.a, chosen: opt });
      SFX.nope();
    }
    render();
    var qref = quiz;
    setTimeout(function () {
      if (!quiz || quiz !== qref || quiz.done) return;
      quiz.idx += 1;
      quiz.answered = false;
      quiz.chosen = null;
      if (quiz.idx >= quiz.items.length) finishQuiz();
      else render();
    }, ok ? 560 : 1250);
  }

  function finishQuiz() {
    if (!quiz || quiz.done) return;
    var k = quiz.k;
    var ch = state.children[k];
    var sec = Math.max(1, Math.round((Date.now() - quiz.startAt) / 1000));
    var rec = academyRec(k);
    var slot = rec[quiz.type];
    var firstToday = slot.tries === 0;
    var xp = quiz.correct * 2;
    var coins = quiz.correct;
    if (firstToday) { xp += 10; coins += 10; }
    slot.tries += 1;
    slot.lastSec = sec;
    if (quiz.correct > slot.best) slot.best = quiz.correct;

    var beforeLv = levelInfo(ch.xp).level;
    var beforeSt = stageForLevel(beforeLv);
    ch.xp += xp;
    ch.coins += coins;
    ch.total += 1;
    var afterLv = levelInfo(ch.xp).level;
    var afterSt = stageForLevel(afterLv);
    if (afterSt > beforeSt) ch.coins += 20;

    quiz.done = true;
    quiz.sec = sec;
    quiz.gain = { xp: xp, coins: coins, bonus: firstToday };
    save();
    stopQuizTimer();
    SFX.all();
    burst(window.innerWidth / 2, window.innerHeight * 0.34, { count: 90 });
    render();
    if (afterSt > beforeSt) setTimeout(function () { openEvolve(beforeSt, afterSt); }, 620);
    else if (afterLv > beforeLv) setTimeout(function () { openLevelUp(afterLv); }, 620);
  }

  function msgStamp(c) {
    if (c && typeof c.ts === 'number' && c.ts > 0) return c.ts;
    var ms = 0;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((c && c.at) || '');
    if (m) ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    var t = /^(오전|오후) (\d{1,2}):(\d{2})$/.exec((c && c.tm) || '');
    if (t) ms += ((parseInt(t[2], 10) % 12) + (t[1] === '오후' ? 12 : 0)) * 3600000 + parseInt(t[3], 10) * 60000;
    return ms;
  }

  function renderModal() {

      document.body.classList.remove('modal-open');
      parentUnlocked = false;

    var cfg = modalStack[modalStack.length - 1];
    var body = typeof cfg.body === 'function' ? cfg.body() : (cfg.body || '');
    var actions = (cfg.actions && cfg.actions.length)
      ? '<div class="modal-actions">' + cfg.actions.map(function (a, i) {
        return '<button type="button" class="btn ' + (a.cls || 'btn-ghost') + '" data-act="' + i + '">' + a.label + '</button>';

  function toggleQuest(id, el) {
    var k = state.active;
    var ch = activeChild();
    var q = findQuest(k, id);
    if (!q) return;
    var today = todayStr();

    if (ch.done[id]) {
      delete ch.done[id];
      ch.xp = Math.max(0, ch.xp - q.xp);
      ch.coins = Math.max(0, ch.coins - q.coins);
      ch.total = Math.max(0, ch.total - 1);
      if (ch.lastAll === today) {
        ch.coins = Math.max(0, ch.coins - 5);
        if (ch.lastAllPrev) {
          ch.lastAll = ch.lastAllPrev.lastAll || null;
          ch.streak = ch.lastAllPrev.streak || 0;
        } else {
          ch.lastAll = null;
          ch.streak = Math.max(0, ch.streak - 1);
        }
        ch.lastAllPrev = null;
      }
      if (ch.bonus90 === today && todayPct(k) < 90) {
        ch.bonus90 = null;
        ch.xp = Math.max(0, ch.xp - 15);
        ch.coins = Math.max(0, ch.coins - 15);
      }
      save();
      SFX.undo();
      render();
      toast('퀘스트를 취소했어요');
      return;
    }

    var beforeLevel = levelInfo(ch.xp).level;
    var beforeStage = stageForLevel(beforeLevel);
    ch.done[id] = true;
    ch.total += 1;
    ch.xp += q.xp;
    ch.coins += q.coins;
    var afterLevel = levelInfo(ch.xp).level;
    var afterStage = stageForLevel(afterLevel);
    if (afterStage > beforeStage) {
      ch.coins += 20;
    }
    save();

    celebrateId = id;
    burstAt(el, { count: 24, colors: ['#ffd23f', '#ff5f6d', '#3fa9ff', '#2fc98a', '#ffffff'] });
    SFX.quest();
    render();

    if (afterStage > beforeStage) {
      setTimeout(function () { openEvolve(beforeStage, afterStage); }, 420);
    } else if (afterLevel > beforeLevel) {
      setTimeout(function () { openLevelUp(afterLevel); }, 420);
    }

    var totalQ = applicableQuests(k).length;
    var pctNow = totalQ ? Math.round((doneCount(k) / totalQ) * 100) : 0;
    var allDoneNow = isAllDone(k) && ch.lastAll !== today;
    var hit90 = pctNow >= 90 && ch.bonus90 !== today;

    if (allDoneNow) {
      ch.lastAllPrev = { lastAll: ch.lastAll, streak: ch.streak };
      ch.streak = (ch.lastAll === yesterdayStr()) ? ch.streak + 1 : 1;
      ch.lastAll = today;
      ch.coins += 5;
    }
    if (hit90) {
      ch.bonus90 = today;
      ch.xp += 15;
      ch.coins += 15;
    }
    save();

    if (hit90 || allDoneNow) {
      setTimeout(function () {
        SFX.all();
        burst(window.innerWidth / 2, window.innerHeight * 0.4, { count: 100 });
        toast(hit90 ? '🏆 90% 이상 달성! 보너스 XP+15 · 코인+15' : '모든 퀘스트 완료! 보너스 🪙+5');
        render();
        openModal({
          title: hit90 ? '🏆 90% 이상 달성 완료!' : '🎉 오늘 퀘스트 완주!',
          body: '<div class="reveal"><div style="font-size:54px;line-height:1.1">🏆</div>'
            + '<h3>' + esc(ch.name) + ' 달성률 ' + pctNow + '%</h3>'
            + '<p class="desc">퀘스트 ' + doneCount(k) + ' / ' + totalQ + ' 완료!<br>'
            + (hit90 ? '보너스 <b>XP +15</b> · <b>코인 +15</b>' : '보너스 코인 <b>+5</b>')
            + (allDoneNow ? '<br>연속 <b>' + ch.streak + '일</b>째 · 완주 보너스 <b>코인 +5</b>' : '')
            + '</p></div>',
          actions: [{ label: '최고예요!', cls: 'btn-primary', fn: function () { closeModal(); } }]
        });
      }, 560);
    }
  }

  function rollCreature() {
    var r = Math.random();
    var key = r < RARITY.common.weight ? 'common' : (r < RARITY.rare.weight ? 'rare' : 'legend');
    var pool = CREATURES.filter(function (c) { return c.rarity === key; });
    if (!pool.length) pool = CREATURES;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function doGacha() {
    var ch = activeChild();
    if (ch.coins < GACHA_COST) {
      SFX.nope();
      toast('코인이 ' + (GACHA_COST - ch.coins) + '개 부족해요');
      return;
    }
    ch.coins -= GACHA_COST;
    var c = rollCreature();
    var isNew = ch.dex.indexOf(c.id) === -1;
    var refund = 0;
    if (isNew) ch.dex.push(c.id);
    else { refund = RARITY[c.rarity].refund; ch.coins += refund; }

     마을
     ============================================================ */
  function buildItem(id) {
    var ch = activeChild();
    var item = villageItemById(id);
    if (!item) return;
    if (ch.village.some(function (v) { return v.id === id; })) {
      toast('이미 지은 건물이에요');
      return;
    }
    if (ch.coins < item.cost) {
      SFX.nope();
      toast('코인이 ' + (item.cost - ch.coins) + '개 부족해요');
      return;
    }
    askConfirm('마을 건설', '<b>' + esc(item.icon) + ' ' + esc(item.name) + '</b><br>코인 <b>' + item.cost + '개</b>로 지을까요?', function () {
      var c = activeChild();
      if (c.coins < item.cost) { toast('코인이 부족해요'); render(); return; }
      var used = {};
      c.village.forEach(function (v) { used[v.cell] = 1; });
      var cell = -1;
      if (!used[item.cell]) cell = item.cell;
      else {
        for (var i = 0; i < 9; i++) if (!used[i]) { cell = i; break; }
      }
      if (cell < 0) { toast('마을 터가 가득 찼어요'); return; }
      c.coins -= item.cost;
      c.village.push({ id: item.id, cell: cell });
      save();
      SFX.build();
      burst(window.innerWidth / 2, window.innerHeight * 0.35, { count: 55 });
      view = 'village';
      render();
      toast(item.name + ' 완성! 마을이 더 멋져 졌어요 🏡');
    }, '짓기');
  }

  function moveItem(id) {
    var ch = activeChild();
    var entry = null;
    ch.village.forEach(function (v) { if (v.id === id) entry = v; });
    if (!entry) return;
    var used = {};
    ch.village.forEach(function (v) { if (v.id !== id) used[v.cell] = 1; });
    var next = -1;
    for (var step = 1; step <= 9; step++) {
      var cand = (entry.cell + step) % 9;
      if (!used[cand]) { next = cand; break; }
    }
    if (next < 0) { toast('옮길 빈 터가 없어요'); return; }
    entry.cell = next;
    save();
    SFX.tap();
    render();
    toast('자리를 옮겼어요');
  }

  function toggleHeart(id) {
    var c = null;
    for (var i = 0; i < state.cheers.length; i++) if (state.cheers[i].id === id) c = state.cheers[i];
    if (!c) return;
    var k = state.active;
    var idx = c.likedBy.indexOf(k);
    if (idx === -1) {
      c.likedBy.push(k);
      c.likes += 1;
      SFX.heart();
    } else {
      c.likedBy.splice(idx, 1);
      c.likes = Math.max(0, c.likes - 1);
      SFX.tap();
    }
    save();
    render();
  }

            : '<div class="pin-hint">PIN을 잊으면 앱 데이터를 초기화해야 해요.</div>');

    });
  }

  function pinPress(k) {
    if (k === 'del') {
      pinBuf = pinBuf.slice(0, -1);
      pinMsg = '';
    } else if (k === 'ok') {
      if (pinBuf.length !== 4) { pinMsg = '숫자 4자리를 입력해 주세요'; renderModal(); return; }
      checkPin();
      return;
    } else {
      if (pinBuf.length >= 4) return;
      pinBuf += String(k);
      SFX.tap();
    }
    renderModal();
    if (pinBuf.length === 4) setTimeout(checkPin, 160);
  }

  function checkPin() {
    if (pinBuf === state.pin) {
      pinBuf = '';
      pinMsg = '';
      closeModal();
      SFX.all();
      var fn = pinAfter;
      pinAfter = null;
      if (fn) fn();
      return;
    }
    SFX.nope();

    pinBuf = '';
    renderModal();
    var m = document.querySelector('#modalRoot .modal');

  }
