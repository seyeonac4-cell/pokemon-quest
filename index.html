  function exportJSON() {
    try {
      var name = '포켓몬퀘스트_백업_' + todayStr().replace(/-/g, '') + '.json';
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) { /* noop */ }
      }, 400);
      toast('백업 파일을 저장했어요');
    } catch (e) {
      toast('백업을 만들지 못했어요');
    }
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed = null;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object' || !parsed.children) {
        toast('이 파일은 백업 파일이 아니에요');
        return;
      }
      askConfirm('데이터 가져오기', '지금 기록을 모두 지우고 이 백업으로 바꿀까요?', function () {
        state = normalize(parsed);
        save();
        closeAllModals();
        render();
        openParentPanel();
        toast('백업을 불러왔어요');
      }, '가져오기');
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  function dexDetail(id) {
    var c = creatureById(id);
    if (!c) return;
    var ch = activeChild();
    var owned = ch.dex.indexOf(id) !== -1;
    var r = RARITY[c.rarity];
    openModal({
      title: owned ? '📖 도감 정보' : '🔮 아직 만나지 못한 친구',
      body: '<div class="reveal">'
        + '<div class="reveal-stage" style="width:150px;height:150px">' + creatureSVG(c) + '</div>'
        + '<h3>' + (owned ? esc(c.name) : '???') + '</h3>'
        + '<span class="rar-tag rar ' + r.cls + '">' + r.label + '</span>'
        + '<p class="desc">' + (owned ? esc(c.desc) : '뽑기로 이 친구를 만나면 도감에 기록돼요.<br>어떤 친구일까요?') + '</p>'
        + '</div>',
      actions: [{ label: '닫기', cls: 'btn-ghost', fn: function () { closeModal(); } }]
    });
  }

  /* ============================================================
     이벤트
     ============================================================ */
  function closestEl(el, sel) {
    while (el && el !== document) {
      if (el.matches && el.matches(sel)) return el;
      el = el.parentNode;
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target;

    var backdrop = closestEl(t, '[data-backdrop]');
    if (backdrop && t === backdrop) { closeModal(); return; }

    var act = closestEl(t, '[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      var top = modalStack[modalStack.length - 1];
      if (a === 'x') { closeModal(); return; }
      if (top && top.actions && top.actions[Number(a)]) {
        e.preventDefault();
        top.actions[Number(a)].fn();
        return;
      }
    }

    var pin = closestEl(t, '[data-pin]');
    if (pin) { pinPress(pin.getAttribute('data-pin')); return; }

    var navEl = closestEl(t, '[data-nav]');
    if (navEl) {
      var nv = navEl.getAttribute('data-nav');
      if (nv !== 'home' && nv !== 'c1' && nv !== 'c2' && nv !== 'shop' && nv !== 'village' && nv !== 'dex') nv = 'home';
      if (nv === 'c1' || nv === 'c2') state.active = nv;
      if (quiz && view === 'quiz') { stopQuizTimer(); quiz = null; }
      view = nv;
      chatDraft = '';
      save();
      SFX.tap();
      render();
      window.scrollTo({ top: 0, behavior: 'auto' });
      return;
    }

    var kid = closestEl(t, '[data-kid]');
    if (kid) {
      var kk = kid.getAttribute('data-kid');
      if (state.children[kk]) {
        state.active = kk;
        save();
        SFX.tap();
        render();
      }
      return;
    }

    var cf = closestEl(t, '[data-chat-from]');
    if (cf) {
      var taNow = document.getElementById('chatText');
      if (taNow) chatDraft = taNow.value;
      chatFrom = cf.getAttribute('data-chat-from');
      SFX.tap();
      render();
      return;
    }

    var cs = closestEl(t, '[data-chat-send]');
    if (cs) { sendChat(); return; }

    var qz = closestEl(t, '[data-quiz]');
    if (qz) {
      startQuiz(qz.getAttribute('data-k') || state.active, qz.getAttribute('data-quiz'));
      return;
    }

    var qo = closestEl(t, '[data-quiz-opt]');
    if (qo) { answerQuiz(qo.getAttribute('data-quiz-opt')); return; }

    var qx = closestEl(t, '[data-quiz-exit]');
    if (qx) { exitQuiz(); return; }

    var q = closestEl(t, '[data-quest]');
    if (q) { toggleQuest(q.getAttribute('data-quest'), q); return; }

    var g = closestEl(t, '[data-gacha]');
    if (g) { doGacha(); return; }

    var rw = closestEl(t, '[data-reward]');
    if (rw) { redeem(rw.getAttribute('data-reward')); return; }

    var tk = closestEl(t, '[data-tk]');
    if (tk) { markTicketUsed(tk.getAttribute('data-tk')); return; }

    var dx = closestEl(t, '[data-dex]');
    if (dx) { dexDetail(dx.getAttribute('data-dex')); return; }

    var bd = closestEl(t, '[data-build]');
    if (bd) { buildItem(bd.getAttribute('data-build')); return; }

    var mv = closestEl(t, '[data-move]');
    if (mv) { moveItem(mv.getAttribute('data-move')); return; }

    var ht = closestEl(t, '[data-heart]');
    if (ht) { toggleHeart(ht.getAttribute('data-heart')); return; }

    var p = closestEl(t, '[data-p]');
    if (p) {
      var op = p.getAttribute('data-p');
      var id = p.getAttribute('data-id');
      if (op === 'edit-kid') {
        editChild = p.getAttribute('data-k') === 'c2' ? 'c2' : 'c1';
        SFX.tap();
        renderModal();
        return;
      }
      if (op === 'quest-add') { questForm(null); return; }
      if (op === 'quest-edit') { questForm(findQuest(editChild, id)); return; }
      if (op === 'reward-add') { rewardForm(null); return; }
      if (op === 'reward-edit') { rewardForm(findReward(id)); return; }
      if (op === 'quest-del') {
        var qq = findQuest(editChild, id);
        askConfirm('퀘스트 삭제', '<b>' + esc(qq ? qq.title : '') + '</b> 퀘스트를 지울까요?', function () {
          state.children[editChild].quests = state.children[editChild].quests.filter(function (x) { return x.id !== id; });
          Object.keys(state.children).forEach(function (ck) { delete state.children[ck].done[id]; });
          save(); render(); renderModal(); toast('퀘스트를 지웠어요');
        }, '삭제');
        return;
      }
      if (op === 'reward-del') {
        var rr = findReward(id);
        askConfirm('보상 삭제', '<b>' + esc(rr ? rr.title : '') + '</b> 보상을 지울까요?', function () {
          state.rewards = state.rewards.filter(function (x) { return x.id !== id; });
          save(); render(); renderModal(); toast('보상을 지웠어요');
        }, '삭제');
        return;
      }
      if (op === 'reset-today') {
        askConfirm('오늘 기록 초기화', '두 아이의 오늘 퀘스트 완료 기록을 모두 지울까요?', function () {
          Object.keys(state.children).forEach(function (ck) {
            state.children[ck].done = {};
            state.children[ck].lastAllPrev = null;
            state.children[ck].bonus90 = null;
          });
          save(); render(); renderModal(); toast('오늘 기록을 지웠어요');
        }, '초기화');
        return;
      }
      if (op === 'pin-save') {
        var el = document.getElementById('pinNew');
        var v = ((el && el.value) || '').trim();
        if (!/^\d{4}$/.test(v)) { toast('숫자 4자리로 입력해 주세요'); return; }
        state.pin = v;
        save();
        if (el) el.value = '';
        toast('PIN을 ' + v + '로 바꿨어요');
        return;
      }
      if (op === 'export') { exportJSON(); return; }
    }

    if (t.closest && t.closest('#soundBtn')) {
      state.sound = !state.sound;
      save();
      if (state.sound) SFX.tap();
      render();
      toast(state.sound ? '소리를 켰어요' : '소리를 껐어요');
      return;
    }
    if (t.closest && t.closest('#parentBtn')) {
      if (parentUnlocked) openParentPanel();
      else askPin('보호자만 설정을 바꿀 수 있어요', openParentPanel);
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id === 'chatText') {
      chatDraft = t.value;
      if (t.style) {
        t.style.height = 'auto';
        t.style.height = Math.min(110, t.scrollHeight) + 'px';
      }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'importFile') {
      if (t.files && t.files[0]) importFile(t.files[0]);
      return;
    }
    var p = t.getAttribute ? t.getAttribute('data-p') : null;
    if (p === 'name' || p === 'grade' || p === 'avatar') {
      var k = t.getAttribute('data-k');
      var ch = state.children[k];
      if (!ch) return;
      var v = String(t.value || '').trim();
      if (!v) {
        t.value = ch[p];
        return;
      }
      ch[p] = v.slice(0, 12);
      save();
      render();
      toast('저장했어요');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!modalStack.length) {
      if (e.target && e.target.id === 'chatText' && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
      return;
    }
    if (e.key === 'Escape') { closeModal(); return; }
    var top = modalStack[modalStack.length - 1];
    if (top && top.title && top.title.indexOf('보호자 모드') !== -1) {
      if (/^[0-9]$/.test(e.key)) pinPress(e.key);
      else if (e.key === 'Backspace') pinPress('del');
      else if (e.key === 'Enter') pinPress('ok');
    }
  });

  /* 자정이 지나면 새 하루로 */
  setInterval(function () {
    if (ensureDay()) {
      render();
      toast('새로운 하루가 시작됐어요! 오늘의 퀘스트를 확인해 보세요');
    }
  }, 30000);

  window.addEventListener('visibilitychange', function () {
    if (!document.hidden && ensureDay()) render();
  });

  /* ============================================================
     시작
     ============================================================ */
  state = load();
  ensureDay();
  initFx();
  render();

  /* 테스트/디버그용 (앱 동작에는 영향 없음) */
  window.__pqd = {
    get state() { return state; },
    render: render,
    toggleQuest: toggleQuest,
    doGacha: doGacha,
    buildItem: buildItem,
    sendChat: sendChat,
    startQuiz: startQuiz,
    answerQuiz: answerQuiz,
    get quiz() { return quiz; },
    levelInfo: levelInfo,
    stageForLevel: stageForLevel,
    creatures: CREATURES,
    villageItems: VILLAGE_ITEMS,
    setView: function (v) { view = v; render(); },
    setChatFrom: function (a) { chatFrom = a; render(); },
    todayPct: todayPct
  };
})();
</script>
</body>
</html>
