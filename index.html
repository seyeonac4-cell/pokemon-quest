    if (type === 'math') {
      var seen = {};
      /* 윤진: 곱셈·나눗셈·괄호·소수·분수·약수배수·도형단위를 골고루 / 형원: 받아올림·받아내림 */
      var plan = shuffleArr(k === 'c1'
        ? [0, 0, 1, 1, 2, 2, 3, 4, 5, 6]
        : [0, 0, 0, 1, 1, 2, 2, 2, 3, 3]);
      plan.forEach(function (t) {
        var raw = mathItem(k, t), guard = 0;
        while (seen[raw.text] && guard++ < 40) raw = mathItem(k, t);
        seen[raw.text] = 1;
        var opts = raw.opts.slice();
        if (opts.indexOf(String(raw.ans)) === -1) opts.push(String(raw.ans));
        items.push({ q: raw.text, a: String(raw.ans), opts: shuffleArr(opts) });
      });
    } else {
      var pool = (k === 'c1' ? WORDS_MID : WORDS_BASIC);
      var koSeen = {};
      var clean = [];
      pool.forEach(function (w) {
        if (koSeen[w.ko]) return;
        koSeen[w.ko] = 1;
        clean.push(w);
      });
      var picks = shuffleArr(clean).slice(0, 10);
      picks.forEach(function (w) {
        var others = [];
        var rest = shuffleArr(clean.filter(function (x) { return x.ko !== w.ko; }));
        for (var j = 0; j < rest.length && others.length < 3; j++) others.push(rest[j].ko);
        var opts = others.slice();
        opts.push(w.ko);
        items.push({ q: w.en, a: w.ko, opts: shuffleArr(opts) });
      });
    }
    return items;
  }

  function academyRec(k) {
    var ch = state.children[k];
    if (!ch.academy || ch.academy.day !== todayStr()) {
      ch.academy = {
        day: todayStr(),
        math: { best: 0, tries: 0, lastSec: 0, rewardTries: 0 },
        words: { best: 0, tries: 0, lastSec: 0, rewardTries: 0 }
      };
    }
    if (ch.academy.math && ch.academy.math.rewardTries == null) ch.academy.math.rewardTries = Math.min(nz(ch.academy.math.tries, 0), QUIZ_REWARD_MAX);
    if (ch.academy.words && ch.academy.words.rewardTries == null) ch.academy.words.rewardTries = Math.min(nz(ch.academy.words.tries, 0), QUIZ_REWARD_MAX);
    return ch.academy;
  }

  /* 오늘 받을 수 있는 보상이 몇 번 남았는지 */
  function quizRewardLeft(k, type) {
    var rec = academyRec(k);
    var slot = rec[type] || { rewardTries: 0 };
    return Math.max(0, QUIZ_REWARD_MAX - clamp(nz(slot.rewardTries, 0), 0, QUIZ_REWARD_MAX));
  }

  function quizMeta(type, k) {
    if (type === 'math') {
      return {
        icon: '⚡', label: '수학 10문제', kicker: '수학 문제',
        desc: k === 'c1' ? '초4~6: 곱셈·나눗셈, 괄호 계산, 분수·소수, 약수·배수' : '받아올림 덧셈 · 받아내림 뺄셈',
        ask: '정답을 골라요', cls: ''
      };
    }
    return {
      icon: '🔤', label: '영단어 10문제', kicker: '영단어 뜻 찾기',
      desc: k === 'c1' ? '중등 필수 영단어에서 출제' : '7세 기초 영단어에서 출제',
      ask: '알맞은 뜻을 골라요', cls: ' word'
    };
  }

  function kidStudyHTML(k) {
    var rec = academyRec(k);
    var cards = [
      { type: 'math', slot: rec.math },
      { type: 'words', slot: rec.words }
    ];
    return '<section class="section"><div class="section-head"><h2>🎯 오늘의 학습</h2>'
      + '<span class="hint">10문제씩 · 보상 하루 ' + QUIZ_REWARD_MAX + '번</span></div>'
      + '<div class="study">'
      + cards.map(function (c) {
        var m = quizMeta(c.type, k);
        var done = c.slot.tries > 0;
        var used = clamp(nz(c.slot.rewardTries, 0), 0, QUIZ_REWARD_MAX);
        var left = QUIZ_REWARD_MAX - used;
        return '<div class="study-card s-' + c.type + '">'
          + '<span class="sc-ico">' + m.icon + '</span>'
          + '<span class="sc-body"><span class="sc-title">' + m.label + '</span>'
          + '<span class="sc-desc">' + m.desc + '</span>'
          + '<span class="sc-rec">' + (done
            ? '오늘 최고 ' + c.slot.best + '/10 · ' + c.slot.tries + '번 도전'
            : (left > 0 ? '아직 안 했어요 · 첫 도전 보너스!' : '오늘 보상은 다 받았어요')) + '</span>'
          + '<span class="sc-cap' + (left > 0 ? '' : ' full') + '">'
          + (left > 0 ? '🎁 오늘 보상 ' + used + '/' + QUIZ_REWARD_MAX + '회 · ' + left + '번 남았어요'
                      : '🎁 오늘 보상 ' + QUIZ_REWARD_MAX + '/' + QUIZ_REWARD_MAX + '회 · 연습으로 풀 수 있어요') + '</span></span>'
          + '<button type="button" class="btn btn-sm ' + (left > 0 ? 'btn-primary' : 'btn-ghost') + '" data-quiz="' + c.type + '" data-k="' + k + '">'
          + (done ? (left > 0 ? '다시' : '연습') : (left > 0 ? '시작' : '연습')) + '</button>'
          + '</div>';
      }).join('')
      + '</div></section>';
  }

  function startQuizTimer() {
    stopQuizTimer();
    quizTick = setInterval(function () {
      var el = document.getElementById('qTimer');
      if (!el || !quiz || quiz.done) return;
      var sec = Math.floor((Date.now() - quiz.startAt) / 1000);
      el.textContent = '⏱ ' + Math.floor(sec / 60) + ':' + pad2(sec % 60);
    }, 250);
  }
  function stopQuizTimer() {
    if (quizTick) { clearInterval(quizTick); quizTick = null; }
  }

  function startQuiz(k, type) {
    state.active = k;
    var left = quizRewardLeft(k, type);
    quiz = {
      k: k, type: type, items: buildQuiz(k, type), idx: 0, correct: 0,
      marks: [], wrong: [], startAt: Date.now(), chosen: null, answered: false,
      done: false, gain: null, sec: 0, rewardLeft: left
    };
    view = 'quiz';
    save();
    SFX.tap();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
    startQuizTimer();
    if (left <= 0) setTimeout(function () { toast('오늘 보상은 다 받았어요 · 연습으로 풀어요 👏'); }, 260);
  }

  function answerQuiz(opt) {
    if (!quiz || quiz.done || quiz.answered) return;
    var it = quiz.items[quiz.idx];
    var ok = opt === it.a;
    quiz.chosen = opt;
    quiz.answered = true;
    quiz.marks.push(ok ? 1 : 0);
    if (ok) {
      quiz.correct += 1;
      SFX.quest();
      burst(window.innerWidth / 2, window.innerHeight * 0.38, { count: 16, colors: ['#ffd23f', '#2fc98a', '#ffffff'] });
    } else {
      quiz.wrong.push({ q: it.q, a: it.a, chosen: opt });
      SFX.nope();
    }
    render();
    var qref = quiz;
    setTimeout(function () {
      if (!quiz || quiz !== qref || quiz.done) return;
      quiz.idx += 1;
      quiz.answered = false;
      quiz.chosen = null;
      if (quiz.idx >= quiz.items.length) finishQuiz();
      else render();
    }, ok ? 560 : 1250);
  }

  function finishQuiz() {
    if (!quiz || quiz.done) return;
    var k = quiz.k;
    var ch = state.children[k];
    var sec = Math.max(1, Math.round((Date.now() - quiz.startAt) / 1000));
    var rec = academyRec(k);
    var slot = rec[quiz.type];
    var used = clamp(nz(slot.rewardTries, 0), 0, QUIZ_REWARD_MAX);
    var canReward = used < QUIZ_REWARD_MAX;
    var firstToday = canReward && used === 0;
    var xp = canReward ? quiz.correct * 2 : 0;
    var coins = canReward ? quiz.correct : 0;
    if (firstToday) { xp += 10; coins += 10; }
    slot.tries += 1;
    slot.lastSec = sec;
    if (quiz.correct > slot.best) slot.best = quiz.correct;

    var beforeLv = levelInfo(ch.xp).level;
    var beforeSt = stageForLevel(beforeLv);
    var afterLv = beforeLv, afterSt = beforeSt;
    if (canReward) {
      slot.rewardTries = used + 1;
      ch.xp += xp;
      ch.coins += coins;
      ch.total += 1;
      afterLv = levelInfo(ch.xp).level;
      afterSt = stageForLevel(afterLv);
      if (afterSt > beforeSt) ch.coins += 20;
    }

    quiz.done = true;
    quiz.sec = sec;
    quiz.gain = {
      xp: xp, coins: coins, bonus: firstToday, capped: !canReward,
      used: clamp(nz(slot.rewardTries, 0), 0, QUIZ_REWARD_MAX), max: QUIZ_REWARD_MAX
    };
    save();
    stopQuizTimer();
    if (canReward) {
      SFX.all();
      burst(window.innerWidth / 2, window.innerHeight * 0.34, { count: 90 });
    } else {
      SFX.tap();
    }
    render();
    if (canReward && afterSt > beforeSt) setTimeout(function () { openEvolve(beforeSt, afterSt); }, 620);
    else if (canReward && afterLv > beforeLv) setTimeout(function () { openLevelUp(afterLv); }, 620);
    else if (!canReward) setTimeout(function () { toast('오늘 보상 ' + QUIZ_REWARD_MAX + '회를 모두 받았어요! 연습 완료 👏'); }, 220);
  }

  function exitQuiz() {
    if (!quiz || quiz.done) { var bk = quiz ? quiz.k : state.active; quiz = null; stopQuizTimer(); view = bk; render(); return; }
    var k = quiz.k;
    var canGet = quizRewardLeft(k, quiz.type) > 0;
    askConfirm('그만 풀까요?', '지금까지 푼 문제는 기록되지 않아요.<br>'
      + (canGet ? '계속 풀면 보상을 받을 수 있어요!' : '끝까지 풀면 연습 기록이 남아요.'), function () {
      stopQuizTimer();
      quiz = null;
      view = k;
      render();
    }, '그만하기');
  }

  function quizHTML() {
    if (!quiz) return homeHTML();
    var k = quiz.k;
    var ch = state.children[k];
    var m = quizMeta(quiz.type, k);
    if (quiz.done) return quizResultHTML();
    var usedQ = clamp(nz(academyRec(k)[quiz.type].rewardTries, 0), 0, QUIZ_REWARD_MAX);
    var leftQ = Math.max(0, QUIZ_REWARD_MAX - usedQ);
    var it = quiz.items[quiz.idx];
    var total = quiz.items.length;
    var dots = '';
    for (var i = 0; i < total; i++) {
      var cls = '';
      if (i < quiz.marks.length) cls = quiz.marks[i] ? ' ok' : ' bad';
      else if (i === quiz.idx) cls = ' now';
      dots += '<i class="' + cls.trim() + '"></i>';
    }
    var opts = it.opts.map(function (o) {
      var cls = 'q-opt' + (quiz.type === 'words' ? ' word' : '');
      if (quiz.answered) {
        if (o === it.a) cls += ' ok';
        else if (o === quiz.chosen) cls += ' bad';
        else cls += ' dim';
      }
      return '<button type="button" class="' + cls + '" data-quiz-opt="' + esc(o) + '"'
        + (quiz.answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('');
    var fb = '';
    if (quiz.answered) {
      var okNow = quiz.chosen === it.a;
      fb = '<div class="q-feedback ' + (okNow ? 'ok' : 'bad') + '">'
        + (okNow ? '정답이에요! 🎉' : '아쉬워요 · 정답은 ' + esc(it.a)) + '</div>';
    }
    return '<section class="quiz">'
      + '<div class="q-top">'
      + '<button type="button" class="q-x" data-quiz-exit="1" aria-label="그만하기">✕</button>'
      + '<div class="q-kicker">' + m.icon + ' ' + m.kicker + ' · ' + esc(ch.name) + '</div>'
      + '<div class="q-time" id="qTimer">⏱ 0:00</div>'
      + '</div>'
      + '<div class="q-dots" aria-label="문제 진행">' + dots + '</div>'
      + '<div class="q-cap' + (leftQ > 0 ? '' : ' full') + '">'
      + (leftQ > 0 ? '🎁 오늘 보상 ' + usedQ + '/' + QUIZ_REWARD_MAX + '회 · ' + leftQ + '번 더 받을 수 있어요'
                   : '🎁 오늘 보상 ' + QUIZ_REWARD_MAX + '/' + QUIZ_REWARD_MAX + '회 완료 · 연습 모드') + '</div>'
      + '<div class="q-card">'
      + '<div class="q-num">' + (quiz.idx + 1) + '번째 문제</div>'
      + '<div class="q-text' + m.cls + (it.q.length > 12 ? ' long' : '') + '">' + esc(it.q) + '</div>'
      + '<div class="q-ask">' + m.ask + '</div>'
      + '</div>'
      + '<div class="q-opts">' + opts + '</div>'
      + fb
      + '</section>';
  }

  function quizResultHTML() {
    var k = quiz.k;
    var ch = state.children[k];
    var m = quizMeta(quiz.type, k);
    var total = quiz.items.length;
    var c = quiz.correct;
    var pct = Math.round((c / total) * 100);
    var emoji = c >= 9 ? '🏆' : (c >= 7 ? '🎉' : (c >= 5 ? '💪' : '🌱'));
    var wrong = '';
    if (quiz.wrong.length) {
      wrong = '<div class="qres-wrong"><h4>틀린 문제 ' + quiz.wrong.length + '개</h4><ul>'
        + quiz.wrong.map(function (w) {
          return '<li><b>' + esc(w.q) + '</b> → <b>' + esc(w.a) + '</b></li>';
        }).join('') + '</ul></div>';
    } else {
      wrong = '<div class="qres-wrong" style="text-align:center;border-color:#b9eed6;background:#f4fffa">'
        + '<h4 style="color:#0e8a5c;margin:0">모두 맞았어요! 완벽해요 ✨</h4></div>';
    }
    var g = quiz.gain || { xp: 0, coins: 0, bonus: false };
    var leftR = quizRewardLeft(k, quiz.type);
    var gainLine = g.capped
      ? '<span>⚡ XP +0</span><span>🪙 코인 +0</span>'
      : '<span>⚡ XP +' + g.xp + '</span><span>🪙 코인 +' + g.coins + '</span>'
        + (g.bonus ? '<span class="b">첫 도전 보너스 +10 포함</span>' : '');
    var capBox = g.capped
      ? '<div class="qres-cap">오늘 보상 ' + QUIZ_REWARD_MAX + '회를 모두 받았어요! 연습 완료 👏<br>내일 또 보상을 받을 수 있어요.</div>'
      : '<div class="qres-cap done">오늘 보상 ' + (g.used || 0) + ' / ' + QUIZ_REWARD_MAX + '회 사용'
        + (leftR > 0 ? ' · ' + leftR + '번 더 받을 수 있어요' : ' · 오늘 보상 완료!') + '</div>';
    return '<section class="quiz">'
      + '<div class="qres">'
      + '<div class="qres-emoji">' + emoji + '</div>'
      + '<div class="qres-score">' + c + ' / ' + total + '</div>'
      + '<div class="qres-meta">' + esc(ch.name) + ' · ' + m.kicker + ' · 정답률 ' + pct + '%'
      + ' · ⏱ ' + Math.floor(quiz.sec / 60) + ':' + pad2(quiz.sec % 60) + '</div>'
      + '<div class="qres-gain">' + gainLine + '</div>'
      + capBox
      + wrong
      + '<div class="qres-btns">'
      + '<button type="button" class="btn btn-ghost" data-quiz-exit="1">할 일로</button>'
      + '<button type="button" class="btn btn-primary" data-quiz="' + quiz.type + '" data-k="' + k + '">'
      + (leftR > 0 ? '다시 도전' : '한 번 더 연습') + '</button>'
      + '</div></div></section>';
  }

  function homeHTML() {
    return heroHTML()
      + '<section class="section"><div class="section-head"><h2>🍀 오늘의 배움</h2>'
      + '<span class="hint">매일 새로워요</span></div>' + learningHTML() + '</section>'
      + '<section class="section"><div class="section-head"><h2>🐾 아이들 포켓몬 현황</h2>'
      + '<span class="hint">카드를 누르면 할 일로</span></div>'
      + '<div class="pcards">' + pcardHTML('c1') + pcardHTML('c2') + '</div></section>'
      + '<section class="section"><div class="section-head"><h2>💬 가족 톡방</h2>'
      + '<span class="hint">' + state.cheers.length + '개 메시지</span></div>'
      + chatHTML() + '</section>';
  }

  /* 아이 선택 (상점·마을·도감) */
  function childSwitchHTML() {
    return '<div class="seg kidseg" role="group" aria-label="아이 선택">'
      + ['c1', 'c2'].map(function (k) {
        var ch = state.children[k];
        var on = state.active === k;
        return '<button type="button" data-kid="' + k + '" class="' + (on ? 'on' : '') + '"'
          + ' aria-pressed="' + on + '">' + esc(ch.avatar) + ' ' + esc(ch.name)
          + '<span class="cs-coin">🪙' + ch.coins + '</span></button>';
      }).join('') + '</div>';
  }

  /* ============ 가족 톡방 ============ */
  function nowTime() {
    var d = new Date();
    var h = d.getHours();
    var ap = h < 12 ? '오전' : '오후';
    h = h % 12;
    if (h === 0) h = 12;
    return ap + ' ' + h + ':' + pad2(d.getMinutes());
  }
  function chatRole(from) {
    if (from === '엄마') return 'mom';
    if (from === '아빠') return 'dad';
    if (from === state.children.c1.name) return 'k1';
    if (from === state.children.c2.name) return 'k2';
    return '';
  }
  function timeLabel(c) {
    var d = c.at === todayStr() ? '오늘' : shortDate(c.at);
    return c.tm ? d + ' ' + c.tm : d;
  }

  function msgStamp(c) {
    if (c && typeof c.ts === 'number' && c.ts > 0) return c.ts;
    var ms = 0;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((c && c.at) || '');
    if (m) ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    var t = /^(오전|오후) (\d{1,2}):(\d{2})$/.exec((c && c.tm) || '');
    if (t) ms += ((parseInt(t[2], 10) % 12) + (t[1] === '오후' ? 12 : 0)) * 3600000 + parseInt(t[3], 10) * 60000;
    return ms;
  }

  function chatHTML() {
    var authors = ['엄마', '아빠', state.children.c1.name, state.children.c2.name];
    var html = '<div class="chat">';
    if (!state.cheers.length) {
      html += '<div class="chat-empty">아직 메시지가 없어요.<br>가족에게 첫 응원 메시지를 남겨보세요! 💌</div>';
    } else {
      var list = state.cheers.slice().sort(function (x, y) { return msgStamp(x) - msgStamp(y); });
      html += list.map(function (c) {
        var role = chatRole(c.from);
        var liked = c.likedBy.indexOf(state.active) !== -1;
        return '<div class="msg ' + role + '">'
          + '<span class="m-av">' + esc(authorAvatar(c.from)) + '</span>'
          + '<span class="m-body">'
          + '<span class="m-who">' + esc(c.from) + '<span class="t">' + esc(timeLabel(c)) + '</span></span>'
          + '<span class="bubble"><span class="b-line">' + esc(c.text) + '</span>'
          + '<button type="button" class="heart-btn' + (liked ? ' on' : '') + '" data-heart="' + esc(c.id) + '"'
          + ' aria-pressed="' + liked + '" aria-label="' + esc(c.from) + ' 메시지에 하트">'
          + (liked ? '❤️' : '🤍') + ' ' + c.likes + '</button>'
          + '</span></span></div>';
      }).join('');
    }
    html += '</div>';
    html += '<div class="chat-form">'
      + '<div class="chips" role="group" aria-label="누가 남기나요">'
      + authors.map(function (a) {
        return '<button type="button" class="chip' + (chatFrom === a ? ' on' : '') + '"'
          + ' data-chat-from="' + esc(a) + '" aria-pressed="' + (chatFrom === a) + '">'
          + esc(authorAvatar(a)) + ' ' + esc(a) + '</button>';
      }).join('')
      + '</div>'
      + '<div class="chat-row">'
      + '<textarea id="chatText" rows="1" maxlength="120" placeholder="' + esc(chatFrom) + '로서 한마디 남겨 보세요">' + esc(chatDraft) + '</textarea>'
      + '<button type="button" class="chat-send" data-chat-send="1" aria-label="메시지 보내기">➤</button>'
      + '</div>'
      + '<div class="chat-hint">보낸 사람을 고르고 한마디를 적어 보내면 가족 모두에게 보여요 (최대 120자)</div>'
      + '</div>';
    return html;
  }

  function sendChat() {
    var ta = document.getElementById('chatText');
    var text = ((ta && ta.value) || chatDraft || '').trim();
    if (!text) {
      toast('메시지를 적어 주세요');
      if (ta && ta.focus) ta.focus();
      return;
    }
    state.cheers.unshift({
      id: uid('ch'), from: chatFrom, text: text.slice(0, 120),
      at: todayStr(), tm: nowTime(), ts: Date.now(), likes: 0, likedBy: []
    });
    chatDraft = '';
    save();
    ntfySend('💬 ' + chatFrom + '의 가족톡', '💬 ' + chatFrom + ': ' + text.slice(0, 120));
    SFX.heart();
    burst(window.innerWidth / 2, window.innerHeight * 0.45,
      { count: 26, colors: ['#ff8fab', '#ff5f6d', '#ffd23f', '#ffffff'] });

  function renderModal() {
    var root = document.getElementById('modalRoot');
    if (!modalStack.length) {
      root.innerHTML = '';
      document.body.style.overflow = '';
      document.body.classList.remove('modal-open');
      parentUnlocked = false;
      pinActive = false;
      return;
    }
    pinActive = !!modalStack[modalStack.length - 1].pinned;
    var cfg = modalStack[modalStack.length - 1];
    var body = typeof cfg.body === 'function' ? cfg.body() : (cfg.body || '');
    var actions = (cfg.actions && cfg.actions.length)
      ? '<div class="modal-actions">' + cfg.actions.map(function (a, i) {
        return '<button type="button" class="btn ' + (a.cls || 'btn-ghost') + '" data-act="' + i + '">' + a.label + '</button>';

      + '</div><div class="modal-body">' + body + '</div>' + actions + '</div></div>';
    document.body.style.overflow = 'hidden';
    document.body.classList.add('modal-open');

  function toggleQuest(id, el) {
    var k = state.active;
    var ch = activeChild();
    var q = findQuest(k, id);
    if (!q) return;
    var today = todayStr();

    if (ch.done[id]) {
      delete ch.done[id];
      ch.xp = Math.max(0, ch.xp - q.xp);
      ch.coins = Math.max(0, ch.coins - q.coins);
      ch.total = Math.max(0, ch.total - 1);
      if (ch.lastAll === today) {
        ch.coins = Math.max(0, ch.coins - 5);
        if (ch.lastAllPrev) {
          ch.lastAll = ch.lastAllPrev.lastAll || null;
          ch.streak = ch.lastAllPrev.streak || 0;
        } else {
          ch.lastAll = null;
          ch.streak = Math.max(0, ch.streak - 1);
        }
        ch.lastAllPrev = null;
      }
      if (ch.bonus90 === today && todayPct(k) < 90) {
        ch.bonus90 = null;
        ch.xp = Math.max(0, ch.xp - 15);
        ch.coins = Math.max(0, ch.coins - 15);
      }
      save();
      SFX.undo();
      render();
      toast('퀘스트를 취소했어요');
      return;
    }

    var beforeLevel = levelInfo(ch.xp).level;
    var beforeStage = stageForLevel(beforeLevel);
    ch.done[id] = true;
    ch.total += 1;
    ch.xp += q.xp;
    ch.coins += q.coins;
    var afterLevel = levelInfo(ch.xp).level;
    var afterStage = stageForLevel(afterLevel);
    if (afterStage > beforeStage) {
      ch.coins += 20;
    }
    save();

    celebrateId = id;
    burstAt(el, { count: 24, colors: ['#ffd23f', '#ff5f6d', '#3fa9ff', '#2fc98a', '#ffffff'] });
    SFX.quest();
    render();

    if (afterStage > beforeStage) {
      setTimeout(function () { openEvolve(beforeStage, afterStage); }, 420);
    } else if (afterLevel > beforeLevel) {
      setTimeout(function () { openLevelUp(afterLevel); }, 420);
    }

    var totalQ = applicableQuests(k).length;
    var pctNow = totalQ ? Math.round((doneCount(k) / totalQ) * 100) : 0;

    /* 가족 휴대폰 알림 */
    ntfySend('✅ ' + ch.name + ' 퀘스트 완료',
      ch.name + josa(ch.name, '이가', '가') + " '" + q.title + "'" + josa(q.title, '을', '를')
      + ' 완료했어요! (오늘 ' + doneCount(k) + '/' + totalQ + ' · ' + pctNow + '%)');
    var allDoneNow = isAllDone(k) && ch.lastAll !== today;
    var hit90 = pctNow >= 90 && ch.bonus90 !== today;

    if (allDoneNow) {
      ch.lastAllPrev = { lastAll: ch.lastAll, streak: ch.streak };
      ch.streak = (ch.lastAll === yesterdayStr()) ? ch.streak + 1 : 1;
      ch.lastAll = today;
      ch.coins += 5;
    }
    if (hit90) {
      ch.bonus90 = today;
      ch.xp += 15;
      ch.coins += 15;
      ntfySend('🎉 ' + ch.name + ' 90% 달성',
        ch.name + josa(ch.name, '이가', '가') + ' 오늘 퀘스트 90% 이상을 달성했어요!');
    }
    save();

    if (hit90 || allDoneNow) {
      setTimeout(function () {
        SFX.all();
        burst(window.innerWidth / 2, window.innerHeight * 0.4, { count: 100 });
        toast(hit90 ? '🏆 90% 이상 달성! 보너스 XP+15 · 코인+15' : '모든 퀘스트 완료! 보너스 🪙+5');
        render();
        openModal({

  function rollCreature() {
    var r = Math.random();
    var key = r < RARITY.common.weight ? 'common' : (r < RARITY.rare.weight ? 'rare' : 'legend');
    var pool = CREATURES.filter(function (c) { return c.rarity === key; });
    if (!pool.length) pool = CREATURES;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function doGacha() {
    var ch = activeChild();
    if (ch.coins < GACHA_COST) {
      SFX.nope();
      toast('코인이 ' + (GACHA_COST - ch.coins) + '개 부족해요');
      return;
    }
    ch.coins -= GACHA_COST;
    var c = rollCreature();
    var isNew = ch.dex.indexOf(c.id) === -1;
    var refund = 0;
    if (isNew) ch.dex.push(c.id);
    else { refund = RARITY[c.rarity].refund; ch.coins += refund; }
    save();
    SFX.gacha();
    burst(window.innerWidth / 2, window.innerHeight * 0.42, { count: 60 });
    playCry(c.dex, c.types);
    render();

    var r = RARITY[c.rarity];
    openModal({
      title: '✨ 뽑기 결과',
      body: '<div class="reveal">'
        + '<div class="reveal-stage" data-cry="' + c.dex + '" data-cry-t="' + esc(c.types.join('|')) + '" title="탭하면 울음소리"><div class="rays"></div><div class="disc"></div>' + creatureSVG(c) + '</div>'

  /* ============================================================
     마을
     ============================================================ */
  function buildItem(id) {
    var ch = activeChild();
    var item = villageItemById(id);
    if (!item) return;
    if (ch.village.some(function (v) { return v.id === id; })) {
      toast('이미 지은 건물이에요');
      return;
    }
    if (ch.coins < item.cost) {
      SFX.nope();
      toast('코인이 ' + (item.cost - ch.coins) + '개 부족해요');
      return;
    }
    askConfirm('마을 건설', '<b>' + esc(item.icon) + ' ' + esc(item.name) + '</b><br>코인 <b>' + item.cost + '개</b>로 지을까요?', function () {
      var c = activeChild();
      if (c.coins < item.cost) { toast('코인이 부족해요'); render(); return; }
      var used = {};
      c.village.forEach(function (v) { used[v.cell] = 1; });
      var cell = -1;
      if (!used[item.cell]) cell = item.cell;
      else {
        for (var i = 0; i < 9; i++) if (!used[i]) { cell = i; break; }
      }
      if (cell < 0) { toast('마을 터가 가득 찼어요'); return; }
      c.coins -= item.cost;
      c.village.push({ id: item.id, cell: cell });
      save();
      SFX.build();
      burst(window.innerWidth / 2, window.innerHeight * 0.35, { count: 55 });
      view = 'village';
      render();
      toast(item.name + ' 완성! 마을이 더 멋져 졌어요 🏡');
    }, '짓기');
  }

  function moveItem(id) {
    var ch = activeChild();
    var entry = null;
    ch.village.forEach(function (v) { if (v.id === id) entry = v; });
    if (!entry) return;
    var used = {};
    ch.village.forEach(function (v) { if (v.id !== id) used[v.cell] = 1; });
    var next = -1;
    for (var step = 1; step <= 9; step++) {
      var cand = (entry.cell + step) % 9;
      if (!used[cand]) { next = cand; break; }
    }
    if (next < 0) { toast('옮길 빈 터가 없어요'); return; }
    entry.cell = next;
    save();
    SFX.tap();
    render();
    toast('자리를 옮겼어요');
  }

  function toggleHeart(id) {
    var c = null;
    for (var i = 0; i < state.cheers.length; i++) if (state.cheers[i].id === id) c = state.cheers[i];
    if (!c) return;
    var k = state.active;
    var idx = c.likedBy.indexOf(k);
    if (idx === -1) {
      c.likedBy.push(k);
      c.likes += 1;
      SFX.heart();
    } else {
      c.likedBy.splice(idx, 1);
      c.likes = Math.max(0, c.likes - 1);
      SFX.tap();
    }
    save();
    render();
  }

  var pinBuf = '';

  function askPin(reason, after) {
    pinBuf = '';
    pinMsg = '';

    pinAfter = after || null;
    openModal({
      title: '🔒 보호자 모드',
      pinned: true,
      body: function () {
        return '<p style="text-align:center;font-size:12px;color:#7b8aa9;font-weight:800">' + esc(reason || '') + '</p>'
          + '<div class="pin-dots">' + [0, 1, 2, 3].map(function (i) {
            return '<span class="pin-dot' + (pinBuf.length > i ? ' on' : '') + '"></span>';
          }).join('') + '</div>'
          + '<div class="pin-msg" id="pinMsg">' + pinMsg + '</div>'
          + '<div class="pinpad">'
          + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
            return '<button type="button" class="pin-key" data-pin="' + n + '">' + n + '</button>';
          }).join('')
          + '<button type="button" class="pin-key wide" data-pin="del">지우기</button>'
          + '<button type="button" class="pin-key" data-pin="0">0</button>'
          + '<button type="button" class="pin-key wide" data-pin="ok">확인</button>'
          + '</div>'
          + (state.pin === '0000'
            ? '<div class="pin-hint">처음 사용이면 기본 PIN <b>0000</b> 이에요. 보호자 모드에서 바꿀 수 있어요.</div>'
            : '<div class="pin-hint">PIN을 잊으면 앱 데이터를 초기화해야 해요.</div>');
      }
    });
  }

  function pinPress(k) {
    if (k === 'del') {
      pinBuf = pinBuf.slice(0, -1);
      pinMsg = '';
    } else if (k === 'ok') {
      if (pinBuf.length !== 4) { pinMsg = '숫자 4자리를 입력해 주세요'; renderModal(); return; }
      checkPin();
      return;
    } else {
      if (pinBuf.length >= 4) return;
      pinBuf += String(k);
      SFX.tap();
    }
    renderModal();
    if (pinBuf.length === 4) setTimeout(checkPin, 160);
  }

  function checkPin() {
    if (pinBuf === state.pin) {
      pinBuf = '';
      pinMsg = '';
      closeModal();
      SFX.all();
      var fn = pinAfter;
      pinAfter = null;
      if (fn) fn();
      return;
    }
    SFX.nope();
    pinMsg = 'PIN이 맞지 않아요. 다시 시도해 주세요.';
    pinBuf = '';
    renderModal();
    var m = document.querySelector('#modalRoot .modal');
    if (m) {
      m.classList.add('shake');
      setTimeout(function () { m.classList.remove('shake'); }, 430);
    }
  }

  function exportJSON() {
    try {
      var name = '포켓몬퀘스트_백업_' + todayStr().replace(/-/g, '') + '.json';
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) { /* noop */ }
      }, 400);
      toast('백업 파일을 저장했어요');
    } catch (e) {
      toast('백업을 만들지 못했어요');
    }
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed = null;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object' || !parsed.children) {
        toast('이 파일은 백업 파일이 아니에요');
        return;
      }
      askConfirm('데이터 가져오기', '지금 기록을 모두 지우고 이 백업으로 바꿀까요?', function () {
        state = normalize(parsed);
        save();
        closeAllModals();
        render();
        openParentPanel();
        toast('백업을 불러왔어요');
      }, '가져오기');
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  /* 울음소리 + 이펙트 한 번에 (소리가 꺼져 있으면 알려 줘요) */
  function cryAndFX(el, dex, types) {
    var ok = playCry(dex, types);
    pokeFX(el, types);
    if (!ok) toast('소리가 꺼져 있어요 · 위쪽 🔊 버튼으로 켤 수 있어요');
    return ok;
  }
  /* 탭한 자리에서 바로 울음소리(사용자 제스처 안에서 재생해야 모바일이 막지 않아요) */
  function cryTap(el, dex, types) {
    var ok = playCry(dex, types);
    popEl(el);
    if (!ok) toast('소리가 꺼져 있어요 · 위쪽 🔊 버튼으로 켤 수 있어요');
    return ok;
  }

  /* ============================================================
     이벤트
     ============================================================ */
  function closestEl(el, sel) {
    while (el && el !== document) {
      if (el.matches && el.matches(sel)) return el;
      el = el.parentNode;
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target;

    var backdrop = closestEl(t, '[data-backdrop]');
    if (backdrop && t === backdrop) { closeModal(); return; }

    var act = closestEl(t, '[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      var top = modalStack[modalStack.length - 1];
      if (a === 'x') { closeModal(); return; }
      if (top && top.actions && top.actions[Number(a)]) {
        e.preventDefault();
        top.actions[Number(a)].fn();
        return;
      }
    }

    var pin = closestEl(t, '[data-pin]');
    if (pin) { pinPress(pin.getAttribute('data-pin')); return; }

    /* ⏰ 5분 경고창 — 보호자 PIN으로만 연장 */
    var tuBtn = closestEl(t, '#timeupPin');
    if (tuBtn) { askPin('보호자만 시간을 연장할 수 있어요', useExtend); return; }

    /* 포켓몬을 누르면 울음소리 + 타입 이펙트 (카드 이동보다 먼저 처리) */
    var cryEl = closestEl(t, '[data-cry]');
    if (cryEl) {
      var cryDex = cryEl.getAttribute('data-cry');
      var cryTypes = (cryEl.getAttribute('data-cry-t') || '').split('|');
      cryAndFX(cryEl, cryDex, cryTypes);
      e.preventDefault();
      return;
    }

    var navEl = closestEl(t, '[data-nav]');
    if (navEl) {
      var nv = navEl.getAttribute('data-nav');
      if (nv !== 'home' && nv !== 'c1' && nv !== 'c2' && nv !== 'shop' && nv !== 'village' && nv !== 'dex') nv = 'home';
      if (nv === 'c1' || nv === 'c2') state.active = nv;
      if (quiz && view === 'quiz') { stopQuizTimer(); quiz = null; }
      view = nv;
      chatDraft = '';
      save();
      SFX.tap();
      render();
      window.scrollTo({ top: 0, behavior: 'auto' });
      return;
    }

    var kid = closestEl(t, '[data-kid]');
    if (kid) {
      var kk = kid.getAttribute('data-kid');
      if (state.children[kk]) {
        state.active = kk;
        save();
        SFX.tap();
        render();
      }
      return;
    }

    var cf = closestEl(t, '[data-chat-from]');
    if (cf) {
      var taNow = document.getElementById('chatText');
      if (taNow) chatDraft = taNow.value;
      chatFrom = cf.getAttribute('data-chat-from');
      SFX.tap();
      render();
      return;
    }

    var cs = closestEl(t, '[data-chat-send]');
    if (cs) { sendChat(); return; }

    var qz = closestEl(t, '[data-quiz]');
    if (qz) {
      startQuiz(qz.getAttribute('data-k') || state.active, qz.getAttribute('data-quiz'));
      return;
    }

    var qo = closestEl(t, '[data-quiz-opt]');
    if (qo) { answerQuiz(qo.getAttribute('data-quiz-opt')); return; }

    var qx = closestEl(t, '[data-quiz-exit]');
    if (qx) { exitQuiz(); return; }

    var q = closestEl(t, '[data-quest]');
    if (q) { toggleQuest(q.getAttribute('data-quest'), q); return; }

    var g = closestEl(t, '[data-gacha]');
    if (g) { doGacha(); return; }

    var rw = closestEl(t, '[data-reward]');
    if (rw) { redeem(rw.getAttribute('data-reward')); return; }

    var tk = closestEl(t, '[data-tk]');
    if (tk) { markTicketUsed(tk.getAttribute('data-tk')); return; }

    var dx = closestEl(t, '[data-dex]');
    if (dx) {
      var dc = creatureById(dx.getAttribute('data-dex'));
      if (dc && activeChild().dex.indexOf(dc.id) !== -1) cryTap(dx, dc.dex, dc.types);
      dexDetail(dx.getAttribute('data-dex'));
      return;
    }

    var bd = closestEl(t, '[data-build]');
    if (bd) { buildItem(bd.getAttribute('data-build')); return; }

    var mv = closestEl(t, '[data-move]');
    if (mv) { moveItem(mv.getAttribute('data-move')); return; }

    var ht = closestEl(t, '[data-heart]');
    if (ht) { toggleHeart(ht.getAttribute('data-heart')); return; }

    var p = closestEl(t, '[data-p]');
    if (p) {
      var op = p.getAttribute('data-p');
      var id = p.getAttribute('data-id');
      if (op === 'edit-kid') {
        editChild = p.getAttribute('data-k') === 'c2' ? 'c2' : 'c1';
        SFX.tap();
        renderModal();
        return;
      }
      if (op === 'quest-add') { questForm(null); return; }
      if (op === 'quest-edit') { questForm(findQuest(editChild, id)); return; }
      if (op === 'reward-add') { rewardForm(null); return; }
      if (op === 'reward-edit') { rewardForm(findReward(id)); return; }
      if (op === 'quest-del') {
        var qq = findQuest(editChild, id);
        askConfirm('퀘스트 삭제', '<b>' + esc(qq ? qq.title : '') + '</b> 퀘스트를 지울까요?', function () {
          state.children[editChild].quests = state.children[editChild].quests.filter(function (x) { return x.id !== id; });
          Object.keys(state.children).forEach(function (ck) { delete state.children[ck].done[id]; });
          save(); render(); renderModal(); toast('퀘스트를 지웠어요');
        }, '삭제');
        return;
      }
      if (op === 'reward-del') {
        var rr = findReward(id);
        askConfirm('보상 삭제', '<b>' + esc(rr ? rr.title : '') + '</b> 보상을 지울까요?', function () {
          state.rewards = state.rewards.filter(function (x) { return x.id !== id; });
          save(); render(); renderModal(); toast('보상을 지웠어요');
        }, '삭제');
        return;
      }
      if (op === 'reset-today') {
        askConfirm('오늘 기록 초기화', '두 아이의 오늘 퀘스트 완료 기록을 모두 지울까요?', function () {
          Object.keys(state.children).forEach(function (ck) {
            state.children[ck].done = {};
            state.children[ck].lastAllPrev = null;
            state.children[ck].bonus90 = null;
          });
          save(); render(); renderModal(); toast('오늘 기록을 지웠어요');
        }, '초기화');
        return;
      }
      if (op === 'reset-grow') {
        var gk = p.getAttribute('data-k');
        var gks = gk === 'all' ? ['c1', 'c2'] : [gk];
        var gnames = gks.map(function (x) { return state.children[x].name; }).join(' · ');
        askConfirm('🔄 아이 성장 초기화',
          '<b>' + esc(gnames) + '</b>의 성장 기록을 처음으로 되돌릴까요?<br><br>'
          + '레벨·XP·코인·도감·마을이 0이 되고, 오늘 완료 체크와 연속 기록도 지워져요. '
          + '파트너 포켓몬도 1단계로 돌아가요.<br><br>'
          + '<b>퀘스트·보상 목록, 상점 쿠폰은 그대로 남아요.</b>',
          function () {
            gks.forEach(function (x) { resetGrowth(x); });
            save(); render(); renderModal();
            toast(gnames + ' 성장을 초기화했어요');
          }, '초기화');
        return;
      }
      if (op === 'pin-save') {
        var el = document.getElementById('pinNew');
        var v = ((el && el.value) || '').trim();
        if (!/^\d{4}$/.test(v)) { toast('숫자 4자리로 입력해 주세요'); return; }
        state.pin = v;
        save();
        if (el) el.value = '';
        toast('PIN을 ' + v + '로 바꿨어요');
        return;
      }
      if (op === 'ntfy-toggle') {
        state.ntfy = state.ntfy || { topic: NTFY_TOPIC };
        state.ntfy.on = state.ntfy.on === false;
        save();
        renderModal();
        toast(state.ntfy.on ? '알림을 켰어요' : '알림을 껐어요');
        return;
      }
      if (op === 'ntfy-save') {
        var tEl = document.getElementById('ntfyTopic');
        var tv = ((tEl && tEl.value) || '').trim();
        if (!TOPIC_RE.test(tv)) { toast('영문·숫자·-·_ 로 3~60자 토픽을 입력해 주세요'); return; }
        state.ntfy = state.ntfy || {};
        state.ntfy.topic = tv;
        save();
        renderModal();
        toast('알림 토픽을 저장했어요');
        return;
      }
      if (op === 'ntfy-test') {
        ntfySend('🔔 테스트 알림', '포켓몬 퀘스트 알림이 잘 도착해요!');
        toast('테스트 알림을 보냈어요');
        return;
      }
      if (op === 'export') { exportJSON(); return; }
    }

    if (t.closest && t.closest('#soundBtn')) {
      state.sound = !state.sound;
      save();
      if (state.sound) SFX.tap();
      render();
      toast(state.sound ? '소리를 켰어요' : '소리를 껐어요');
      return;
    }
    if (t.closest && t.closest('#parentBtn')) {
      if (parentUnlocked) openParentPanel();
      else askPin('보호자만 설정을 바꿀 수 있어요', openParentPanel);
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id === 'chatText') {
      chatDraft = t.value;
      if (t.style) {
        t.style.height = 'auto';
        t.style.height = Math.min(110, t.scrollHeight) + 'px';
      }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'importFile') {
      if (t.files && t.files[0]) importFile(t.files[0]);
      return;
    }
    var p = t.getAttribute ? t.getAttribute('data-p') : null;
    if (p === 'name' || p === 'grade' || p === 'avatar') {
      var k = t.getAttribute('data-k');
      var ch = state.children[k];
      if (!ch) return;
      var v = String(t.value || '').trim();
      if (!v) {
        t.value = ch[p];
        return;
      }
      ch[p] = v.slice(0, 12);
      save();
      render();
      toast('저장했어요');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!modalStack.length) {
      if (e.target && e.target.id === 'chatText' && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
      return;
    }
    if (e.key === 'Escape') { closeModal(); return; }
    var top = modalStack[modalStack.length - 1];
    if (top && top.title && top.title.indexOf('보호자 모드') !== -1 && pinActive) {
      if (/^[0-9]$/.test(e.key)) pinPress(e.key);
      else if (e.key === 'Backspace') pinPress('del');
      else if (e.key === 'Enter') pinPress('ok');
    }
  });

  /* ============================================================
     ⏰ 화면 사용 시간 제한 (5분)
     - 화면이 보이는 동안에만 시간이 흘러요.
     - 누적 시간은 localStorage에 저장되어 새로고침으로 초기화되지 않아요.
     - 3분 이상 화면을 닫아 두었다가 돌아오면 푹 쉰 것으로 보고 새로 시작해요.
     ============================================================ */
  var USAGE_KEY = 'pokemon_quest_usage_v1';
  var USE_LIMIT = 300;   /* 5분 */
  var USE_BREAK = 180;   /* 3분 쉬면 리셋 */
  var USE_WARN = 270;    /* 4분 30초에 살짝 알려 줌 */
  var usage = { acc: 0, last: 0 };
  var useStart = 0;      /* 지금 세션을 세기 시작한 시각(ms). 0이면 멈춤 */
  var useWarned = false;
  var useUp = false;
  var useTick = null;

  function useLoad() {
    var raw = null;
    try { raw = window.localStorage.getItem(USAGE_KEY); } catch (e) { raw = null; }
    var acc = 0, last = 0;
    if (raw) {
      try {
        var o = JSON.parse(raw);
        acc = Number(o && o.acc);
        last = Number(o && o.last);
      } catch (e) { acc = 0; last = 0; }
    }
    if (!isFinite(acc) || acc < 0) acc = 0;
    if (!isFinite(last) || last < 0) last = 0;
    var now = Date.now();
    if (!last || now - last >= USE_BREAK * 1000) acc = 0;   /* 충분히 쉬었으면 새로 */
    usage.acc = Math.min(acc, USE_LIMIT + 120);
    usage.last = last;
  }

  function useSave() {
    try {
      window.localStorage.setItem(USAGE_KEY, JSON.stringify({ acc: Math.round(usage.acc), last: usage.last }));
    } catch (e) { /* 저장 불가 환경 */ }
  }

  function useElapsed() {
    var e = usage.acc;
    if (useStart) e += (Date.now() - useStart) / 1000;
    return e;
  }

  /* 세션 시간을 누적에 접어 넣기 (저장용) */
  function useFold() {
    if (!useStart) return;
    var now = Date.now();
    usage.acc += (now - useStart) / 1000;
    useStart = now;
    usage.last = now;
    useSave();
  }

  function usePaint() {
    var pill = document.getElementById('usePill');
    if (!pill) return;
    var left = Math.max(0, Math.ceil(USE_LIMIT - useElapsed()));
    var mm = Math.floor(left / 60);
    var ss = left % 60;
    pill.textContent = '⏰ ' + mm + ':' + (ss < 10 ? '0' : '') + ss;
    pill.classList.toggle('warn', !useUp && left <= 60);
    pill.classList.toggle('hot', !useUp && left <= 30);
    pill.setAttribute('aria-label', '화면 사용 시간 ' + mm + '분 ' + ss + '초 남았어요');
  }

  function useResume() {
    if (useUp || useStart) return;
    var now = Date.now();
    if (usage.last && now - usage.last >= USE_BREAK * 1000) {
      usage.acc = 0;
      useWarned = false;
    }
    useStart = now;
    usage.last = now;
    usePaint();
  }

  function usePause() {
    if (!useStart) return;
    usage.acc += (Date.now() - useStart) / 1000;
    useStart = 0;
    usage.last = Date.now();
    useSave();
    usePaint();
  }

  function useShowTimeUp() {
    if (useUp) return;
    useUp = true;
    usePause();                       /* 경고창 뒤로는 더 세지 않음 */
    usePaint();
    var el = document.getElementById('timeup');
    if (el) {
      el.classList.add('show');
      el.setAttribute('aria-hidden', 'false');
      document.body.classList.add('tu-open');
      try {
        tone(784, 0, 0.18, 'sine', 0.09);
        tone(587, 0.16, 0.24, 'sine', 0.09);
      } catch (e) { /* noop */ }
      setTimeout(function () {
        var b = document.getElementById('timeupPin');
        if (b && b.focus) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } }
      }, 80);
    }
  }

  function useHideTimeUp() {
    useUp = false;
    var el = document.getElementById('timeup');
    if (el) {
      el.classList.remove('show');
      el.setAttribute('aria-hidden', 'true');
    }
    document.body.classList.remove('tu-open');
  }

  /* 보호자 PIN을 통과하면 5분 연장 (누적에서 5분을 덜어 냄) */
  function useExtend() {
    var e = useElapsed();
    usage.acc = Math.max(0, e - USE_LIMIT);
    useWarned = false;
    useHideTimeUp();
    useResume();
    useSave();
    toast('5분 더 이용할 수 있어요');
  }

  function useOnVisible() {
    var now = Date.now();
    var away = usage.last ? now - usage.last : 0;
    if (useUp && away >= USE_BREAK * 1000) {
      /* 경고창이 뜬 채로 3분 넘게 쉬었으면 처음부터 */
      usage.acc = 0;
      useWarned = false;
      useHideTimeUp();
    }
    useResume();
  }

  function useStartTimer() {
    if (useTick) return;
    useTick = setInterval(function () {
      if (!useStart) { usePaint(); return; }
      var e = useElapsed();
      if (!useWarned && e >= USE_WARN && e < USE_LIMIT) {
        useWarned = true;
        toast('⏰ 곧 5분이에요! 이번 것만 마무리해 볼까요?');
      }
      if (e >= USE_LIMIT) { useShowTimeUp(); return; }
      if (Math.floor(e) % 5 === 0) useFold();
      usePaint();
    }, 1000);
  }

  function useBoot() {
    useLoad();
    usePaint();
    useStartTimer();
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) usePause();
      else useOnVisible();
    });
    window.addEventListener('pagehide', usePause);
    window.addEventListener('beforeunload', usePause);
    window.addEventListener('pageshow', function (e) {
      if (e && e.persisted) useOnVisible();
    });
    if (useElapsed() >= USE_LIMIT) setTimeout(useShowTimeUp, 250);
    else if (!document.hidden) useResume();
  }

  /* 자정이 지나면 새 하루로 */
  setInterval(function () {
    if (ensureDay()) {
      render();
      toast('새로운 하루가 시작됐어요! 오늘의 퀘스트를 확인해 보세요');
    }
  }, 30000);

  window.addEventListener('visibilitychange', function () {
    if (!document.hidden && ensureDay()) render();
  });

  /* ============================================================
     시작
     ============================================================ */
  state = load();
  ensureDay();
  initFx();
  render();
  initSync();
  useBoot();

  /* 첫 터치에 울음소리를 미리 받아 둠 (데이터 거의 안 쓰고 첫 탭이 바로 들려요) */
  document.addEventListener('pointerdown', function warm() {
    document.removeEventListener('pointerdown', warm);
    try {
      var wk = state.active;
      var wch = state.children[wk];
      prefetchCry(partnerSpec(wk, stageForLevel(levelInfo(wch.xp).level)).dex);
      wch.dex.slice(0, 6).forEach(function (id) {
        var wc = creatureById(id);
        if (wc) prefetchCry(wc.dex);
      });
    } catch (e) { /* noop */ }
  }, { once: true });

  /* 테스트/디버그용 (앱 동작에는 영향 없음) */
  window.__pqd = {
    get state() { return state; },
    render: render,
    toggleQuest: toggleQuest,
    doGacha: doGacha,
    buildItem: buildItem,
    sendChat: sendChat,
    startQuiz: startQuiz,
    answerQuiz: answerQuiz,
    get quiz() { return quiz; },
    levelInfo: levelInfo,
    stageForLevel: stageForLevel,
    creatures: CREATURES,
    villageItems: VILLAGE_ITEMS,
    setView: function (v) { view = v; render(); },
    setChatFrom: function (a) { chatFrom = a; render(); },
    todayPct: todayPct,
    sync: sync,
    initSync: initSync,
    pushSync: pushSync,
    ntfySend: ntfySend,
    ntfyCfg: ntfyCfg,
    playCry: playCry,
    pokeFX: pokeFX,
    crySynth: crySynth,
    typeFxOf: typeFxOf,
    typeBurst: typeBurst,
    fxParticles: function () { return fxParticles; },
    prefetchCry: prefetchCry,
    cryInfo: function () {
      var keys = Object.keys(cryEls);
      return { ogg: CRY_OGG_OK, cached: keys, current: cryNow ? cryNow.src : null };
    },
    cryState: function () {
      var el = cryNow;
      if (!el) return null;
      return {
        src: el.src, paused: el.paused, t: el.currentTime,
        dur: el.duration, ready: el.readyState, vol: el.volume,
        err: el.error ? el.error.code : null
      };
    },
    quizMax: QUIZ_REWARD_MAX,
    quizRewardLeft: quizRewardLeft,
    academyRec: academyRec,
    finishQuiz: finishQuiz,
    dexDetail: dexDetail,
    cryAndFX: cryAndFX,
    normalize: normalize,
    childForSend: childForSend,
    usageState: function () {
      return { elapsed: Math.round(useElapsed() * 10) / 10, limit: USE_LIMIT, up: useUp, running: !!useStart };
    },
    usageSet: function (sec) {
      usage.acc = Math.max(0, Number(sec) || 0);
      useWarned = false;
      useStart = 0;
      usage.last = Date.now();
      useSave();
      if (useElapsed() >= USE_LIMIT) { useShowTimeUp(); }
      else { useHideTimeUp(); if (!document.hidden) useResume(); }
      usePaint();
      return this.usageState();
    },
    usageShow: useShowTimeUp,
    usageExtend: useExtend
  };
})();
</script>
<!-- 「📲 앱으로 설치」 한 번 누르기 버튼 (공통 스크립트) -->
<script src="./pwa-install.js?v=1" defer></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }
</script>
