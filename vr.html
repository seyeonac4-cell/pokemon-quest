<title>🥽 3D VR 체험관 · 애완동물 & 바닷속 — 채씨네</title>
<style>
/* ============================================================
   🥽 3D VR 체험관 (vr.html)
   🐾 애완동물 마을 · 🐠 바닷속 수족관 — Three.js 프로시저럴 3D
   터치 360° / 폰 기울이기 / 카드보드 양안 VR
   ============================================================ */
:root{
  --font:'Jua','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ink:#22304d; --ink2:#46567a; --muted:#7b89a8;
  --acc:#ff9d3d; --acc2:#ffd05a; --accInk:#6b3d00;
  --card:rgba(255,255,255,.95);
  --shadow:0 8px 22px rgba(20,40,80,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:linear-gradient(#8fd8ff,#dff4ff);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{text-decoration:none;color:inherit}
canvas#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;background:#0a2030}

/* ------- HUD ------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.topbar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;min-width:0}
.topbar .grow{flex:1 1 auto;min-width:4px}
.tb{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:38px;min-width:38px;padding:0 11px;border-radius:999px;background:var(--card);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:15px;font-weight:800;color:var(--ink2);
  white-space:nowrap;touch-action:manipulation;transition:transform .1s, background .2s, color .2s}
.tb:active{transform:scale(.94)}
.tb.back{font-size:17px;padding:0 10px;color:#3d4a68}
.tb.title{pointer-events:none;background:rgba(255,255,255,.9);font-size:13.5px;letter-spacing:-.02em;color:#3b4a6b;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.tb span.lbl{font-size:12.5px;font-weight:800}
.tb.on{background:linear-gradient(180deg,#fff5c9,#ffd75e);color:#6b4800;border-color:#fff3bd}

.tabs{position:absolute;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));
  display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.55);
  border:2px solid rgba(255,255,255,.85);box-shadow:var(--shadow);pointer-events:auto}
.tab{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:800;color:#5a6787;
  white-space:nowrap;transition:background .2s,color .2s,transform .1s}
.tab:active{transform:scale(.96)}
.tab.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accInk);box-shadow:0 3px 10px rgba(0,0,0,.16)}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(106px + env(safe-area-inset-top,0px));
  font-size:12px;font-weight:800;color:#33456b;background:rgba(255,255,255,.86);border-radius:999px;
  padding:7px 13px;white-space:nowrap;box-shadow:0 3px 10px rgba(24,40,80,.16);
  opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}

/* ------- 조준점 ------- */
#gaze{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:5px;pointer-events:none;opacity:.75;transition:opacity .2s}
#gaze .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.9);
  box-shadow:0 0 0 2px rgba(40,60,100,.35),0 1px 5px rgba(0,0,0,.3);transition:transform .16s,background .16s}
#gaze.lock{opacity:1}
#gaze.lock .dot{transform:scale(1.7);background:transparent;border:2px solid #ffd24a;box-shadow:0 0 12px rgba(255,215,90,.85)}
#gazeName{font-size:11.5px;font-weight:800;color:#2c3a5c;background:rgba(255,255,255,.9);
  padding:2px 9px;border-radius:999px;opacity:0;transition:opacity .18s;white-space:nowrap}
#gaze.lock #gazeName{opacity:1}
#reticleL,#reticleR{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.62);display:none}
#reticleL{left:25%;margin-left:-6px}
#reticleR{left:75%;margin-left:-6px}

/* ------- 안내 카드 ------- */
#info{position:absolute;left:50%;transform:translate(-50%,16px) scale(.94);bottom:calc(104px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;width:min(90vw,380px);padding:10px 14px 10px 10px;border-radius:20px;
  background:var(--card);border:2px solid #fff;box-shadow:0 12px 30px rgba(20,40,80,.28);
  opacity:0;pointer-events:none;transition:opacity .26s, transform .26s}
#info.show{opacity:1;transform:translate(-50%,0) scale(1)}
#iemo{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(160deg,#fff2c8,#ffd977)}
#iname{font-size:16px;font-weight:900;color:#22304d;letter-spacing:-.02em}
#idesc{font-size:12.5px;font-weight:700;color:#5d6b8a;margin-top:1px;line-height:1.3}

/* ------- 아래쪽 조작 ------- */
#bottom{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 14px;pointer-events:none}
#actBtn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 26px;
  border-radius:999px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accInk);
  font-size:17px;font-weight:900;letter-spacing:-.02em;border:3px solid #fff;
  box-shadow:0 10px 24px rgba(120,70,0,.32);transition:transform .1s,filter .2s}
#actBtn .ae{font-size:23px;line-height:1}
#actBtn:active{transform:scale(.94);filter:brightness(.97)}
#zoom{position:absolute;left:12px;bottom:0;display:flex;flex-direction:column;gap:7px;pointer-events:auto}
#zoom button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #fff;
  box-shadow:var(--shadow);font-size:16px;font-weight:900;color:#4a5a7c;display:grid;place-items:center}
#zoom button:active{transform:scale(.93)}
#sndBtn{position:absolute;right:12px;bottom:0;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;pointer-events:auto}
#sndBtn:active{transform:scale(.93)}

#toast{position:absolute;left:50%;transform:translate(-50%,6px);bottom:calc(150px + env(safe-area-inset-bottom,0px));
  padding:8px 15px;border-radius:14px;background:rgba(30,40,66,.9);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 22px rgba(10,20,40,.32);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  max-width:82vw;text-align:center;word-break:keep-all}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ------- VR 모드 ------- */
#vrExit{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));
  display:none;pointer-events:auto}
#vrExit button{height:34px;padding:0 14px;border-radius:999px;background:rgba(20,28,44,.55);color:#fff;
  border:1px solid rgba(255,255,255,.4);font-size:12.5px;font-weight:800;backdrop-filter:blur(4px)}
body.vr .topbar,body.vr .tabs,body.vr #bottom,body.vr #hint,body.vr #info,body.vr #gaze,body.vr #toast{display:none}
body.vr #vrExit,body.vr #reticleL,body.vr #reticleR{display:block}
body.vr #reticleL,body.vr #reticleR{display:block}

/* ------- 로딩 ------- */
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#bfe9ff,#7ec3f0 55%,#4f9ad0);
  transition:opacity .5s;color:#25405e}
#load.hide{opacity:0;pointer-events:none}
#load .lbox{display:flex;flex-direction:column;align-items:center;gap:12px}
#load .lemo{font-size:44px;letter-spacing:.05em;animation:bounce 1.2s infinite}
#ltxt{font-size:15px;font-weight:800;color:#1d3b57;text-align:center;padding:0 24px;line-height:1.5}
#load .lbar{width:150px;height:8px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden}
#load .lbar i{display:block;width:40%;height:100%;border-radius:99px;background:#fff;animation:slide 1.1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

@media (max-height:560px){
  .tabs{top:calc(48px + env(safe-area-inset-top,0px))}
  #hint{display:none}
  #info{top:calc(102px + env(safe-area-inset-top,0px));bottom:auto;width:min(64vw,340px);padding:6px 12px 6px 8px}
  #iemo{width:36px;height:36px;font-size:19px}
  #iname{font-size:14px}
  #idesc{font-size:11.5px}
  #actBtn{height:48px;font-size:15px;padding:0 20px}
  #bottom{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom,0px));font-size:12px;padding:6px 12px}
}
</style>
</head>
<body class="pet">
<canvas id="gl"></canvas>

<div id="hud">
  <div class="topbar">
    <a class="tb back" href="./apps.html" aria-label="앱 모음으로">◀</a>
    <button class="tb title" id="titleBtn">🥽 VR 체험관</button>
    <div class="grow"></div>
    <button class="tb" id="gyroBtn" aria-label="폰 기울여 보기">🧭<span class="lbl">폰</span></button>

  </div>

  <div class="tabs">

  <div id="hint">👆 손가락으로 드래그해 360° 둘러보기 · 동물을 콕 눌러봐</div>

  <div id="info">
    <div id="iemo">🐶</div>
    <div>
      <div id="iname">코기</div>

    </div>

  <div id="bottom">
    <div id="zoom">

<div id="load">

    <div class="lemo">🐾🐠</div>
    <div id="ltxt">3D 체험관 준비 중…</div>
    <div class="lbar"><i></i></div>
  </div>
</div>

<script type="module">
/* ============================================================
   0. Three.js 불러오기 (CDN 3중 fallback — world-3d.html 방식)
   ============================================================ */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js',
  'https://unpkg.com/three@0.159.0/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.module.min.js'
];
window.__errs = [];
addEventListener('error', e => { try { __errs.push(String(e.message || e.type)); } catch (_) {} });
addEventListener('unhandledrejection', e => { try { __errs.push('rejection: ' + String(e.reason)); } catch (_) {} });

const $ = s => document.querySelector(s);
let THREE = null;
for (const u of CDNS) {
  try { const m = await import(u); if (m && m.Scene) { THREE = m; break; } } catch (e) { /* next */ }
}
if (!THREE) {
  const lt = $('#ltxt'); if (lt) lt.textContent = '3D 라이브러리를 불러오지 못했어요 😢\n인터넷 연결을 확인하고 새로고침 해 주세요';
} else {
  try { boot(); } catch (e) { console.error(e); __errs.push('boot: ' + (e && e.message)); const lt = $('#ltxt'); if (lt) lt.textContent = '3D 화면을 만들지 못했어요 😢 새로고침 해 주세요'; }
}

/* ============================================================
   1. 공통 유틸
   ============================================================ */
function boot() {
  const D2R = Math.PI / 180;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerpAngle = (a, b, k) => {
    let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * k;
  };
  const rnd = (a, b) => a + Math.random() * (b - a);

  const TEXC = {};
  function tex(key, w, h, draw) {
    if (TEXC[key]) return TEXC[key];
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); draw(x, w, h);
    const t = new THREE.CanvasTexture(c);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 2;
    TEXC[key] = t; return t;
  }
  function mat(color, opts) { return new THREE.MeshLambertMaterial(Object.assign({ color }, opts || {})); }
  function box(w, h, d, color, opts) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts)); }
  function sph(r, color, opts, sx, sy, sz) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat(color, opts));
    m.scale.set(sx || 1, sy || 1, sz || 1); return m;
  }
  function cyl(rt, rb, h, color, seg, opts) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 10), mat(color, opts)); }
  function cone(r, h, color, seg, opts) { return new THREE.Mesh(new THREE.ConeGeometry(r, h, seg || 8), mat(color, opts)); }
  function place(o, x, y, z) { o.position.set(x, y, z); return o; }
  function shadowAll(g) { g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } }); }

  /* ---------- 사운드 (Web Audio 합성) ---------- */
  let AC = null;
  const SND = { muted: false };
  function ac() {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function beep(o) {
    if (SND.muted) return; const a = ac(); if (!a) return;
    const t0 = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + (o.dur || 0.2));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.dur || 0.2));
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + (o.dur || 0.2) + 0.03);
  }
  function noise(o) {
    if (SND.muted) return; const a = ac(); if (!a) return;
    const dur = o.dur || 0.3, t0 = a.currentTime + (o.delay || 0);
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 900, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    f.Q.value = o.q || 1.2;
    const g = a.createGain(); g.gain.value = o.vol || 0.16;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t0); src.stop(t0 + dur);
  }
  const sfx = {
    corgi() { beep({ f: 420, f2: 250, dur: 0.10, type: 'square', vol: 0.10 }); beep({ f: 380, f2: 220, dur: 0.11, type: 'square', vol: 0.09, delay: 0.12 }); },
    retriever() { beep({ f: 300, f2: 170, dur: 0.17, type: 'sawtooth', vol: 0.09 }); beep({ f: 260, f2: 150, dur: 0.16, type: 'sawtooth', vol: 0.08, delay: 0.19 }); },
    cat() { beep({ f: 520, f2: 760, dur: 0.20, type: 'sine', vol: 0.11 }); beep({ f: 760, f2: 430, dur: 0.26, type: 'sine', vol: 0.10, delay: 0.18 }); },
    cat2() { beep({ f: 640, f2: 900, dur: 0.16, type: 'triangle', vol: 0.10 }); beep({ f: 880, f2: 520, dur: 0.24, type: 'triangle', vol: 0.09, delay: 0.15 }); },
    rabbit() { beep({ f: 900, f2: 1500, dur: 0.08, type: 'sine', vol: 0.10 }); beep({ f: 1100, f2: 1700, dur: 0.07, type: 'sine', vol: 0.08, delay: 0.10 }); },
    chick() { beep({ f: 1700, f2: 2400, dur: 0.06, type: 'sine', vol: 0.10 }); beep({ f: 1900, f2: 2500, dur: 0.05, type: 'sine', vol: 0.09, delay: 0.09 }); beep({ f: 1600, f2: 2200, dur: 0.06, type: 'sine', vol: 0.08, delay: 0.17 }); },
    hamster() { beep({ f: 1200, f2: 1600, dur: 0.05, type: 'square', vol: 0.06 }); beep({ f: 1300, f2: 1700, dur: 0.05, type: 'square', vol: 0.05, delay: 0.08 }); },
    dolphin() { beep({ f: 1300, f2: 2300, dur: 0.22, type: 'sine', vol: 0.10 }); beep({ f: 2100, f2: 1500, dur: 0.18, type: 'sine', vol: 0.08, delay: 0.24 }); },
    turtle() { beep({ f: 300, f2: 210, dur: 0.34, type: 'triangle', vol: 0.10 }); noise({ f: 500, dur: 0.3, vol: 0.05 }); },
    nimo() { beep({ f: 760, f2: 1150, dur: 0.10, type: 'sine', vol: 0.10 }); beep({ f: 900, f2: 1300, dur: 0.09, type: 'sine', vol: 0.08, delay: 0.12 }); },
    penguin() { beep({ f: 480, f2: 340, dur: 0.16, type: 'square', vol: 0.08 }); beep({ f: 520, f2: 360, dur: 0.14, type: 'square', vol: 0.07, delay: 0.18 }); },
    ray() { noise({ f: 260, f2: 900, dur: 0.5, vol: 0.09, q: 0.7 }); beep({ f: 180, f2: 120, dur: 0.4, type: 'sine', vol: 0.07 }); },
    shark() { beep({ f: 220, f2: 150, dur: 0.26, type: 'sawtooth', vol: 0.07 }); },
    jelly() {
      [0, 0.14, 0.28].forEach((d, i) => beep({ f: 880 + i * 220, f2: 1320 + i * 260, dur: 0.3, type: 'sine', vol: 0.05, delay: d }));
    },
    bubble() { beep({ f: 260, f2: 900, dur: 0.13, type: 'sine', vol: 0.10 }); beep({ f: 380, f2: 1200, dur: 0.1, type: 'sine', vol: 0.07, delay: 0.09 }); },
    splash() { noise({ f: 1600, f2: 500, dur: 0.45, vol: 0.12, q: 0.6 }); },
    toss() { noise({ f: 700, f2: 1400, dur: 0.18, vol: 0.07, q: 1.4 }); },
    munch() { noise({ f: 320, f2: 160, dur: 0.10, vol: 0.10, q: 1.0 }); noise({ f: 280, f2: 140, dur: 0.09, vol: 0.08, q: 1.0, delay: 0.13 }); },
    tapUI() { beep({ f: 620, f2: 900, dur: 0.06, type: 'sine', vol: 0.05 }); }
  };

  /* ============================================================
     2. 텍스처 · 파티클
     ============================================================ */
  const grassT = tex('grass', 256, 256, (x, w, h) => {
    x.fillStyle = '#6ec569'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) {

  class Puffs {
    constructor(scene, texture, o) {
      o = o || {};

      const n = o.count || 80;
      for (let i = 0; i < n; i++) {

        sp.visible = false; sp.scale.set(0.3, 0.3, 1); scene.add(sp);
        sp.userData = { life: 0, max: 1 };
        this.pool.push(sp);
      }
    }
    spawn(p, o) {
      o = o || {};
      let sp = null;
      for (let i = 0; i < this.pool.length; i++) {
        const c = this.pool[(this.cursor + i) % this.pool.length];
        if (!c.visible) { sp = c; this.cursor = (this.cursor + i + 1) % this.pool.length; break; }
      }
      if (!sp) { sp = this.pool[this.cursor]; this.cursor = (this.cursor + 1) % this.pool.length; }
      sp.visible = true; sp.position.copy(p);
      const spread = o.spread != null ? o.spread : 0.6;
      sp.userData = {
        vx: (Math.random() - .5) * spread, vy: o.vy != null ? o.vy : 1.2, vz: (Math.random() - .5) * spread,
        life: 0, max: o.life || 1.6, s0: o.size || 0.32, spin: (Math.random() - .5) * 1.6, rot: Math.random() * 6.28
      };
      sp.material.opacity = 1;
      sp.material.color.set(o.color || 0xffffff);
      sp.scale.set(sp.userData.s0, sp.userData.s0, 1);
    }
    update(dt) {
      for (const sp of this.pool) {
        if (!sp.visible) continue;
        const u = sp.userData; u.life += dt;
        if (u.life >= u.max) { sp.visible = false; sp.material.opacity = 0; continue; }
        const k = u.life / u.max;
        sp.position.x += u.vx * dt; sp.position.y += u.vy * dt; sp.position.z += u.vz * dt;
        u.vy += this.gravity * dt;
        u.vx *= (1 - 0.4 * dt); u.vz *= (1 - 0.4 * dt);
        sp.material.opacity = Math.min(1, k * 6) * (1 - k) * (1 - k * 0.3);
        const sc = u.s0 * (1 + k * 0.7);
        sp.scale.set(sc, sc, 1);
        sp.material.rotation = u.rot + u.spin * u.life;
      }

    if (P.pointers.size === 2) {

  function deviceQuat(e) {
    const a = (e.alpha || 0) * D2R, b = (e.beta || 0) * D2R, g = (e.gamma || 0) * D2R;
    const so = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * D2R;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(b, a, -g, 'YXZ'));
    q.multiply(new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2));

    function addCreature(c) {
      if (!c.group && c.g) c.group = c.g;
      c.group.position.set(c.home.x, 0, c.home.z);
      c.group.rotation.y = Math.random() * 6.28;
      c.wait = Math.random() * 2; c.tgt = null; c.happy = 0; c.ate = false;
      c.group.userData.creature = c;

    function wander(c, dt) {
      const g = c.group;
      // 간식 몰려오기
      if (snack.active && !c.ate) {
        const to = snack.pos;
        const dx = to.x - g.position.x, dz = to.z - g.position.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.62) {
          const sp = (c.speed || 0.6) * 3.2 * dt;
          g.position.x += dx / d * Math.min(sp, d - 0.6);
          g.position.z += dz / d * Math.min(sp, d - 0.6);
          g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
          g.position.y = Math.abs(Math.sin(S.t * 13)) * (c.hop ? 0.2 : 0.07);
        } else {
          c.ate = true;
          sfx.munch();
          for (let i = 0; i < 6; i++) hearts.spawn(V3(g.position.x, 0.7, g.position.z), { size: 0.26, spread: 1.2, vy: 1.3, life: 1.1 });
        }
        return;
      }
      if (c.happy > 0) {
        c.happy -= dt;
        const dx = -g.position.x, dz = -g.position.z;
        const d = Math.hypot(dx, dz) || 1;
        if (d > 2.0) {
          const sp = 2.1 * dt;
          g.position.x += dx / d * sp; g.position.z += dz / d * sp;
        }
        g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-7 * dt));
        g.position.y = Math.abs(Math.sin(S.t * 11)) * 0.24;
        c.heartT = (c.heartT || 0) + dt;
        if (c.heartT > 0.16) {
          c.heartT = 0;
          hearts.spawn(V3(g.position.x, g.position.y + (c.pickY || 0.5) + 0.18, g.position.z), { size: rnd(0.18, 0.3), vy: rnd(0.6, 1.2), spread: 0.8, life: rnd(0.8, 1.2) });
        }
        return;
      }
      // 배회
      if (c.wait > 0) {
        c.wait -= dt;
        g.position.y += (0 - g.position.y) * Math.min(1, dt * 8);
        return;
      }
      if (!c.tgt) {
        c.tgt = V3(c.home.x + rnd(-c.range, c.range), 0, c.home.z + rnd(-c.range, c.range));
      }
      const dx = c.tgt.x - g.position.x, dz = c.tgt.z - g.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.22) {
        c.tgt = null; c.wait = rnd(1.0, 3.2);
        return;
      }
      const sp = (c.speed || 0.55) * dt;
      g.position.x += dx / d * Math.min(sp, d);
      g.position.z += dz / d * Math.min(sp, d);
      g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-6 * dt));
      g.position.y = Math.abs(Math.sin(S.t * (c.hop ? 8.5 : 6.5))) * (c.hop ? 0.19 : 0.045);
    }

      ham.g.rotation.z = Math.sin(t * 7) * 0.1;
      ham.head.rotation.z = Math.sin(t * 5) * 0.14;
    };

    /* --- 간식 --- */
    const snack = { active: false, pos: new THREE.Vector3(), mesh: null, until: 0 };
    function makeBone() {
      const g = new THREE.Group();
      const m = mat(0xfff6e2);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.34, 8), m); bar.rotation.z = Math.PI / 2; g.add(bar);
      [-1, 1].forEach(s => {
        [-1, 1].forEach(t => {
          const k = sph(0.075, 0xfff6e2); k.position.set(0.17 * s, 0.055 * t, 0); g.add(k);
        });
      });
      return g;
    }
    const hearts = new Puffs(sc, heartT, { count: 90, gravity: 0.55 });

    function throwSnack() {
      const dir = camera.getWorldDirection(V3(0, 0, 0)); dir.y = 0;
      if (dir.lengthSq() < 0.001) dir.set(0, 0, -1);
      dir.normalize();
      const land = V3(dir.x * rnd(5.2, 7.2), 0.13, dir.z * rnd(5.2, 7.2));
      if (land.length() > 13.5) land.multiplyScalar(13.5 / land.length());
      if (snack.mesh) sc.remove(snack.mesh);
      const mesh = makeBone(); sc.add(mesh);
      mesh.position.set(dir.x * 1.6, 1.5, dir.z * 1.6);
      mesh.rotation.set(0.4, Math.random() * 3, 0.2);
      snack.mesh = mesh; snack.active = true; snack.pos.copy(land); snack.until = S.t + 7;
      snack.land = land.clone(); snack.throwT = 0;
      sfx.toss();
      creatures.forEach(c => { c.ate = false; c.happy = 0; c.tgt = null; });
      toast('🍖 간식을 던졌어요! 다들 달려와요~');
    }
    function updateSnack(dt) {
      if (!snack.active) return;
      snack.throwT += dt;
      const k = Math.min(1, snack.throwT / 0.85);
      if (snack.mesh) {
        const from = V3(snack.land.x * 0.24, 1.5, snack.land.z * 0.24);
        snack.mesh.position.lerpVectors(from, snack.land, k);
        snack.mesh.position.y = 1.5 * (1 - k) + snack.land.y + Math.sin(k * Math.PI) * 1.5;
        snack.mesh.rotation.x += dt * 7; snack.mesh.rotation.z += dt * 5;
      }
      if (S.t > snack.until) {
        snack.active = false;
        if (snack.mesh) { sc.remove(snack.mesh); snack.mesh = null; }
      }
    }

    /* --- 업데이트 --- */
    function update(t, dt) {
      creatures.forEach(c => c.update(t, dt));
      updateSnack(dt);
      hearts.update(dt);
      clouds.forEach((c, i) => { c.position.x += Math.sin(t * 0.05 + i) * dt * 0.5; c.rotation.y += dt * 0.01; });
      butterflies.forEach((b, i) => {
        const a = t * 0.6 + b.ph;
        b.g.position.x = b.cx + Math.sin(a) * 1.6;
        b.g.position.z = b.cz + Math.cos(a * 0.8) * 1.4;
        b.g.position.y = 1.5 + Math.sin(a * 1.7) * 0.35;
        b.g.rotation.y = -a;
        const f = Math.sin(t * 18 + i) * 0.9;
        b.w1.rotation.y = f; b.w2.rotation.y = Math.PI - f;
      });
      sunGlow.material.opacity = 0.6 + Math.sin(t * 0.9) * 0.08;
    }

    return { scene: sc, update, creatures, hearts, throwSnack, cameraPos: V3(0, 1.5, 0), reset: () => { snack.active = false; if (snack.mesh) { sc.remove(snack.mesh); snack.mesh = null; } } };
  }

  /* ============================================================
     5. 🐠 바닷속 수족관

  function buildOcean() {
    const sc = new THREE.Scene();
    sc.fog = new THREE.Fog(0x0e6288, 15, 80);

    sc.add(new THREE.AmbientLight(0x6fd8ee, 0.3));

    // 모래 바닥
    const floor = new THREE.Mesh(new THREE.CircleGeometry(42, 56), new THREE.MeshLambertMaterial({ map: sandT, color: 0xd9c9a4 }));

    // 모래 언덕
    for (let i = 0; i < 9; i++) {

    // 빛줄기

        new THREE.MeshBasicMaterial({ color: 0xcff8ff, transparent: true, opacity: 0.028, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
      ray.position.set(-13 + i * 4.4, 4.4, -17 - (i % 3) * 4.0);
      ray.rotation.z = 0.11 * (i % 2 ? 1 : -1); ray.rotation.x = 0.06;
      sc.add(ray); rays.push(ray);
    }

    // 산호초 · 바위 · 해초
    const coralCols = [0xff7f9c, 0xffa06b, 0xc78bff, 0x6fe3c4, 0xffd166];
    function coral(x, z, s) {
      const g = new THREE.Group(); g.position.set(x, -3.1, z); g.scale.setScalar(s); sc.add(g);
      const col = coralCols[Math.floor(Math.random() * coralCols.length)];
      const base = cyl(0.42, 0.62, 0.7, 0x2f8f9e); base.position.y = 0.35; g.add(base);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * 6.28;
        const br = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, rnd(0.4, 0.9), 4, 6), mat(col, { emissive: col, emissiveIntensity: 0.18 }));
        br.position.set(Math.cos(a) * 0.3, 0.7 + 0.25, Math.sin(a) * 0.3);
        br.rotation.set(rnd(-0.35, 0.35), 0, Math.cos(a) * 0.5);
        g.add(br);
        const tip = sph(0.13, col, { emissive: col, emissiveIntensity: 0.3 });
        tip.position.copy(br.position).add(V3(Math.cos(a) * 0.1, 0.45, Math.sin(a) * 0.1));
        g.add(tip);
      }
      return g;
    }
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * 6.28 + 0.3, r = 9 + Math.random() * 7;

    // 부채 산호
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * 6.28, r = 9 + Math.random() * 7;
      const fan = sph(1, i % 2 ? 0xff8fb1 : 0xb08bff, { emissive: i % 2 ? 0xff5d8f : 0x8a5cff, emissiveIntensity: 0.25 }, 0.78, 0.9, 0.1);
      fan.position.set(Math.cos(a) * r, -2.3, Math.sin(a) * r);
      fan.rotation.y = Math.random() * 3; fan.rotation.z = (Math.random() - .5) * 0.4;
      fan.scale.multiplyScalar(1.0); fan.scale.z = 0.5; sc.add(fan);
    }
    // 바위
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * 6.28, r = 8 + Math.random() * 9;
      const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.35, 0.95), 0), mat(0x1f6274));
      rk.position.set(Math.cos(a) * r, -3.1 + rnd(0.1, 0.35), Math.sin(a) * r);

    }
    // 해초
    const weeds = [];
    for (let i = 0; i < 18; i++) {

      const g = new THREE.Group(); g.position.set(Math.cos(a) * r, -3.15, Math.sin(a) * r); sc.add(g);
      const n = 4 + Math.floor(Math.random() * 3);
      const blades = [];
      for (let k = 0; k < n; k++) {
        const h = rnd(1.2, 2.8);

        bl.position.set(rnd(-0.25, 0.25), h / 2, rnd(-0.25, 0.25));

    // 바위 아치 (먼 배경)

    arch.position.set(0.5, -3.1, -21); arch.rotation.z = Math.PI; sc.add(arch);
    [-4.2, 4.2].forEach(dx => {

    // 작은 물고기 떼
    const school = [];

      const f = new THREE.Group();
      const bd = new THREE.Mesh(fishGeo, mat(i % 3 ? 0x8fd8ff : 0xa8f0ff));
      bd.scale.set(0.8, 1, 2.1); f.add(bd);
      const tl = cone(0.07, 0.15, 0xbfefff, 4); tl.rotation.x = -Math.PI / 2; tl.position.z = -0.2; f.add(tl);
      sc.add(f);
      school.push({ g: f, ph: Math.random() * 6.28, r: 8.5 + Math.random() * 3.5, y: 1.2 + Math.random() * 2.0, sp: 0.15 + Math.random() * 0.06 });
    }

    // 해파리 빛망울용
    const glowSprite = new THREE.SpriteMaterial({ map: glowT, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffc0ff });

    /* ---------------- 바다 생물 ---------------- */
    const creatures = [];
    const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

    function addSea(c) {
      if (!c.group && c.g) c.group = c.g;
      c.group.userData.creature = c;
      sc.add(c.group); creatures.push(c);
      return c;
    }
    function orbit(c, o, dt) {
      c.a += o.speed * dt;
      const a = c.a;
      const x = o.cx + Math.cos(a) * o.r, z = o.cz + Math.sin(a) * o.r;
      const y = o.cy + Math.sin(S.t * (o.bob || 0.7) + a * 0.8) * (o.vamp || 0.35);
      c.group.position.set(x, y, z);
      const tx = -Math.sin(a), tz = Math.cos(a);
      c.group.rotation.y = lerpAngle(c.group.rotation.y, Math.atan2(tx, tz), 1 - Math.exp(-3.5 * dt));
      c.group.rotation.z = Math.sin(a) * (o.bank || 0.1);
      c.group.rotation.x = Math.sin(S.t * 0.8 + a) * 0.05;
    }

    /* --- 돌고래 --- */

    /* --- 펭귄 (헤엄치는) --- */
    function makePenguin() {

    /* --- 가오리 --- */

      const disc = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat(col));
      disc.scale.set(1.0, 0.22, 0.78); g.add(disc);
      const belly = sph(1, 0xdfe7ff, {}, 0.82, 0.1, 0.62); belly.position.y = -0.05; g.add(belly);
      [-1, 1].forEach(s => {
        const e = sph(0.07, 0x1b2233); e.position.set(0.3 * s, 0.13, 0.28); g.add(e);
        const bump = sph(0.11, col); bump.position.set(0.34 * s, 0.1, 0.2); g.add(bump);
      });
      const tail = new THREE.Group(); tail.position.set(0, 0, -0.62); g.add(tail);
      const t1 = cyl(0.035, 0.055, 1.1, col, 6); t1.rotation.x = Math.PI / 2; t1.position.z = -0.5; tail.add(t1);
      const t2 = cyl(0.012, 0.03, 0.5, col, 5); t2.rotation.x = Math.PI / 2; t2.position.z = -1.25; tail.add(t2);
      return { g, disc, tail };
    }
    const ray = addSea({
      id: 'ray', emoji: '🐟', name: '가오리', desc: '날개처럼 헤엄치는 바다의 연',
      sound: sfx.ray, rad: 1.3, pickY: 0, ...makeRay(),
      a: 4.4, cx: 3.4, cz: -6.4
    });
    ray.update = (t, dt) => {
      orbit(ray, { cx: 4.9, cz: -11.0, r: 3.0, cy: 2.7, speed: 0.28, vamp: 0.55, bank: 0.06 }, dt);
      ray.disc.rotation.z = Math.sin(t * 1.7) * 0.3;
      ray.disc.scale.y = 0.22 + Math.sin(t * 1.7) * 0.08;
      ray.tail.rotation.x = Math.sin(t * 1.9) * 0.18;
    };

    /* --- 아기상어 --- */
    function makeShark() {
      const g = new THREE.Group();
      const blue = 0x7ba7c9, belly = 0xf0f8ff;
      const body = sph(1, blue, {}, 0.29, 0.32, 0.75); g.add(body);
      const bel = sph(1, belly, {}, 0.23, 0.22, 0.62); bel.position.set(0, -0.11, 0.02); g.add(bel);
      const head = cone(0.26, 0.4, blue, 8); head.rotation.x = -Math.PI / 2; head.position.set(0, 0.02, 0.72); g.add(head);
      const mouth = box(0.16, 0.05, 0.1, 0x3a2b33); mouth.position.set(0, -0.09, 0.85); g.add(mouth);
      [-1, 1].forEach(s => {
        const e = sph(0.05, 0x1a2233); e.position.set(0.14 * s, 0.1, 0.62); g.add(e);
        const gl = sph(0.016, 0xffffff); gl.position.set(0.15 * s, 0.12, 0.64); g.add(gl);
        const fin = cone(0.13, 0.36, blue, 4); fin.position.set(0.26 * s, -0.08, 0.24); fin.rotation.z = 1.2 * s; fin.scale.set(1, 1, 0.45); g.add(fin);
      });
      const dorsal = cone(0.16, 0.42, blue, 4); dorsal.position.set(0, 0.32, -0.08); dorsal.rotation.x = -0.3; dorsal.scale.set(0.6, 1, 1); g.add(dorsal);
      const tail = new THREE.Group(); tail.position.set(0, 0, -0.7); g.add(tail);
      const tcon = cone(0.26, 0.42, blue, 4); tcon.position.set(0, 0, -0.2); tcon.rotation.x = -Math.PI / 2; tcon.scale.set(0.45, 1, 1.3); tail.add(tcon);
      // 이빨
      for (let i = 0; i < 5; i++) {
        const tooth = cone(0.018, 0.05, 0xffffff, 4); tooth.position.set(-0.08 + i * 0.04, -0.11, 0.87); tooth.rotation.x = Math.PI; g.add(tooth);
      }
      return { g, tail };
    }
    const shark = addSea({
      id: 'shark', emoji: '🦈', name: '아기상어', desc: '상어도 아기 땐 귀여워요. 이빨이 계속 새로 나요',
      sound: sfx.shark, rad: 1.2, pickY: 0, ...makeShark(),
      a: 3.3, cx: -1.2, cz: -9.0
    });
    shark.update = (t, dt) => {
      orbit(shark, { cx: -1.6, cz: -14.2, r: 4.0, cy: 0.35, speed: 0.33, vamp: 0.42, bank: 0.1 }, dt);
      shark.tail.rotation.y = Math.sin(t * 3.4) * 0.45;
      shark.g.rotation.y += Math.sin(t * 3.4) * 0.05;
    };

    /* --- 야광 해파리 --- */
    function makeJelly() {
      const g = new THREE.Group();
      const col = 0xffa8e6;
      const bell = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.58),
        new THREE.MeshLambertMaterial({ color: col, emissive: 0xff5cc0, emissiveIntensity: 0.85, transparent: true, opacity: 0.82 }));
      g.add(bell);
      const inner = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
        new THREE.MeshBasicMaterial({ color: 0xffe6ff, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
      inner.position.y = -0.02; g.add(inner);
      const glow = new THREE.Sprite(glowSprite.clone()); glow.scale.set(2.4, 2.4, 1); glow.position.y = 0.05; g.add(glow);
      const tentacles = [];
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * 6.28;
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.03, 0.85, 4), new THREE.MeshBasicMaterial({ color: 0xffc4f0, transparent: true, opacity: 0.75 }));
        t.position.set(Math.cos(a) * 0.26, -0.45, Math.sin(a) * 0.26);
        t.geometry.translate(0, -0.4, 0);
        g.add(t); tentacles.push({ m: t, ph: a });
      }
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * 6.28;
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.2, 4), new THREE.MeshBasicMaterial({ color: 0xff9ee0, transparent: true, opacity: 0.6 }));
        t.position.set(Math.cos(a) * 0.1, -0.6, Math.sin(a) * 0.1);
        t.geometry.translate(0, -0.55, 0);
        g.add(t); tentacles.push({ m: t, ph: a + 1 });
      }
      return { g, bell, tentacles };
    }
    const jelly = addSea({
      id: 'jelly', emoji: '🪼', name: '야광 해파리', desc: '어두운 바다에서 스스로 빛을 내는 몽글몽글',
      sound: sfx.jelly, rad: 0.9, pickY: 0.1, ...makeJelly(),
      a: 0.9, cx: 4.6, cz: -2.2
    });
    jelly.update = (t, dt) => {
      orbit(jelly, { cx: 5.7, cz: -7.6, r: 0.9, cy: 2.0, speed: 0.25, vamp: 0.6, bank: 0.05, bob: 0.9 }, dt);
      const pulse = 1 + Math.sin(t * 2.1) * 0.09;
      jelly.bell.scale.set(pulse, 1 / pulse, pulse);
      jelly.tentacles.forEach((tt, i) => {
        tt.m.rotation.x = Math.sin(t * 1.7 + tt.ph) * 0.22;
        tt.m.rotation.z = Math.cos(t * 1.4 + tt.ph) * 0.22;
      });
    };

    /* --- 물방울 --- */
    function burstBubbles() {
      const dir = camera.getWorldDirection(V3(0, 0, 0));
      const p = V3(dir.x * 2.4, -1.4, dir.z * 2.4);
      if (p.length() < 0.1) p.set(0, -1.4, -2.4);
      for (let i = 0; i < 60; i++) {
        const q = p.clone().add(V3(rnd(-0.5, 0.5), rnd(0, 0.4), rnd(-0.5, 0.5)));
        bubbles.spawn(q, { size: rnd(0.08, 0.2), vy: rnd(1.6, 3.4), spread: 1.6, life: rnd(1.4, 2.4) });
      }
      for (let i = 0; i < 10; i++) {
        const q = V3(rnd(-4, 4), -2.6, rnd(-9, -2));
        bubbles.spawn(q, { size: rnd(0.12, 0.26), vy: rnd(1.2, 2.2), spread: 0.6, life: rnd(2, 3.2) });
      }
      sfx.splash(); sfx.bubble();
      toast('🫧 뽀글뽀글~ 물방울이 올라가요!');
    }

    /* --- 업데이트 --- */
    let bubbleClock = 0;
    function update(t, dt) {
      creatures.forEach(c => c.update(t, dt));
      rays.forEach((r, i) => { r.material.opacity = 0.03 + Math.abs(Math.sin(t * 0.35 + i * 0.7)) * 0.035; });
      weeds.forEach(w => w.blades.forEach((b, i) => {
        b.m.rotation.z = Math.sin(t * 0.9 + b.ph + i) * 0.13;
        b.m.rotation.x = Math.cos(t * 0.7 + b.ph) * 0.08;
      }));
      bubbles.update(dt);
      school.forEach((f, i) => {
        const a = t * f.sp + f.ph;
        f.g.position.set(Math.cos(a) * f.r, f.y + Math.sin(a * 3 + i) * 0.22, -6 + Math.sin(a) * f.r * 0.7);
        f.g.rotation.y = -a + Math.PI / 2;
        f.g.rotation.z = Math.sin(a * 3 + i) * 0.15;
      });
      bubbleClock += dt;
      if (bubbleClock > 0.16) {
        bubbleClock = 0;
        const a = Math.random() * 6.28, r = rnd(2.5, 13);
        bubbles.spawn(V3(Math.cos(a) * r, rnd(-3, -1.2), Math.sin(a) * r), {
          size: rnd(0.07, 0.18), vy: rnd(0.7, 1.5), spread: 0.25, life: rnd(2.5, 4.2)
        });
      }
    }

    return { scene: sc, update, creatures, hearts: bubbles, throwSnack: burstBubbles, cameraPos: V3(0, 0.9, 0), reset: () => {} };
  }

  /* ============================================================
     6. 씬 전환 · 탭 · VR · 자이로 UI
     ============================================================ */
  S.scenes.pet = buildPet();
  S.scenes.ocean = buildOcean();
  S.active = S.scenes.pet;
  camera.position.copy(S.active.cameraPos);

  const sceneCamera = { pet: V3(0, 1.5, 0), ocean: V3(0, 0.9, 0) };

  function switchScene(k, silent) {
    if (!S.scenes[k]) return;
    S.active.reset && S.active.reset();
    S.key = k; S.active = S.scenes[k];
    camera.position.copy(sceneCamera[k]);
    S.yaw = 0; S.pitch = k === 'pet' ? -0.05 : 0.02; S.fovT = 70; S.fov = 70;
    document.body.classList.toggle('ocean', k === 'ocean');
    document.body.classList.toggle('pet', k === 'pet');
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.scene === k));
    const ttl = $('#titleBtn');
    if (k === 'pet') {
      document.documentElement.style.setProperty('--acc', '#ff9d3d');
      document.documentElement.style.setProperty('--acc2', '#ffd05a');
      document.documentElement.style.setProperty('--accInk', '#6b3d00');
      $('#actTxt').textContent = '간식 던지기';
      $('#actBtn').querySelector('.ae').textContent = '🍖';
      ttl.textContent = '🐾 애완동물 마을';
      if (!silent) toast('🐾 애완동물 마을에 왔어요!');
    } else {
      document.documentElement.style.setProperty('--acc', '#25c4d8');
      document.documentElement.style.setProperty('--acc2', '#88f0ff');
      document.documentElement.style.setProperty('--accInk', '#004a56');
      $('#actTxt').textContent = '물방울 뿜기';
      $('#actBtn').querySelector('.ae').textContent = '🫧';
      ttl.textContent = '🐠 바닷속 수족관';
      if (!silent) toast('🐠 바닷속으로 들어왔어요!');
    }
    S.gaze = null;
  }

  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => { sfx.tapUI(); switchScene(b.dataset.scene); });
  });

  /* ---------- 토스트 · 카드 ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }
  let infoTimer = 0;
  function showInfo(c) {
    $('#iemo').textContent = c.emoji; $('#iname').textContent = c.name; $('#idesc').textContent = c.desc;
    const el = $('#info'); el.classList.add('show');
    clearTimeout(infoTimer); infoTimer = setTimeout(() => el.classList.remove('show'), 5000);
  }

  /* ---------- 선택 · 상호작용 ---------- */
  const ray = new THREE.Raycaster();
  function pickByDir(dir) {
    const cam = camera.position;
    let best = null, bestA = 0.34;
    for (const c of S.active.creatures) {
      const p = c.group.position.clone(); p.y += (c.pickY || 0.3);
      const v = p.sub(cam); const d = v.length();
      if (d > 30 || d < 0.4) continue;
      const a = v.normalize().angleTo(dir);
      if (a < bestA) { bestA = a; best = c; }
    }
    return best;
  }
  function handleTap(cx, cy) {
    let dir;
    if (S.stereo) {
      dir = camera.getWorldDirection(V3(0, 0, 0));
    } else {
      const r = canvas.getBoundingClientRect();
      const nx = ((cx - r.left) / r.width) * 2 - 1;
      const ny = -((cy - r.top) / r.height) * 2 + 1;
      ray.setFromCamera({ x: nx, y: ny }, camera);
      dir = ray.ray.direction.clone();
    }
    const c = pickByDir(dir);
    if (c) interact(c);
    else {
      if (!S.tapHintShown) { S.tapHintShown = true; toast('동물을 화면 가운데에 두고 콕 눌러봐요 👆'); }
    }
  }
  function interact(c) {
    c.happy = 2.2;
    if (c.sound) c.sound();
    showInfo(c);
    const p = c.group.position.clone();
    p.y += (c.pickY || 0.4) + 0.25;
    if (S.key === 'pet') {
      for (let i = 0; i < 16; i++) S.active.hearts.spawn(p, { size: rnd(0.22, 0.38), vy: rnd(0.7, 1.5), spread: 1.4, life: rnd(0.9, 1.5) });
    } else {
      for (let i = 0; i < 20; i++) S.active.hearts.spawn(p, { size: rnd(0.08, 0.18), vy: rnd(1.1, 2.4), spread: 1.1, life: rnd(1.4, 2.4) });
    }
  }

  $('#actBtn').addEventListener('click', () => {
    ac();
    if (S.key === 'pet') S.scenes.pet.throwSnack(); else S.scenes.ocean.throwSnack();
  });
  $('#zoomIn').addEventListener('click', () => { setFov(S.fovT - 8); sfx.tapUI(); });
  $('#zoomOut').addEventListener('click', () => { setFov(S.fovT + 8); sfx.tapUI(); });
  $('#sndBtn').addEventListener('click', () => {
    SND.muted = !SND.muted;
    $('#sndBtn').textContent = SND.muted ? '🔇' : '🔊';
    if (!SND.muted) sfx.tapUI();
    toast(SND.muted ? '소리를 껐어요' : '소리를 켰어요');
  });

  /* ---------- VR 안경 모드 ---------- */
  function setStereo(on) {
    S.stereo = !!on;
    document.body.classList.toggle('vr', S.stereo);
    $('#vrBtn').classList.toggle('on', S.stereo);
    if (S.stereo) {
      S.fovT = 74; 
      try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      toast('🥽 카드보드에 폰을 끼우고 양쪽 눈으로 보세요');
      setTimeout(() => { if (S.stereo && document.body.classList.contains('vr')) toast(''); }, 2600);
    } else {
      S.fovT = 70;
      try { if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    }
  }
  $('#vrBtn').addEventListener('click', () => { sfx.tapUI(); setStereo(!S.stereo); });
  $('#vrExitBtn').addEventListener('click', () => { sfx.tapUI(); setStereo(false); });
  $('#gyroBtn').addEventListener('click', () => { sfx.tapUI(); if (S.gyro) { gyroOff(); toast('이제 손가락으로 둘러보세요 👆'); } else gyroOn(); });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && S.stereo) setStereo(false);
  });

  /* ---------- 리사이즈 ---------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.aspect = (S.stereo ? w / 2 : w) / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 250));
  resize();

  /* ---------- 렌더 ---------- */
  const STEREO_SHIFT = 0.0145;
  function applyView(dt) {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = (S.stereo ? w / 2 : w) / h;
    camera.fov += (S.fovT - camera.fov) * Math.min(1, dt * 9);
    S.fov = camera.fov;
    camera.updateProjectionMatrix();
    if (S.gyro && GY.has) {
      camera.quaternion.slerp(GY.target, 0.28);
    } else {
      camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
    }
  }
  function render(stereoSplit) {
    const w = window.innerWidth, h = window.innerHeight;
    if (!stereoSplit) {
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, w, h);
      renderer.render(S.active.scene, camera);
      return;
    }
    const halfW = w / 2;
    const top = camera.near * Math.tan(camera.fov * D2R / 2);
    const height = 2 * top, width = height * camera.aspect;
    const left = -0.5 * width;
    const shift = width * STEREO_SHIFT;
    renderer.setScissorTest(true);
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? -shift : shift;
      const vx = i === 0 ? 0 : halfW;
      renderer.setViewport(vx, 0, halfW, h);
      renderer.setScissor(vx, 0, halfW, h);
      camera.projectionMatrix.makePerspective(left + s, left + s + width, top, top - height, camera.near, camera.far);
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      renderer.render(S.active.scene, camera);
    }
    renderer.setScissorTest(false);
  }

  /* ---------- 조준점 갱신 ---------- */
  let gazeClock = 0;
  function updateGaze(dt) {
    gazeClock += dt;
    if (gazeClock < 0.12) return;
    gazeClock = 0;
    const dir = camera.getWorldDirection(V3(0, 0, 0));
    const c = pickByDir(dir);
    const el = $('#gaze');
    if (c) {
      el.classList.add('lock');
      $('#gazeName').textContent = c.emoji + ' ' + c.name;
    } else {
      el.classList.remove('lock');
    }
  }

  /* ---------- 메인 루프 ---------- */
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - S.last) / 1000));
    S.last = now; S.t += dt;
    applyView(dt);
    try { S.active.update(S.t, dt); } catch (e) { if (!S._updErr) { S._updErr = 1; console.error(e); } }
    render(S.stereo);
    if (!S.stereo) updateGaze(dt);
    requestAnimationFrame(loop);
  }

  /* ---------- 시작 ---------- */
  switchScene('pet', true);
  camera.position.copy(sceneCamera.pet);
  camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
  requestAnimationFrame(t => { S.last = t; loop(t); });

  setTimeout(() => {
    $('#load').classList.add('hide');
    $('#hint').classList.add('show');
    setTimeout(() => $('#hint').classList.remove('show'), 6500);
  }, 420);

  /* ---------- 테스트 훅 ---------- */
  window.__VR = {
    state() {
      return {
        scene: S.key, stereo: S.stereo, gyro: S.gyro,
        yaw: +S.yaw.toFixed(3), pitch: +S.pitch.toFixed(3), fov: +S.fov.toFixed(1),
        creatures: S.active.creatures.map(c => c.id),
        errs: window.__errs.slice(0, 8)
      };
    },
    look(yaw, pitch, fov) { S.yaw = yaw != null ? yaw : S.yaw; S.pitch = pitch != null ? pitch : S.pitch; if (fov) { S.fov = S.fovT = fov; } },
    scene(k) { switchScene(k); },
    stereo(v) { setStereo(v); },
    tap(id) { const c = S.active.creatures.find(x => x.id === id); if (c) interact(c); return !!c; },
    pos(id) { const c = S.active.creatures.find(x => x.id === id); if (!c) return null; const p = c.group.position; return { x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2) }; },
    act() { if (S.key === 'pet') S.scenes.pet.throwSnack(); else S.scenes.ocean.throwSnack(); },
    reset() { S.yaw = 0; S.pitch = 0; }
  };
}
</script>
</body>
