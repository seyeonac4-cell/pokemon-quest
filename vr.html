<meta name="mobile-web-app-capable" content="yes">

<title>🥽 3D VR 체험관 · 애완동물 & 바닷속 — 채씨네</title>
<style>
/* ============================================================
   🥽 3D VR 체험관 (vr.html)
   🐾 애완동물 마을 · 🐠 바닷속 수족관 — Three.js 프로시저럴 3D
   터치 360° / 폰 기울이기 / 카드보드 양안 VR
   ============================================================ */
:root{
  --font:'Jua','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ink:#22304d; --ink2:#46567a; --muted:#7b89a8;
  --acc:#ff9d3d; --acc2:#ffd05a; --accInk:#6b3d00;
  --card:rgba(255,255,255,.95);
  --shadow:0 8px 22px rgba(20,40,80,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:linear-gradient(#8fd8ff,#dff4ff);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{text-decoration:none;color:inherit}
canvas#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;background:#0a2030}

/* ------- 📷 AR 카메라 레이어 ------- */
#cam{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#000}
body.ar #cam{display:block}
body.ar canvas#gl{background:transparent;z-index:1}
body.ar{background:#000}
body.ar #hint{display:none}

/* ------- HUD ------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.topbar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;min-width:0}
.topbar .grow{flex:1 1 auto;min-width:4px}
.tb{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:38px;min-width:38px;padding:0 11px;border-radius:999px;background:var(--card);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:15px;font-weight:800;color:var(--ink2);
  white-space:nowrap;touch-action:manipulation;transition:transform .1s, background .2s, color .2s}
.tb:active{transform:scale(.94)}
.tb.back{font-size:17px;padding:0 10px;color:#3d4a68}
.tb.title{pointer-events:none;background:rgba(255,255,255,.9);font-size:13.5px;letter-spacing:-.02em;color:#3b4a6b;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.tb span.lbl{font-size:12.5px;font-weight:800}
.tb.on{background:linear-gradient(180deg,#fff5c9,#ffd75e);color:#6b4800;border-color:#fff3bd}
.tb.ar{background:linear-gradient(180deg,#ffe0f0,#ffa8d2);color:#7d2050;border-color:#fff}
.tb.ar.on{background:linear-gradient(180deg,#ff86bd,#ff4f96);color:#fff;border-color:#ffe3f1}
.tb .ae2{font-size:15px;line-height:1}

.tabs{position:absolute;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));
  display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.55);
  border:2px solid rgba(255,255,255,.85);box-shadow:var(--shadow);pointer-events:auto}
.tab{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:800;color:#5a6787;
  white-space:nowrap;transition:background .2s,color .2s,transform .1s}
.tab:active{transform:scale(.96)}
.tab.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accInk);box-shadow:0 3px 10px rgba(0,0,0,.16)}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(106px + env(safe-area-inset-top,0px));
  font-size:12px;font-weight:800;color:#33456b;background:rgba(255,255,255,.86);border-radius:999px;
  padding:7px 13px;white-space:nowrap;box-shadow:0 3px 10px rgba(24,40,80,.16);
  opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}

/* ------- 조준점 ------- */
#gaze{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:5px;pointer-events:none;opacity:.75;transition:opacity .2s}
#gaze .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.9);
  box-shadow:0 0 0 2px rgba(40,60,100,.35),0 1px 5px rgba(0,0,0,.3);transition:transform .16s,background .16s}
#gaze.lock{opacity:1}
#gaze.lock .dot{transform:scale(1.7);background:transparent;border:2px solid #ffd24a;box-shadow:0 0 12px rgba(255,215,90,.85)}
#gazeName{font-size:11.5px;font-weight:800;color:#2c3a5c;background:rgba(255,255,255,.9);
  padding:2px 9px;border-radius:999px;opacity:0;transition:opacity .18s;white-space:nowrap}
#gaze.lock #gazeName{opacity:1}

/* ------- 💕 쓰다듬기 배지 ------- */
#petBadge{position:absolute;left:50%;top:calc(140px + env(safe-area-inset-top,0px));
  transform:translate(-50%,8px) scale(.94);padding:8px 16px;border-radius:999px;
  background:linear-gradient(180deg,#ffe8f3,#ffc0dc);color:#8a2b5c;border:2px solid #fff;
  font-size:13.5px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;
  box-shadow:0 6px 18px rgba(150,45,95,.28);opacity:0;pointer-events:none;
  transition:opacity .18s, transform .18s}
#petBadge.show{opacity:1;transform:translate(-50%,0) scale(1)}
#reticleL,#reticleR{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.62);display:none}
#reticleL{left:25%;margin-left:-6px}
#reticleR{left:75%;margin-left:-6px}

/* ------- 안내 카드 ------- */
#info{position:absolute;left:50%;transform:translate(-50%,16px) scale(.94);bottom:calc(104px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;width:min(90vw,380px);padding:10px 14px 10px 10px;border-radius:20px;
  background:var(--card);border:2px solid #fff;box-shadow:0 12px 30px rgba(20,40,80,.28);
  opacity:0;pointer-events:none;transition:opacity .26s, transform .26s}
#info.show{opacity:1;transform:translate(-50%,0) scale(1)}
#iemo{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(160deg,#fff2c8,#ffd977)}
#iname{font-size:16px;font-weight:900;color:#22304d;letter-spacing:-.02em}
#idesc{font-size:12.5px;font-weight:700;color:#5d6b8a;margin-top:1px;line-height:1.3}

/* ------- 아래쪽 조작 ------- */
#bottom{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 14px;pointer-events:none}
#actBtn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 26px;
  border-radius:999px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--accInk);
  font-size:17px;font-weight:900;letter-spacing:-.02em;border:3px solid #fff;
  box-shadow:0 10px 24px rgba(120,70,0,.32);transition:transform .1s,filter .2s}
#actBtn .ae{font-size:23px;line-height:1}
#actBtn:active{transform:scale(.94);filter:brightness(.97)}
#zoom{position:absolute;left:12px;bottom:0;display:flex;flex-direction:column;gap:7px;pointer-events:auto}
#zoom button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #fff;
  box-shadow:var(--shadow);font-size:16px;font-weight:900;color:#4a5a7c;display:grid;place-items:center}
#zoom button:active{transform:scale(.93)}
#sndBtn{position:absolute;right:12px;bottom:0;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;pointer-events:auto}
#sndBtn:active{transform:scale(.93)}

#toast{position:absolute;left:50%;transform:translate(-50%,6px);bottom:calc(150px + env(safe-area-inset-bottom,0px));
  padding:8px 15px;border-radius:14px;background:rgba(30,40,66,.9);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 22px rgba(10,20,40,.32);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  max-width:82vw;text-align:center;word-break:keep-all}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ------- 📷 AR 모드 버튼 줄 ------- */
#arBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top,0px));
  display:none;gap:7px;pointer-events:auto}
body.ar #arBar{display:flex}
#arBar button{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:999px;
  background:rgba(255,255,255,.94);border:2px solid #fff;box-shadow:var(--shadow);
  font-size:13.5px;font-weight:900;color:#3d4a68;white-space:nowrap;transition:transform .1s}
#arBar button:active{transform:scale(.94)}
#arBar b{font-weight:900;color:#c2457e}
body.ar #gaze .dot{background:rgba(255,255,255,.95)}

/* ------- VR 모드 ------- */
#vrExit{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));
  display:none;pointer-events:auto}
#vrExit button{height:34px;padding:0 14px;border-radius:999px;background:rgba(20,28,44,.55);color:#fff;
  border:1px solid rgba(255,255,255,.4);font-size:12.5px;font-weight:800;backdrop-filter:blur(4px)}
body.vr .topbar,body.vr .tabs,body.vr #bottom,body.vr #hint,body.vr #info,body.vr #gaze,body.vr #toast{display:none}
body.vr #vrExit,body.vr #reticleL,body.vr #reticleR{display:block}
body.vr #reticleL,body.vr #reticleR{display:block}

/* ------- 로딩 ------- */
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#bfe9ff,#7ec3f0 55%,#4f9ad0);
  transition:opacity .5s;color:#25405e}
#load.hide{opacity:0;pointer-events:none}
#load .lbox{display:flex;flex-direction:column;align-items:center;gap:12px}
#load .lemo{font-size:44px;letter-spacing:.05em;animation:bounce 1.2s infinite}
#ltxt{font-size:15px;font-weight:800;color:#1d3b57;text-align:center;padding:0 24px;line-height:1.5}
#load .lbar{width:150px;height:8px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden}
#load .lbar i{display:block;width:40%;height:100%;border-radius:99px;background:#fff;animation:slide 1.1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

@media (max-height:560px){
  .tabs{top:calc(48px + env(safe-area-inset-top,0px))}
  #hint{display:none}
  #info{top:calc(102px + env(safe-area-inset-top,0px));bottom:auto;width:min(64vw,340px);padding:6px 12px 6px 8px}
  #iemo{width:36px;height:36px;font-size:19px}
  #iname{font-size:14px}
  #idesc{font-size:11.5px}
  #actBtn{height:48px;font-size:15px;padding:0 20px}
  #bottom{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom,0px));font-size:12px;padding:6px 12px}
  #arBar{top:calc(96px + env(safe-area-inset-top,0px))}
  #arBar button{height:32px;font-size:12.5px;padding:0 11px}
}
</style>
</head>
<body class="pet">
<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted webkit-playsinline></video>

<div id="hud">
  <div class="topbar">
    <a class="tb back" href="./apps.html" aria-label="앱 모음으로">◀</a>
    <button class="tb title" id="titleBtn">🥽 VR 체험관</button>
    <div class="grow"></div>

  </div>

  <div class="tabs">

  <div id="gaze"><span class="dot"></span><span id="gazeName"></span></div>

      <div id="iname">아기 비숑</div>

  </div>

  <div id="arBar">
    <button id="shotBtn" aria-label="AR 사진 찍기"><span>📸</span>찰칵</button>
    <button id="sizeBtn" aria-label="동물 크기 조절"><span>📏</span>크기 <b id="sizeTxt">1×</b></button>
  </div>

  <div id="vrExit"><button id="vrExitBtn">⨯ VR 종료</button></div>
  <div id="toast"></div>
</div>

<div id="load">
  <div class="lbox">
    <div class="lemo">🐾🐠</div>
    <div id="ltxt">3D 체험관 준비 중…</div>
    <div class="lbar"><i></i></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
<script type="module">
/* ============================================================
   0. Three.js 불러오기 (CDN 3중 fallback — world-3d.html 방식)
   ============================================================ */
const CDNS = [
  'three',
  'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js',
  'https://unpkg.com/three@0.159.0/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.module.min.js'
];
window.__errs = [];
addEventListener('error', e => { try { __errs.push(String(e.message || e.type)); } catch (_) {} });
addEventListener('unhandledrejection', e => { try { __errs.push('rejection: ' + String(e.reason)); } catch (_) {} });

const $ = s => document.querySelector(s);
let THREE = null;
for (const u of CDNS) {
  try { const m = await import(u); if (m && m.Scene) { THREE = m; break; } } catch (e) { /* next */ }
}
if (!THREE) {
  const lt = $('#ltxt'); if (lt) lt.textContent = '3D 라이브러리를 불러오지 못했어요 😢\n인터넷 연결을 확인하고 새로고침 해 주세요';
} else {
  try { boot(); } catch (e) { console.error(e); __errs.push('boot: ' + (e && e.message)); const lt = $('#ltxt'); if (lt) lt.textContent = '3D 화면을 만들지 못했어요 😢 새로고침 해 주세요'; }
}

/* ============================================================
   1. 공통 유틸
   ============================================================ */
function boot() {
  const D2R = Math.PI / 180;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerpAngle = (a, b, k) => {
    let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * k;
  };
  const rnd = (a, b) => a + Math.random() * (b - a);

  const TEXC = {};
  const FX = new Set();   // 📷 AR 모드에서도 카메라 위에 남겨 둘 파티클·효과(하트/물방울/간식) 오브젝트
  function tex(key, w, h, draw) {
    if (TEXC[key]) return TEXC[key];
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); draw(x, w, h);
    const t = new THREE.CanvasTexture(c);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 2;
    TEXC[key] = t; return t;
  }
  function mat(color, opts) { return new THREE.MeshLambertMaterial(Object.assign({ color }, opts || {})); }
  function box(w, h, d, color, opts) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts)); }
  function sph(r, color, opts, sx, sy, sz) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat(color, opts));
    m.scale.set(sx || 1, sy || 1, sz || 1); return m;
  }
  function cyl(rt, rb, h, color, seg, opts) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 10), mat(color, opts)); }
  function cone(r, h, color, seg, opts) { return new THREE.Mesh(new THREE.ConeGeometry(r, h, seg || 8), mat(color, opts)); }
  function place(o, x, y, z) { o.position.set(x, y, z); return o; }
  function shadowAll(g) { g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } }); }

  /* ============================================================
     📦 애니메이션 GLB 모델 (assets/models/*.glb)
     뼈대(skeleton) + 애니메이션 클립 내장 · THREE.AnimationMixer 로 상태 전환
     Quaternius · Gamideo · Vuena · Gobkit — 모두 CC0 (assets/models/CREDITS.md)
     (로드 실패하거나 CDN 이 막히면 기존 절차적 모델이 그대로 보입니다)
     ============================================================ */
  const GLB_FILE = {
    pom: 'puppy', cheese: 'cat', capybara: 'capybara', alpaca: 'llama', rabbit: 'rabbit',
    dolphin: 'dolphin', turtle: 'sea-turtle', nimo: 'clownfish', shark: 'great-white-shark', jelly: 'jellyfish'
  };
  const GLB_TUNE = {
    // size: 목표 크기(m) · by:'h' 면 높이, by:'len' 이면 가장 긴 수평 길이 · yaw: 모델 코끝 보정
    pom:      { size: 0.66, by: 'h',   yaw: 0, white: 1 },
    cheese:   { size: 0.68, by: 'h',   yaw: 0 },
    capybara: { size: 0.96, by: 'h',   yaw: 0 },
    alpaca:   { size: 1.15, by: 'h',   yaw: 0, cream: 1 },
    rabbit:   { size: 0.74, by: 'h',   yaw: 0, kMul: 16, rawOrigin: 1 },
    dolphin:  { size: 2.60, by: 'len', yaw: 0, swim: 1 },
    turtle:   { size: 1.50, by: 'len', yaw: 0, swim: 1 },
    nimo:     { size: 0.82, by: 'len', yaw: 0, swim: 1 },
    shark:    { size: 2.40, by: 'len', yaw: 0, swim: 1 },
    jelly:    { size: 1.30, by: 'h',   yaw: 0, swim: 1 }
  };
  /* 처음 시작 자세 — 동물마다 다르게 (다 같이 같은 포즈로 서 있지 않도록) */  const GLB_START = {
    pom: 'walk', cheese: 'sit', capybara: 'idle2', alpaca: 'walk', rabbit: 'idle',
    dolphin: 'swim', turtle: 'idle', nimo: 'swim', shark: 'swim', jelly: 'idle'
  };
  const GLB_CACHE = {};
  let GLTF_LOADER_P = null, SKU_P = null;
  function gltfLoader() {
    if (!GLTF_LOADER_P) {
      GLTF_LOADER_P = import('three/addons/loaders/GLTFLoader.js')
        .then(m => new m.GLTFLoader())
        .catch(e => { GLTF_LOADER_P = null; throw e; });
    }

  }
  function skelUtils() {
    if (!SKU_P) SKU_P = import('three/addons/utils/SkeletonUtils.js').catch(e => { SKU_P = null; throw e; });
    return SKU_P;

  function loadGLB(file, v) {

    return gltfLoader().then(loader => new Promise((res, rej) => {
      loader.load('./assets/models/' + file + '.glb?v=' + v, g => { GLB_CACHE[cacheKey] = g; res(g); }, undefined, rej);
    }));
  }

  /* 클립 이름 → 역할. 모델마다 이름이 달라서 규칙으로 맞춘다.
     역할: idle · idle2 · walk · run · jump · eat · sit · sleep · emote · swim */
  function clipRole(raw) {
    let n = String(raw || '').toLowerCase();
    const bar = n.lastIndexOf('|'); if (bar >= 0) n = n.slice(bar + 1);
    n = n.replace(/[\s\-]+/g, '_');
    if (!n) return null;
    if (n.indexOf('hitreact') >= 0) return null;
    if (n.indexOf('out_of_water') >= 0) return null;
    if (n.indexOf('attack') === 0) return null;
    if (n === 'death' || n === 'dead' || n === 'hit') return null;
    if (n.indexOf('jump') >= 0) return 'jump';                       // jump · jump_toidle · gallop_jump
    if (n.indexOf('swimming_impulse') >= 0) return 'jump';
    if (n.indexOf('swimming_fast') >= 0 || n === 'swim_fast') return 'run';
    if (n.indexOf('gallop') === 0 || n === 'run') return 'run';
    if (n === 'walk' || n === 'walking') return 'walk';
    if (n.indexOf('swimidle') === 0) return 'idle';
    if (n.indexOf('swimming_normal') >= 0 || n === 'swim') return 'swim';
    if (n.indexOf('eat') === 0) return 'eat';
    if (n.indexOf('sit') === 0) return 'sit';
    if (n.indexOf('sleep') === 0) return 'sleep';
    if (n.indexOf('idle_2') === 0 || n.indexOf('idle_alt') === 0 || n.indexOf('headlow') >= 0) return 'idle2';
    if (n.indexOf('gesture') === 0 || n.indexOf('call') === 0 || n.indexOf('assist') === 0) return 'emote';
    if (n.indexOf('idle') === 0) return 'idle';
    return null;
  }

  /* 비숑처럼 하얀 털 — 밝은 재질만 크림/화이트로 (눈·코는 그대로) */
  function whiteFur(mm) {
    if (!mm || !mm.color) return;
    const col = mm.color;
    const lum = 0.2126 * col.r + 0.7152 * col.g + 0.0722 * col.b;
    if (lum < 0.14) return;
    const t = clamp((lum - 0.14) / 0.6, 0, 1);
    col.setRGB(0.78 + 0.21 * t, 0.76 + 0.22 * t, 0.72 + 0.25 * t);
  }
  /* 알파카 — 갈색 털을 크림색으로 (눈·코·발굽은 그대로) */
  function creamFur(mm) {
    if (!mm || !mm.color) return;
    const col = mm.color;
    const lum = 0.2126 * col.r + 0.7152 * col.g + 0.0722 * col.b;
    if (lum < 0.05) return;
    const t = clamp((lum - 0.05) / 0.35, 0, 1);
    col.setRGB(0.70 + 0.28 * t, 0.60 + 0.35 * t, 0.45 + 0.50 * t);
  }

  function glbify(c, key) { c.glbKey = key; }

  function glbMount(c) {
    const key = c.glbKey;
    if (!key || c.glb || c.glbLoading) return;
    c.glbLoading = true;
    const tune = GLB_TUNE[key] || {};
    const file = GLB_FILE[key] || key;
    Promise.all([loadGLB(file, 3), skelUtils()]).then(([gltf, SU]) => {
      if (c.glb) return;
      const root = SU.clone(gltf.scene);
      const holder = new THREE.Group();
      holder.add(root);
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const ctr = box.getCenter(new THREE.Vector3());
      const span = tune.by === 'len' ? Math.max(size.x, size.z) : size.y;
      const k = (tune.size || 1) / Math.max(0.001, span) * (tune.kMul || 1);
      /* 일부 모델은 노드 스케일이 이상해 바운딩박스가 엉뚱하다 → 원점 기준으로만 맞춘다 */
      if (tune.rawOrigin) root.position.set(0, tune.yFix || 0, 0);
      else root.position.set(-ctr.x, -box.min.y + (tune.yFix || 0), -ctr.z);
      holder.scale.setScalar(k);
      holder.rotation.y = tune.yaw || 0;
      holder.userData.k = k;
      holder.userData.yaw = tune.yaw || 0;
      root.traverse(o => {
        if (!o.isMesh) return;

        const cloned = list.map(mm => mm ? mm.clone() : mm);

      c.role = null; c.act = null;
      c.petHeat = 0; c.idleUntil = 0; c.glanceUntil = 0;
      c.group.children.slice().forEach(ch => { if (ch !== holder) ch.visible = false; });
      c.group.add(holder);
      c.glb = holder;
      c.glbSwim = !!tune.swim;
      c.sizeH = (tune.size || 0.8) * (tune.by === 'len' ? 0.55 : 1);
      c.pickY = Math.max(c.pickY || 0, (tune.size || 1) * (c.glbSwim ? 0.22 : 0.42));
      if (!c.glbSwim) { c.speed = (c.speed || 0.5) * 0.68; c.range = (c.range || 0.8) * 0.85; }

      const start = GLB_START[key] || 'idle';
      const first = clips[start] ? start : (clips.idle ? 'idle' : Object.keys(clips)[0]);
      if (first) animSet(c, first, { fade: 0.01, rand: true });
      if (start === 'walk' || start === 'run') { c.wait = 0; c.tgt = null; }
      else { c.idleRole = first; c.idleUntil = S.t + rnd(4, 9); }
    }).catch(e => { try { console.warn('GLB 로드 실패 → 기존 모델 유지:', key, e && e.message); } catch (_) {} });
  }

  /* 상태 전환 (크로스페이드) */
  function animSet(c, role, opt) {

    const prev = c.act;

    a.clampWhenFinished = !!opt.once;
    a.timeScale = (c.animRate || 1) * (opt.rate || 1);
    const dur = (a.getClip() && a.getClip().duration) || 1;
    a.time = opt.rand ? Math.random() * Math.max(0.01, dur - 0.05) : 0;

  function pickIdle(c) {
    const has = k => !!(c.clips && c.clips[k]);
    const r = Math.random();
    if (r < 0.36) return 'idle';
    if (r < 0.64 && has('idle2')) return 'idle2';
    if (r < 0.80 && has('sit')) return 'sit';
    if (r < 0.90 && has('sleep')) return 'sleep';
    return has('idle2') ? 'idle2' : 'idle';
  }

  /* 살아있는 느낌 — 상태별 클립 자동 전환 · 점프 물리 · 쓰다듬기 반응 */
  function glbTick(t, dt) {

    if (!cs) return;
    const now = S.t;
    for (let i = 0; i < cs.length; i++) {
      const c = cs[i];

      const g = c.glb, k = g.userData.k || 1, baseYaw = g.userData.yaw || 0;

      if (c.boost > 0) c.boost = Math.max(0, c.boost - dt);

      /* 점프 포물선 */
      if (c.jumpT != null) {

        if (u >= 1) {

          if (!swim) c.group.position.y = 0;
        } else if (!swim) {

        }
      }
      if (c.squashT > 0) c.squashT = Math.max(0, c.squashT - dt);
      /* 예약된 점프(간식 먹고 기뻐서 두 번) */
      if (c.hops && c.hops.length && now >= c.hops[0].at) startHop(c, c.hops.shift().h);

      }

      if (c.oneUntil != null && now > c.oneUntil) c.oneUntil = null;

      /* --- 어떤 동작을 재생할지 --- */
      const spd = c.spd || 0;
      let role = null;
      if (c.oneUntil != null && now < c.oneUntil) {
        role = null;                                   /* 점프·먹기 원샷 유지 */
      } else if (c.eatUntil != null && now < c.eatUntil) {
        role = 'eat';
      } else if (c.petting) {
        role = (c.clips.sit && now - (c.petStartAt || 0) > 0.6) ? 'sit' : (c.clips.emote ? 'emote' : (c.clips.idle2 ? 'idle2' : 'idle'));
      } else if (swim) {
        role = c.clips.swim ? 'swim' : 'idle';
        if ((c.boost || 0) > 0 && c.clips.run) role = 'run';
      } else if (spd > 0.60) {
        role = c.clips.run ? 'run' : 'walk';
      } else if (spd > 0.05) {
        role = c.clips.walk ? 'walk' : (c.clips.swim || 'idle');
      } else {
        if (now > (c.idleUntil || 0)) {
          c.idleRole = pickIdle(c);
          c.idleUntil = now + rnd(2.4, 5.4);
          const r2 = Math.random();
          if (r2 < 0.16) c.glanceUntil = now + rnd(1.0, 1.9);        /* 힐끔 쳐다보기 */
          else if (r2 < 0.28) c.shiverT = 0.4;                        /* 몸 부르르 */
          else if (r2 < 0.36) c.hops = [{ at: now + 0.15, h: 0.26 }];  /* 깡총 */
        }
        role = c.idleRole || 'idle';
      }
      if (role) animSet(c, role, {});

      /* --- 몸짓: 쓰다듬기 부비부비 · 힐끔 쳐다보기 · 부르르 --- */
      let rz = swim ? 0 : Math.sin(t * 1.4 + c.glbPhase) * 0.012;
      let ry = baseYaw;
      const pet = c.petHeat || 0;
      if (pet > 0.01) {
        rz += Math.sin(t * 11 + c.glbPhase) * 0.13 * pet;
        ry += Math.sin(t * 7.5 + c.glbPhase) * 0.26 * pet;
      }
      if (c.shiverT > 0) { c.shiverT = Math.max(0, c.shiverT - dt); rz += Math.sin(t * 42) * 0.05; }
      if (c.glanceUntil && now < c.glanceUntil && !swim) {
        const dx = camera.position.x - c.group.position.x, dz = camera.position.z - c.group.position.z;
        c.group.rotation.y = lerpAngle(c.group.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-4.2 * dt));
      }
      /* 물속에서 휙 도는 반응 */
      if (c.spin && c.spin.t < c.spin.dur) {
        c.spin.t += dt;
        const u = Math.min(1, c.spin.t / c.spin.dur);
        ry += Math.PI * 2 * (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
      }
      g.rotation.y = ry;
      g.rotation.z = rz;
      g.rotation.x = swim ? Math.sin(t * 1.6 + c.glbPhase) * 0.03 : 0;
      /* 착지 스쿼시 */
      const sq = c.squashT > 0 ? Math.sin((c.squashT / 0.26) * Math.PI) * 0.16 : 0;
      g.scale.set(k * (1 + sq), k * (1 - sq * 0.92), k * (1 + sq));

      if (c.mixer) c.mixer.update(dt);
    }
  }

  function startHop(c, h) {
    if (c.glbSwim) { c.boost = 1.2; c.spin = { t: 0, dur: 0.6 }; return; }
    c.jumpT = 0; c.jumpDur = 0.55; c.jumpH = h || 0.4;
    if (c.glb && c.clips.jump) animSet(c, 'jump', { once: true, fade: 0.1 });
  }

  /* 콕 누르면 폴짝 — 점프 클립 + 포물선 + (물속은) 휙 회전 */
  function animPoke(c) {
    if (!c.glb) { if (!c.glbSwim) { c.jumpT = 0; c.jumpDur = 0.55; c.jumpH = 0.3; } return; }
    if (c.glbSwim) {
      c.boost = 1.8; c.spin = { t: 0, dur: 0.75 };
      if (c.clips.jump) animSet(c, 'jump', { once: true, fade: 0.1 });
      else if (c.clips.run) animSet(c, 'run', { rate: 1.5, fade: 0.12 });
      return;
    }
    if (c.clips.jump) animSet(c, 'jump', { once: true, fade: 0.1 });
    else if (c.clips.emote) animSet(c, 'emote', { once: true, fade: 0.12 });
    else if (c.clips.idle2) animSet(c, 'idle2', { fade: 0.12 });
    else c.oneUntil = S.t + 0.55;
    c.jumpT = 0; c.jumpDur = 0.62; c.jumpH = Math.min(0.5, (c.pickY || 0.4) * 0.75 + 0.14);
  }

  /* 간식 냄새 맡고 달려가 먹기 */
  function animEatStart(c) {
    c.eatUntil = S.t + 1.7;
    c.hopAfterEat = 0;
    if (c.glb && c.clips.eat) animSet(c, 'eat', { once: true, fade: 0.18 });
  }

  /* ---------- 사운드 (Web Audio 합성) ---------- */

    cat() { beep({ f: 520, f2: 760, dur: 0.20, type: 'sine', vol: 0.11 }); beep({ f: 760, f2: 430, dur: 0.26, type: 'sine', vol: 0.10, delay: 0.18 }); },

    hamster() { beep({ f: 1200, f2: 1600, dur: 0.05, type: 'square', vol: 0.06 }); beep({ f: 1300, f2: 1700, dur: 0.05, type: 'square', vol: 0.05, delay: 0.08 }); },

      noise({ f: 320, f2: 210, dur: 0.22, vol: 0.022, q: 1.6, delay: 0.04 });
    },
    munch() { noise({ f: 320, f2: 160, dur: 0.10, vol: 0.10, q: 1.0 }); noise({ f: 280, f2: 140, dur: 0.09, vol: 0.08, q: 1.0, delay: 0.13 }); },
    tapUI() { beep({ f: 620, f2: 900, dur: 0.06, type: 'sine', vol: 0.05 }); }
  };

  /* ============================================================
     2. 텍스처 · 파티클
     ============================================================ */
  const grassT = tex('grass', 256, 256, (x, w, h) => {
    x.fillStyle = '#6ec569'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) {
      const gx = Math.random() * w, gy = Math.random() * h;
      x.strokeStyle = Math.random() < 0.5 ? 'rgba(78,170,74,.5)' : 'rgba(140,224,132,.45)';
      x.lineWidth = 1 + Math.random();
      x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + (Math.random() - .5) * 6, gy - 4 - Math.random() * 5); x.stroke();
    }
    for (let i = 0; i < 70; i++) { x.fillStyle = 'rgba(255,255,255,.13)'; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 1.7, 0, 7); x.fill(); }
  });
  grassT.wrapS = grassT.wrapT = THREE.RepeatWrapping; grassT.repeat.set(16, 16);

  const sandT = tex('sand', 256, 256, (x, w, h) => {
    x.fillStyle = '#e8d7a6'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 1800; i++) {
      x.fillStyle = Math.random() < .5 ? 'rgba(210,188,138,.55)' : 'rgba(255,246,214,.55)';
      const s = 1 + Math.random() * 2.2;
      x.fillRect(Math.random() * w, Math.random() * h, s, s);
    }
  });
  sandT.wrapS = sandT.wrapT = THREE.RepeatWrapping; sandT.repeat.set(10, 10);

  const skyT = tex('skyPet', 32, 256, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#4fb6f2'); g.addColorStop(0.45, '#8fd8ff'); g.addColorStop(0.78, '#d6f2ff'); g.addColorStop(1, '#eafbff');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
  const seaT = tex('skySea', 32, 256, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#7fe3ea'); g.addColorStop(0.3, '#2aa6c4'); g.addColorStop(0.68, '#0f6a92'); g.addColorStop(1, '#063a5c');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });

  const heartT = tex('heart', 64, 64, (x, w, h) => {
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#ff5d8f'; x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 4;
    x.beginPath(); x.moveTo(32, 57);
    x.bezierCurveTo(3, 37, 5, 10, 21, 10); x.bezierCurveTo(29, 10, 32, 18, 32, 21);
    x.bezierCurveTo(32, 18, 35, 10, 43, 10); x.bezierCurveTo(59, 10, 61, 37, 32, 57);
    x.closePath(); x.fill(); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); x.ellipse(22, 22, 5, 3.4, -0.5, 0, 7); x.fill();
  });
  const bubT = tex('bubble', 64, 64, (x, w, h) => {
    x.clearRect(0, 0, w, h);
    const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
    g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(.55, 'rgba(210,246,255,.35)');
    g.addColorStop(.88, 'rgba(160,230,255,.55)'); g.addColorStop(1, 'rgba(160,230,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(32, 32, 30, 0, 7); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 2.4; x.beginPath(); x.arc(32, 32, 25, 0, 7); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.ellipse(22, 21, 5, 3.4, -0.6, 0, 7); x.fill();
  });
  const glowT = tex('glow', 64, 64, (x, w, h) => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.35, 'rgba(255,200,255,.45)'); g.addColorStop(1, 'rgba(255,160,240,0)');
    x.fillStyle = g; x.beginPath(); x.arc(32, 32, 32, 0, 7); x.fill();
  });
  const shadowT = tex('softshadow', 64, 64, (x, w, h) => {
    const g = x.createRadialGradient(32, 32, 2, 32, 32, 31);
    g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(.45, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.clearRect(0, 0, w, h); x.fillStyle = g; x.beginPath(); x.arc(32, 32, 31, 0, 7); x.fill();
  });

  class Puffs {
    constructor(scene, texture, o) {
      o = o || {};
      this.scene = scene; this.gravity = o.gravity != null ? o.gravity : 0.8;
      this.pool = []; this.cursor = 0;
      const n = o.count || 80;
      for (let i = 0; i < n; i++) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, opacity: 0, color: o.color || 0xffffff }));
        sp.visible = false; sp.scale.set(0.3, 0.3, 1); scene.add(sp);
        sp.userData = { life: 0, max: 1 };
        FX.add(sp);
        this.pool.push(sp);
      }
    }
    spawn(p, o) {
      o = o || {};
      let sp = null;
      for (let i = 0; i < this.pool.length; i++) {
        const c = this.pool[(this.cursor + i) % this.pool.length];
        if (!c.visible) { sp = c; this.cursor = (this.cursor + i + 1) % this.pool.length; break; }
      }
      if (!sp) { sp = this.pool[this.cursor]; this.cursor = (this.cursor + 1) % this.pool.length; }
      sp.visible = true; sp.position.copy(p);
      const spread = o.spread != null ? o.spread : 0.6;
      sp.userData = {
        vx: (Math.random() - .5) * spread, vy: o.vy != null ? o.vy : 1.2, vz: (Math.random() - .5) * spread,
        life: 0, max: o.life || 1.6, s0: o.size || 0.32, spin: (Math.random() - .5) * 1.6, rot: Math.random() * 6.28
      };
      sp.material.opacity = 1;
      sp.material.color.set(o.color || 0xffffff);
      sp.scale.set(sp.userData.s0, sp.userData.s0, 1);
    }
    update(dt) {
      for (const sp of this.pool) {
        if (!sp.visible) continue;
        const u = sp.userData; u.life += dt;
        if (u.life >= u.max) { sp.visible = false; sp.material.opacity = 0; continue; }
        const k = u.life / u.max;
        sp.position.x += u.vx * dt; sp.position.y += u.vy * dt; sp.position.z += u.vz * dt;
        u.vy += this.gravity * dt;
        u.vx *= (1 - 0.4 * dt); u.vz *= (1 - 0.4 * dt);
        sp.material.opacity = Math.min(1, k * 6) * (1 - k) * (1 - k * 0.3);
        const sc = u.s0 * (1 + k * 0.7);
        sp.scale.set(sc, sc, 1);
        sp.material.rotation = u.rot + u.spin * u.life;
      }
    }
  }

  /* ============================================================
     3. 상태 · 렌더러 · 카메라
     ============================================================ */
  const canvas = $('#gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x0a2030, 1);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.05, 420);
  camera.rotation.order = 'YXZ';

  const S = {
    t: 0, last: performance.now(), key: 'pet', stereo: false, gyro: false,
    yaw: 0, pitch: -0.05, fov: 70, fovT: 70,
    scenes: {}, active: null, gaze: null, dragging: false
  };

  /* ---------- 포즈(둘러보기) ---------- */
  const P = { pointers: new Map(), lastX: 0, lastY: 0, pinch: 0, moved: 0, downT: 0, multi: false };

  function setFov(v) { S.fovT = clamp(v, 32, 82); }

  canvas.addEventListener('pointerdown', e => {
    try { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); } catch (_) {}
    P.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (P.pointers.size === 1) {
      P.lastX = e.clientX; P.lastY = e.clientY; P.moved = 0; P.downT = performance.now();
      /* 동물을 짚었으면 → 쓰다듬기 모드 (카메라 회전 대신) */
      try { const hit = creatureAt(e.clientX, e.clientY); if (hit) petBegin(hit, e.clientX, e.clientY); } catch (_) {}
    }
    if (P.pointers.size === 2) {
      const [a, b] = [...P.pointers.values()];
      P.pinch = Math.hypot(a.x - b.x, a.y - b.y); P.multi = true;
    }
    ac();
  }, { passive: true });

  canvas.addEventListener('pointermove', e => {
    if (!P.pointers.has(e.pointerId)) return;
    P.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (P.pointers.size >= 2) {
      petEnd();
      const [a, b] = [...P.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (P.pinch) setFov(S.fovT - (d - P.pinch) * 0.16);
      P.pinch = d; P.moved += 99;
      return;
    }
    const dx = e.clientX - P.lastX, dy = e.clientY - P.lastY;
    P.lastX = e.clientX; P.lastY = e.clientY;
    P.moved += Math.abs(dx) + Math.abs(dy);
    /* 동물 쓰다듬는 중 → 360° 카메라 회전 금지, 쓰다듬기만 */
    if (PET.on) { petMove(e.clientX, e.clientY); return; }
    if (S.gyro) return;
    const k = 0.0042 * (S.fov / 62);
    S.yaw -= dx * k;
    S.pitch = clamp(S.pitch - dy * k, -1.35, 1.35);
  }, { passive: true });

  function endPointer(e) {
    if (!P.pointers.has(e.pointerId)) return;
    P.pointers.delete(e.pointerId);
    const quick = performance.now() - P.downT < 420;
    if (P.pointers.size === 0) {
      const petted = PET.on && PET.dist > 14;
      const petC = PET.c;
      petEnd();
      const wasTap = quick && P.moved < 18 && !P.multi && !petted;
      P.multi = false; P.pinch = 0;
      if (petted) { if (petC && S.t - (petC.petStartAt || 0) < 0.3) petStroke(petC); }
      else if (wasTap) handleTap(e.clientX, e.clientY);
    }
    if (P.pointers.size === 1) { const p = [...P.pointers.values()][0]; P.lastX = p.x; P.lastY = p.y; P.moved = 99; }
  }
  canvas.addEventListener('pointerup', endPointer, { passive: true });
  canvas.addEventListener('pointercancel', endPointer, { passive: true });

  canvas.addEventListener('wheel', e => {
    e.preventDefault(); setFov(S.fovT + (e.deltaY > 0 ? 4 : -4));
  }, { passive: false });

  /* ---------- 자이로스코프 ---------- */
  const GY = { has: false, qDev: new THREE.Quaternion(), base: new THREE.Quaternion(), target: new THREE.Quaternion(), listening: false };

  function deviceQuat(e) {
    const a = (e.alpha || 0) * D2R, b = (e.beta || 0) * D2R, g = (e.gamma || 0) * D2R;
    const so = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * D2R;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(b, a, -g, 'YXZ'));
    q.multiply(new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2));
    q.multiply(new THREE.Quaternion().setFromAxisAngle(V3(0, 0, 1), -so));
    return q;
  }
  function onOrient(e) {
    if (!S.gyro || e.alpha == null) return;
    GY.qDev.copy(deviceQuat(e));
    if (!GY.has) {
      GY.has = true;
      const cur = new THREE.Quaternion().copy(camera.quaternion);
      GY.base.copy(cur).multiply(GY.qDev.clone().invert());
    }
    GY.target.copy(GY.base).multiply(GY.qDev);
  }
  function gyroOn() {
    S.gyro = true; GY.has = false; $('#gyroBtn').classList.add('on');
    const attach = () => {
      if (GY.listening) return;
      window.addEventListener('deviceorientation', onOrient, true);
      GY.listening = true;
      setTimeout(() => {
        if (S.gyro && !GY.has) {
          toast('이 기기에선 기울임 센서를 못 찾았어요. 드래그로 둘러보세요 👆');
        } else if (S.gyro) toast('폰을 돌려서 둘러보세요 🧭');
      }, 1400);
    };
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') attach();
        else { S.gyro = false; $('#gyroBtn').classList.remove('on'); toast('센서 권한이 없어 드래그로 둘러볼게요'); }
      }).catch(() => { S.gyro = false; $('#gyroBtn').classList.remove('on'); toast('센서를 켤 수 없어 드래그로 둘러볼게요'); });
    } else attach();
  }
  function gyroOff() {
    S.gyro = false; GY.has = false; $('#gyroBtn').classList.remove('on');
    if (GY.listening) { window.removeEventListener('deviceorientation', onOrient, true); GY.listening = false; }
    // 현재 바라보던 방향을 드래그 각도로 되돌려 놓기
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    S.yaw = e.y; S.pitch = clamp(e.x, -1.35, 1.35);
  }

  /* ============================================================
     3.5 📷 AR 카메라 모드 — 현실 카메라 화면 위에 3D 동물 띄우기
     ============================================================ */
  const AR = { on: false, stream: null, video: null, scale: 1, sizeIdx: 1, err: '' };
  const AR_SIZES = [0.7, 1, 1.5, 2.1];
  const AR_FOV = 78;   // AR 은 폰 카메라처럼 조금 넓게
  const AR_CAM = {
    pet: { pos: V3(0, 1.45, -1.0), pitch: -0.12 },
    ocean: { pos: V3(0, 0.9, 0), pitch: 0.02 }
  };

  async function startCam() {
    if (AR.stream && AR.stream.active) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { AR.err = 'no-api'; return false; }
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      const v = $('#cam');
      AR.stream = st; AR.video = v;
      v.srcObject = st;
      try { v.muted = true; await v.play(); } catch (_) {}
      AR.err = '';
      return true;
    } catch (e) {
      AR.err = String((e && e.name) || e);
      AR.stream = null; AR.video = null;
      return false;
    }
  }
  function stopCam() {
    if (AR.stream) { try { AR.stream.getTracks().forEach(t => t.stop()); } catch (_) {} }
    AR.stream = null;
    const v = AR.video || $('#cam');
    if (v) { try { v.pause(); } catch (_) {} v.srcObject = null; }
    AR.video = null;
  }

  /* 배경 지형·하늘·모래판은 숨기고 동물·파티클·빛만 남긴다 */
  function arHideScenery(wrap, on) {
    if (!wrap) return;
    const sc = wrap.scene || wrap;
    if (!sc || !sc.userData) return;
    if (on) {
      if (!sc.userData.arSaved) sc.userData.arSaved = { fog: sc.fog, bg: sc.background };
      sc.fog = null; sc.background = null;
    } else if (sc.userData.arSaved) {
      sc.fog = sc.userData.arSaved.fog;
      sc.background = sc.userData.arSaved.bg;
      sc.userData.arSaved = null;
    }
    sc.children.forEach(ch => {
      if (ch.isLight || ch.userData.creature || ch.userData.keep || FX.has(ch)) return;
      ch.visible = !on;
    });
  }

  /* 바닥에 닿는 부드러운 그림자 (AR 에서만) */
  function arShadows(on) {
    const pet = S.scenes.pet;
    if (!pet) return;
    pet.creatures.forEach(c => {
      if (!c.arShadow) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: shadowT, transparent: true, opacity: 0.42, depthWrite: false, color: 0x1a2436 }));
        FX.add(sp);
        c.arShadow = sp; pet.scene.add(sp);
      }
      c.arShadow.visible = !!on;
    });
  }

  function applyArScale() {
    const k = AR.on ? AR.scale : 1;
    [S.scenes.pet, S.scenes.ocean].forEach(s => { if (s) s.creatures.forEach(c => c.group.scale.setScalar(k)); });
  }

  /* AR 에 들어가면 동물들이 있는 쪽을 바라보게 */
  function arFaceCrowd() {
    const cs = S.active.creatures; if (!cs || !cs.length) return;
    let cx = 0, cz = 0;
    cs.forEach(c => { const p = c.group.getWorldPosition(new THREE.Vector3()); cx += p.x; cz += p.z; });
    cx /= cs.length; cz /= cs.length;
    const dx = cx - camera.position.x, dz = cz - camera.position.z;
    if (Math.hypot(dx, dz) > 0.2) S.yaw = Math.atan2(-dx, -dz);
  }
  /* 씬 전환 직후에는 생물 위치가 아직 안 갱신되어 있을 수 있으니 한 번 돌리고 본다 */
  function arSnapFace() {
    try { S.active.update(S.t, 0.0001); } catch (_) {}
    arFaceCrowd();
  }

  function arCycleSize() {
    AR.sizeIdx = (AR.sizeIdx + 1) % AR_SIZES.length;
    AR.scale = AR_SIZES[AR.sizeIdx];
    applyArScale();
    const el = $('#sizeTxt'); if (el) el.textContent = AR.scale + '×';
    toast('📏 동물 크기 ' + AR.scale + '배');
    return AR.scale;
  }

  function arTick() {
    const pet = S.scenes.pet;
    if (!pet) return;
    pet.creatures.forEach(c => {
      const sh = c.arShadow;
      if (!sh || !sh.visible) return;
      sh.position.set(c.group.position.x, 0.035, c.group.position.z);
      const s = (c.rad || 0.9) * 1.55 * AR.scale;
      sh.scale.set(s, s * 0.55, 1);
    });
  }

  /* 📸 찰칵 — 카메라 화면 + 3D 동물을 한 장으로 합성해 저장 */
  function snapAr() {
    if (!AR.on) return false;
    render(false);
    const w = canvas.width, h = canvas.height;
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const g2 = out.getContext('2d');
    g2.fillStyle = '#0a2030'; g2.fillRect(0, 0, w, h);
    const v = AR.video;
    if (v && v.videoWidth) {
      const s = Math.max(w / v.videoWidth, h / v.videoHeight);
      const dw = v.videoWidth * s, dh = v.videoHeight * s;
      try { g2.drawImage(v, (w - dw) / 2, (h - dh) / 2, dw, dh); } catch (_) {}
    }
    try { g2.drawImage(canvas, 0, 0, w, h); } catch (_) {}
    sfx.tapUI();
    try {
      out.toBlob(b => {
        if (!b) return;
        const a = document.createElement('a');
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        a.download = 'AR-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.png';
        a.href = URL.createObjectURL(b);
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, 'image/png');
    } catch (_) {}
    toast('📸 찰칵! 사진을 저장했어요');
    return true;
  }

  async function setArMode(on) {
    on = !!on;
    if (on === AR.on) return AR.on;
    if (on) {
      if (S.stereo) setStereo(false);
      const ok = await startCam();
      if (!ok) {
        stopCam();
        toast('카메라 권한을 허용하면 현실 화면 위에 동물이 나타나요!');
        return false;
      }
      AR.on = true;
      document.body.classList.add('ar');
      $('#arBtn').classList.add('on');
      renderer.setClearColor(0x000000, 0);
      arHideScenery(S.scenes.pet, true);
      arHideScenery(S.scenes.ocean, true);
      arShadows(true);
      const cf = AR_CAM[S.key] || AR_CAM.pet;
      camera.position.copy(cf.pos);
      S.yaw = 0; S.pitch = cf.pitch; S.fov = S.fovT = AR_FOV;
      arSnapFace();
      applyArScale();
      sfx.tapUI();
      toast('📷 카메라 위에 동물이 나타나요! 손가락으로 돌려 보세요');
      return true;
    }
    AR.on = false;
    document.body.classList.remove('ar');
    $('#arBtn').classList.remove('on');
    renderer.setClearColor(0x0a2030, 1);
    arHideScenery(S.scenes.pet, false);
    arHideScenery(S.scenes.ocean, false);

  const COAT_A = strandAlpha('coatA', 7000, 8, 40, 6);
  const COAT_B = strandAlpha('coatB', 6200, 10, 48, 6);

  function coatLayer(mesh, amount, color, alphaMap, test, uvShift) {
    const g = mesh.geometry.clone();
    const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      const k = 1 + Math.sin(i * 2.399) * 0.42;
      p.setXYZ(i, p.getX(i) + n.getX(i) * amount * k, p.getY(i) + n.getY(i) * amount * k, p.getZ(i) + n.getZ(i) * amount * k);
      if (uvShift && uv) uv.setXY(i, uv.getX(i) + uvShift, uv.getY(i) + uvShift * 0.6);
    }
    p.needsUpdate = true; if (uvShift && uv) uv.needsUpdate = true;
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color: color, alphaMap: alphaMap, alphaTest: test == null ? 0.56 : test,
      bumpMap: FUR_B, bumpScale: 0.03, roughness: 1, metalness: 0, side: THREE.DoubleSide,
      envMapIntensity: 0.42, transparent: false
    }));
    m.position.copy(mesh.position); m.rotation.copy(mesh.rotation); m.scale.copy(mesh.scale);
    m.castShadow = false; m.receiveShadow = false;
    return m;
  }
  /* 겹겹의 결층 — 부드러운 털 실루엣 */
  function coatStack(mesh, layers, cols, step, test) {
    const out = [];
    const s0 = step || 0.0025, ds = (step ? step * 0.9 : 0.0035);
    for (let i = 0; i < layers; i++) {
      out.push(coatLayer(mesh, s0 + i * ds, cols[i % cols.length], i % 2 ? COAT_B : COAT_A, test == null ? 0.56 : test, i * 0.083));
    }
    return out;
  }

  /* 보풀 — 표면을 굴곡지게 만들어 뭉게털 느낌 (꼬리·갈기·볼) */
  function puffGeo(geo, amp, freq, seed) {
    const g = geo.clone();
    const p = g.attributes.position, n = g.attributes.normal;
    const sd = seed || 3.1;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const v = Math.sin(x * freq + sd) * Math.cos(y * freq * 1.3 - sd) + Math.sin(z * freq * 1.7 + y * freq * 0.7) * 0.7;
      const k = v * amp;
      p.setXYZ(i, x + n.getX(i) * k, y + n.getY(i) * k, z + n.getZ(i) * k);
    }
    p.needsUpdate = true;
    g.computeVertexNormals();
    return g;
  }
  /* 털 뭉치 (갈기·꼬리·볼록한 털) */
  function puffMesh(geo, mat, amp, freq, seed) {
    return new THREE.Mesh(puffGeo(geo, amp, freq || 18, seed), mat);
  }

    function makeLegs(g, o) {

    function gait(c, t, dt, amp) {
      const run = (c.spd || 0) > 0.06;
      c.ph = (c.ph || 0) + dt * (run ? 11 : 0);
      c.legs.forEach(l => {
        l.hip.rotation.x = run ? Math.sin(c.ph + l.ph) * (amp || 0.45) : Math.sin(t * 1.4 + l.ph) * 0.01;
      });
    }

    function wander(c, dt) {
      const g = c.group;
      const px = g.position.x, pz = g.position.z;
      /* 쓰다듬는 동안엔 제자리에서 기분 좋게 부비부비 */
      if (c.petting) {
        c.spd = 0; c.tgt = null;
        if (!c.glb) g.position.y += (0 - g.position.y) * Math.min(1, dt * 8);
        return;
      }
      if (snack.active && !c.ate) {
        const to = snack.pos;
        const dx = to.x + (c.snackOX || 0) - g.position.x, dz = to.z + (c.snackOZ || 0) - g.position.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.62) {
          const sp = (c.speed || 0.6) * 2.6 * dt;
          g.position.x += dx / d * Math.min(sp, d - 0.6);
          g.position.z += dz / d * Math.min(sp, d - 0.6);
          g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
          if (!c.glb) g.position.y = Math.abs(Math.sin(S.t * 13)) * (c.hop ? 0.16 : 0.04);
        } else {
          c.ate = true;
          sfx.munch();
          animEatStart(c);
          for (let i = 0; i < 6; i++) hearts.spawn(V3(g.position.x, 0.7, g.position.z), { size: 0.26, spread: 1.2, vy: 1.3, life: 1.1 });
        }
        c.spd = 1.0;
        return;
      }
      if (c.happy > 0) {
        c.happy -= dt;
        const dx = -g.position.x, dz = -g.position.z;
        const d = Math.hypot(dx, dz) || 1;
        if (d > 2.0) {
          const sp = 1.9 * dt;
          g.position.x += dx / d * sp; g.position.z += dz / d * sp;
        }
        g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-7 * dt));
        if (!c.glb) g.position.y = Math.abs(Math.sin(S.t * 11)) * 0.13;
        c.heartT = (c.heartT || 0) + dt;
        if (c.heartT > 0.16) {
          c.heartT = 0;
          hearts.spawn(V3(g.position.x, g.position.y + (c.pickY || 0.5) + 0.18, g.position.z), { size: rnd(0.18, 0.3), vy: rnd(0.6, 1.2), spread: 0.8, life: rnd(0.8, 1.2) });
        }
        c.spd = 0.9;

      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.033, 16, 12), belly);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.0105, 14, 10), wetMat(0xe79aa2, { rough: 0.3 }));

      const mouthMat = new THREE.MeshStandardMaterial({ color: 0x8a5a5a, roughness: 0.8 });
      [-1, 1].forEach(s => {
        const m = new THREE.Mesh(tubeGeo([V3(0, -0.026, 0.108), V3(s * 0.014, -0.040, 0.098), V3(s * 0.024, -0.040, 0.086)], [0.0026, 0.0022, 0.0016], 8, 6), mouthMat);
        head.add(m);

      // 큰 맑은 눈
      const rabIris = irisTex('rabIris', '#3d1a16', '#7a3a2a', '#160605');
      [-1, 1].forEach(s => {
        const e = makeEye(0.0295, { irisMap: rabIris, rimColor: 0x3a2018, sclera: 0x2a1814, irisScale: 0.92 });
        e.position.set(s * 0.048, 0.014, 0.068);
        e.rotation.y = s * 0.44; e.rotation.z = -s * 0.05;
        head.add(e);
      });
      // 짧고 앙증맞은 귀
      [-1, 1].forEach(s => {
        const ear = new THREE.Group();
        ear.position.set(s * 0.038, 0.062, -0.012);
        ear.rotation.z = -s * 0.16; ear.rotation.x = -0.12;
        const outer = new THREE.Mesh(tubeGeo([
          V3(0, 0, 0), V3(s * 0.004, 0.045, -0.004), V3(s * 0.008, 0.085, -0.008), V3(s * 0.011, 0.108, -0.008)
        ], [0.030, 0.032, 0.026, 0.012], 14, 16), furH);
        outer.scale.z = 0.55; ear.add(outer);
        const inner = new THREE.Mesh(tubeGeo([
          V3(s * 0.001, 0.006, 0.013), V3(s * 0.005, 0.045, 0.006), V3(s * 0.008, 0.09, -0.002)
        ], [0.019, 0.021, 0.008], 12, 12), furMat(0xf2c2c8, { bump: 0.02 }));
        inner.scale.z = 0.3; ear.add(inner);
        const ef = puffMesh(new THREE.SphereGeometry(0.014, 12, 10), furMat(0xfffdf7, { bump: 0.03 }), 0.004, 40, 3.9);

        head.add(ear);

      // 수염
      [-1, 1].forEach(s => {

      return { g, head, body, legs: frontLegs.concat(backLegs), frontLegs, backLegs, neck };
    }

    const rabbit = addCreature(Object.assign({
      id: 'rabbit', emoji: '🐰', name: '아기토끼', desc: '큰 눈에 짧은 귀, 아직 세상이 궁금한 솜털 아기',
      home: V3(-2.45, 0, -4.95), range: 0.95, speed: 0.46, pickY: 0.42, rad: 0.35, hop: true,
      sound: sfx.rabbit
    }, makeRabbit()));
    rabbit.update = (t, dt) => {
      wander(rabbit, dt);
      gait(rabbit, t, dt, 0.34);
      rabbit.head.rotation.x = 0.06 + Math.sin(t * 1.6) * 0.05 + (rabbit.happy > 0 ? -0.1 : 0);
      rabbit.head.rotation.y = Math.sin(t * 0.9) * 0.18;
      rabbit.head.rotation.z = Math.sin(t * 0.7) * 0.035;
    };
    /* --- 간식 --- */
    const snack = { active: false, pos: new THREE.Vector3(), mesh: null, until: 0 };
    function makeBone() {
      const g = new THREE.Group();
      const m = new THREE.MeshStandardMaterial({ color: 0xfff6e2, roughness: 0.55, bumpMap: FUR_B, bumpScale: 0.01 });
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.34, 12), m); bar.rotation.z = Math.PI / 2; g.add(bar);
      [-1, 1].forEach(s => {
        [-1, 1].forEach(t => {
          const k = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), m); k.position.set(0.17 * s, 0.055 * t, 0); g.add(k);
        });
      });
      return g;
    }
    const hearts = new Puffs(sc, heartT, { count: 90, gravity: 0.55 });

    function throwSnack() {
      const dir = camera.getWorldDirection(V3(0, 0, 0)); dir.y = 0;
      if (dir.lengthSq() < 0.001) dir.set(0, 0, -1);
      dir.normalize();
      const base = AR.on ? V3(camera.position.x, 0, camera.position.z) : V3(0, 0, 0);
      const rr = AR.on ? rnd(1.9, 3.1) : rnd(4.6, 6.4);
      const land = V3(base.x + dir.x * rr, 0.13, base.z + dir.z * rr);
      if (!AR.on && land.length() > 12.5) land.multiplyScalar(12.5 / land.length());
      if (snack.mesh) { sc.remove(snack.mesh); FX.delete(snack.mesh); }
      const mesh = makeBone(); sc.add(mesh); FX.add(mesh);
      mesh.position.set(base.x + dir.x * 1.6, 1.5, base.z + dir.z * 1.6);
      mesh.rotation.set(0.4, Math.random() * 3, 0.2);
      snack.mesh = mesh; snack.active = true; snack.pos.copy(land); snack.until = S.t + 7;
      snack.land = land.clone(); snack.throwT = 0; snack.base = base.clone();
      sfx.toss();
      creatures.forEach((c, i) => {
        c.ate = false; c.happy = 0; c.tgt = null; c.wait = 0;
        c.eatUntil = null; c.hopAfterEat = 0; c.hops = null; c.oneUntil = null;
        /* 다 같이 한 점에 뭉치지 않게 — 각자 조금씩 옆자리로 */
        const a = (i / Math.max(1, creatures.length)) * 6.28 + rnd(-0.4, 0.4);
        const rr = 0.35 + (c.rad || 0.5) * 0.55;
        c.snackOX = Math.cos(a) * rr; c.snackOZ = Math.sin(a) * rr;
      });
      toast('🍖 간식을 던졌어요! 다들 달려와요~');
    }
    function updateSnack(dt) {
      if (!snack.active) return;
      snack.throwT += dt;
      const k = Math.min(1, snack.throwT / 0.85);
      if (snack.mesh) {
        const b = snack.base || V3(0, 0, 0);
        const from = V3(b.x, 1.5, b.z);
        snack.mesh.position.lerpVectors(from, snack.land, k);
        snack.mesh.position.y = 1.5 * (1 - k) + snack.land.y + Math.sin(k * Math.PI) * 1.5;
        snack.mesh.rotation.x += dt * 7; snack.mesh.rotation.z += dt * 5;
      }
      if (S.t > snack.until) {
        snack.active = false;
        if (snack.mesh) { sc.remove(snack.mesh); FX.delete(snack.mesh); snack.mesh = null; }
      }
    }

    /* --- 업데이트 --- */
    function update(t, dt) {
      creatures.forEach(c => c.update(t, dt));
      glbTick(t, dt);
      updateSnack(dt);
      hearts.update(dt);
      clouds.forEach((c, i) => { c.position.x += Math.sin(t * 0.05 + i) * dt * 0.5; c.rotation.y += dt * 0.01; });
      butterflies.forEach((b, i) => {
        const a = t * 0.6 + b.ph;
        b.g.position.x = b.cx + Math.sin(a) * 1.6;
        b.g.position.z = b.cz + Math.cos(a * 0.8) * 1.4;
        b.g.position.y = 1.5 + Math.sin(a * 1.7) * 0.35;
        b.g.rotation.y = -a;
        const f = Math.sin(t * 18 + i) * 0.9;
        b.w1.rotation.y = f; b.w2.rotation.y = Math.PI - f;
      });
      sunGlow.material.opacity = 0.6 + Math.sin(t * 0.9) * 0.08;
    }

    return { scene: sc, update, creatures, hearts, throwSnack, cameraPos: V3(0, 1.5, 0), reset: () => { snack.active = false; if (snack.mesh) { sc.remove(snack.mesh); FX.delete(snack.mesh); snack.mesh = null; } } };
  }

  /* ============================================================
     6. 🐠 바닷속 수족관 (정예 5종 · 실사풍)
        🐬 돌고래 · 🐢 바다거북 · 🐠 흰동가리 · 🦈 아기상어 · 🪼 해파리
     ============================================================ */
  function buildOcean() {
    const sc = new THREE.Scene();
    sc.fog = new THREE.Fog(0x0d6288, 16, 86);
    sc.background = new THREE.Color(0x0a4463);
    sc.environment = envMap();

    const sky = new THREE.Mesh(new THREE.SphereGeometry(160, 32, 22), new THREE.MeshBasicMaterial({ map: seaT, side: THREE.BackSide, fog: false }));
    sc.add(sky);

    sc.add(new THREE.HemisphereLight(0xcaf7ff, 0x063246, 0.85));
    const sun = new THREE.DirectionalLight(0xe2fbff, 1.5); sun.position.set(4, 22, 8); sc.add(sun);
    const down = new THREE.DirectionalLight(0x8fe6ff, 0.55); down.position.set(-6, -6, 4); sc.add(down);
    const rim = new THREE.DirectionalLight(0x4fd6ff, 0.7); rim.position.set(-10, 6, -12); sc.add(rim);
    sc.add(new THREE.AmbientLight(0x6fd8ee, 0.34));

    // 모래 바닥
    const floor = new THREE.Mesh(new THREE.CircleGeometry(44, 72), new THREE.MeshStandardMaterial({ map: sandT, color: 0xe4d5b0, roughness: 0.95, bumpMap: FUR_B, bumpScale: 0.03 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -3.2; sc.add(floor);
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * 6.28, r = 6 + Math.random() * 16;
      const dune = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshStandardMaterial({ color: 0xf2e5bf, roughness: 0.95 }));
      dune.scale.set(rnd(2, 4), rnd(0.4, 0.9), rnd(2, 4));
      dune.position.set(Math.cos(a) * r, -3.1, Math.sin(a) * r); sc.add(dune);
    }

    // 빛줄기
    const rays = [];
    for (let i = 0; i < 8; i++) {
      const h = rnd(16, 24);
      const ray = new THREE.Mesh(new THREE.CylinderGeometry(rnd(0.10, 0.22), rnd(0.6, 1.1), h, 12, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xdffaff, transparent: true, opacity: 0.007, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
      ray.position.set(-13 + i * 4.0, 4.4, -17 - (i % 3) * 4.0);
      ray.rotation.z = 0.11 * (i % 2 ? 1 : -1); ray.rotation.x = 0.06;
      sc.add(ray); rays.push(ray);
    }

    // 산호초 · 바위 · 해초
    const coralCols = [0xff7f9c, 0xffa06b, 0xc78bff, 0x6fe3c4, 0xffd166];
    function coral(x, z, s) {
      const g = new THREE.Group(); g.position.set(x, -3.1, z); g.scale.setScalar(s); sc.add(g);
      const col = coralCols[Math.floor(Math.random() * coralCols.length)];
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.62, 0.7, 12), new THREE.MeshStandardMaterial({ color: 0x2f8f9e, roughness: 0.85 }));
      base.position.y = 0.35; g.add(base);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * 6.28;
        const br = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, rnd(0.4, 0.9), 4, 10), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8, emissive: col, emissiveIntensity: 0.12 }));
        br.position.set(Math.cos(a) * 0.3, 0.95, Math.sin(a) * 0.3);
        br.rotation.set(rnd(-0.35, 0.35), 0, Math.cos(a) * 0.5);
        g.add(br);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, emissive: col, emissiveIntensity: 0.2 }));
        tip.position.copy(br.position).add(V3(Math.cos(a) * 0.1, 0.45, Math.sin(a) * 0.1));
        g.add(tip);
      }
      return g;
    }
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * 6.28 + 0.3, r = 9 + Math.random() * 7;
      coral(Math.cos(a) * r, Math.sin(a) * r, rnd(0.5, 0.85));

    for (let i = 0; i < 5; i++) {
      const a = Math.random() * 6.28, r = 9 + Math.random() * 7;
      const fan = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshStandardMaterial({ color: i % 2 ? 0xff8fb1 : 0xb08bff, roughness: 0.8, emissive: i % 2 ? 0xff5d8f : 0x8a5cff, emissiveIntensity: 0.16 }));
      fan.scale.set(0.78, 0.9, 0.1);
      fan.position.set(Math.cos(a) * r, -2.3, Math.sin(a) * r);
      fan.rotation.y = Math.random() * 3; fan.rotation.z = (Math.random() - .5) * 0.4;
      sc.add(fan);
    }
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * 6.28, r = 8 + Math.random() * 9;
      const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.35, 0.95), 1), new THREE.MeshStandardMaterial({ color: 0x24697c, roughness: 0.95, flatShading: true }));
      rk.position.set(Math.cos(a) * r, -3.1 + rnd(0.1, 0.35), Math.sin(a) * r);
      rk.rotation.set(Math.random(), Math.random(), Math.random()); sc.add(rk);
    }
    const weeds = [];
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * 6.28, r = 7 + Math.random() * 9;
      const g = new THREE.Group(); g.position.set(Math.cos(a) * r, -3.15, Math.sin(a) * r); sc.add(g);
      const n = 4 + Math.floor(Math.random() * 3);
      const blades = [];
      for (let k = 0; k < n; k++) {
        const h = rnd(1.2, 2.8);
        const bl = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, h, 4, 8), new THREE.MeshStandardMaterial({ color: k % 2 ? 0x2f9e6a : 0x46c78a, roughness: 0.85 }));
        bl.position.set(rnd(-0.25, 0.25), h / 2, rnd(-0.25, 0.25));
        bl.rotation.z = rnd(-0.15, 0.15);
        g.add(bl); blades.push({ m: bl, ph: Math.random() * 6.28, h });
      }
      weeds.push({ blades, ph: Math.random() * 6.28 });
    }

    // 기포 · 부유물
    const bubbles = new Puffs(sc, bubT, { count: 120, gravity: -0.25 });

    // 바위 아치
    const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.85, 12, 20, Math.PI), new THREE.MeshStandardMaterial({ color: 0x1d6478, roughness: 0.95 }));
    arch.position.set(0.5, -3.1, -21); arch.rotation.z = Math.PI; sc.add(arch);
    [-4.2, 4.2].forEach(dx => {
      const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.15, 3.2, 12), new THREE.MeshStandardMaterial({ color: 0x1d6478, roughness: 0.95 }));
      pil.position.set(0.5 + dx, -1.6, -21); sc.add(pil);
    });

    // 작은 물고기 떼
    const school = [];
    const fishGeo = new THREE.SphereGeometry(1, 12, 8);
    for (let i = 0; i < 16; i++) {
      const f = new THREE.Group();
      const bd = new THREE.Mesh(fishGeo, new THREE.MeshStandardMaterial({ color: i % 3 ? 0x9fe4ff : 0xb8f2ff, roughness: 0.35, metalness: 0.1, envMapIntensity: 1 }));
      bd.scale.set(0.06, 0.08, 0.17); f.add(bd);
      const tl = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0xcdf4ff, roughness: 0.5 }));
      tl.rotation.x = -Math.PI / 2; tl.position.z = -0.19; f.add(tl);
      sc.add(f);
      school.push({ g: f, ph: Math.random() * 6.28, r: 8.5 + Math.random() * 3.5, y: 1.2 + Math.random() * 2.0, sp: 0.15 + Math.random() * 0.06 });
    }

    const glowSprite = new THREE.SpriteMaterial({ map: glowT, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffc0ff });

    /* ---------------- 바다 생물 ---------------- */
    const creatures = [];
    const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

    function addSea(c) {
      if (!c.group && c.g) c.group = c.g;
      c.group.userData.creature = c;
      sc.add(c.group); creatures.push(c);
      if (GLB_FILE[c.id]) glbify(c, c.id);
      return c;
    }
    function orbit(c, o, dt) {
      c.a += o.speed * dt;
      const a = c.a;
      const x = o.cx + Math.cos(a) * o.r, z = o.cz + Math.sin(a) * o.r;
      const y = o.cy + Math.sin(S.t * (o.bob || 0.7) + a * 0.8) * (o.vamp || 0.35);
      c.group.position.set(x, y, z);
      const tx = -Math.sin(a), tz = Math.cos(a);
      c.group.rotation.y = lerpAngle(c.group.rotation.y, Math.atan2(tx, tz), 1 - Math.exp(-3.5 * dt));
      c.group.rotation.z = Math.sin(a) * (o.bank || 0.1);
      c.group.rotation.x = Math.sin(S.t * 0.8 + a) * 0.05;
    }

    /* ============================================================
       🐬 돌고래 — 유선형 몸 · 등지느러미 · 수평 꼬리
       ============================================================ */
    const DOL_SKIN = skinTex('dolSkin', 1024, 512, (x, w, h) => {
      beltGrad(x, w, h, '#6f8296', '#f2f8fb', 0.5);
      // 등쪽 점무늬
      x.save();
      for (let i = 0; i < 900; i++) {
        const px = Math.random() * w, py = h * (0.2 + Math.random() * 0.3);
        x.fillStyle = 'rgba(255,255,255,' + (0.03 + Math.random() * 0.07).toFixed(3) + ')';
        x.beginPath(); x.arc(px, py, 1 + Math.random() * 3, 0, TAU); x.fill();
      }
      x.restore();
      // 배 쪽 회백색 경계
      const g2 = x.createLinearGradient(0, 0, 0, h);
      g2.addColorStop(0.0, 'rgba(255,255,255,0)'); g2.addColorStop(0.62, 'rgba(255,255,255,0)');
      g2.addColorStop(0.78, 'rgba(240,248,252,.55)'); g2.addColorStop(1, 'rgba(240,248,252,0)');
      x.fillStyle = g2; x.fillRect(0, 0, w, h);
    });

    function makeDolphin() {
      const g = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({
        map: DOL_SKIN, color: 0xffffff, roughness: 0.30, metalness: 0.02,
        envMapIntensity: 0.9, bumpMap: FUR_R, bumpScale: 0.004
      });
      const finMat2 = new THREE.MeshStandardMaterial({ color: 0x7b8ea1, roughness: 0.36, metalness: 0.02, envMapIntensity: 0.9, side: THREE.DoubleSide });
      const body = new THREE.Mesh(loftGeo([
        [-1.34, 0.014, 0.026, 0.0],
        [-1.14, 0.048, 0.070, 0.005],
        [-0.90, 0.100, 0.135, 0.012],
        [-0.55, 0.170, 0.205, 0.015],
        [-0.20, 0.200, 0.238, 0.012],
        [0.15, 0.198, 0.235, 0.004],
        [0.45, 0.182, 0.222, -0.004],
        [0.70, 0.150, 0.186, -0.016],
        [0.88, 0.112, 0.142, -0.028],
        [1.02, 0.078, 0.098, -0.038],
        [1.14, 0.046, 0.056, -0.046],
        [1.30, 0.026, 0.030, -0.052],
        [1.44, 0.012, 0.014, -0.056]
      ], 64, 48, 0.012), skin);

    const JEL_TEX = skinTex('jelTex', 512, 512, (x, w, h) => {

    function makeJelly() {
      const g = new THREE.Group();
      // 우산(벨) — 라테로 부드러운 종 모양
      const prof = [];
      for (let i = 0; i <= 18; i++) {
        const u = i / 18;
        const r = 0.52 * Math.sin(u * Math.PI * 0.52) / Math.sin(Math.PI * 0.52) * (1 - u * 0.18);
        prof.push(new THREE.Vector2(Math.max(0.001, r), -0.42 + u * 0.42 * 1.0));
      }
      const bellGeo = new THREE.LatheGeometry(prof, 40);
      const bellMat = new THREE.MeshPhysicalMaterial({
        color: 0xffc4f2, map: JEL_TEX, transparent: true, opacity: 0.86, roughness: 0.12, metalness: 0,
        clearcoat: 1, clearcoatRoughness: 0.1, side: THREE.DoubleSide, emissive: 0xff62c8, emissiveIntensity: 0.85,
        envMapIntensity: 1.4, depthWrite: false
      });
      const bell = new THREE.Mesh(bellGeo, bellMat);
      g.add(bell);
      // 안쪽 발광
      const inner = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16),
        new THREE.MeshBasicMaterial({ color: 0xffe6ff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
      inner.scale.y = 0.5; inner.position.y = -0.16; g.add(inner);
      const glow = new THREE.Sprite(glowSprite.clone()); glow.scale.set(2.6, 2.6, 1); glow.position.y = 0.02; g.add(glow);
      // 촉수
      const tentacles = [];
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU;
        const len = 0.9 + Math.random() * 0.5;
        const pts = [];
        for (let k = 0; k <= 5; k++) {
          const u = k / 5;

        }
        const t = new THREE.Mesh(tubeGeo(pts, [0.012, 0.010, 0.008, 0.007, 0.005, 0.003], 18, 6),

        g.add(t); tentacles.push({ m: t, ph: a, len });
      }
      // 구강 팔 (주름진 리본)
      const arms = [];
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + 0.4;
        const pts = [];
        for (let k = 0; k <= 6; k++) {
          const u = k / 6;
          pts.push(V3(Math.cos(a) * (0.10 + Math.sin(u * 5) * 0.05), -0.34 - u * 0.62, Math.sin(a) * (0.10 + Math.cos(u * 4) * 0.05)));
        }
        const t = new THREE.Mesh(tubeGeo(pts, [0.05, 0.075, 0.06, 0.05, 0.035, 0.02, 0.008], 20, 10),
          new THREE.MeshStandardMaterial({ color: 0xffd9f5, transparent: true, opacity: 0.55, roughness: 0.25, emissive: 0xff8ce0, emissiveIntensity: 0.45, depthWrite: false }));
        g.add(t); arms.push({ m: t, ph: a });
      }
      return { g, bell, tentacles, arms, glow };
    }
    const jelly = addSea(Object.assign({
      id: 'jelly', emoji: '🪼', name: '야광 해파리', desc: '어두운 바다에서 스스로 빛을 내는 몽글몽글',

  const ray = new THREE.Raycaster();
  function pickByDir(dir) {
    const cam = camera.position;

    for (const c of S.active.creatures) {
      const p = c.group.getWorldPosition(new THREE.Vector3()); p.y += (c.pickY || 0.3) * (AR.on ? AR.scale : 1);
      const v = p.sub(cam); const d = v.length();
      if (d > 30 || d < 0.4) continue;
      const a = v.normalize().angleTo(dir);
      if (a < bestA) { bestA = a; best = c; }

  }

      ray.setFromCamera({ x: nx, y: ny }, camera);

  const PET = { on: false, c: null, lastX: 0, lastY: 0, dist: 0, lastT: 0 };
  let petBadgeT = 0;
  function showPetBadge() {

  /* 화면 좌표 → 동물. 화면에서 가까운(그리고 크게 보이는) 동물이 먼저 잡힌다 */
  const TMPV = new THREE.Vector3();
  function creatureAt(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const px = (cx - r.left) / r.width, py = (cy - r.top) / r.height;
    let best = null, bestDist = 1e9;
    const tanHalf = Math.tan(camera.fov * Math.PI / 360);
    for (const c of S.active.creatures) {
      if (!c.group.visible) continue;
      const p = c.group.getWorldPosition(TMPV.set(0, 0, 0));
      p.y += (c.pickY || 0.35) * (AR.on ? AR.scale : 1);
      const dist = camera.position.distanceTo(p);
      p.project(camera);
      if (p.z > 1) continue;
      const sx = p.x * 0.5 + 0.5, sy = -p.y * 0.5 + 0.5;
      const d = Math.hypot(sx - px, sy - py);
      /* 화면에 보이는 크기만큼 넉넉히 잡고, 여러 마리가 겹치면 가까운 쪽을 고른다 */
      const rad = ((c.sizeH || 0.7) * 0.78) / Math.max(0.6, dist) / tanHalf;
      if (d < rad + 0.045 && dist < bestDist) { best = c; bestDist = dist; }
    }
    return best;
  }
  function petStroke(c) {
    const now = performance.now();
    if (c.petLastT && now - c.petLastT < 230) return;
    c.petLastT = now;
    c.petting = true;
    c.petStartAt = S.t;
    c.petStopAt = S.t + 0.62;
    c.petHeat = Math.min(1.2, (c.petHeat || 0) + 0.5);
    c.wait = Math.max(c.wait || 0, 0.5);

    const n = S.key === 'pet' ? 4 : 5;

    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.aspect = (S.stereo ? w / 2 : w) / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 250));
  resize();

  /* ---------- 렌더 ---------- */
  const STEREO_SHIFT = 0.0145;
  function applyView(dt) {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = (S.stereo ? w / 2 : w) / h;
    camera.fov += (S.fovT - camera.fov) * Math.min(1, dt * 9);
    S.fov = camera.fov;
    camera.updateProjectionMatrix();
    if (S.gyro && GY.has) {
      camera.quaternion.slerp(GY.target, 0.28);
    } else {
      camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
    }
  }
  function render(stereoSplit) {
    const w = window.innerWidth, h = window.innerHeight;
    if (!stereoSplit) {
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, w, h);
      renderer.render(S.active.scene, camera);
      return;
    }
    const halfW = w / 2;
    const top = camera.near * Math.tan(camera.fov * D2R / 2);
    const height = 2 * top, width = height * camera.aspect;
    const left = -0.5 * width;
    const shift = width * STEREO_SHIFT;
    renderer.setScissorTest(true);
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? -shift : shift;
      const vx = i === 0 ? 0 : halfW;
      renderer.setViewport(vx, 0, halfW, h);
      renderer.setScissor(vx, 0, halfW, h);
      camera.projectionMatrix.makePerspective(left + s, left + s + width, top, top - height, camera.near, camera.far);
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      renderer.render(S.active.scene, camera);
    }
    renderer.setScissorTest(false);
  }

  /* ---------- 조준점 갱신 ---------- */
  let gazeClock = 0;
  function updateGaze(dt) {
    gazeClock += dt;
    if (gazeClock < 0.12) return;
    gazeClock = 0;
    const dir = camera.getWorldDirection(V3(0, 0, 0));
    const c = pickByDir(dir);
    const el = $('#gaze');
    if (c) {
      el.classList.add('lock');
      $('#gazeName').textContent = c.emoji + ' ' + c.name;
    } else {
      el.classList.remove('lock');
    }
  }

  /* ---------- 메인 루프 ---------- */
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - S.last) / 1000));
    S.last = now; S.t += dt;
    applyView(dt);
    if (AR.on) { try { arTick(); } catch (e) {} }
    try { S.active.update(S.t, dt); } catch (e) { if (!S._updErr) { S._updErr = 1; console.error(e); } }
    render(S.stereo);
    if (!S.stereo) updateGaze(dt);
    requestAnimationFrame(loop);
  }

  /* ---------- 시작 ---------- */
  switchScene('pet', true);
  camera.position.copy(sceneCamera.pet);
  camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
  requestAnimationFrame(t => { S.last = t; loop(t); });

  setTimeout(() => {
    $('#load').classList.add('hide');
    $('#hint').classList.add('show');
    setTimeout(() => $('#hint').classList.remove('show'), 6500);
  }, 420);

  /* ---------- 테스트 훅 ---------- */
  window.__VR = {
    state() {
      return {
        scene: S.key, stereo: S.stereo, gyro: S.gyro,
        yaw: +S.yaw.toFixed(3), pitch: +S.pitch.toFixed(3), fov: +S.fov.toFixed(1),
        creatures: S.active.creatures.map(c => c.id),
        errs: window.__errs.slice(0, 8)
      };
    },
    look(yaw, pitch, fov) { S.yaw = yaw != null ? yaw : S.yaw; S.pitch = pitch != null ? pitch : S.pitch; if (fov) { S.fov = S.fovT = fov; } },
    scene(k) { switchScene(k); },
    stereo(v) { setStereo(v); },
    tap(id) { const c = S.active.creatures.find(x => x.id === id); if (c) interact(c); return !!c; },
    animState() {
      return S.active.creatures.map(c => ({
        id: c.id, glb: !!c.glb, role: c.role || null, t: c.act ? +c.act.time.toFixed(2) : null,
        rate: c.animRate ? +c.animRate.toFixed(2) : null,
        clips: c.clips ? Object.keys(c.clips) : [],
        spd: +(c.spd || 0).toFixed(2), pet: !!c.petting, heat: +(c.petHeat || 0).toFixed(2),
        pos: [+c.group.position.x.toFixed(2), +c.group.position.y.toFixed(2), +c.group.position.z.toFixed(2)],
        yaw: +c.group.rotation.y.toFixed(2)
      }));
    },
    bb(id) {
      const c = S.active.creatures.find(x => x.id === id); if (!c || !c.glb) return null;
      c.glb.updateWorldMatrix(true, true);
      const out = { k: +c.glb.scale.x.toFixed(4) };
      c.glb.traverse(o => {
        if (out.mesh) return;
        if (!o.isMesh) return;
        let raw = null, world = null;
        if (o.isSkinnedMesh && o.computeBoundingBox) { o.computeBoundingBox(); }
        if (o.geometry) { if (!o.geometry.boundingBox) o.geometry.computeBoundingBox(); }
        if (o.isSkinnedMesh && o.boundingBox) raw = o.boundingBox; else raw = o.geometry.boundingBox;
        if (!raw) return;
        const sz = raw.getSize(new THREE.Vector3());
        world = raw.clone().applyMatrix4(o.matrixWorld);
        const ws = world.getSize(new THREE.Vector3());
        out.mesh = {
          skinned: !!o.isSkinnedMesh,
          raw: [sz.x, sz.y, sz.z].map(v => +v.toFixed(3)),
          rawMinY: +raw.min.y.toFixed(3),
          world: [ws.x, ws.y, ws.z].map(v => +v.toFixed(3)),
          worldMinY: +world.min.y.toFixed(3)
        };
      });
      return out;
    },
    solo(id) {
      S.active.creatures.forEach(c => { c.group.visible = !id || c.id === id; });
      return S.active.creatures.map(c => c.id + ':' + c.group.visible).join(' ');
    },
    screenOf(id) {
      const c = S.active.creatures.find(x => x.id === id); if (!c) return null;
      const p = c.group.getWorldPosition(new THREE.Vector3()); p.y += (c.pickY || 0.3);
      p.project(camera);
      return { x: Math.round((p.x * 0.5 + 0.5) * window.innerWidth), y: Math.round((-p.y * 0.5 + 0.5) * window.innerHeight), front: p.z < 1 };
    },
    stroke(id, n) {
      const s = this.screenOf(id); if (!s) return null;
      const yaw0 = S.yaw, pitch0 = S.pitch, steps = n || 9;
      const ev = (type, x, y) => canvas.dispatchEvent(new PointerEvent(type, { pointerId: 91, clientX: x, clientY: y, bubbles: true, pointerType: 'mouse', isPrimary: true }));
      ev('pointerdown', s.x, s.y);
      for (let i = 1; i <= steps; i++) ev('pointermove', s.x + i * 6, s.y + (i % 2 ? 4 : -4));
      ev('pointerup', s.x + steps * 6, s.y);
      const c = S.active.creatures.find(x => x.id === id);
      return { at: s, yaw0, yaw1: S.yaw, pitch0, pitch1: S.pitch, same: yaw0 === S.yaw && pitch0 === S.pitch, role: c && c.role, heat: c ? +(c.petHeat || 0).toFixed(2) : 0 };
    },
    dragBg(dx, x, y) {
      const yaw0 = S.yaw, cx = x != null ? x : Math.round(window.innerWidth / 2), cy = y != null ? y : 120;
      const ev = (type, px, py) => canvas.dispatchEvent(new PointerEvent(type, { pointerId: 92, clientX: px, clientY: py, bubbles: true, pointerType: 'mouse', isPrimary: true }));
      ev('pointerdown', cx, cy);
      for (let i = 1; i <= 8; i++) ev('pointermove', cx + i * (dx || 10), cy);
      ev('pointerup', cx + 8 * (dx || 10), cy);
      return { yaw0, yaw1: S.yaw, moved: yaw0 !== S.yaw };
    },
    pos(id) { const c = S.active.creatures.find(x => x.id === id); if (!c) return null; const p = c.group.position; return { x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2) }; },
    act() { if (S.key === 'pet') S.scenes.pet.throwSnack(); else S.scenes.ocean.throwSnack(); },
    reset() { S.yaw = 0; S.pitch = 0; },
    freeze(v) { S.active.creatures.forEach(c => { c.speed = v === false ? (c.speed0 || 0.5) : 0; if (v !== false) { c.wait = 1e6; c.happy = 0; c.tgt = null; } }); return true; },
    rot(id) { const c = S.active.creatures.find(x => x.id === id); return c ? +c.group.rotation.y.toFixed(3) : null; },
    face(id, dist, h, fov) {
      const c = S.active.creatures.find(x => x.id === id); if (!c) return null;
      const ry = c.group.rotation.y, p = c.group.position;
      camera.position.set(p.x + Math.sin(ry) * dist, h == null ? 0.6 : h, p.z + Math.cos(ry) * dist);
      S.yaw = ry;
      S.pitch = -0.10; if (fov) { S.fov = S.fovT = fov; }
      return { x: p.x, z: p.z, ry };
    },
    view(x, y, z, yaw, pitch, fov) { camera.position.set(x, y, z); S.yaw = yaw || 0; S.pitch = pitch == null ? -0.1 : pitch; if (fov) { S.fov = S.fovT = fov; } return true; },
    spot(id, dist, ang) {
      const c = S.active.creatures.find(x => x.id === id); if (!c) return null;
      const p = c.group.position, d = dist || 2.4, a = ang == null ? 0 : ang;
      camera.position.set(p.x + Math.sin(a) * d + 0.35, 1.18, p.z + Math.cos(a) * d);
      S.yaw = Math.atan2(-(p.x - camera.position.x), -(p.z - camera.position.z));
      S.pitch = -0.2; S.fov = S.fovT = 52;
      return { x: +camera.position.x.toFixed(2), z: +camera.position.z.toFixed(2), face: +c.group.rotation.y.toFixed(2) };
    },
    async ar(v) { await setArMode(!!v); return AR.on; },
    arSize(d) { if (!AR.on) return AR.scale; arCycleSize(); if (d) arCycleSize(); return AR.scale; },
    snap() { return snapAr(); },
    arState() { return { on: AR.on, cam: !!(AR.stream && AR.stream.active), err: AR.err, clearAlpha: renderer.getClearAlpha(), fog: !!S.active.scene.fog, bg: S.active.scene.background ? 'set' : 'none', scale: AR.scale, camPose: { x: +camera.position.x.toFixed(2), y: +camera.position.y.toFixed(2), z: +camera.position.z.toFixed(2), pitch: +S.pitch.toFixed(2) } }; },
    dbg() {
      const out = {};
      S.active.scene.children.forEach(ch => {
        const k = ch.userData.creature ? 'creature:' + ch.userData.creature.id
          : ch.isLight ? 'light'
            : FX.has(ch) ? 'fx'
              : (ch.type || 'obj');
        if (!(k in out)) out[k] = { total: 0, visible: 0 };
        out[k].total++; if (ch.visible) out[k].visible++;
      });
      return out;
    }
  };
}
</script>
</body>
