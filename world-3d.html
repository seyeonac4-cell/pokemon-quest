<style>
/* ============================================================
   🏡 3D 가족 마을 · 놀이터 (world-3d.html)
   윤진 · 형원 · 엄마 · 아빠 — 진짜 3D 3인칭/1인칭 블록 놀이터
   Three.js(CDN) + 공용 지갑·타이머·마이크(world-*.js)
   ============================================================ */
:root{
  --font:'Jua','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ink:#25304a; --ink2:#46557b; --muted:#7d89a8;
  --gold:#ffcc33; --line:rgba(255,255,255,.72);
  --shadow:0 6px 18px rgba(24,40,80,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:linear-gradient(#8fd8ff,#dff4ff);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#look{position:fixed;inset:0;z-index:1;touch-action:none}

#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.94);border:2px solid #fff;box-shadow:var(--shadow);
  font-size:14px;font-weight:800;color:var(--ink2);white-space:nowrap}

/* ---------- 위쪽 줄 ---------- */
.topbar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;min-width:0}
.topbar .grow{flex:1 1 auto;min-width:4px}
.tb{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:36px;min-width:36px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.94);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:14.5px;font-weight:800;color:var(--ink2);
  white-space:nowrap;touch-action:manipulation;transition:transform .1s,background .2s}
.tb:active{transform:scale(.94)}
.tb.back{font-size:17px;padding:0 9px;color:#3d4a68}
.tb.prof{max-width:120px;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
#coinChip{pointer-events:auto}
#coinChip b{font-size:16px;color:#a2700a}
#viewBtn{pointer-events:auto;background:linear-gradient(180deg,#fff,#eef4ff)}
#viewBtn .vico{font-size:16px;line-height:1}
#viewBtn[data-mode="first"]{background:linear-gradient(180deg,#fff4c9,#ffe28c);color:#6b4a00;border-color:#fff3c4}
.trial{pointer-events:none;position:absolute;left:8px;top:calc(50px + env(safe-area-inset-top,0px));
  font-size:11px;font-weight:800;color:#fff;background:rgba(90,60,160,.72);padding:3px 9px;border-radius:999px}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));
  font-size:12px;font-weight:800;color:#33456b;background:rgba(255,255,255,.82);border-radius:999px;
  padding:6px 12px;white-space:nowrap;box-shadow:0 3px 10px rgba(24,40,80,.14);
  opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}

#liveChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(88px + env(safe-area-inset-top,0px));
  display:none;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
  background:rgba(64,214,176,.95);color:#044c37;border:2px solid #fff;font-size:12px;font-weight:800;
  box-shadow:var(--shadow);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#liveChip.show{display:inline-flex}

/* ---------- 왼쪽 아래 조이스틱 ---------- */
#joy{position:absolute;left:14px;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:116px;height:116px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.42),rgba(255,255,255,.22));
  border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 22px rgba(24,40,80,.18),inset 0 2px 6px rgba(255,255,255,.5)}
#joy::after{content:"이동";position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-size:10.5px;font-weight:800;color:rgba(60,80,120,.55);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffffff,#dce9ff 70%,#c6d8f5);
  border:2px solid #fff;box-shadow:0 5px 14px rgba(24,50,100,.28);transition:transform .06s;
  display:grid;place-items:center;font-size:16px;color:#7f93bb}
#joy.active #joyKnob{transition:none}

/* ---------- 오른쪽 아래 점프 ---------- */
#jumpBtn{position:absolute;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  width:88px;height:88px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 42% 32%,#fff6b8,#ffd34f 60%,#f6b21c);
  border:3px solid #fff;box-shadow:0 8px 20px rgba(150,100,0,.32);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#6a4500;font-size:13px;font-weight:900;letter-spacing:-.02em}
#jumpBtn .ji{font-size:22px;line-height:1}
#jumpBtn:active{transform:scale(.93);filter:brightness(.97)}
#jumpBtn[disabled]{opacity:.45}

/* 1인칭 시점 조준점 */
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:0 0 0 2px rgba(60,80,120,.35),0 1px 4px rgba(0,0,0,.25);
  opacity:0;transition:opacity .2s;pointer-events:none}
#cross.show{opacity:1}

/* ---------- 알림 · 배너 ---------- */
#toast{position:absolute;left:50%;transform:translate(-50%,6px);top:calc(128px + env(safe-area-inset-top,0px));
  padding:8px 15px;border-radius:14px;background:rgba(38,28,60,.9);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 22px rgba(20,10,40,.3);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  max-width:82vw;text-align:center;word-break:keep-all}
#toast.show{opacity:1;transform:translate(-50%,0)}

#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);
  padding:16px 26px;border-radius:26px;background:linear-gradient(180deg,#fff6c9,#ffd75e);
  border:3px solid #fff;box-shadow:0 16px 40px rgba(150,100,0,.36);color:#5a3a00;
  font-size:22px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;margin-top:4px;font-size:13px;font-weight:800;color:#8a6a1a}

/* ---------- 캐릭터 고르기 시트 ---------- */
#sheetWrap{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,30,60,0);transition:background .25s;z-index:6}
#sheetWrap.open{pointer-events:auto;background:rgba(20,30,60,.42)}
#sheet{width:100%;max-width:460px;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));
  background:#fff;border-radius:24px 24px 20px 20px;padding:16px 14px 14px;box-shadow:0 -8px 34px rgba(20,30,60,.32);
  transform:translateY(120%);transition:transform .26s cubic-bezier(.2,.9,.2,1)}
#sheetWrap.open #sheet{transform:none}
#sheet h3{margin:0 0 3px;font-size:17px;font-weight:900;letter-spacing:-.02em}
#sheet p{margin:0 0 11px;font-size:12.5px;color:var(--muted);font-weight:700}
.whoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whoBtn{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:16px;background:#f4f7ff;
  border:2px solid #e6ecfa;font-size:14.5px;font-weight:900;color:var(--ink);text-align:left;touch-action:manipulation}
.whoBtn .we{font-size:24px;line-height:1}
.whoBtn small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.whoBtn[aria-pressed="true"]{border-color:#ffb02e;background:#fff7e0;box-shadow:0 4px 12px rgba(200,140,0,.18)}
#sheetClose{width:100%;margin-top:10px;min-height:44px;border-radius:14px;background:#eef2fb;color:#4a5878;font-size:14px;font-weight:900}

/* ---------- 준비 · 오류 ---------- */
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:linear-gradient(#8fd8ff,#dff4ff);transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
#loading .box{text-align:center}
#loading .em{font-size:46px;line-height:1;animation:lbob 1.6s ease-in-out infinite}
#loading b{display:block;margin-top:10px;font-size:16px;color:#2b3a5c}
#loading span{display:block;margin-top:4px;font-size:12.5px;color:#5e719a;font-weight:700}
@keyframes lbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#glerr{position:fixed;inset:0;z-index:21;display:none;place-items:center;padding:22px;
  background:linear-gradient(#8fd8ff,#dff4ff)}
#glerr.show{display:grid}
#glerr .card{max-width:340px;background:#fff;border-radius:22px;padding:22px 18px;text-align:center;
  box-shadow:0 10px 30px rgba(24,40,80,.22)}
#glerr .em{font-size:38px}
#glerr h2{margin:8px 0 6px;font-size:17px}
#glerr p{margin:0;font-size:13px;color:#61708f;font-weight:700;line-height:1.5}
#glerr button{margin-top:14px;min-height:46px;padding:0 20px;border-radius:14px;background:#4a90e2;color:#fff;
  font-size:14.5px;font-weight:900}

@media (max-width:360px){
  .pill{height:33px;font-size:13px;padding:0 10px}
  .tb{height:33px;font-size:13.5px;padding:0 8px}
  #joy{width:104px;height:104px}
  #jumpBtn{width:80px;height:80px;font-size:12px}
}
@media (min-width:820px){
  #joy{width:132px;height:132px;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  #jumpBtn{width:104px;height:104px;right:28px;bottom:calc(38px + env(safe-area-inset-bottom,0px));font-size:14px}
  #jumpBtn .ji{font-size:26px}
  #hint{font-size:13px}
}
</style>

<!-- 🧪 테스트(?w3dtest=1)일 때는 공용 스크립트도 시험 모드로 켜서 Firebase 에 아무것도 쓰지 않아요 -->

<script type="module">
/* ============================================================
   1. 3D 라이브러리 불러오기 (CDN 3곳 차례대로)
   ============================================================ */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js',
  'https://unpkg.com/three@0.159.0/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.module.min.js'
];
let THREE = null;
for (const u of CDNS) {
  try { const m = await import(u); if (m && m.Scene) { THREE = m; break; } } catch (e) { THREE = null; }
}
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
function showErr() {
  const el = $('#glerr'); if (el) el.classList.add('show');
  const ld = $('#loading'); if (ld) ld.classList.add('hide');
}
if (!THREE) { showErr(); } else { try { boot(); } catch (e) { showErr(); } }

function boot() {
  /* ============================================================
     2. 준비 · 기본값
     ============================================================ */
  const Q = new URLSearchParams(location.search || '');
  const qp = (k) => { try { return Q.get(k); } catch (e) { return null; } };
  const TEST = qp('w3dtest') === '1';          // 🧪 Firebase 에 절대 쓰지 않아요
  const PEOPLE = {
    yunjin:  { name: '윤진', emoji: '🦊', shirt: '#ff7fae', shirt2: '#ff4f86', pants: '#6c7bd9', skin: '#ffd9b8', hair: '#5b3a2e', kind: 'girl', house: '#ffd0e6' },
    hyungwon:{ name: '형원', emoji: '🐣', shirt: '#ffd54a', shirt2: '#f0b71c', pants: '#f0a6c8', skin: '#ffe0c4', hair: '#7a4a22', kind: 'girl2', house: '#fff2bd' },
    mom:     { name: '엄마', emoji: '👩', shirt: '#4fd1b0', shirt2: '#1fae8c', pants: '#3f4a6b', skin: '#ffd9b8', hair: '#3a2a26', kind: 'mom', house: '#d6f7ec' },
    dad:     { name: '아빠', emoji: '👨', shirt: '#4a90e2', shirt2: '#2a6fc0', pants: '#324a75', skin: '#f7c9a3', hair: '#2a2320', kind: 'dad', house: '#d8e9ff' }
  };
  const ORDER = ['yunjin', 'hyungwon', 'mom', 'dad'];
  const ADULTS = { mom: 1, dad: 1 };
  const K_ACTIVE = 'lim_active_kid';

  function normWho(v) {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    if (s === 'yunjin' || s === '윤진') return 'yunjin';
    if (s === 'hyungwon' || s === 'hyeongwon' || s === '형원') return 'hyungwon';
    if (s === 'mom' || s === '엄마') return 'mom';
    if (s === 'dad' || s === '아빠') return 'dad';
    return null;
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  let me = normWho(qp('who')) || normWho(store(K_ACTIVE)) || 'yunjin';

  /* ============================================================
     3. 소리 (직접 만든 효과음 — 외부 파일 없음)
     ============================================================ */
  const AU = {
    ac: null, master: null, wind: null, windGain: null, windFilter: null, on: true,
    unlock() {
      if (!this.ac) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ac = new AC();
          this.master = this.ac.createGain();
          this.master.gain.value = 0.55;
          this.master.connect(this.ac.destination);
        } catch (e) { this.ac = null; }
      }
      if (this.ac && this.ac.state === 'suspended') { try { this.ac.resume(); } catch (e) {} }
    },
    tone(f1, dur, type, vol, f2) {
      if (!this.ac || !this.on) return;
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f1, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.2), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.03);
    },
    coin() { this.tone(1040, 0.07, 'triangle', 0.22); setTimeout(() => this.tone(1560, 0.09, 'triangle', 0.16), 55); },
    jump() { this.tone(430, 0.13, 'sine', 0.16, 780); },
    land() { this.tone(170, 0.1, 'sine', 0.1, 110); },

    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    joy.x = dx; joy.y = dy;
    knobEl.style.transform = 'translate(' + (dx * JOY_R) + 'px,' + (dy * JOY_R) + 'px)';

      if (x + RADIUS > c.minX && x - RADIUS < c.maxX && z + RADIUS > c.minZ && z - RADIUS < c.maxZ) return c;
    }

  }
  function supportTop(x, z, maxTop) {

      const c = colliders[i];

      if (x > c.minX - m && x < c.maxX + m && z > c.minZ - m && z < c.maxZ + m) {

  function nearestSlide(x, y, z) {
    let best = null;
    const N = 60;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const p = slideCurve.getPointAt(Math.min(0.999, t));
      const dh = Math.hypot(x - p.x, z - p.z);
      if (dh > 1.15) continue;
      const dy = y - p.y;                       // 발이 판 위(0.42) ~ 살짝 아래일 때만 타요
      if (dy < -0.16 || dy > 1.35) continue;
      const score = dh + Math.abs(dy - 0.35) * 0.6;
      if (!best || score < best.score) best = { t, score, p: p.clone() };
    }
    return best;
  }

    P.riding = null;
    P.x = p.x + tan.x * 1.4;
    P.z = p.z + tan.z * 1.4;

  function updateRide(dt) {
    const r = P.riding; if (!r) return;
    if (P.rideSpeed <= 0) {            /* 🧪 스크린샷용 정지 상태 */
      const pp = slideCurve.getPointAt(r.t);

    r.t += (P.rideSpeed * dt) / slideLen;

  const clock = new THREE.Clock();

  function step(dt) {
    const busy = locked() || sheetOpen();
    // 입력 → 이동
    let ix = 0, iy = 0;
    if (!busy && !P.riding && performance.now() > P.lockUntil) {
      if (keys['w'] || keys['arrowup']) iy += 1;
      if (keys['s'] || keys['arrowdown']) iy -= 1;
      if (keys['a'] || keys['arrowleft']) ix -= 1;
      if (keys['d'] || keys['arrowright']) ix += 1;
      ix += joy.x; iy -= joy.y;
    }
    let mag = Math.hypot(ix, iy);
    if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = (fx * iy + rx * ix) * SPEED * dt;
    let dz = (fz * iy + rz * ix) * SPEED * dt;
    P.speed = mag * SPEED;

    if (!P.riding) {
      // 좌우 · 앞뒤 따로 움직여 벽에 부딪혀도 미끄러져요
      if (dx) { if (!blockedAt(P.x + dx, P.z)) P.x += dx; }
      if (dz) { if (!blockedAt(P.x, P.z + dz)) P.z += dz; }
      // 밟고 올라가기
      if (P.grounded) {
        const sup = supportTop(P.x, P.z, P.y + MAX_STEP);
        if (sup > P.y) P.y = sup;
        else if (sup < P.y - 0.04) { P.grounded = false; P.vy = 0; }
      }
      // 점프 · 중력
      if (!P.grounded) {
        P.vy -= GRAV * dt;
        let ny = P.y + P.vy * dt;
        if (P.vy <= 0) {
          const sup = supportTop(P.x, P.z, P.y + 0.03);
          if (ny <= sup) {
            const wasAir = !P.grounded;
            ny = sup; P.y = sup; P.vy = 0; P.grounded = true;
            if (wasAir && sup > 0.3 && onTrampoline(P.x, P.z)) {
              P.vy = 15.5; P.grounded = false;
              trampSquash = 1;
              AU.boing();
              burst(new THREE.Vector3(P.x, P.y + 0.2, P.z), 0x8ef0d6, 10);
            } else if (wasAir) {
              AU.land();
            }
          }
        }
        P.y = ny;
      } else {
        P.coyote = 0.12;
      }
      P.y = Math.max(0, P.y);
      // 마을 밖으로 떨어지면 시작 자리로 (안전장치)
      if (P.y < -6 || Math.abs(P.x) > 60 || Math.abs(P.z) > 60) { resetPlayer(me); toast('🏡 마을로 다시 돌아왔어요'); }
      // 캐릭터 방향
      if (mag > 0.06) {
        const want = Math.atan2(ix * rx + iy * fx, ix * rz + iy * fz);
        let d = want - P.face;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        P.face += d * Math.min(1, dt * 14);
      }
      // 미끄럼틀에 올라섰나요?
      if (performance.now() > P.lockUntil) {
        const near = nearestSlide(P.x, P.y, P.z);
        if (near) startRide(near.t);
      }
    } else {
      updateRide(dt);
    }
    P.coyote = Math.max(0, P.coyote - dt);

    // 내 캐릭터
    meAvatar.position.set(P.x, P.y, P.z);
    meAvatar.rotation.y = P.face;
    animateAvatar(meAvatar, dt, P.speed, P.grounded, !!P.riding);

    // 코인 회전 · 되살아나기
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.alive) {
        if (c.respawn && performance.now() > c.respawn) {
          c.alive = true; c.respawn = 0; c.mesh.visible = true; c.mesh.scale.setScalar(0.01);
        }
        continue;
      }
      c.mesh.rotation.y += dt * 2.6;
      c.mesh.position.y = c.home.y + Math.sin(performance.now() / 620 + c.spin) * 0.09;
      if (c.mesh.scale.x < 1) c.mesh.scale.setScalar(Math.min(1, c.mesh.scale.x + dt * 3.2));
      if (Math.abs(c.mesh.position.x - P.x) < 9 && Math.abs(c.mesh.position.z - P.z) < 9) { /* 가까울 때만 */ }
    }
    // 별 회전
    if (STAR.mesh && !STAR.got) {
      STAR.mesh.rotation.y += dt * 1.9;
      STAR.mesh.position.y = STAR.y + Math.sin(performance.now() / 700) * 0.12;
      if (STAR.glow) { STAR.glow.position.y = STAR.mesh.position.y; STAR.glow.scale.setScalar(1 + Math.sin(performance.now() / 460) * 0.06); }
    }
    // 트램펄린 흔들
    if (trampSquash > 0) {
      trampSquash = Math.max(0, trampSquash - dt * 3.2);
      const s = 1 - Math.sin(trampSquash * Math.PI) * 0.35;
      if (TRAMP.g && TRAMP.g.children[1]) TRAMP.g.children[1].scale.y = Math.max(0.2, s);
    }
    // 반짝이
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { scene.remove(s.mesh); s.mesh.material.dispose(); sparks.splice(i, 1); continue; }
      s.v.y -= 9 * dt;
      s.mesh.position.addScaledVector(s.v, dt);
      const k = 1 - s.life / s.max;
      s.mesh.material.opacity = k;
      s.mesh.scale.setScalar(0.35 + k * 0.5);
    }
    // 구름
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 46) c.position.x = -46;
    }
    // 가족 아바타
    updateRemotes(dt);

    if (!busy) collectCoins();

    // 카메라 · 렌더
    updateCamera(dt);
    sun.position.set(P.x + 22, 34, P.z + 16);
    sun.target.position.set(P.x, 0, P.z);
    sun.target.updateMatrixWorld();

    // 서버로 내 위치
    fbPush(false);
  }

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, clock.getDelta() || 0.016);
    step(dt);
    renderer.render(scene, camera);
    if (!ready) {
      frameNo++;
      if (frameNo === 3) { ready = true; $('#loading').classList.add('hide'); setTimeout(() => { const l = $('#loading'); if (l) l.style.display = 'none'; }, 500); showHint(); }
    }
  }

  /* ---------- 크기 ---------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    fovBase = (w / h) < 0.85 ? 68 : 60;
    camera.fov = fovBase;
    fovNow = fovBase;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 260));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  /* ---------- 시작 ---------- */
  resetPlayer(me);
  // 처음엔 내 집 앞에서 카메라를 마을 쪽으로
  yaw = 0;
  meAvatar.position.set(P.x, P.y, P.z);
  meAvatar.rotation.y = P.face;
  camTarget.set(P.x, P.y + 1.5, P.z);
  camPos.set(P.x, P.y + 3.6, P.z + 6.6);
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  loop();

  /* ---------- 테스트 · 디버그 창구 ---------- */
  window.W3D = {
    version: '1.0', three: THREE.REVISION, test: TEST, who: () => me,
    state() {
      return {
        ready, mode: viewMode, test: TEST, who: me,
        x: +P.x.toFixed(2), y: +P.y.toFixed(2), z: +P.z.toFixed(2),
        vy: +P.vy.toFixed(2), grounded: P.grounded,
        yaw: +yaw.toFixed(3), pitch: +pitch.toFixed(3),
        riding: !!P.riding, rideT: P.riding ? +P.riding.t.toFixed(3) : null,
        coins: WC ? WC.get(me) : null, star: STAR.got,
        avatarVisible: meAvatar.visible,
        remotes: Object.keys(FB.remotes).length,
        colliders: colliders.length, coinsLeft: coins.filter((c) => c.alive).length,
        calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
        cam: [+camera.position.x.toFixed(2), +camera.position.y.toFixed(2), +camera.position.z.toFixed(2)], camHit: camDbg.hit,
        webgl: !!renderer.getContext()
      };
    },
    teleport(x, y, z) { P.x = x; P.y = y; P.z = z; P.vy = 0; P.grounded = false; P.riding = null; },
    slideAt(t) {
      P.riding = { t: Math.max(0, Math.min(0.95, t)) };
      P.rideSpeed = 0;
      const p = slideCurve.getPointAt(P.riding.t);
      P.x = p.x; P.y = p.y + 0.12; P.z = p.z;
      const tan = slideCurve.getTangentAt(P.riding.t);
      P.face = Math.atan2(tan.x, tan.z);
      yaw = Math.atan2(-tan.x, -tan.z);
    },
    look(y, p) { yaw = y; if (p !== undefined) pitch = p; },
    setView, toggleView,
    jump: doJump,
    who: (w) => { setWho(w); return me; },
    slideTop: () => { const p = slideCurve.getPointAt(0); return { x: p.x, y: p.y, z: p.z }; },
    starPos: () => ({ x: STAR.x, y: STAR.y, z: STAR.z })
  };
}
</script>
