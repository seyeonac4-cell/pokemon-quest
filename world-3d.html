<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#8fd8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3D 가족 마을">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/world-3d/world-3d-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/world-3d/world-3d-icon-180.png">
<link rel="manifest" href="./manifest-world-3d.json">
<title>🏡 3D 가족 마을 · 놀이터 — 채씨네</title>
<script>window.__errs=[];addEventListener('error',function(e){try{__errs.push(String(e.message||(e.error&&e.error.message)||e.type)+' @'+(e.filename||'')+':'+(e.lineno||''))}catch(_){}});addEventListener('unhandledrejection',function(e){try{__errs.push('rejection: '+String(e.reason))}catch(_){}});</script>
<style>
/* ============================================================
   🏡 3D 가족 마을 · 놀이터 (world-3d.html)
   윤진 · 형원 · 엄마 · 아빠 — 진짜 3D 3인칭/1인칭 블록 놀이터
   Three.js(CDN) + 공용 지갑·타이머·마이크(world-*.js)
   ============================================================ */
:root{
  --font:'Jua','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ink:#25304a; --ink2:#46557b; --muted:#7d89a8;
  --gold:#ffcc33; --line:rgba(255,255,255,.72);
  --shadow:0 6px 18px rgba(24,40,80,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:linear-gradient(#8fd8ff,#dff4ff);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#look{position:fixed;inset:0;z-index:1;touch-action:none}

#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.94);border:2px solid #fff;box-shadow:var(--shadow);
  font-size:14px;font-weight:800;color:var(--ink2);white-space:nowrap}

/* ---------- 위쪽 줄 ---------- */
.topbar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px;min-width:0}
.topbar .grow{flex:1 1 auto;min-width:4px}
.tb{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:36px;min-width:36px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.94);
  border:2px solid #fff;box-shadow:var(--shadow);font-size:14.5px;font-weight:800;color:var(--ink2);
  white-space:nowrap;touch-action:manipulation;transition:transform .1s,background .2s}
.tb:active{transform:scale(.94)}
.tb.back{font-size:17px;padding:0 9px;color:#3d4a68}
.tb.prof{max-width:120px;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
#coinChip{pointer-events:auto}
#coinChip b{font-size:16px;color:#a2700a}
#viewBtn{pointer-events:auto;background:linear-gradient(180deg,#fff,#eef4ff)}
#viewBtn .vico{font-size:16px;line-height:1}
#viewBtn[data-mode="first"]{background:linear-gradient(180deg,#fff4c9,#ffe28c);color:#6b4a00;border-color:#fff3c4}
.trial{pointer-events:none;position:absolute;left:8px;top:calc(50px + env(safe-area-inset-top,0px));
  font-size:11px;font-weight:800;color:#fff;background:rgba(90,60,160,.72);padding:3px 9px;border-radius:999px}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));
  font-size:12px;font-weight:800;color:#33456b;background:rgba(255,255,255,.82);border-radius:999px;
  padding:6px 12px;white-space:nowrap;box-shadow:0 3px 10px rgba(24,40,80,.14);
  opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}

#liveChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(88px + env(safe-area-inset-top,0px));
  display:none;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
  background:rgba(64,214,176,.95);color:#044c37;border:2px solid #fff;font-size:12px;font-weight:800;
  box-shadow:var(--shadow);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#liveChip.show{display:inline-flex}

/* ---------- 왼쪽 아래 조이스틱 ---------- */
#joy{position:absolute;left:14px;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:116px;height:116px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.42),rgba(255,255,255,.22));
  border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 22px rgba(24,40,80,.18),inset 0 2px 6px rgba(255,255,255,.5)}
#joy::after{content:"이동";position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-size:10.5px;font-weight:800;color:rgba(60,80,120,.55);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffffff,#dce9ff 70%,#c6d8f5);
  border:2px solid #fff;box-shadow:0 5px 14px rgba(24,50,100,.28);transition:transform .06s;
  display:grid;place-items:center;font-size:16px;color:#7f93bb}
#joy.active #joyKnob{transition:none}

/* ---------- 오른쪽 아래 점프 ---------- */
#jumpBtn{position:absolute;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  width:88px;height:88px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 42% 32%,#fff6b8,#ffd34f 60%,#f6b21c);
  border:3px solid #fff;box-shadow:0 8px 20px rgba(150,100,0,.32);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#6a4500;font-size:13px;font-weight:900;letter-spacing:-.02em}
#jumpBtn .ji{font-size:22px;line-height:1}
#jumpBtn:active{transform:scale(.93);filter:brightness(.97)}
#jumpBtn[disabled]{opacity:.45}

/* 1인칭 시점 조준점 */
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:0 0 0 2px rgba(60,80,120,.35),0 1px 4px rgba(0,0,0,.25);
  opacity:0;transition:opacity .2s;pointer-events:none}
#cross.show{opacity:1}

/* ---------- 알림 · 배너 ---------- */
#toast{position:absolute;left:50%;transform:translate(-50%,6px);top:calc(196px + env(safe-area-inset-top,0px));
  padding:8px 15px;border-radius:14px;background:rgba(38,28,60,.9);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 22px rgba(20,10,40,.3);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  max-width:82vw;text-align:center;word-break:keep-all}
#toast.show{opacity:1;transform:translate(-50%,0)}

#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);
  padding:16px 26px;border-radius:26px;background:linear-gradient(180deg,#fff6c9,#ffd75e);
  border:3px solid #fff;box-shadow:0 16px 40px rgba(150,100,0,.36);color:#5a3a00;
  font-size:22px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;margin-top:4px;font-size:13px;font-weight:800;color:#8a6a1a}

/* ---------- 캐릭터 고르기 시트 ---------- */
#sheetWrap{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,30,60,0);transition:background .25s;z-index:6}
#sheetWrap.open{pointer-events:auto;background:rgba(20,30,60,.42)}
#sheet{width:100%;max-width:460px;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));
  background:#fff;border-radius:24px 24px 20px 20px;padding:16px 14px 14px;box-shadow:0 -8px 34px rgba(20,30,60,.32);
  transform:translateY(120%);transition:transform .26s cubic-bezier(.2,.9,.2,1)}
#sheetWrap.open #sheet{transform:none}
#sheet h3{margin:0 0 3px;font-size:17px;font-weight:900;letter-spacing:-.02em}
#sheet p{margin:0 0 11px;font-size:12.5px;color:var(--muted);font-weight:700}
.whoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whoBtn{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:16px;background:#f4f7ff;
  border:2px solid #e6ecfa;font-size:14.5px;font-weight:900;color:var(--ink);text-align:left;touch-action:manipulation}
.whoBtn .we{font-size:24px;line-height:1}
.whoBtn small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.whoBtn[aria-pressed="true"]{border-color:#ffb02e;background:#fff7e0;box-shadow:0 4px 12px rgba(200,140,0,.18)}
#sheetClose{width:100%;margin-top:10px;min-height:44px;border-radius:14px;background:#eef2fb;color:#4a5878;font-size:14px;font-weight:900}

/* ---------- 준비 · 오류 ---------- */
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:linear-gradient(#8fd8ff,#dff4ff);transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
#loading .box{text-align:center}
#loading .em{font-size:46px;line-height:1;animation:lbob 1.6s ease-in-out infinite}
#loading b{display:block;margin-top:10px;font-size:16px;color:#2b3a5c}
#loading span{display:block;margin-top:4px;font-size:12.5px;color:#5e719a;font-weight:700}
@keyframes lbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#glerr{position:fixed;inset:0;z-index:21;display:none;place-items:center;padding:22px;
  background:linear-gradient(#8fd8ff,#dff4ff)}
#glerr.show{display:grid}
#glerr .card{max-width:340px;background:#fff;border-radius:22px;padding:22px 18px;text-align:center;
  box-shadow:0 10px 30px rgba(24,40,80,.22)}
#glerr .em{font-size:38px}
#glerr h2{margin:8px 0 6px;font-size:17px}
#glerr p{margin:0;font-size:13px;color:#61708f;font-weight:700;line-height:1.5}
#glerr button{margin-top:14px;min-height:46px;padding:0 20px;border-radius:14px;background:#4a90e2;color:#fff;
  font-size:14.5px;font-weight:900}

/* ---------- 오른쪽 도구 (블록 월드 문 · 수영 · 밧줄) ---------- */
#tools{position:absolute;right:10px;bottom:calc(126px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column-reverse;align-items:flex-end;gap:7px;pointer-events:none;z-index:4;max-width:62vw}
#toolActions{display:flex;flex-direction:column-reverse;align-items:flex-end;gap:7px}
#toolActions:empty{display:none}
#tools .tb2{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  min-height:42px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.96);border:2px solid #fff;
  box-shadow:var(--shadow);font-size:13px;font-weight:900;color:var(--ink2);white-space:nowrap;
  touch-action:manipulation;max-width:62vw;overflow:hidden;text-overflow:ellipsis;transition:transform .1s}
#tools .tb2:active{transform:scale(.95)}
#tools .tb2.gold{background:linear-gradient(180deg,#fff6c9,#ffd75e);color:#6b4700;border-color:#fff3c4}
#tools .tb2.green{background:linear-gradient(180deg,#e6fff7,#8ff0cf);color:#0a5b42;border-color:#d6fff0}
#tools .tb2.pink{background:linear-gradient(180deg,#ffe9f3,#ffb3d1);color:#7a2145;border-color:#ffdcea}
#tools .tb2.blue{background:linear-gradient(180deg,#e8f5ff,#93d4ff);color:#0a4a72;border-color:#d5efff}

#swimPanel{pointer-events:auto;width:178px;background:rgba(255,255,255,.96);border:2px solid #fff;border-radius:18px;
  padding:9px 9px 8px;box-shadow:var(--shadow);display:none}
#swimPanel .spT{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:900;
  color:var(--muted);margin:0 2px 6px}
#swimPanel .spT b{color:#0a4a72;font-size:12.5px}
.spGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.spGrid button{height:38px;border-radius:11px;background:#eef5ff;font-size:12.5px;font-weight:900;color:#3a4c74;
  border:2px solid #e2ecfb;touch-action:manipulation}
.spGrid button[aria-pressed="true"]{background:linear-gradient(180deg,#d9f0ff,#8fd4ff);border-color:#63bdf5;
  color:#0a4a72;box-shadow:0 3px 9px rgba(40,120,180,.22)}
.spWide{width:100%;margin-top:6px;min-height:40px;border-radius:12px;background:linear-gradient(180deg,#fff6c9,#ffd75e);
  color:#6b4700;font-size:13px;font-weight:900;touch-action:manipulation;border:2px solid #ffe9a8}
.spWide.gray{background:#eef2fb;color:#4a5878;border-color:#e2e9f7}
.spWide:active{transform:scale(.97)}

#countdown{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) scale(.55);font-size:80px;
  font-weight:900;color:#fff;text-shadow:0 8px 26px rgba(10,40,90,.55),0 2px 0 rgba(0,70,120,.35);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:5;letter-spacing:-.02em}
#countdown.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#countdown.go{color:#ffe066}

#raceHud{position:absolute;left:8px;top:calc(88px + env(safe-area-inset-top,0px));transform:none;
  display:none;flex-direction:column;gap:2px;min-width:172px;max-width:58vw;padding:7px 11px;border-radius:14px;
  background:rgba(18,38,70,.62);color:#fff;font-size:12px;font-weight:800;pointer-events:none;z-index:4}
#raceHud.show{display:flex}
#raceHud .rl{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
#raceHud .rl b{color:#ffe066}
#raceHud .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin:2px 0 1px}
#raceHud .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7fe8c6,#ffe066);border-radius:99px;transition:width .18s}

#raceWrap{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,30,60,0);transition:background .25s;z-index:7}
#raceWrap.open{pointer-events:auto;background:rgba(20,30,60,.42)}
#raceSheet{width:100%;max-width:440px;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;
  border-radius:24px 24px 20px 20px;padding:16px 14px 14px;box-shadow:0 -8px 34px rgba(20,30,60,.32);
  transform:translateY(120%);transition:transform .26s cubic-bezier(.2,.9,.2,1);max-height:78vh;overflow:auto}
#raceWrap.open #raceSheet{transform:none}
#raceSheet h3{margin:0 0 4px;font-size:17px;font-weight:900;letter-spacing:-.02em}
#raceSheet p{margin:0 0 10px;font-size:12.5px;line-height:1.45;color:var(--muted);font-weight:700}
.rBtn{display:flex;align-items:center;gap:9px;width:100%;min-height:46px;padding:9px 12px;border-radius:16px;
  background:#f4f7ff;border:2px solid #e6ecfa;font-size:14.5px;font-weight:900;color:var(--ink);text-align:left;
  margin-bottom:7px;touch-action:manipulation}
.rBtn:active{transform:scale(.98)}
.rBtn small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px}
.rBtn.go{background:linear-gradient(180deg,#fff6c9,#ffd75e);border-color:#ffe9a8;color:#6b4700}
.rBtn.go small{color:#8a6a1a}
.rankRow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#f6f9ff;
  margin-bottom:5px;font-size:13.5px;font-weight:800;color:var(--ink)}
.rankRow.me{background:#fff6d8;border:2px solid #ffe9a8}
.rankRow .rk{width:20px;text-align:center;font-size:14px}
.rankRow .rt{margin-left:auto;font-variant-numeric:tabular-nums}

@media (max-width:360px){
  .pill{height:33px;font-size:13px;padding:0 10px}
  .tb{height:33px;font-size:13.5px;padding:0 8px}
  #joy{width:104px;height:104px}
  #jumpBtn{width:80px;height:80px;font-size:12px}
}
@media (min-width:820px){
  #joy{width:132px;height:132px;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  #jumpBtn{width:104px;height:104px;right:28px;bottom:calc(38px + env(safe-area-inset-bottom,0px));font-size:14px}
  #jumpBtn .ji{font-size:26px}
  #hint{font-size:13px}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D 가족 마을 화면"></canvas>
<div id="look" aria-hidden="true"></div>

<div id="hud">
  <div class="topbar">
    <a class="tb back" href="./apps.html" aria-label="앱 모음으로">◀</a>
    <button class="tb prof" id="profBtn" type="button"><span id="profEmo">🦊</span>&nbsp;<span id="profName">윤진</span></button>
    <div class="grow"></div>
    <div class="pill" id="coinChip">🪙 <b id="coinVal">50</b></div>
    <button class="tb" id="viewBtn" type="button" data-mode="third" aria-label="1인칭 시점으로 바꾸기" title="시점 바꾸기 (V)">
      <span class="vico" id="viewIco">🎥</span><span id="viewTxt">3인칭</span>
    </button>
  </div>

  <div id="hint">화면을 드래그하면 둘러볼 수 있어요 · 🕹️ 이동 · ⬆️ 점프</div>
  <div id="liveChip">🟢 <span id="liveTxt"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="cross" aria-hidden="true"></div>

  <div id="joy" aria-label="이동 조이스틱"><div id="joyKnob">🕹️</div></div>
  <button id="jumpBtn" type="button" aria-label="점프"><span class="ji">⬆️</span><span>점프</span></button>

  <!-- 🚪 블록 월드 문 · 🏊 수영 · 🪢 밧줄 도구 -->
  <div id="tools">
    <div id="toolActions"></div>
    <div id="swimPanel">
      <div class="spT"><span>🏊 영법</span><b id="strokeNow">자유형</b></div>
      <div class="spGrid">
        <button type="button" data-stroke="free" aria-pressed="true">🏊‍♀️ 자유형</button>
        <button type="button" data-stroke="back" aria-pressed="false">🙃 배영</button>
        <button type="button" data-stroke="fly" aria-pressed="false">🦋 접영</button>
        <button type="button" data-stroke="breast" aria-pressed="false">🐸 평영</button>
      </div>
      <button type="button" class="spWide" id="raceOpenBtn">🏁 대결 시작</button>
      <button type="button" class="spWide gray" id="swimExitBtn">🏖️ 물 밖으로</button>
    </div>
  </div>
  <div id="raceHud" aria-live="polite"></div>
  <div id="countdown" aria-hidden="true"></div>
  <div id="raceWrap">
    <div id="raceSheet" role="dialog" aria-label="수영장 대결"></div>
  </div>

  <div id="sheetWrap">
    <div id="sheet" role="dialog" aria-label="누구로 놀까요">
      <h3>누구로 놀까요?</h3>
      <p>고른 캐릭터로 3D 마을을 걸어 다녀요 (다른 월드와 같은 캐릭터)</p>
      <div class="whoGrid">
        <button class="whoBtn" type="button" data-who="yunjin" aria-pressed="false"><span class="we">🦊</span><span>윤진<small>분홍 · 20분 제한</small></span></button>
        <button class="whoBtn" type="button" data-who="hyungwon" aria-pressed="false"><span class="we">🐣</span><span>형원<small>노랑 · 20분 제한</small></span></button>
        <button class="whoBtn" type="button" data-who="mom" aria-pressed="false"><span class="we">👩</span><span>엄마<small>민트 · 제한 없음</small></span></button>

  /* ---------- 작은 소품 도우미 (geometry 는 하나를 나눠 써요) ---------- */
  const GEOS = {
    sph: new THREE.SphereGeometry(1, 12, 10),
    cyl: new THREE.CylinderGeometry(1, 1, 1, 16),
    cone: new THREE.ConeGeometry(1, 1, 12),
    ring: new THREE.TorusGeometry(1, 0.4, 8, 18)
  };
  function meshP(par, geo, x, y, z, sx, sy, sz, color, opts) {
    const o = opts || {};
    const m = new THREE.Mesh(geo, o.material || mat(color, o.matOpts));
    m.position.set(x, y, z);
    m.scale.set(sx, sy == null ? sx : sy, sz == null ? sx : sz);
    if (o.rx) m.rotation.x = o.rx;
    if (o.ry) m.rotation.y = o.ry;
    if (o.rz) m.rotation.z = o.rz;
    m.castShadow = !!o.cast;
    m.receiveShadow = !!o.receive;
    par.add(m);
    return m;
  }
  const FLAME = { emissive: 0xffc400, emissiveIntensity: 1.1 };
  const GLOWY = { emissive: 0xffb300, emissiveIntensity: 0.9 };

  /* ---------- 🍰 먹을 것 ---------- */
  function food(par, kind, x, y, z, c) {
    if (kind === 'cake') {
      meshP(par, GEOS.cyl, x, y + 0.08, z, 0.30, 0.16, 0.30, '#ffd9a8', { cast: true });
      meshP(par, GEOS.cyl, x, y + 0.18, z, 0.31, 0.05, 0.31, '#fff3e0');
      meshP(par, GEOS.cyl, x, y + 0.27, z, 0.24, 0.13, 0.24, c);
      meshP(par, GEOS.sph, x - 0.09, y + 0.39, z, 0.025, 0.10, 0.025, '#7fe0ff');
      meshP(par, GEOS.sph, x + 0.09, y + 0.39, z, 0.025, 0.10, 0.025, '#ff8ec4');
      meshP(par, GEOS.sph, x - 0.09, y + 0.48, z, 0.036, 0.055, 0.036, '#ffd23f', { matOpts: FLAME });
      meshP(par, GEOS.sph, x + 0.09, y + 0.48, z, 0.036, 0.055, 0.036, '#ffd23f', { matOpts: FLAME });
      meshP(par, GEOS.sph, x, y + 0.30, z + 0.22, 0.05, 0.05, 0.05, '#ff4f6d');
    } else if (kind === 'cupcake') {
      meshP(par, GEOS.cyl, x, y + 0.06, z, 0.10, 0.12, 0.10, '#e8b06a');
      meshP(par, GEOS.sph, x, y + 0.17, z, 0.11, 0.09, 0.11, '#fff0f6');
      meshP(par, GEOS.sph, x, y + 0.24, z, 0.035, 0.035, 0.035, '#ff4f6d');
    } else if (kind === 'donut') {
      meshP(par, GEOS.ring, x, y + 0.055, z, 0.14, 0.14, 0.16, c || '#ff9ecd', { rx: Math.PI / 2 });
      meshP(par, GEOS.sph, x + 0.055, y + 0.09, z + 0.03, 0.018, 0.018, 0.018, '#fff2b0');
    } else if (kind === 'cookie') {
      meshP(par, GEOS.cyl, x, y + 0.03, z, 0.13, 0.06, 0.13, '#e0a86a');
      meshP(par, GEOS.sph, x - 0.045, y + 0.062, z - 0.02, 0.022, 0.012, 0.022, '#5a3720');
      meshP(par, GEOS.sph, x + 0.05, y + 0.062, z + 0.03, 0.02, 0.012, 0.02, '#5a3720');
    } else if (kind === 'milk') {
      addBox(par, 0.17, 0.30, 0.16, x, y + 0.15, z, '#ffffff', { cast: false });
      addBox(par, 0.17, 0.09, 0.16, x, y + 0.24, z, c || '#ff6b8a', { cast: false });
      addBox(par, 0.04, 0.10, 0.04, x + 0.03, y + 0.34, z - 0.02, '#8fd4ff', { cast: false });
    } else if (kind === 'burger') {
      meshP(par, GEOS.sph, x, y + 0.07, z, 0.19, 0.09, 0.19, '#e8b06a');
      meshP(par, GEOS.cyl, x, y + 0.14, z, 0.19, 0.05, 0.19, '#7a4a2a');
      meshP(par, GEOS.cyl, x, y + 0.18, z, 0.20, 0.03, 0.20, '#7cd15a');
      meshP(par, GEOS.cyl, x, y + 0.20, z, 0.19, 0.02, 0.19, '#ffd23f');
      meshP(par, GEOS.sph, x, y + 0.26, z, 0.19, 0.10, 0.19, '#e8b06a');
    } else if (kind === 'pizza') {
      meshP(par, GEOS.cyl, x, y + 0.03, z, 0.24, 0.06, 0.24, '#e0a86a');
      meshP(par, GEOS.cyl, x, y + 0.07, z, 0.20, 0.03, 0.20, '#ffd45e');
      [[-0.07, 0.05], [0.06, 0.06], [0, -0.08]].forEach((q) => {
        meshP(par, GEOS.cyl, x + q[0], y + 0.09, z + q[1], 0.045, 0.02, 0.045, '#e8433f');
      });
    } else if (kind === 'cola') {
      meshP(par, GEOS.cyl, x, y + 0.13, z, 0.10, 0.26, 0.10, '#e8433f');
      meshP(par, GEOS.cyl, x, y + 0.27, z, 0.105, 0.03, 0.105, '#ffffff');
      meshP(par, GEOS.cyl, x + 0.03, y + 0.36, z, 0.012, 0.14, 0.012, '#ffffff');
    } else if (kind === 'tea') {
      meshP(par, GEOS.cyl, x, y + 0.02, z, 0.13, 0.03, 0.13, '#ffffff');
      meshP(par, GEOS.cyl, x, y + 0.09, z, 0.075, 0.13, 0.075, '#ffffff');
      meshP(par, GEOS.ring, x + 0.09, y + 0.10, z, 0.05, 0.05, 0.05, '#ffffff');
      meshP(par, GEOS.cyl, x, y + 0.14, z, 0.065, 0.02, 0.065, '#c98a3c');
    } else if (kind === 'sandwich') {
      addBox(par, 0.28, 0.06, 0.24, x, y + 0.03, z, '#f0cf9a', { cast: false });
      addBox(par, 0.26, 0.05, 0.22, x, y + 0.08, z, '#7cd15a', { cast: false });
      addBox(par, 0.26, 0.04, 0.22, x, y + 0.12, z, '#ff9b8a', { cast: false });
      addBox(par, 0.28, 0.06, 0.24, x, y + 0.17, z, '#f0cf9a', { cast: false });
    } else if (kind === 'fruit') {
      meshP(par, GEOS.cyl, x, y + 0.05, z, 0.26, 0.10, 0.26, '#d9b06a');
      meshP(par, GEOS.sph, x - 0.10, y + 0.15, z + 0.02, 0.10, 0.10, 0.10, '#e8433f');
      meshP(par, GEOS.sph, x + 0.09, y + 0.14, z - 0.05, 0.09, 0.09, 0.09, '#ffa733');
      meshP(par, GEOS.sph, x + 0.01, y + 0.15, z + 0.10, 0.085, 0.085, 0.085, '#8fd14a');
      meshP(par, GEOS.sph, x + 0.01, y + 0.22, z - 0.01, 0.08, 0.08, 0.08, '#ffd54a');
    } else if (kind === 'grape') {
      meshP(par, GEOS.cyl, x, y + 0.04, z, 0.20, 0.08, 0.20, '#ffffff');
      [[0, 0.10, 0], [-0.07, 0.14, 0.03], [0.07, 0.14, 0.02], [0, 0.13, 0.08], [0, 0.19, 0.02]].forEach((q) => {
        meshP(par, GEOS.sph, x + q[0], y + q[1], z + q[2], 0.055, 0.055, 0.055, '#8d5bd9');
      });
    }
  }

  /* ---------- 🧸 인형 ---------- */
  function doll(par, type, x, y, z, c, s) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    g.scale.setScalar(s || 1);
    par.add(g);
    const dark = '#3a2a22';
    meshP(g, GEOS.sph, 0, 0.16, 0, 0.155, 0.16, 0.145, c);          // 몸통
    meshP(g, GEOS.sph, 0, 0.41, 0.005, 0.145, 0.14, 0.14, c);         // 머리
    if (type === 'bunny') {
      meshP(g, GEOS.sph, -0.07, 0.60, -0.01, 0.045, 0.135, 0.04, c);
      meshP(g, GEOS.sph, 0.07, 0.60, -0.01, 0.045, 0.135, 0.04, c);
      meshP(g, GEOS.sph, 0, 0.385, 0.13, 0.07, 0.05, 0.04, '#fff6fb');
    } else if (type === 'bear') {
      meshP(g, GEOS.sph, -0.10, 0.50, -0.02, 0.055, 0.055, 0.05, c);
      meshP(g, GEOS.sph, 0.10, 0.50, -0.02, 0.055, 0.055, 0.05, c);
      meshP(g, GEOS.sph, 0, 0.385, 0.12, 0.075, 0.055, 0.05, '#f6e2c8');
    } else if (type === 'chick') {
      meshP(g, GEOS.sph, 0, 0.55, 0, 0.03, 0.06, 0.03, c);
      meshP(g, GEOS.cone, 0, 0.385, 0.15, 0.05, 0.09, 0.05, '#ffa733', { rx: Math.PI / 2 });
    } else if (type === 'puppy') {
      meshP(g, GEOS.sph, -0.12, 0.44, 0, 0.05, 0.10, 0.055, '#8a5a3a');
      meshP(g, GEOS.sph, 0.12, 0.44, 0, 0.05, 0.10, 0.055, '#8a5a3a');
      meshP(g, GEOS.sph, 0, 0.385, 0.12, 0.07, 0.05, 0.05, '#f6e2c8');
    } else if (type === 'duck') {
      meshP(g, GEOS.sph, 0, 0.385, 0.15, 0.07, 0.035, 0.06, '#ffa733');
    } else if (type === 'fox') {
      meshP(g, GEOS.cone, -0.08, 0.55, -0.01, 0.05, 0.13, 0.05, '#ff7f4a');
      meshP(g, GEOS.cone, 0.08, 0.55, -0.01, 0.05, 0.13, 0.05, '#ff7f4a');
      meshP(g, GEOS.sph, 0, 0.385, 0.13, 0.07, 0.05, 0.04, '#fff6fb');
    }
    meshP(g, GEOS.sph, -0.05, 0.425, 0.115, 0.022, 0.024, 0.018, dark);
    meshP(g, GEOS.sph, 0.05, 0.425, 0.115, 0.022, 0.024, 0.018, dark);
    return g;
  }

  /* ---------- 🪙 돈 (장식용 보물) ---------- */
  function coinStack(par, x, z, n, y0, s) {
    const sc = s || 1, h = 0.05 * n;
    meshP(par, GEOS.cyl, x, y0 + h / 2, z, 0.13 * sc, h, 0.13 * sc, '#e8a92b');
    meshP(par, GEOS.cyl, x, y0 + h + 0.008, z, 0.135 * sc, 0.014, 0.135 * sc, '#ffd94a');
  }
  function billBundle(par, x, z, y0, ry) {
    addBox(par, 0.34, 0.05, 0.20, x, y0 + 0.025, z, '#4fbf68', { rotY: ry || 0, cast: false });
    addBox(par, 0.34, 0.05, 0.20, x, y0 + 0.075, z, '#66d17c', { rotY: (ry || 0) + 0.14, cast: false });
    addBox(par, 0.07, 0.11, 0.205, x, y0 + 0.05, z, '#f2e8cd', { rotY: ry || 0, cast: false });
  }
  function treasure(par, x, z, y0, c) {
    addBox(par, 0.80, 0.42, 0.55, x, y0 + 0.21, z, '#b07a4a');
    addBox(par, 0.84, 0.12, 0.58, x, y0 + 0.50, z - 0.10, c, { rotX: -0.38 });
    addBox(par, 0.14, 0.14, 0.06, x, y0 + 0.28, z + 0.29, '#ffd75e');
    meshP(par, GEOS.cyl, x - 0.16, y0 + 0.44, z, 0.15, 0.05, 0.15, '#ffd94a');
    meshP(par, GEOS.cyl, x + 0.17, y0 + 0.45, z + 0.04, 0.13, 0.04, 0.13, '#ffc31f');
    meshP(par, GEOS.sph, x, y0 + 0.47, z - 0.16, 0.10, 0.08, 0.09, '#ffe066', { matOpts: GLOWY });
  }

  /* ---------- 문 앞 발판 글자 ---------- */
  function matTexture(txt, bg, fg) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const q = c.getContext('2d');
    q.fillStyle = bg; q.fillRect(0, 0, 256, 128);
    q.strokeStyle = fg; q.lineWidth = 9; q.strokeRect(7, 7, 242, 114);
    q.textAlign = 'center'; q.textBaseline = 'middle'; q.fillStyle = fg;
    q.font = 'bold 46px "Jua", sans-serif';
    q.fillText(txt, 128, 66);
    const t = new THREE.CanvasTexture(c);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  function buildHouse(hx, hz, who) {
    const p = PEOPLE[who], r = ROOM[who], g = new THREE.Group();
    g.position.set(hx, 0, hz);
    scene.add(g);
    const W = HW, D = HD, H = HH, t = WT, hw = W / 2, hd = D / 2;
    const info = { who: who, x: hx, z: hz, W: W, D: D, H: H, g: g,
      roofMat: null, ceilMat: null, walls: [], wallSet: new Set(), cut: 0 };
    HOUSE_OBJS.push(info);

    // 벽 한 장 (충돌 + 카메라 가림 + 투명도 조절용 재질)
    function wall(w, h, d, x, y, z, nx, nz, bottom) {
      const wm = new THREE.MeshLambertMaterial({ color: '#fff7ec', transparent: true, opacity: 1 });
      const ms = new THREE.Mesh(BOX, wm);
      ms.scale.set(w, h, d);
      ms.position.set(x, y, z);
      ms.castShadow = true; ms.receiveShadow = true;
      g.add(ms);
      camBlockers.push(ms);
      if (nx || nz) {
        info.walls.push({ mat: wm, nx: nx || 0, nz: nz || 0, x: x, z: z, cut: 0 });
        info.wallSet.add(ms);
      }
      solidRect(hx + x, hz + z, w, d, y + h / 2, bottom || 0);
      return ms;
    }
    // 뒤·옆벽
    wall(W, H, t, 0, H / 2, -hd + t / 2, 0, -1);
    wall(t, H, D, -hw + t / 2, H / 2, 0, -1, 0);
    wall(t, H, D, hw - t / 2, H / 2, 0, 1, 0);
    // 앞벽 — 가운데는 문
    const pw = (W - DOOR_W) / 2, px = DOOR_W / 2 + pw / 2;
    wall(pw, H, t, -px, H / 2, hd - t / 2, 0, 1);
    wall(pw, H, t, px, H / 2, hd - t / 2, 0, 1);
    wall(DOOR_W, H - DOOR_H, t, 0, (H + DOOR_H) / 2, hd - t / 2, 0, 0, DOOR_H);   // 문 위 벽

    // 바깥 벽 하단 색 띠
    addBox(g, W + 0.10, 0.5, 0.08, 0, 0.25, -hd - 0.02, p.house, { cast: false });
    addBox(g, 0.08, 0.5, D + 0.10, -hw - 0.02, 0.25, 0, p.house, { cast: false });
    addBox(g, 0.08, 0.5, D + 0.10, hw + 0.02, 0.25, 0, p.house, { cast: false });
    addBox(g, pw, 0.5, 0.08, -px, 0.25, hd + 0.02, p.house, { cast: false });
    addBox(g, pw, 0.5, 0.08, px, 0.25, hd + 0.02, p.house, { cast: false });

    // 지붕 (들어가면 살짝 비쳐요)
    info.roofMat = new THREE.MeshLambertMaterial({ color: p.shirt2, transparent: true, opacity: 1 });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(W * 0.79, 2.3, 4), info.roofMat);
    roof.rotation.y = Math.PI / 4;
    roof.position.set(0, H + 1.15, 0);
    roof.castShadow = false; roof.receiveShadow = true;   // 지붕 그림자가 앞벽을 통째로 가리지 않게
    g.add(roof);
    // 굴뚝
    addBox(g, 0.7, 1.5, 0.7, 1.9, H + 1.7, -1.2, '#e9d9c0');
    addBox(g, 0.9, 0.2, 0.9, 1.9, H + 2.5, -1.2, '#cdbba0');

    // 문틀
    addBox(g, DOOR_W + 0.30, 0.16, 0.14, 0, DOOR_H + 0.06, hd + 0.02, p.shirt2);
    addBox(g, 0.16, DOOR_H + 0.1, 0.14, -DOOR_W / 2 - 0.07, DOOR_H / 2, hd + 0.02, p.shirt2);
    addBox(g, 0.16, DOOR_H + 0.1, 0.14, DOOR_W / 2 + 0.07, DOOR_H / 2, hd + 0.02, p.shirt2);
    // 활짝 열린 문짝
    const hinge = new THREE.Group();
    hinge.position.set(-DOOR_W / 2, 0, hd + 0.06);
    hinge.rotation.y = -1.8;
    g.add(hinge);
    addBox(hinge, DOOR_W - 0.06, DOOR_H - 0.12, 0.08, (DOOR_W - 0.06) / 2, (DOOR_H - 0.12) / 2, 0, '#b07a4a');
    addBox(hinge, 0.09, 0.09, 0.11, DOOR_W - 0.22, 1.0, 0.08, '#ffd75e');

    // 문 앞 계단 · 발판
    addBox(g, 2.1, 0.12, 0.9, 0, 0.06, hd + 0.5, '#e9dfcc', { receive: true });
    solidRect(hx, hz + hd + 0.5, 2.1, 0.9, 0.12);
    const matPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 0.66),
      new THREE.MeshLambertMaterial({ map: matTexture('어서와!', p.house, p.shirt2) })
    );
    matPlane.rotation.x = -Math.PI / 2;
    matPlane.position.set(0, 0.128, hd + 0.52);
    matPlane.receiveShadow = true;
    g.add(matPlane);

    // 창문 2개 (앞벽)
    [-1.9, 1.9].forEach((wx) => {
      addBox(g, 1.32, 1.16, 0.08, wx, 2.0, hd + 0.02, p.house, { cast: false });
      addBox(g, 1.14, 1.0, 0.1, wx, 2.0, hd + 0.06, '#f6fbff', { cast: false });
    });
    // 문 위 등불
    meshP(g, GEOS.sph, 0, DOOR_H + 0.42, hd + 0.12, 0.10, 0.12, 0.10, '#fff3c4', { matOpts: { emissive: 0xffcc66, emissiveIntensity: 1.0 } });

    // 집 이름판
    makeSign([p.emoji + ' ' + p.name + '네 집'], hx, 4.05, hz + D / 2 + 0.4, 2.3, 0.72, { post: false });
    // 앞마당 꽃 — 문 앞 길은 비워 둬요
    [-1, 1].forEach((side) => {
      for (let i = 0; i < 3; i++) {
        const fx = side * (1.25 + i * 0.72), fz = hd + 1.05 + (i % 2) * 0.45;
        addBox(g, 0.08, 0.34, 0.08, fx, 0.17, fz, '#4fa23a', { cast: false });
        meshP(g, GEOS.sph, fx, 0.41, fz, 0.14, 0.12, 0.14, ['#ff7fae', '#ffd54a', '#8d6bff'][i]);
      }
    });

    /* ---------- 🏠 집 안 ---------- */
    // 바닥 · 러그
    addBox(g, W - 2 * t, 0.10, D - t, 0, 0.05, t / 2, r.floor, { cast: false, receive: true });
    solidRect(hx, hz + t / 2, W - 2 * t, D - t, 0.10);
    addBox(g, 3.0, 0.05, 2.2, 0.1, 0.135, 0.5, r.rug2, { cast: false, receive: true });
    addBox(g, 2.7, 0.04, 1.9, 0.1, 0.16, 0.5, r.rug, { cast: false, receive: true });
    // 천장 (들어가면 살짝 비쳐요)
    info.ceilMat = new THREE.MeshLambertMaterial({ color: '#fff4e6', transparent: true, opacity: 1 });
    const ceil = new THREE.Mesh(new THREE.BoxGeometry(W - 2 * t, 0.12, D - 2 * t), info.ceilMat);
    ceil.position.set(0, H - 0.06, 0);
    ceil.receiveShadow = true;
    g.add(ceil);
    // 방 불빛
    const lampLight = new THREE.PointLight(0xffe6c4, 11, 7.5, 1.6);
    lampLight.position.set(0, H - 0.85, 0);
    g.add(lampLight);
    addBox(g, 0.05, 0.22, 0.05, 0, H - 0.18, 0, '#8a6a4a', { cast: false });
    meshP(g, GEOS.sph, 0, H - 0.32, 0, 0.16, 0.12, 0.16, '#fff4cf', { matOpts: { emissive: 0xffd27a, emissiveIntensity: 1.0 } });

    // 창가(뒷벽) 밝은 창
    addBox(g, 2.0, 1.16, 0.06, 0, 1.95, -hd + t + 0.02, '#ffffff', { cast: false });
    addBox(g, 1.84, 1.0, 0.08, 0, 1.95, -hd + t + 0.05, '#cfe9ff', { cast: false, matOpts: { emissive: 0x9ed4ff, emissiveIntensity: 0.55 } });

    // 침대 (왼쪽 벽)
    const BX = -2.35, BZ = -1.35;
    addBox(g, 1.5, 0.30, 2.2, BX, 0.28, BZ, '#c99a6b');
    addBox(g, 1.4, 0.20, 2.05, BX, 0.53, BZ, '#fffaf2');
    addBox(g, 0.95, 0.16, 0.40, BX, 0.68, BZ - 0.75, r.bed);
    addBox(g, 1.36, 0.12, 1.15, BX, 0.66, BZ + 0.35, r.rug);
    solidRect(hx + BX, hz + BZ, 1.5, 2.2, 0.64);

    // 탁자 (오른쪽) — 위에 먹을 것이 가득
    const TX = 1.55, TZ = 0.8;
    addBox(g, 1.6, 0.10, 1.0, TX, 0.57, TZ, '#e0b483');
    [[-0.7, -0.4], [0.7, -0.4], [-0.7, 0.4], [0.7, 0.4]].forEach((q) => {
      addBox(g, 0.1, 0.54, 0.1, TX + q[0], 0.27, TZ + q[1], '#c99a6b');
    });
    solidRect(hx + TX, hz + TZ, 1.6, 1.0, 0.62);

    // 선반 (뒤 오른쪽) — 널빤지 세 칸
    const SX = 2.3, SZ = -2.3;

  /* ---------- 실내 판정 · 지붕/벽 투명(인형의 집처럼) ---------- */
  function houseOf(x, z, pad) {
    const q = pad === undefined ? -0.2 : pad;
    for (let i = 0; i < HOUSE_OBJS.length; i++) {
      const h = HOUSE_OBJS[i];
      if (Math.abs(x - h.x) < h.W / 2 + q && Math.abs(z - h.z) < h.D / 2 + q) return h;
    }
    return null;
  }
  let inHouse = null, doorHintAt = 0;
  function updateHouses(dt) {
    inHouse = houseOf(P.x, P.z, -0.1);
    const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
    for (let i = 0; i < HOUSE_OBJS.length; i++) {
      const h = HOUSE_OBJS[i];
      const mine = h === inHouse;
      const above = mine && cy > h.H - 0.40;          // 카메라가 지붕 위로 올라가면 인형의 집처럼
      const k = Math.min(1, dt * 8);
      h.cut += ((above ? 1 : 0) - h.cut) * k;
      const op = 1 - h.cut * 0.93;
      if (Math.abs(h.roofMat.opacity - op) > 0.002) h.roofMat.opacity = op;
      if (Math.abs(h.ceilMat.opacity - op) > 0.002) h.ceilMat.opacity = op;
      for (let w = 0; w < h.walls.length; w++) {
        const wl = h.walls[w];
        // 카메라가 그 벽 바깥으로 나가 있으면 그 벽만 살짝 비쳐서 방 안이 보여요
        const along = (cx - P.x) * wl.nx + (cz - P.z) * wl.nz;
        const wd = (h.x + wl.x - P.x) * wl.nx + (h.z + wl.z - P.z) * wl.nz;
        const want = (mine && along > wd + 0.05) ? 1 : 0;
        wl.cut += (want - wl.cut) * k;
        const wo = 1 - wl.cut * 0.82;
        if (Math.abs(wl.mat.opacity - wo) > 0.002) wl.mat.opacity = wo;
      }
    }
    // 🚪 문 앞에 오면 한 번만 알려 줘요
    // 집 안에서는 내 이름표가 화면을 가리지 않게 잠깐 숨겨요
    for (let i = 0; i < meAvatar.children.length; i++) {
      const ch = meAvatar.children[i];
      if (ch.isSprite && ch.visible === !!inHouse) ch.visible = !inHouse;
    }
    const now = performance.now();
    if (inHouse) doorHintAt = 0;
    else if (now - doorHintAt > 24000) {
      for (let i = 0; i < HOUSE_OBJS.length; i++) {
        const h = HOUSE_OBJS[i];
        if (Math.abs(P.x - h.x) < 1.15 && Math.abs(P.z - (h.z + h.D / 2 + 0.6)) < 1.2) {
          doorHintAt = now;
          toast('🚪 ' + PEOPLE[h.who].name + '네 집이에요! 문으로 들어가 볼까요?', 2600);
          break;
        }
      }
    }
  }

  const RAINBOW = [0xff5b6e, 0xff9a3c, 0xffd93f, 0x5fd06a, 0x49b8ff, 0x8d6bff];
  (function buildSlide() {
    const N = 108;
    let prev = slideCurve.getPoint(0);
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 1; i <= N; i++) {
      const p = slideCurve.getPoint(i / N);
      const mid = prev.clone().add(p).multiplyScalar(0.5);
      const seg = p.clone().sub(prev);
      const len = seg.length();
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), seg.clone().normalize());
      const board = new THREE.Mesh(BOX, mat(RAINBOW[Math.floor(i / 4) % RAINBOW.length]));

        const r = new THREE.Mesh(BOX, mat(0xffffff));

        r.castShadow = true;
        scene.add(r);
      });
      if (i % 18 === 0) {

        post.castShadow = true;
        scene.add(post);
      }
      prev = p;

    }
    if (viewMode === 'first') {
      camera.position.set(P.x, eyeY + (P.grounded ? Math.sin(P.phase) * 0.02 : 0), P.z);
      const lp = -pitch;
      const dir = tmpV.set(-Math.sin(yaw) * Math.cos(lp), Math.sin(lp), -Math.cos(yaw) * Math.cos(lp));
      camPos.copy(camera.position);
      camTarget.copy(camera.position).add(dir);
      camera.lookAt(camTarget);
      setFov(fovBase + 6, dt);
      return;
    }
    // 3인칭 백뷰
    const fwd = P.swim ? 0.45 : 0;
    const wantTarget = tmpV2.set(P.x + Math.sin(P.face) * fwd, P.y + (P.swim ? 0.45 : 1.5), P.z + Math.cos(P.face) * fwd);
    camTarget.lerp(wantTarget, 1 - Math.exp(-14 * dt));
    const inH = houseOf(P.x, P.z, -0.2);
    const dist = P.swim ? (RACE.on ? 5.0 : 4.6) : (inH ? Math.min(camDist, 3.4) : camDist);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const want = tmpV.set(
      camTarget.x + Math.sin(yaw) * dist * cp,
      camTarget.y + dist * sp + (P.swim ? 0.28 : 0.42),
      camTarget.z + Math.cos(yaw) * dist * cp
    );
    if (want.y < 0.9) want.y = 0.9;
    camPos.lerp(want, 1 - Math.exp(-11 * dt));
    // 🏠 집 안에 있을 땐 카메라도 방 안에 머물러요 (벽 밖으로 나가면 안이 안 보여서)
    if (inH) {
      const halfX = inH.W / 2 - 0.65, halfZ = inH.D / 2 - 0.65;
      camPos.x = Math.max(inH.x - halfX, Math.min(inH.x + halfX, camPos.x));
      camPos.z = Math.max(inH.z - halfZ, Math.min(inH.z + halfZ, camPos.z));
      // 고개를 폭 숙이면 위에서 내려다보는 '인형의 집' 시점
      if (pitch <= 0.6) camPos.y = Math.max(0.9, Math.min(inH.H - 0.45, camPos.y));
      else camPos.y = Math.min(inH.H + 1.3, camPos.y);
    }
    // 벽·미끄럼틀이 카메라를 가리면 캐릭터 쪽으로 당겨요
    let camUse = camPos;
    try {
      tmpRayDir.copy(camPos).sub(camTarget);
      const dist = tmpRayDir.length();
      if (dist > 0.4 && camBlockers.length) {
        raycaster.set(camTarget, tmpRayDir.clone().normalize());
        raycaster.far = dist;
        const hits = raycaster.intersectObjects(camBlockers, false);
        camDbg.hit = hits.length ? +hits[0].distance.toFixed(2) : -1;
        if (hits.length && hits[0].distance > 0.6) {
          const d2 = Math.max(1.1, hits[0].distance - 0.35);
          camUse = camTarget.clone().add(tmpRayDir.clone().normalize().multiplyScalar(d2));
          if (camUse.y < 0.7) camUse.y = 0.7;
        }
      }
    } catch (e) {}
    camera.position.copy(camUse);
    camera.lookAt(camTarget.x, camTarget.y + 0.1, camTarget.z);
    setFov(fovBase, dt);
  }
  function setFov(target, dt) {
    if (Math.abs(fovNow - target) < 0.05) return;
    fovNow += (target - fovNow) * Math.min(1, dt * 5);
    camera.fov = fovNow;
    camera.updateProjectionMatrix();
  }

  /* ============================================================
     19. 수집 · 게임 규칙
     ============================================================ */
  function collectCoins() {
    const cx = P.x, cy = P.y + 0.95, cz = P.z;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.alive) continue;
      const dx = cx - c.mesh.position.x, dy = cy - c.mesh.position.y, dz = cz - c.mesh.position.z;
      if (dx * dx + dy * dy + dz * dz < 1.35 * 1.35) {
        c.alive = false;
        c.mesh.visible = false;
        c.respawn = performance.now() + 26000;
        burst(c.mesh.position.clone(), 0xffe066, 8);
        AU.coin();
        earn(1);
        toast('🪙 코인 +1', 1200);
      }
    }
    // 별 보너스
    if (!STAR.got && STAR.mesh) {
      const dx = cx - STAR.mesh.position.x, dy = cy - STAR.mesh.position.y, dz = cz - STAR.mesh.position.z;
      if (dx * dx + dy * dy + dz * dz < 1.7 * 1.7) {
        STAR.got = true;
        STAR.mesh.visible = false;
        if (STAR.glow) STAR.glow.visible = false;
        burst(STAR.mesh.position.clone(), 0xffd23f, 18);
        AU.star();
        earn(10);
        showBanner2('⭐ 별 보너스 +10!', '옆 미끄럼틀에 올라가면 쭈욱~');
      }
    }
  }

  /* ============================================================
     19-B. 🚪 문 · 🏊 수영 · 🐷 진흙탕 · 🪢 밧줄 (플레이 규칙)
     ============================================================ */
  const NOFB = TEST || qp('wctest') === '1' || qp('bwtest') === '1';
  const NOW = () => Date.now() + (FB.offset || 0);
  function nameOf(w) { const pp = PEOPLE[w]; return pp ? pp.emoji + ' ' + pp.name : '가족'; }

  /* ---------- 영법 4종 ---------- */
  const STROKES = {
    free:   { name: '자유형', emo: '🏊‍♀️', speed: 5.6 },
    back:   { name: '배영',   emo: '🙃',  speed: 4.6 },
    fly:    { name: '접영',   emo: '🦋',  speed: 5.1 },
    breast: { name: '평영',   emo: '🐸',  speed: 3.9 }
  };
  const STROKE_ORDER = ['free', 'back', 'fly', 'breast'];
  P.swim = false; P.tilt = 0; P.stroke = 'free';
  P.stuck = null; P.stuckAt = 0; P.swimWake = 0; P.stuckWarn = false; P.mudFree = 0;

  const insidePool = (x, z) => x > POOL.x0 + 0.04 && x < POOL.x1 - 0.04 && z > POOL.z0 + 0.04 && z < POOL.z1 - 0.04;
  const POOL_LEN = POOL.finishX - POOL.startX;

  /* ---------- 물결 · 물보라 ---------- */
  const ripples = [];
  const rippleGeo = new THREE.RingGeometry(0.3, 0.46, 20);
  function ripple(x, z, color) {
    const m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({
      color: color || 0xffffff, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false
    }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, POOL.water + 0.012, z);
    scene.add(m);
    ripples.push({ m: m, life: 0, max: 1.15 });
  }
  function splashWater(x, z, n) { burst(new THREE.Vector3(x, POOL.water + 0.08, z), 0xe8f8ff, n || 10); }
  function splashMud(x, z, n) { burst(new THREE.Vector3(x, 0.45, z), 0x8a5f38, n || 12); }

  /* ---------- 영법 모션 (팔·다리 3D) ---------- */
  let swimPhase = 0;
  function swimPose(av, dt, stroke, k) {
    const u = av && av.userData;
    if (!u || !u.armL) return;
    swimPhase += dt * (3.2 + (k || 0) * 3.6);
    const s = Math.sin(swimPhase);
    if (stroke === 'back') {
      u.armL.rotation.set(-1.95 + s * 1.5, 0, 0.34);
      u.armR.rotation.set(-1.95 - s * 1.5, 0, -0.34);
      u.legL.rotation.set(s * 0.24, 0, 0);
      u.legR.rotation.set(-s * 0.24, 0, 0);
    } else if (stroke === 'fly') {
      const w = Math.sin(swimPhase * 0.9);
      u.armL.rotation.set(-2.05 + w * 1.95, 0, 0.32);
      u.armR.rotation.set(-2.05 + w * 1.95, 0, -0.32);
      u.legL.rotation.set(w * 0.5, 0, 0.05);
      u.legR.rotation.set(w * 0.5, 0, -0.05);
    } else if (stroke === 'breast') {
      const w = (Math.sin(swimPhase * 0.8) + 1) / 2;
      u.armL.rotation.set(-2.6 + w * 1.5, 0, 0.14 + w * 0.95);
      u.armR.rotation.set(-2.6 + w * 1.5, 0, -0.14 - w * 0.95);
      const f = Math.max(0, Math.sin(swimPhase * 0.8 + 0.6));
      u.legL.rotation.set(-0.1, 0, 0.16 + f * 0.6);
      u.legR.rotation.set(-0.1, 0, -0.16 - f * 0.6);
    } else {
      u.armL.rotation.set(-1.55 + s * 1.45, 0, 0.18);
      u.armR.rotation.set(-1.55 - s * 1.45, 0, -0.18);
      u.legL.rotation.set(s * 0.32, 0, 0);
      u.legR.rotation.set(-s * 0.32, 0, 0);
    }
  }

  /* ---------- 말풍선 ---------- */
  function makeBubbleSprite(lines, w, h) {
    const c = document.createElement('canvas'); c.width = 720; c.height = 360;
    const g = c.getContext('2d');
    const r = 46, x0 = 10, y0 = 10, x1 = 710, y1 = 300;
    g.fillStyle = 'rgba(255,255,255,.97)';
    g.strokeStyle = 'rgba(120,90,60,.55)';
    g.lineWidth = 8;
    g.beginPath();
    g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.quadraticCurveTo(x1, y0, x1, y0 + r);
    g.lineTo(x1, y1 - r); g.quadraticCurveTo(x1, y1, x1 - r, y1);
    g.lineTo(380, y1); g.lineTo(340, 350); g.lineTo(320, y1);
    g.lineTo(x0 + r, y1); g.quadraticCurveTo(x0, y1, x0, y1 - r);
    g.lineTo(x0, y0 + r); g.quadraticCurveTo(x0, y0, x0 + r, y0); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#3a2a1a';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (lines.length === 1) {
      g.font = 'bold 62px "Jua", sans-serif';
      g.fillText(lines[0], 360, 158);
    } else {
      g.font = 'bold 54px "Jua", sans-serif';
      g.fillText(lines[0], 360, 118);
      g.font = 'bold 41px "Jua", sans-serif';
      g.fillStyle = '#5a4632';
      g.fillText(lines[1], 360, 212);
    }
    const t = new THREE.CanvasTexture(c);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
    sp.scale.set(w || 3.4, h || 1.7, 1);
    sp.renderOrder = 30;
    return sp;
  }
  const mudBubble = makeBubbleSprite(['🐷 앗! 진흙탕에 빠졌어요!', '누군가 밧줄을 던져줘야 나올 수 있어요!'], 3.1, 1.55);
  mudBubble.visible = false;
  scene.add(mudBubble);

  /* ---------- 🪢 밧줄 ---------- */
  const ROPE = { mesh: null, on: false, t: 0, dur: 0.5, hold: 0, from: new THREE.Vector3(), to: new THREE.Vector3(), onEnd: null };
  (function makeRope() {
    const geo = new THREE.CylinderGeometry(0.05, 0.05, 1, 7, 1);
    geo.translate(0, 0.5, 0);
    ROPE.mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xd8a563 }));
    ROPE.mesh.castShadow = false;
    ROPE.mesh.visible = false;
    scene.add(ROPE.mesh);
  })();
  const _upv = new THREE.Vector3(0, 1, 0);
  function placeRope(a, b) {
    if (!ROPE.mesh) return;
    const d = a.distanceTo(b);
    if (d < 0.02) { ROPE.mesh.visible = false; return; }
    ROPE.mesh.visible = true;
    ROPE.mesh.position.copy(a);
    ROPE.mesh.scale.set(1, d, 1);
    ROPE.mesh.quaternion.setFromUnitVectors(_upv, b.clone().sub(a).normalize());
  }
  function flingRope(from, to, dur, onEnd) {
    ROPE.from.copy(from); ROPE.to.copy(to);
    ROPE.t = 0; ROPE.hold = 0; ROPE.dur = dur || 0.5; ROPE.onEnd = onEnd || null; ROPE.on = true;
    AU.whoosh();
  }
  function updateRope(dt) {
    if (!ROPE.on) return;
    ROPE.t += dt;
    const k = Math.min(1, ROPE.t / ROPE.dur);
    const tip = ROPE.from.clone().lerp(ROPE.to, k);
    placeRope(ROPE.from, tip);
    if (k >= 1) {
      if (ROPE.onEnd) { const f = ROPE.onEnd; ROPE.onEnd = null; f(); }
      ROPE.hold += dt;
      if (ROPE.hold > 0.5) {
        ROPE.on = false; ROPE.hold = 0;
        if (ROPE.mesh) ROPE.mesh.visible = false;
      }
    }
  }

  /* ---------- 수영 상태 ---------- */
  function paintStroke() {
    $$('#swimPanel .spGrid button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.stroke === P.stroke ? 'true' : 'false'));
    const el = $('#strokeNow');
    if (el) el.textContent = (STROKES[P.stroke] || STROKES.free).name;
  }
  function setStroke(k) {
    if (!STROKES[k] || P.stroke === k) return;
    P.stroke = k;
    paintStroke();
    if (P.swim) { AU.pop(); toast(STROKES[k].emo + ' ' + STROKES[k].name + '!', 1400); }
  }
  function enterSwim() {
    if (P.swim) return;
    P.swim = true; P.stuck = null; P.riding = null;
    P.vy = 0; P.grounded = true; P.tilt = 0;
    P.y = POOL.water + 0.14;
    P.lockUntil = performance.now() + 260;
    splashWater(P.x, P.z, 18);
    ripple(P.x, P.z, 0xbfefff);
    AU.splash();
    toast('🏊 물속에 들어왔어요! 영법을 골라 헤엄쳐요', 2600);
    paintTools();
  }
  function exitSwim() {
    if (!P.swim) return;
    if (RACE.on) abortRaceLocal();
    const north = Math.abs(P.z - POOL.z0) < Math.abs(P.z - POOL.z1);
    P.z = north ? POOL.z0 - 0.75 : POOL.z1 + 0.75;
    P.x = Math.min(POOL.x1 - 1.4, Math.max(POOL.x0 + 1.4, P.x));
    P.y = POOL.deck; P.vy = 0; P.grounded = true; P.swim = false; P.tilt = 0;
    P.lockUntil = performance.now() + 220;
    AU.pop();
    toast('🏖️ 수영장에서 나왔어요', 2000);
    paintTools();
  }
  function updatePool(dt) {
    if (!P.swim) {
      P.tilt += (0 - P.tilt) * Math.min(1, dt * 10);
      if (insidePool(P.x, P.z) && !P.stuck && !P.riding && P.y < 0.9) enterSwim();
      return;
    }
    if (!insidePool(P.x, P.z)) { exitSwim(); return; }
    P.y = POOL.water + 0.14 + Math.sin(performance.now() / 640) * 0.025;
    P.grounded = true; P.vy = 0; P.riding = null;
    const m = 0.42;
    P.x = Math.min(POOL.x1 - m, Math.max(POOL.x0 + m, P.x));
    P.z = Math.min(POOL.z1 - m, Math.max(POOL.z0 + m, P.z));
    P.tilt += ((P.stroke === 'back' ? -1 : 1) - P.tilt) * Math.min(1, dt * 7);
    if (RACE.on && (RACE.phase === 'countdown' || RACE.phase === 'run')) {
      const lz = POOL.laneZ[Math.max(0, Math.min(3, RACE.lane))];
      P.z = Math.min(lz + 0.6, Math.max(lz - 0.6, P.z));
    }
    P.swimWake -= dt;
    if (P.speed > 0.6 && P.swimWake <= 0) {
      P.swimWake = 0.3;
      ripple(P.x, P.z, P.stroke === 'back' ? 0x9fe8ff : 0xffffff);
      if (Math.random() < 0.55) splashWater(P.x, P.z, P.stroke === 'fly' ? 8 : 4);
    }
  }

  /* ---------- 🐷 진흙탕 ---------- */
  function mudAt(x, z) {
    for (let i = 0; i < MUD.length; i++) {
      const p = MUD[i];
      const dx = (x - p.x) / p.rx, dz = (z - p.z) / p.rz;
      if (dx * dx + dz * dz < 0.7) return p;
    }
    return null;
  }
  function sinkIn(pud) {
    if (P.stuck || P.swim) return;
    P.stuck = pud; P.stuckAt = performance.now(); P.stuckWarn = false;
    P.vy = 0; P.grounded = true; P.riding = null;
    splashMud(P.x, P.z, 18);
    AU.squelch();
    mudBubble.visible = true;
    mudBubble.position.set(P.x, P.y + 2.6, P.z);
    toast('🐷 앗! 진흙탕에 빠졌어요! 누군가 밧줄을 던져줘야 나올 수 있어요!', 4200);
    if (!NOFB && FB.ready) {
      try { FB.mud.child('stuck/' + me).set({ who: me, x: +P.x.toFixed(2), z: +P.z.toFixed(2), at: NOW() }); } catch (e) {}
    }
    paintTools();
  }
  function freeFromMud(by) {
    if (!P.stuck) return;
    P.stuck = null;
    P.mudFree = performance.now() + 2200;
    const p = mudAt(P.x, P.z);
    if (p) {
      const a = Math.atan2((P.z - p.z) / p.rz, (P.x - p.x) / p.rx);
      P.x = p.x + Math.cos(a) * p.rx * 1.06;
      P.z = p.z + Math.sin(a) * p.rz * 1.06;
    }
    P.y = 0; P.vy = 0; P.grounded = true;
    mudBubble.visible = false;
    splashMud(P.x, P.z, 16);
    AU.cheer();
    if (by) toast('🪢 ' + nameOf(by) + '가 밧줄을 던져 줬어요! 고마워요 💛', 3600);
    else toast('🪢 비상 밧줄로 진흙탕에서 나왔어요!', 3000);
    if (!NOFB && FB.ready) { try { FB.mud.child('stuck/' + me).remove(); } catch (e) {} }
    paintTools();
  }
  const PULL = { on: false, t: 0, dur: 0.85, y0: 0, by: null };
  function startPull(by) {
    PULL.on = true; PULL.t = 0; PULL.y0 = P.y; PULL.by = by || null;
    if (!NOFB && FB.ready) { try { FB.mud.child('rescue/' + me).remove(); } catch (e) {} }
  }
  function updatePull(dt) {
    if (!PULL.on) return;
    PULL.t += dt;
    const k = Math.min(1, PULL.t / PULL.dur);
    const s = 1 - Math.pow(1 - k, 2);
    P.y = PULL.y0 * (1 - s) + Math.sin(k * Math.PI) * 0.45;
    if (k >= 1) {
      const by = PULL.by;
      PULL.on = false;
      P.y = 0;
      freeFromMud(by);
    }
  }
  function doRescue(by, bx, bz) {
    if (!P.stuck || PULL.on) return;
    const from = new THREE.Vector3(
      typeof bx === 'number' ? bx : P.x + 2.6,
      typeof bx === 'number' ? 1.25 : 1.55,
      typeof bz === 'number' ? bz : P.z - 2.4
    );
    flingRope(from, new THREE.Vector3(P.x, P.y + 1.1, P.z), 0.5, function () { startPull(by); });
    AU.cheer();
  }
  function updateMud(dt) {
    if (P.swim) return;
    if (!P.stuck) {
      if (performance.now() < (P.mudFree || 0)) return;
      if (P.grounded && !P.riding && performance.now() > P.lockUntil) {
        const p = mudAt(P.x, P.z);
        if (p) sinkIn(p);
      }
      return;
    }
    P.grounded = true; P.vy = 0;
    P.speed = 0;
    if (PULL.on) return;
    P.y += (-0.98 - P.y) * Math.min(1, dt * 4);
    mudBubble.position.set(P.x, P.y + 2.7, P.z);
    mudBubble.material.opacity = 0.94 + Math.sin(performance.now() / 420) * 0.06;
    if (Math.random() < dt * 1.5) splashMud(P.x + (Math.random() - 0.5) * 1.2, P.z + (Math.random() - 0.5) * 1.2, 2);
    const aloneNow = Object.keys(FB.remotes || {}).length === 0;
    if (!P.stuckWarn && aloneNow && performance.now() - P.stuckAt > 15000) {
      P.stuckWarn = true;
      toast('🪢 혼자 있을 땐 오른쪽 「혼자일 때 도움 요청」으로 비상 밧줄을 쓸 수 있어요', 4200);
    }
  }

  /* ---------- 다른 가족이 진흙탕에 빠졌을 때 ---------- */
  function stuckList() {
    const out = [];
    const src = FB.stuckMap || {};
    const now = NOW();
    for (const k in src) {
      const v = src[k];
      if (!v || k === me) continue;
      if (now - (v.at || 0) > 90000) continue;
      out.push({ who: k, x: Number(v.x) || 0, z: Number(v.z) || 0 });
    }
    return out;
  }
  function nearestStuck() {
    let best = null;
    const t = performance.now();
    stuckList().forEach((s) => {
      if (RESCUED_AT[s.who] && t - RESCUED_AT[s.who] < 15000) return;
      const d = Math.hypot(s.x - P.x, s.z - P.z);
      if (d < 6.5 && (!best || d < best.d)) best = { who: s.who, x: s.x, z: s.z, d: d };
    });
    return best;
  }
  const RESCUED_AT = {};
  function rescueOther(who) {
    if (NOFB || !FB.ready) { toast('지금은 밧줄을 던질 수 없어요'); return; }
    const s = (FB.stuckMap || {})[who];
    if (!s) { toast('이미 빠져나왔어요!'); return; }
    try { FB.mud.child('rescue/' + who).set({ by: me, x: +P.x.toFixed(2), z: +P.z.toFixed(2), at: NOW() }); } catch (e) {}
    RESCUED_AT[who] = performance.now();

  if (swimPanelEl) {
    swimPanelEl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.stroke) setStroke(b.dataset.stroke);
      else if (b.id === 'raceOpenBtn') openRaceSheet();
      else if (b.id === 'swimExitBtn') exitSwim();
    });
  }
  const raceSheetEl = $('#raceSheet');
  if (raceSheetEl) {
    raceSheetEl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.stroke) { setStroke(b.dataset.stroke); repaintRaceSheet(); return; }
      const a = b.dataset.race;
      if (a === 'bot' || a === 'solo') startLocalRace(a);
      else if (a === 'family') startFamilyRace();
      else if (a === 'start') beginFamilyCountdown();
      else if (a === 'abort') {
        if (RACE.host === me) { try { FB.swim.child('state').remove(); } catch (err) {} }
        resetRaceLocal(); closeRaceSheet(); paintTools();
      } else if (a === 'again') { resetRaceLocal(); repaintRaceSheet(); paintTools(); }
      else if (a === 'close') {
        if (RACE.family && RACE.host === me) { try { FB.swim.child('state').remove(); } catch (err) {} }
        resetRaceLocal(); closeRaceSheet(); paintTools();
      }
    });
  }
  const raceWrapEl = $('#raceWrap');
  if (raceWrapEl) raceWrapEl.addEventListener('click', (e) => { if (e.target === raceWrapEl) closeRaceSheet(); });

  /* ---------- 도움 요청 표시 기둥 ---------- */
  let beacon = null;
  function updateBeacon(dt) {
    const list = stuckList();
    if (!list.length) { if (beacon) beacon.visible = false; return; }
    let near = list[0];
    list.forEach((s) => { if (Math.hypot(s.x - P.x, s.z - P.z) < Math.hypot(near.x - P.x, near.z - P.z)) near = s; });
    if (!beacon) {
      beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.8, 9, 12, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x7fe8c6, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }));
      scene.add(beacon);
    }
    beacon.visible = true;
    beacon.position.set(near.x, 4.5, near.z);
    beacon.rotation.y += dt * 0.8;
  }

  /* ---------- 월드 반짝임 ---------- */
  function tickWorldFx(dt) {
    const t = performance.now();
    if (portalGlow) {
      const k = 1 + Math.sin(t / 520) * 0.05;
      portalGlow.scale.set(k, k, 1);
      portalGlow.material.opacity = 0.74 + Math.sin(t / 380) * 0.16;
    }
    if (portalRing) portalRing.rotation.z += dt * 0.9;
    for (let i = 0; i < portalBricks.length; i++) {
      const b = portalBricks[i];
      b.rotation.y += dt * (0.8 + i * 0.35);
      b.position.y = (b.userData.baseY || 2.2) + Math.sin(t / 700 + i) * 0.09;
    }
    if (waterTex) { waterTex.offset.x += dt * 0.035; waterTex.offset.y += dt * 0.02; }
    if (waterMesh) waterMesh.position.y = POOL.water + Math.sin(t / 900) * 0.008;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life += dt;
      if (r.life >= r.max) { scene.remove(r.m); r.m.material.dispose(); ripples.splice(i, 1); continue; }
      const s = 1 + r.life * 2.6;
      r.m.scale.set(s, s, 1);
      r.m.material.opacity = 0.72 * (1 - r.life / r.max);
    }
    for (let i = 0; i < mudBubbles.length; i++) {
      const b = mudBubbles[i];
      b.userData.t += dt;
      const s = 1 + Math.sin(b.userData.t * 2.2) * 0.35;
      b.scale.set(s, 0.5 * Math.max(0.2, s), s);
      b.position.y = b.userData.baseY + Math.abs(Math.sin(b.userData.t * 1.6)) * 0.03;
    }
  }

  /* ---------- 실시간 연결(대결·진흙 구출) ---------- */
  let rescueRef = null, lastRescueAt = 0;
  function bindRescue() {
    if (NOFB || !FB.ready || !FB.mud) return;
    try {
      if (rescueRef) rescueRef.off();
      rescueRef = FB.mud.child('rescue/' + me);
      rescueRef.on('value', (snap) => {
        const v = snap.val();
        if (!v || !v.by || v.by === me) return;
        if (Math.abs(NOW() - (v.at || 0)) > 25000) return;
        if (performance.now() - lastRescueAt < 1500) return;
        lastRescueAt = performance.now();
        doRescue(v.by, v.x, v.z);
      }, () => {});
    } catch (e) {}
  }
  function bindWorldSync() {
    if (NOFB) return;
    if (!FB.ready || !FB.db) { setTimeout(bindWorldSync, 800); return; }
    try {
      if (!FB.offsetBound) {
        FB.offsetBound = true;
        FB.db.ref('.info/serverTimeOffset').on('value', (s) => { FB.offset = Number(s.val()) || 0; }, () => {});
      }
      if (!FB.swim) {
        FB.swim = FB.db.ref('family-lim-7660/world3dSwim');
        FB.mud = FB.db.ref('family-lim-7660/world3dMud');
        FB.swim.child('state').on('value', (s) => { onSwimState(s.val() || null); }, () => {});
        FB.swim.child('lanes').on('value', (s) => { FB.lanesData = s.val() || {}; }, () => {});
        FB.mud.child('stuck').on('value', (s) => { FB.stuckMap = s.val() || {}; paintTools(); }, () => {});
      }
      bindRescue();
    } catch (e) { setTimeout(bindWorldSync, 1200); }
  }

  paintStroke();
  paintTools();
  bindWorldSync();

  /* ============================================================
     20. 메인 루프
     ============================================================ */
  const clock = new THREE.Clock();
  let frameNo = 0, ready = false;
  let fbTimer = 0;

  function step(dt) {
    tickWorldFx(dt);
    const busy = locked() || sheetOpen() || raceOpen || raceLocked() || !!P.stuck;
    // 입력 → 이동
    let ix = 0, iy = 0;
    if (!busy && !P.riding && performance.now() > P.lockUntil) {
      if (keys['w'] || keys['arrowup']) iy += 1;
      if (keys['s'] || keys['arrowdown']) iy -= 1;
      if (keys['a'] || keys['arrowleft']) ix -= 1;
      if (keys['d'] || keys['arrowright']) ix += 1;
      ix += joy.x; iy -= joy.y;
    }
    let mag = Math.hypot(ix, iy);
    if (window.__drive && !busy) { ix += window.__drive.x; iy += window.__drive.y; }
    mag = Math.hypot(ix, iy);
    if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const spd = P.swim ? (STROKES[P.stroke] || STROKES.free).speed : SPEED;
    let dx = (fx * iy + rx * ix) * spd * dt;
    let dz = (fz * iy + rz * ix) * spd * dt;
    P.speed = mag * spd;

    if (P.riding) {
      updateRide(dt);
    } else if (P.swim) {
      // 물속: 벽·단을 타지 않고 물결 따라 둥실둥실
      P.x += dx; P.z += dz;
      if (mag > 0.06) {
        const w = Math.atan2(ix * rx + iy * fx, ix * rz + iy * fz);
        let df = w - P.face;
        while (df > Math.PI) df -= Math.PI * 2;
        while (df < -Math.PI) df += Math.PI * 2;
        P.face += df * Math.min(1, dt * 10);
      }
    } else if (!P.stuck) {
      // 좌우 · 앞뒤 따로 움직여 벽에 부딪혀도 미끄러져요
      if (dx) { if (!blockedAt(P.x + dx, P.z)) P.x += dx; }
      if (dz) { if (!blockedAt(P.x, P.z + dz)) P.z += dz; }
      // 밟고 올라가기
      if (P.grounded) {
        const sup = supportTop(P.x, P.z, P.y + MAX_STEP);
        if (sup > P.y) P.y = sup;
        else if (sup < P.y - 0.04) { P.grounded = false; P.vy = 0; }
      }
      // 점프 · 중력
      if (!P.grounded) {
        P.vy -= GRAV * dt;
        let ny = P.y + P.vy * dt;
        if (P.vy <= 0) {
          const sup = supportTop(P.x, P.z, P.y + 0.03);
          if (ny <= sup) {
            const wasAir = !P.grounded;
            ny = sup; P.y = sup; P.vy = 0; P.grounded = true;
            if (wasAir && sup > 0.3 && onTrampoline(P.x, P.z)) {
              P.vy = 15.5; P.grounded = false;
              trampSquash = 1;
              AU.boing();
              burst(new THREE.Vector3(P.x, P.y + 0.2, P.z), 0x8ef0d6, 10);
            } else if (wasAir) {
              AU.land();
            }
          }
        }
        P.y = ny;
      } else {
        P.coyote = 0.12;
      }
      P.y = Math.max(0, P.y);
      // 마을 밖으로 떨어지면 시작 자리로 (안전장치)
      if (P.y < -6 || Math.abs(P.x) > 60 || Math.abs(P.z) > 60) { resetPlayer(me); toast('🏡 마을로 다시 돌아왔어요'); }
      // 캐릭터 방향
      if (mag > 0.06) {
        const want = Math.atan2(ix * rx + iy * fx, ix * rz + iy * fz);
        let d = want - P.face;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        P.face += d * Math.min(1, dt * 14);
      }
      // 미끄럼틀에 올라섰나요?
      if (performance.now() > P.lockUntil) {
        const near = nearestSlide(P.x, P.y, P.z);
        if (near) startRide(near.t);
      }
    }
    P.coyote = Math.max(0, P.coyote - dt);

    // 수영장 · 진흙탕 · 대결
    updatePool(dt);
    updateMud(dt);
    updateRace(dt);
    updatePull(dt);
    updateRope(dt);
    updateBeacon(dt);
    paintTools();

    // 내 캐릭터
    const tilt = P.tilt || 0;
    const lift = tilt * 0.9;
    meAvatar.rotation.order = 'YXZ';
    meAvatar.position.set(P.x + Math.sin(P.face) * lift, P.y, P.z + Math.cos(P.face) * lift);
    meAvatar.rotation.y = P.face + (P.swim && P.stroke === 'back' ? Math.PI : 0);
    meAvatar.rotation.x = tilt * (Math.PI / 2);
    if (P.swim) swimPose(meAvatar, dt, P.stroke, P.speed > 0.6 ? 1 : 0.25);
    else animateAvatar(meAvatar, dt, P.speed, P.grounded, !!P.riding);

    // 코인 회전 · 되살아나기
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.alive) {
        if (c.respawn && performance.now() > c.respawn) {
          c.alive = true; c.respawn = 0; c.mesh.visible = true; c.mesh.scale.setScalar(0.01);
        }
        continue;
      }
      c.mesh.rotation.y += dt * 2.6;
      c.mesh.position.y = c.home.y + Math.sin(performance.now() / 620 + c.spin) * 0.09;
      if (c.mesh.scale.x < 1) c.mesh.scale.setScalar(Math.min(1, c.mesh.scale.x + dt * 3.2));
      if (Math.abs(c.mesh.position.x - P.x) < 9 && Math.abs(c.mesh.position.z - P.z) < 9) { /* 가까울 때만 */ }
    }
    // 별 회전
    if (STAR.mesh && !STAR.got) {
      STAR.mesh.rotation.y += dt * 1.9;
      STAR.mesh.position.y = STAR.y + Math.sin(performance.now() / 700) * 0.12;
      if (STAR.glow) { STAR.glow.position.y = STAR.mesh.position.y; STAR.glow.scale.setScalar(1 + Math.sin(performance.now() / 460) * 0.06); }
    }
    // 트램펄린 흔들
    if (trampSquash > 0) {
      trampSquash = Math.max(0, trampSquash - dt * 3.2);
      const s = 1 - Math.sin(trampSquash * Math.PI) * 0.35;
      if (TRAMP.g && TRAMP.g.children[1]) TRAMP.g.children[1].scale.y = Math.max(0.2, s);
    }
    // 반짝이
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { scene.remove(s.mesh); s.mesh.material.dispose(); sparks.splice(i, 1); continue; }
      s.v.y -= 9 * dt;
      s.mesh.position.addScaledVector(s.v, dt);
      const k = 1 - s.life / s.max;
      s.mesh.material.opacity = k;
      s.mesh.scale.setScalar(0.35 + k * 0.5);
    }
    // 구름
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 46) c.position.x = -46;
    }
    // 가족 아바타
    updateRemotes(dt);

    if (!busy) collectCoins();

    // 카메라 · 렌더
    updateCamera(dt);
    updateHouses(dt);
    sun.position.set(P.x + 22, 34, P.z + 16);
    sun.target.position.set(P.x, 0, P.z);
    sun.target.updateMatrixWorld();

    // 서버로 내 위치
    fbPush(false);
  }

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, clock.getDelta() || 0.016);
    step(dt);
    renderer.render(scene, camera);
    if (!ready) {
      frameNo++;
      if (frameNo === 3) { ready = true; $('#loading').classList.add('hide'); setTimeout(() => { const l = $('#loading'); if (l) l.style.display = 'none'; }, 500); showHint();
        setTimeout(() => { try { toast('🆕 블록 월드 문 · 🏊 수영장 · 🐷 진흙탕이 생겼어요!', 3600); } catch (e) {} }, 1400); }
    }
  }

  /* ---------- 크기 ---------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    fovBase = (w / h) < 0.85 ? 68 : 60;
    camera.fov = fovBase;
    fovNow = fovBase;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 260));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  /* ---------- 시작 ---------- */
  resetPlayer(me);
  // 🔒 1인 1기기 좌석: 이미 다른 기기가 이 캐릭터로 놀고 있으면 안내하고 막아요
  if (window.WorldSeat) {
    try {
      WorldSeat.init({ who: () => me, setWho: (w) => { const n = normWho(w); if (n && n !== me) setWho(n); } });
      WorldSeat.enter(me);
    } catch (e) {}
  }
  // 처음엔 내 집 앞에서 카메라를 마을 쪽으로
  yaw = 0;
  meAvatar.position.set(P.x, P.y, P.z);
  meAvatar.rotation.y = P.face;
  camTarget.set(P.x, P.y + 1.5, P.z);
  camPos.set(P.x, P.y + 3.6, P.z + 6.6);
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  loop();

  /* ---------- 테스트 · 디버그 창구 ---------- */
  window.W3D = {
    version: '2.0', three: THREE.REVISION, test: TEST, who: () => me,
    state() {
      return {
        ready, mode: viewMode, test: TEST, who: me,
        x: +P.x.toFixed(2), y: +P.y.toFixed(2), z: +P.z.toFixed(2),
        vy: +P.vy.toFixed(2), grounded: P.grounded,
        yaw: +yaw.toFixed(3), pitch: +pitch.toFixed(3),
        riding: !!P.riding, rideT: P.riding ? +P.riding.t.toFixed(3) : null,
        coins: WC ? WC.get(me) : null, star: STAR.got,
        swim: !!P.swim, stroke: P.stroke, tilt: +(P.tilt || 0).toFixed(2),
        stuck: !!P.stuck, race: RACE.on ? RACE.phase : 'idle', raceMode: RACE.mode,
        avatarVisible: meAvatar.visible,
        house: inHouse ? inHouse.who : null,
        roofOp: +HOUSE_OBJS[0].roofMat.opacity.toFixed(2),
        remotes: Object.keys(FB.remotes).length,
        colliders: colliders.length, coinsLeft: coins.filter((c) => c.alive).length,
        calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
        cam: [+camera.position.x.toFixed(2), +camera.position.y.toFixed(2), +camera.position.z.toFixed(2)], camHit: camDbg.hit,
        webgl: !!renderer.getContext()
      };
    },
    teleport(x, y, z) { P.x = x; P.y = y; P.z = z; P.vy = 0; P.grounded = false; P.riding = null; P.swim = false; P.stuck = null; },
    houses: () => HOUSE_OBJS.map((h) => ({ who: h.who, x: h.x, z: h.z, doorX: h.x, doorZ: +((h.z + h.D / 2) + 0.6).toFixed(2), roof: +h.roofMat.opacity.toFixed(2) })),
    houseAt: (x, z) => { const h = houseOf(x, z); return h ? h.who : null; },
    slideAt(t) {
      P.riding = { t: Math.max(0, Math.min(0.95, t)) };
      P.rideSpeed = 0;
      const p = slideCurve.getPointAt(P.riding.t);
      P.x = p.x; P.y = p.y + 0.12; P.z = p.z;
      const tan = slideCurve.getTangentAt(P.riding.t);
      P.face = Math.atan2(tan.x, tan.z);
      yaw = Math.atan2(-tan.x, -tan.z);
    },
    look(y, p) { yaw = y; if (p !== undefined) pitch = p; },
    setView, toggleView,
    jump: doJump,
    who: (w) => { setWho(w); return me; },
    slideTop: () => { const p = slideCurve.getPointAt(0); return { x: p.x, y: p.y, z: p.z }; },
    starPos: () => ({ x: STAR.x, y: STAR.y, z: STAR.z }),
    portal: () => ({ x: PORTAL.x, z: PORTAL.z }),
    pool: () => ({ ...POOL }),
    mud: () => MUD.map((m) => ({ x: m.x, z: m.z, rx: m.rx, rz: m.rz })),
    swimIn(lane) {
      const l = Math.max(0, Math.min(3, lane == null ? 0 : lane));
      P.x = POOL.startX + 1; P.z = POOL.laneZ[l]; P.y = 0;
      P.vy = 0; P.grounded = true; P.riding = null; P.stuck = null;
      P.face = Math.PI / 2; yaw = -Math.PI / 2; pitch = 0.28;
      enterSwim();
      return { x: P.x, z: P.z, swim: P.swim };
    },
    swimOut: exitSwim,
    stroke(k) { setStroke(k); return P.stroke; },
    raceStart(mode) { startLocalRace(mode || 'bot'); return RACE.phase; },
    raceInfo() {
      return {
        on: RACE.on, phase: RACE.phase, mode: RACE.mode, family: RACE.family,
        stroke: RACE.stroke, mineMs: RACE.mineMs, mineDone: RACE.mineDone,
        botT: +RACE.botT.toFixed(3), botMs: RACE.botMs,
        t: +((P.x - POOL.startX) / POOL_LEN).toFixed(3),
        results: RACE.results, count: RACE.count, host: RACE.host, joined: RACE.joined
      };
    },
    raceOpen: () => openRaceSheet(),
    mudIn(i) {
      const m = MUD[Math.max(0, Math.min(MUD.length - 1, i || 0))];
      P.x = m.x; P.z = m.z; P.y = 0; P.vy = 0; P.grounded = true;
      P.riding = null; P.swim = false; P.stuck = null; P.lockUntil = 0;
      mudBubble.visible = false;
      return { x: P.x, z: P.z };
    },
    isStuck: () => !!P.stuck,
    avatarInfo() {
      try {
        meAvatar.updateMatrixWorld(true);
        const h = new THREE.Vector3(0, 1.86, 0).applyMatrix4(meAvatar.matrixWorld);
        const f = new THREE.Vector3(0, 1.84, 0.3).applyMatrix4(meAvatar.matrixWorld);
        return {
          head: [+h.x.toFixed(2), +h.y.toFixed(2), +h.z.toFixed(2)],
          facePt: [+f.x.toFixed(2), +f.y.toFixed(2), +f.z.toFixed(2)],
          pos: [+P.x.toFixed(2), +P.y.toFixed(2), +P.z.toFixed(2)],
          face: +P.face.toFixed(2), tilt: +(P.tilt || 0).toFixed(2)
        };
      } catch (e) { return { err: String(e) }; }
    },
    drive(x, y) { window.__drive = { x: x || 0, y: y || 0 }; return window.__drive; },
    rescue(by) { doRescue(by || null); },
    rescueSelf() { doRescue(null); },
    stuckMap: () => FB.stuckMap,
    raceState: () => FB.swimState
  };
}
</script>
</body>
