<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB UV 검증</title><style>html,body{margin:0;height:100%;background:#20262e;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const NAMES=['v-cat-orig','v-cat-weld','v-cat-dec'];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x20262e);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,2.0));
const d1=new THREE.DirectionalLight(0xfff3e0,2.0);d1.position.set(3,6,7);scene.add(d1);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.01,200);
camera.position.set(0,1.0,4.6);camera.lookAt(0,0.45,0);
const loader=new GLTFLoader();
window.__status='0/3';
NAMES.forEach((n,i)=>{
  loader.load('./assets/models/'+n+'.glb',g=>{
    const root=g.scene; const box=new THREE.Box3().setFromObject(root);
    const size=box.getSize(new THREE.Vector3()); const c=box.getCenter(new THREE.Vector3());
    root.position.set(-c.x,-box.min.y,-c.z);
    const w=new THREE.Group(); w.add(root);
    w.scale.setScalar(1.1/Math.max(size.x,size.y,size.z));
    w.position.set((i-1)*1.6,0,0); scene.add(w);
    window.__status=(parseInt(window.__status)+1)+'/3';
  },undefined,e=>console.error(n,e));
});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
