<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bw layout test</title>
<style>
 html,body{margin:0;background:#1b2440;font-family:sans-serif;color:#fff}
 #wrap{padding:12px}
 iframe{border:0;background:#fff;display:block;border:1px solid #46618f}
</style></head>
<body>
<div id="wrap"><iframe id="m"></iframe></div>
<script>
var p = new URLSearchParams(location.search);
var w = +(p.get('w') || 390), h = +(p.get('h') || 844);
var touch = p.get('touch') !== '0';
var hash = p.get('who') || 'hyungwon';
var f = document.getElementById('m');
f.style.width = w + 'px';
f.style.height = h + 'px';
f.src = './block-world.html?t=' + Date.now() + '#' + hash;
f.addEventListener('load', function () {
  if (!touch) return;
  try {
    var d = f.contentDocument;
    var s = d.createElement('style');
    s.textContent = '#controls{display:block!important}#kbHint{display:none!important}' +
      '#ridePill{left:auto!important;right:calc(16px + env(safe-area-inset-right,0px))!important;transform:none!important;bottom:calc(128px + env(safe-area-inset-bottom,0px))!important}' +
      '#actionPrompt{bottom:calc(196px + env(safe-area-inset-bottom,0px))!important}' +
      '#toast{bottom:calc(252px + env(safe-area-inset-bottom,0px))!important}';
    d.head.appendChild(s);
  } catch (e) {}
});
</script>
</body></html>
