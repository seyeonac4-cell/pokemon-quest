<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bw layout test</title>
<style>
 html,body{margin:0;background:#1b2440;font-family:sans-serif;color:#fff}
 #wrap{display:flex;gap:16px;padding:12px;align-items:flex-start}
 iframe{border:0;background:#fff;display:block}
 #m{width:390px;height:844px}
</style></head>
<body>
<div id="wrap"><iframe id="m" src="./block-world.html?t=9#hyungwon"></iframe></div>
<script>
var f=document.getElementById('m');
f.addEventListener('load',function(){
  try{
    var d=f.contentDocument;
    var s=d.createElement('style');
    s.textContent='#controls{display:block!important}#kbHint{display:none!important}';
    d.head.appendChild(s);
  }catch(e){}
});
</script>
</body></html>
