<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bw layout test</title>
<style>
 html,body{margin:0;background:#1b2440;font-family:sans-serif;color:#fff}
 #wrap{padding:12px}
 iframe{border:0;background:#fff;display:block;border:1px solid #46618f}
</style></head>
<body>
<div id="wrap"><iframe id="m"></iframe></div>
<script>
var p = new URLSearchParams(location.search);
var w = +(p.get('w') || 390), h = +(p.get('h') || 844);
var f = document.getElementById('m');
f.style.width = w + 'px';
f.style.height = h + 'px';
f.src = './block-world.html?t=' + Date.now() + '#hyungwon';
f.addEventListener('load', function () {
  try {
    var d = f.contentDocument;
    var s = d.createElement('style');
    s.textContent = '#controls{display:block!important}#kbHint{display:none!important}';
    d.head.appendChild(s);
  } catch (e) {}
});
</script>
</body></html>
