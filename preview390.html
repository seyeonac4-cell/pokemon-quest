<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>390 미리보기 (임시)</title>
<style>
body{margin:0;background:#222;font-family:sans-serif;color:#fff}
.row{display:flex;gap:16px;padding:12px}
figure{margin:0}
figcaption{font-size:12px;padding:4px 0;color:#bbb}
iframe{border:0;background:#fff;display:block}
.a{width:390px;height:1150px}
.b{width:390px;height:1150px}
</style>
</head>
<body>
<div class="row">
  <figure>
    <figcaption>A · 390px · 1면(헤드라인)</figcaption>
    <iframe class="a" id="fa" src="./idol.html?p=a"></iframe>
  </figure>
  <figure>
    <figcaption>B · 390px · 영어 섹션</figcaption>
    <iframe class="b" id="fb" src="./idol.html?p=b"></iframe>
  </figure>
</div>
<script>
/* 미리보기용: iframe 안을 특정 섹션으로 스크롤 (임시 페이지) */
(function () {
  var b = document.getElementById('fb');
  var target = (location.hash || '#survTitle').slice(1);
  var tries = 0;
  var t = setInterval(function () {
    tries++;
    try {
      var w = b.contentWindow, d = b.contentDocument;
      var el = d && d.getElementById(target);
      if (el && w.scrollTo) {
        var y = el.getBoundingClientRect().top + w.scrollY - 78;
        w.scrollTo(0, Math.max(0, y));
        clearInterval(t);
      }
    } catch (e) {}
    if (tries > 60) clearInterval(t);
  }, 300);
})();

(function(){
  var t = Date.now();
  var fa = document.getElementById('fa'), fb = document.getElementById('fb');
  fa.src = './idol.html?p=a&t=' + t;
  fb.src = './idol.html?p=b&t=' + t;
})();
</script>
</body>
</html>
